<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🔔 도전 골든벨</title>
<meta name="theme-color" content="#C2703E">
<meta name="description" content="반 전체가 함께하는 교실 골든벨 — 문제와 사진을 넣어두고, 틀린 사람만 눌러 진행합니다.">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ══════════════════════════════════════════════════════════════════════════
   🔔 도전 골든벨 — 나눠 쓰는 판

   칭찬도장판 안에 있던 골든벨을 명단·로그인·서버 없이 떼어냈다.
   교실 한 대(전자칠판)에서만 돌고, 문제·사진·진행 상태는 모두 이 기기 안에 있다.
   그래서 누구에게 링크를 줘도 계정 없이 바로 쓸 수 있다.
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  --paper:#FBF6E9; --paper2:#F3EBD6; --card:#FFFDF7;
  --ink:#3A3226; --ink2:#6B5F4E; --mute:#A39682;
  --line:#E0D3B8; --line2:#CDBC9A;
  --ac:#C2703E; --ac-d:#9C5427; --ac-l:#F0D9C6;
  --ok:#5CB86E; --ok-d:#3D8B4F; --warn:#E8A93A; --bad:#D9534F;
  --fs-xxs:clamp(11px,2.5vw,13px); --fs-xs:clamp(12.5px,2.9vw,14.5px);
  --fs-s:clamp(14px,3.2vw,16px);   --fs-m:clamp(16px,3.8vw,19px);
  --fs-l:clamp(19px,4.6vw,24px);   --fs-xl:clamp(24px,6vw,34px);
  --font:'Pretendard Variable',Pretendard,-apple-system,system-ui,'Malgun Gothic',sans-serif;
  --sh:0 4px 20px rgba(120,100,70,.10);
  --qs:1;            /* 문제 글자 배율 — 뒷자리에서 안 보이면 키운다 */
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{
  font-family:var(--font);color:var(--ink);background:var(--paper);
  background-image:radial-gradient(rgba(180,160,120,.10) 1px,transparent 1px),
                   radial-gradient(rgba(180,160,120,.07) 1px,transparent 1px);
  background-size:22px 22px,22px 22px;background-position:0 0,11px 11px;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{border:none;background:none;cursor:pointer}

.wrap{width:100%;max-width:1100px;margin:0 auto;padding:0 clamp(12px,3.5vw,22px)}

/* ── 머리 ── */
.hdr{position:sticky;top:0;z-index:30;background:rgba(251,246,233,.94);backdrop-filter:blur(12px);
  border-bottom:2px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:10px;padding:10px 0}
.hdr-t{font-size:var(--fs-s);font-weight:900;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-b{font-size:var(--fs-xxs);font-weight:800;color:var(--mute);padding:6px 11px;border-radius:999px;
  border:1.5px solid var(--line);background:#fff}
main{padding:14px 0 40px}

/* ── 카드 ── */
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;
  padding:clamp(14px,3.4vw,20px);box-shadow:var(--sh);margin-bottom:12px}
.card h3{font-size:var(--fs-m);font-weight:900;margin-bottom:4px}
.sub{font-size:var(--fs-xxs);color:var(--ink2);font-weight:600;line-height:1.6}
.sub b{color:var(--ac-d)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}

/* ── 조각들 ── */
.inp{width:100%;padding:11px 13px;border:2px solid var(--line);border-radius:11px;background:#fff;
  font-size:var(--fs-s);font-weight:600;outline:none;line-height:1.6}
.inp:focus{border-color:var(--ac)}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:13px;
  border-radius:13px;background:var(--ac);color:#fff;font-size:var(--fs-s);font-weight:900;
  box-shadow:0 4px 14px rgba(194,112,62,.3);transition:transform .12s}
.btn:active{transform:translateY(2px)}
.btn.g{background:var(--ok-d);box-shadow:0 4px 14px rgba(61,139,79,.28)}
.btn.ghost{background:#fff;color:var(--ink2);border:2px solid var(--line);box-shadow:none}
.btn.big{padding:18px;font-size:var(--fs-m);border-radius:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;
  font-size:var(--fs-xs);font-weight:800;color:var(--ink2);white-space:nowrap}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.chip.sm{padding:6px 11px;font-size:var(--fs-xxs)}
.chip.go{background:var(--ok-d);color:#fff;border-color:var(--ok-d)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.hint{font-size:var(--fs-xxs);color:var(--mute);font-weight:600;line-height:1.6;margin-top:7px}

/* ── 문제 목록 ── */
.qlist{display:flex;flex-direction:column;gap:7px;margin-top:11px}
.qrow{display:flex;gap:8px;align-items:center;padding:9px 11px;border:2px solid var(--line);
  border-radius:13px;background:#fff}
.qrow.cur{border-color:var(--ac)}
.qrow .no{flex:0 0 auto;width:22px;text-align:center;color:var(--ac-d);font-weight:900;font-size:var(--fs-xs)}
.qrow .tx{flex:1;min-width:0;font-size:var(--fs-xs);line-height:1.5;word-break:break-word}
.qrow .tx b{color:var(--ok-d)}
.qthumb{flex:0 0 auto;width:40px;height:40px;border-radius:9px;object-fit:cover;border:1.5px solid var(--line)}
.qrow .acts{flex:0 0 auto;display:flex;gap:4px}

/* ── 이미지 넣는 칸 ── */
.drop{margin-top:9px;border:2px dashed var(--line2);border-radius:14px;padding:16px 12px;
  text-align:center;background:var(--paper2);transition:.15s;cursor:pointer}
.drop.hot{border-color:var(--ac);background:var(--ac-l)}
.drop .big{font-size:22px}
.imgprev{margin-top:9px;position:relative;display:inline-block}
.imgprev img{max-width:100%;max-height:190px;border-radius:12px;border:2px solid var(--line);display:block}
.imgprev .x{position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:999px;
  background:var(--bad);color:#fff;font-weight:900;font-size:14px;box-shadow:var(--sh)}

/* ── 진행: 문제 무대 ── */
.stage{background:var(--card);border:3px solid var(--line2);border-radius:22px;
  padding:clamp(18px,3.6vw,32px);box-shadow:var(--sh);margin-bottom:12px}
.stage-top{display:flex;align-items:baseline;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.stage-no{font-size:calc(clamp(22px,3.4vw,40px) * var(--qs));font-weight:900;color:var(--ac-d);line-height:1}
.stage-alive{font-size:calc(clamp(15px,2.2vw,24px) * var(--qs));font-weight:800}
.stage-alive b{color:var(--ok-d)}
.qbody{display:flex;gap:clamp(14px,2.6vw,28px);align-items:center;justify-content:center;flex-wrap:wrap}
.qtext{flex:1 1 340px;min-width:0;text-align:center;white-space:pre-wrap;word-break:keep-all;
  font-size:calc(clamp(24px,3.9vw,58px) * var(--qs));font-weight:900;line-height:1.35}
.qimg{flex:0 1 auto;max-width:min(100%,540px)}
.qimg img{width:100%;max-height:46vh;object-fit:contain;border-radius:14px;border:2px solid var(--line)}
.ans{margin-top:clamp(14px,2.4vw,22px);padding-top:clamp(12px,2vw,18px);border-top:3px dashed var(--line);text-align:center}
.ans .k{font-size:var(--fs-xs);font-weight:800;color:var(--mute)}
.ans .v{font-size:calc(clamp(22px,3.4vw,50px) * var(--qs));font-weight:900;color:var(--ok-d);
  line-height:1.3;word-break:keep-all;white-space:pre-wrap}
.noq{text-align:center;font-size:var(--fs-m);font-weight:800;color:var(--mute);padding:18px 0}

/* ── 남은 시간 ── */
.tmr{display:block;margin:0 auto 4px;width:min(100%,420px);height:12px;border-radius:999px;
  background:var(--paper2);overflow:hidden;border:1.5px solid var(--line)}
.tmr i{display:block;height:100%;background:var(--ok);transition:width .25s linear}
.tmr.warn i{background:var(--warn)}
.tmr.over i{background:var(--bad)}
.tmr-n{text-align:center;font-size:calc(clamp(16px,2.4vw,28px) * var(--qs));font-weight:900;
  color:var(--ink2);margin-bottom:12px;font-variant-numeric:tabular-nums}

/* ── 탈락 처리 ── */
.stepper{display:flex;align-items:center;justify-content:center;gap:clamp(12px,3vw,26px);margin-top:12px}
.stepper button{width:clamp(64px,11vw,92px);height:clamp(64px,11vw,92px);border-radius:24px;
  border:2px solid var(--line);background:#fff;font-size:clamp(30px,5vw,44px);font-weight:900;
  color:var(--ac-d);box-shadow:var(--sh)}
.stepper button:active{transform:translateY(2px)}
.stepper button.p{background:var(--bad);color:#fff;border-color:var(--bad)}
.stepper .n{font-size:clamp(44px,9vw,86px);font-weight:900;min-width:1.6em;text-align:center;
  line-height:1;font-variant-numeric:tabular-nums}

.stu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:7px}
.stu{border:2px solid var(--line);border-radius:13px;background:#fff;padding:9px 5px;text-align:center}
.stu.sel{border-color:var(--ok);background:#F3FBF4}
.stu .c{display:block;font-size:var(--fs-m);font-weight:900;color:var(--ok-d);line-height:1.1}
.stu .c.zero{color:var(--mute)}
.stu .n{display:block;font-size:var(--fs-xs);font-weight:800;margin-top:3px;line-height:1.25;word-break:break-all}
.stu .m{display:block;font-size:10.5px;color:var(--mute);font-weight:700;margin-top:2px}

/* ── 알림 ── */
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);z-index:99;
  background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;font-size:var(--fs-xs);
  font-weight:800;opacity:0;pointer-events:none;transition:.22s;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

.empty{text-align:center;color:var(--mute);font-weight:700;font-size:var(--fs-xs);padding:16px 0}
@media print{ .hdr,.btn,.chip{display:none!important} }
</style>
</head>
<body>

<header class="hdr"><div class="wrap hdr-in">
  <div class="hdr-t">🔔 도전 골든벨</div>

</div></header>

<main><div class="wrap" id="scr"></div></main>

<div id="toast"></div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   0. 잔심부름
   ══════════════════════════════════════════════════════════════════════════ */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
function escq(s){ return esc(s).replace(/"/g,'&quot;'); }
function toast(m){
  var t = $('toast'); if(!t) return;
  t.textContent = m; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove('on'); }, 2300);
}
function todayStr(){
  var d = new Date(), p = function(n){ return (n<10?'0':'') + n; };
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function lsGet(k, d){ try{ var v = localStorage.getItem(k); return v === null ? d : v; }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }

function fullToggle(){
  try{
    if(document.fullscreenElement) document.exitFullscreen();
    else if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
    else toast('이 브라우저는 전체화면을 지원하지 않아요');
  }catch(e){}
}

/* ══════════════════════════════════════════════════════════════════════════
   1. 🖼 사진 창고 — IndexedDB

   문제 글은 localStorage 에 두지만 사진은 여기 둔다. localStorage 는 5MB 에서
   막혀서 사진 스무 장이면 꽉 찬다. IndexedDB 는 그 벽이 없고, 똑같이 이 기기
   안에만 있다(서버로 아무것도 안 나간다).
   ══════════════════════════════════════════════════════════════════════════ */
var IMGC = {};          /* 그릴 때 바로 꺼내 쓰려고 메모리에도 얹어둔다 */
var IDB = (function(){
  var dbp = null;
  function open(){
    if(dbp) return dbp;
    dbp = new Promise(function(res, rej){
      if(!window.indexedDB) return rej(new Error('no idb'));
      /* img = 문제 사진, snd = 선생님이 넣어둔 음악. 판이 2 인 건 snd 가 나중에
         붙었기 때문이다 — 사진만 있던 기기도 열면서 조용히 칸이 하나 는다. */
      var rq = indexedDB.open('goldenbell', 2);
      rq.onupgradeneeded = function(){
        var d = rq.result;
        if(!d.objectStoreNames.contains('img')) d.createObjectStore('img');
        if(!d.objectStoreNames.contains('snd')) d.createObjectStore('snd');
      };
      rq.onsuccess = function(){ res(rq.result); };
      rq.onerror  = function(){ rej(rq.error); };
    });
    return dbp;
  }
  function run(st, mode, fn){
    return open().then(function(d){
      return new Promise(function(res, rej){
        var t = d.transaction(st, mode), s = t.objectStore(st), rq = fn(s);
        rq.onsuccess = function(){ res(rq.result); };
        rq.onerror   = function(){ rej(rq.error); };
      });
    });
  }
  return {
    put:  function(k,v,st){ return run(st||'img','readwrite', function(s){ return s.put(v,k); }); },
    del:  function(k,st){   return run(st||'img','readwrite', function(s){ return s.delete(k); }); },
    all:  function(st){
      st = st || 'img';
      return open().then(function(d){
        return new Promise(function(res){
          var out = {}, t = d.transaction(st,'readonly'), rq = t.objectStore(st).openCursor();
          rq.onsuccess = function(){
            var c = rq.result;
            if(c){ out[c.key] = c.value; c.continue(); } else res(out);
          };
          rq.onerror = function(){ res(out); };
        });
      });
    }
  };
})();

/* 사진은 넣기 전에 줄인다 — 휴대폰 사진 4MB 가 그대로 들어오면 판이 무거워진다.
   긴 변 1280px, JPEG 82%. 칠판에 띄우는 데는 이걸로 넘친다. */
function shrinkImage(file, cb){
  if(!file || !/^image\//.test(file.type||'')){ cb(null); return; }
  var r = new FileReader();
  r.onload = function(){
    var im = new Image();
    im.onload = function(){
      var MAX = 1280, w = im.width, h = im.height, s;
      if(w > MAX || h > MAX){ s = MAX / Math.max(w,h); w = Math.round(w*s); h = Math.round(h*s); }
      var cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      var cx = cv.getContext('2d');
      cx.fillStyle = '#fff'; cx.fillRect(0,0,w,h);   /* 투명 PNG 가 검게 나오지 않도록 */
      cx.drawImage(im, 0, 0, w, h);
      try{ cb(cv.toDataURL('image/jpeg', 0.82)); }catch(e){ cb(null); }
    };
    im.onerror = function(){ cb(null); };
    im.src = String(r.result);
  };
  r.onerror = function(){ cb(null); };
  r.readAsDataURL(file);
}
/* 사진을 창고에 넣고 열쇠(id)를 돌려준다 */
function imgStore(dataUrl, done){
  var id = 'i_' + uid();
  IMGC[id] = dataUrl;
  IDB.put(id, dataUrl).then(function(){ done && done(id); })
     .catch(function(){ done && done(id); });   /* IDB 가 막혀도 이번 수업은 굴러가게 */
}
/* 어느 문제도 안 쓰는 사진은 지운다 */
function imgSweep(){
  var used = {}, i, j, qs;
  for(i=0;i<SETS.length;i++){
    qs = SETS[i].qs || [];
    for(j=0;j<qs.length;j++) if(qs[j].img) used[qs[j].img] = 1;
  }
  for(var k in IMGC){ if(!used[k]){ delete IMGC[k]; IDB.del(k).catch(function(){}); } }
}

/* ══════════════════════════════════════════════════════════════════════════
   2. 🔊 소리 — 브라우저가 그 자리에서 만든다

   나눠 쓰는 판이라 남의 음원을 실어 보낼 수 없다. 무료라고 적힌 음원도 대개
   «파일 그대로 재배포»는 막혀 있어서, 공개 저장소에 mp3 를 담는 순간 걸린다.
   그래서 파일을 두지 않고 WebAudio 로 그때그때 합성한다 — 받을 게 없으니
   학교 와이파이가 느려도 즉시 나고, 인터넷이 끊겨도 나고, 라이선스가 붙을
   대상 자체가 없다.

   쓰던 브금이 따로 있으면 아래 「＋ 내 음악」으로 넣으면 된다 — 그 파일은
   선생님 기기 브라우저에만 들어가고 여기로 올라오지 않는다.

   폴더째 가져다 쓸 거면 audio/ 에 아래 이름대로 mp3 를 넣고 USE_FILES 를
   true 로 바꾸면 파일 쪽으로 굴러간다.
   ══════════════════════════════════════════════════════════════════════════ */
var USE_FILES = false;
var SND_BASE  = './audio/';
var SND = {
  write:   'sfx-write.mp3',    show:  'sfx-show.mp3',
  tense1:  'bgm-tense1.mp3',   tense2:'bgm-tense2.mp3',
  cute:    'bgm-cute.mp3',     fanfare:'sfx-fanfare.mp3'
};
var BGM_LIST = [{k:'tense1',n:'긴장감 1'},{k:'tense2',n:'긴장감 2'},{k:'cute',n:'귀여운 퀴즈'},{k:'off',n:'끄기'}];
var _aud = {}, _bgm = null;

/* ── 🎵 내 음악 넣기 ───────────────────────────────────────────────────────
   선생님이 고른 mp3 를 이 «기기 브라우저»에만 넣어둔다(IndexedDB snd 칸).
   여기로 올라오는 파일은 없다 — 각자 쓰던 브금을 각자 기기에 넣어 쓰는 구조라,
   누가 어떤 음악을 쓰든 이 페이지는 그대로 나눠 쓸 수 있다.
   배경음으로만 쓴다. 효과음은 짧고 정해진 신호라 손대지 않는다.
   ────────────────────────────────────────────────────────────────────────── */
var MYS = null;             /* [{id,name,url}] — url 은 이 세션에서 만든 임시 주소 */
var _mysBusy = false;

function mysLoad(){
  if(MYS || _mysBusy) return;
  _mysBusy = true;
  IDB.all('snd').then(function(m){
    var out = [], k;
    for(k in m){
      try{ out.push({ id:k, name:m[k].name, url:URL.createObjectURL(m[k].blob) }); }catch(e){}
    }
    MYS = out; _mysBusy = false;
    if(out.length) render();
  }).catch(function(){ MYS = []; _mysBusy = false; });
}
function mysAdd(input){
  /* ⚠️ input.files 는 «살아 있는» 목록이라 input.value='' 를 먼저 하면 그 자리에서
     비어버린다. 그래서 파일을 배열로 다 옮겨 담은 «뒤에» 입력칸을 비운다. */
  var fs = input.files, picked = [], i, f;
  for(i=0;i<(fs ? fs.length : 0);i++){
    f = fs[i];
    if(/^audio\//.test(f.type || '') || /\.(mp3|m4a|ogg|wav|aac|flac|opus)$/i.test(f.name)) picked.push(f);
  }
  input.value = '';                          /* 같은 파일을 다시 골라도 들어가게 */
  if(!picked.length){ toast(fs && fs.length ? '음악 파일이 아니에요' : '고른 파일이 없어요'); return; }
  if(!MYS) MYS = [];
  var left = picked.length;
  picked.forEach(function(g, j){
    var id = 'u_' + Date.now().toString(36) + j;
    var rec = { name: g.name.replace(/\.[^.]+$/, ''), blob: g };
    IDB.put(id, rec, 'snd').then(function(){
      try{ MYS.push({ id:id, name:rec.name, url:URL.createObjectURL(g) }); }catch(e){}
      if(--left === 0){ toast('음악 ' + picked.length + '개를 넣었어요'); render(); }
    }).catch(function(){
      if(--left === 0){ toast('넣지 못했어요 — 저장 공간을 확인해 주세요'); render(); }
    });
  });
}
function mysDel(id){
  var it = mysAt(id); if(!it) return;
  if(!confirm('「' + it.name + '」을 뺄까요? (원본 파일은 그대로예요)')) return;
  IDB.del(id, 'snd').catch(function(){});
  MYS = MYS.filter(function(x){ return x.id !== id; });
  try{ URL.revokeObjectURL(it.url); }catch(e){}
  delete _aud[id];
  if(bgmKey() === id) pickBgm('tense1');       /* 틀던 곡을 뺐으면 기본으로 */
  else render();
}
function mysAt(id){
  for(var i=0;i<(MYS||[]).length;i++) if(MYS[i].id === id) return MYS[i];
  return null;
}

function sndOn(){ return lsGet('gb2_snd','on') !== 'off'; }
function vol(){ var v = parseFloat(lsGet('gb2_vol','')); return (isFinite(v) && v>=0 && v<=1) ? v : 0.7; }
function bgmVol(){ return vol() * 0.5; }   /* 배경음은 선생님 목소리 밑에 깔린다 */
function bgmKey(){ return lsGet('gb2_bgm','tense1'); }

function setVol(v){
  v = Math.max(0, Math.min(1, (parseFloat(v)||0)/100));
  lsSet('gb2_vol', String(v));
  syncVol();                                   /* 합성기 쪽 */
  if(_bgm){ try{ _bgm.volume = bgmVol(); }catch(e){} }
  for(var k in _aud){ if(_aud[k] !== _bgm){ try{ _aud[k].volume = v; }catch(e){} } }
  var lab = $('volLab'); if(lab) lab.textContent = Math.round(v*100) + '%';
}
function toggleSnd(){
  var on = !sndOn();
  lsSet('gb2_snd', on ? 'on' : 'off');
  if(!on) bgmStop();
  render();
}
function pickBgm(k){
  lsSet('gb2_bgm', k); bgmStop();
  if(k !== 'off' && sndOn() && ST.ready && !ST.done) bgmPlay();
  render();
}
/* ── 파일로 나는 소리 — audio/ 의 mp3(USE_FILES) 이거나 내가 넣어둔 음악 ── */
function aud(key){
  var mine = (key && key.indexOf('u_') === 0) ? mysAt(key) : null;
  var src = mine ? mine.url : (SND[key] ? SND_BASE + SND[key] : null);
  if(!src) return null;
  if(!_aud[key]){ var a = new Audio(); a.preload = 'none'; a.src = src; _aud[key] = a; }
  return _aud[key];
}

/* ── 합성기 ────────────────────────────────────────────────────────────────
   효과음 줄(_SG)과 배경음 줄(_BG)을 따로 둔다. 배경음은 선생님 목소리 밑에
   깔려야 하니 슬라이더의 절반만 쓴다 — mp3 때와 똑같은 규칙이다.
   AudioContext 는 «교사가 시작을 누른 뒤»에 깨어난다(브라우저 규칙). ── */
var _AC = null, _SG = null, _BG = null, _NB = null;
function ac(){
  if(!_AC){
    try{ _AC = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ return null; }
    _SG = _AC.createGain(); _SG.connect(_AC.destination);
    _BG = _AC.createGain(); _BG.connect(_AC.destination);
  }
  if(_AC.state === 'suspended'){ try{ _AC.resume(); }catch(e){} }
  syncVol();
  return _AC;
}
function syncVol(){
  if(_SG) _SG.gain.value = vol();
  if(_BG) _BG.gain.value = bgmVol();
}

/* 소리 한 알 — 파형 하나에 붙였다 떼는 봉투를 씌운다 */
function tone(t0, o){
  if(!_AC) return;
  var osc = _AC.createOscillator(), g = _AC.createGain();
  osc.type = o.type || 'sine';
  osc.frequency.setValueAtTime(o.f, t0);
  if(o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f2), t0 + o.d);
  var pk = (o.g == null ? 0.25 : o.g), atk = (o.a == null ? 0.008 : o.a);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(pk, t0 + atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + o.d);
  osc.connect(g); g.connect(o.bus || _SG);
  osc.start(t0); osc.stop(t0 + o.d + 0.04);
}
/* 스치는 소리 — 초침·팡파레 끝의 «촤» 같은 것 */
function noise(t0, o){
  if(!_AC) return;
  if(!_NB){
    var n = Math.floor(_AC.sampleRate * 0.5);
    _NB = _AC.createBuffer(1, n, _AC.sampleRate);
    var ch = _NB.getChannelData(0);
    for(var i=0;i<n;i++) ch[i] = Math.random()*2 - 1;
  }
  var d = o.d || 0.05;
  var src = _AC.createBufferSource(); src.buffer = _NB; src.loop = true;
  var bp = _AC.createBiquadFilter(); bp.type = 'bandpass';
  bp.frequency.value = o.f || 3000; bp.Q.value = o.q || 1;
  var g = _AC.createGain();
  g.gain.setValueAtTime(o.g == null ? 0.2 : o.g, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  src.connect(bp); bp.connect(g); g.connect(o.bus || _SG);
  src.start(t0); src.stop(t0 + d + 0.02);
}

function sfxSynth(key){
  if(!ac()) return;
  var t = _AC.currentTime + 0.02;
  if(key === 'write'){
    /* «정답을 써주세요» — 종처럼 두 번, 낮은 데서 높은 데로 */
    tone(t,        {f:784,  d:0.42, g:0.30});
    tone(t,        {f:1568, d:0.28, g:0.07});
    tone(t + 0.20, {f:1047, d:0.60, g:0.30});
    tone(t + 0.20, {f:2093, d:0.34, g:0.06});
  } else if(key === 'show'){
    /* «정답을 들어주세요» — 세 계단 올라가며 재촉한다 */
    [1047, 1319, 1568].forEach(function(f, i){
      tone(t + i*0.10, {f:f, d:0.32, type:'triangle', g:0.26});
    });
    tone(t + 0.30, {f:2093, d:0.55, g:0.15});
  } else if(key === 'fanfare'){
    /* 팡파레 — 금관처럼 올라갔다가 화음으로 멈춘다 */
    [523, 659, 784, 1047].forEach(function(f, i){
      tone(t + i*0.11, {f:f,   d:0.20, type:'sawtooth', g:0.15});
      tone(t + i*0.11, {f:f/2, d:0.20, type:'square',   g:0.05});
    });
    [523, 659, 784, 1047].forEach(function(f){
      tone(t + 0.46, {f:f, d:1.6, type:'sawtooth', g:0.11, a:0.02});
    });
    noise(t + 0.46, {f:6000, d:0.55, g:0.09, q:0.7});
  }
}

/* 배경음 — 한 박씩 미리 예약해 두고 끊길 때까지 이어 붙인다 */
var _bgmJob = null;
function bgmPattern(kind, s, t){
  var B = _BG;
  if(kind === 'tense1'){
    /* 시계 초침 — 골든벨의 긴장은 사실 이 소리다 */
    noise(t, {f:4200, d:0.045, g:0.16, q:1.4, bus:B});
    if(s % 4 === 0) tone(t, {f:110, d:0.42, g:0.20, bus:B});
    if(s % 8 === 4) tone(t, {f:98,  d:0.42, g:0.15, bus:B});
  } else if(kind === 'tense2'){
    /* 심장 박동 — 쿵, 쿵 … 그 밑에 반음 어긋난 현이 깔린다 */
    if(s % 4 === 0){
      tone(t,        {f:70, d:0.30, g:0.34, bus:B});
      tone(t + 0.22, {f:62, d:0.34, g:0.24, bus:B});
    }
    if(s % 8 === 0){
      tone(t, {f:147, d:3.8, type:'sawtooth', g:0.045, a:0.6, bus:B});
      tone(t, {f:156, d:3.8, type:'sawtooth', g:0.032, a:0.6, bus:B});
    }
  } else if(kind === 'cute'){
    /* 마림바처럼 통통 — 5음 음계라 아무렇게 겹쳐도 어긋나지 않는다 */
    var sc = [523, 587, 659, 784, 880, 1047];
    var f  = sc[[0,2,4,2,1,3,5,3][s % 8]];
    tone(t, {f:f,   d:0.26, type:'triangle', g:0.20, bus:B});
    tone(t, {f:f*2, d:0.13, g:0.05, bus:B});
    if(s % 8 === 0) tone(t, {f:131, d:0.5, g:0.16, bus:B});
    if(s % 8 === 4) tone(t, {f:175, d:0.5, g:0.14, bus:B});
  }
}
function bgmSynth(kind){
  if(!ac()) return null;
  var stopped = false, at = _AC.currentTime + 0.06, step = 0;
  var beat = (kind === 'cute') ? 0.30 : 0.5;
  function fill(){
    if(stopped || !_AC) return;
    while(at < _AC.currentTime + 0.6){ bgmPattern(kind, step, at); at += beat; step++; }
  }
  var iv = setInterval(fill, 120);
  fill();
  return { stop: function(){ stopped = true; clearInterval(iv); } };
}

/* ── 바깥에서 쓰는 문 — 파일이든 합성이든 여기까지만 보면 된다 ── */
function sfx(key){
  if(!sndOn()) return;
  if(USE_FILES){
    var a = aud(key); if(!a) return;
    try{ a.volume = vol(); a.currentTime = 0; var p = a.play(); if(p && p.catch) p.catch(function(){}); }catch(e){}
    return;
  }
  sfxSynth(key);
}
function bgmPlay(){
  var k = bgmKey();
  if(!sndOn() || k === 'off') return;
  bgmStop();
  /* 내가 넣어둔 음악은 합성기와 상관없이 언제나 파일로 난다 */
  if(USE_FILES || k.indexOf('u_') === 0){
    var a = aud(k); if(!a) return;
    a.loop = true; a.volume = bgmVol(); _bgm = a;
    try{ var p = a.play(); if(p && p.catch) p.catch(function(){}); }catch(e){}
    return;
  }
  _bgmJob = bgmSynth(k);
}
function bgmStop(){
  if(_bgmJob){ _bgmJob.stop(); _bgmJob = null; }
  if(_bgm){ try{ _bgm.pause(); _bgm.currentTime = 0; }catch(e){} _bgm = null; }
}
function sndBar(){
  var on = sndOn(), k = bgmKey(), i;
  var h = '<div class="chips" style="margin-top:9px">' +
          '<button class="chip sm" onclick="toggleSnd()">' + (on ? '🔊 소리 켜짐' : '🔇 소리 꺼짐') + '</button>';
  if(on){
    h += '<span class="sub" style="font-weight:800">배경음</span>';
    for(i=0;i<BGM_LIST.length;i++){
      if(BGM_LIST[i].k === 'off') continue;        /* 「끄기」는 내 음악 뒤로 민다 */
      h += '<button class="chip sm' + (k===BGM_LIST[i].k?' on':'') + '" onclick="pickBgm(\'' + BGM_LIST[i].k + '\')">' + BGM_LIST[i].n + '</button>';
    }
    mysLoad();
    var mine = MYS || [];
    for(i=0;i<mine.length;i++){
      h += '<span class="chip sm' + (k===mine[i].id?' on':'') +
           '" style="display:inline-flex;align-items:center;gap:7px">' +
           '<b onclick="pickBgm(\'' + mine[i].id + '\')" style="cursor:pointer;font-weight:800">🎵 ' +
           esc(mine[i].name) + '</b>' +
           '<b onclick="mysDel(\'' + mine[i].id + '\')" style="cursor:pointer;opacity:.5">✕</b></span>';
    }
    h += '<label class="chip sm" style="cursor:pointer" title="고른 파일은 이 기기에만 저장돼요">＋ 내 음악' +
         '<input type="file" accept="audio/*" multiple style="display:none" onchange="mysAdd(this)"></label>' +
         '<button class="chip sm' + (k==='off'?' on':'') + '" onclick="pickBgm(\'off\')">끄기</button>';
    h += '</div><div style="display:flex;gap:9px;align-items:center;margin-top:8px">' +
         '<span class="sub" style="font-weight:800;flex:0 0 auto">🔉 크기</span>' +
         '<input type="range" min="0" max="100" step="5" value="' + Math.round(vol()*100) + '"' +
         ' oninput="setVol(this.value)" style="flex:1;min-width:110px;accent-color:var(--ac)">' +
         '<b id="volLab" style="flex:0 0 auto;font-size:12px;color:var(--ac-d);min-width:38px;text-align:right">' +
         Math.round(vol()*100) + '%</b>';
  }
  return h + '</div>';
}

/* ══════════════════════════════════════════════════════════════════════════
   3. 📝 문제 묶음

   묶음(세트) 하나가 «한 시간 분량»이다. 단원별로 여러 개 만들어 두고 시작할 때
   고른다. 글은 localStorage, 사진은 위의 창고. 파일로 내보내면 사진까지 같이
   담기니 집에서 만들어 학교에서 열거나, 옆 반 선생님께 그대로 드리면 된다.
   ══════════════════════════════════════════════════════════════════════════ */
var SETS = [];        /* [{id,name,qs:[{q,a,img}]}] */
var CUR  = null;      /* 지금 고른 묶음 id */
var _edit = false, _editIx = -1, _draftImg = null, _bulk = false;

function setsLoad(){
  try{ SETS = JSON.parse(lsGet('gb2_sets','[]')); }catch(e){ SETS = []; }
  if(!(SETS instanceof Array)) SETS = [];
  var i;
  for(i=0;i<SETS.length;i++){ if(!(SETS[i].qs instanceof Array)) SETS[i].qs = []; }
  CUR = lsGet('gb2_cur', null);
  if(!curSet() && SETS.length) CUR = SETS[0].id;
}
function setsSave(){
  try{ localStorage.setItem('gb2_sets', JSON.stringify(SETS)); }
  catch(e){ toast('저장 공간이 가득 찼어요 — 안 쓰는 묶음을 지워보세요'); }
  lsSet('gb2_cur', CUR || '');
}
function curSet(){
  for(var i=0;i<SETS.length;i++) if(SETS[i].id === CUR) return SETS[i];
  return null;
}
function curQs(){ var s = curSet(); return s ? s.qs : []; }
function qAt(round){ var l = curQs(); return l[round-1] || null; }

function setPick(id){ CUR = id; _editIx = -1; setsSave(); render(); }
function setAdd(){
  var n = prompt('묶음 이름 (예: 9월 7일 · 옴의 법칙)', todayStr() + ' 골든벨');
  if(n === null) return;
  n = n.trim() || todayStr();
  var s = { id:'s_'+uid(), name:n, qs:[] };
  SETS.push(s); CUR = s.id; _edit = true; _editIx = -1;
  setsSave(); render();
}
function setRename(){
  var s = curSet(); if(!s) return;
  var n = prompt('묶음 이름을 바꿉니다', s.name);
  if(n === null) return;
  s.name = n.trim() || s.name; setsSave(); render();
}
function setDel(){
  var s = curSet(); if(!s) return;
  if(!confirm('「' + s.name + '」 묶음을 문제 ' + s.qs.length + '개와 함께 지울까요?')) return;
  SETS = SETS.filter(function(x){ return x.id !== s.id; });
  CUR = SETS.length ? SETS[0].id : null;
  setsSave(); imgSweep(); render();
}

/* ── 문제 하나씩 ── */
function qToggleEdit(){ _edit = !_edit; _editIx = -1; _draftImg = null; _bulk = false; render(); }
function qEdit(i){
  var l = curQs(); if(!l[i]) return;
  _edit = true; _editIx = i; _draftImg = l[i].img || null; _bulk = false; render();
}
function qCancel(){ _editIx = -1; _draftImg = null; render(); }
function qAdd(){
  var s = curSet();
  if(!s){ toast('묶음을 먼저 만들어주세요'); return; }
  var qi = $('inQ'), ai = $('inA');
  var q = qi ? qi.value.trim() : '', a = ai ? ai.value.trim() : '';
  if(!q && !_draftImg){ toast('문제를 적거나 사진을 넣어주세요'); if(qi) qi.focus(); return; }
  var item = { q:q, a:a };
  if(_draftImg) item.img = _draftImg;
  if(_editIx >= 0 && s.qs[_editIx]) s.qs[_editIx] = item;
  else s.qs.push(item);
  _editIx = -1; _draftImg = null;
  setsSave(); imgSweep(); render();
}
function qDel(i){
  var s = curSet(); if(!s || !s.qs[i]) return;
  if(!confirm((i+1) + '번 문제를 지울까요?')) return;
  s.qs.splice(i,1);
  if(_editIx === i){ _editIx = -1; _draftImg = null; }
  setsSave(); imgSweep(); render();
}
function qMove(i, d){
  var s = curSet(); if(!s) return;
  var j = i + d; if(j < 0 || j >= s.qs.length) return;
  var t = s.qs[i]; s.qs[i] = s.qs[j]; s.qs[j] = t;
  _editIx = -1; setsSave(); render();
}

/* ── 여러 문제를 한 번에 붙여넣기 ──────────────────────────────────────────
   엑셀에서 두 칸 복사한 것(탭), `문제 | 정답`, `문제 :: 정답`, `문제 → 정답`,
   그리고 «문제 다음 줄에 답:» 형태를 모두 알아본다. 앞의 번호(1. 1) 1-)는 뗀다.
   ────────────────────────────────────────────────────────────────────────── */
function parseBulk(text){
  var lines = String(text||'').replace(/\r/g,'').split('\n'), out = [], i, ln, m, p;
  for(i=0;i<lines.length;i++){
    ln = lines[i].trim();
    if(!ln) continue;

    /* 「답: …」 「정답 - …」 「A. …」 → 바로 앞 문제의 정답으로 붙인다 */
    m = ln.match(/^(?:정답|답|A)\s*[.:)\-–]\s*(.+)$/i);
    if(m && out.length){ out[out.length-1].a = m[1].trim(); continue; }

    ln = ln.replace(/^(?:Q\s*[.:)]|\d+\s*[.):\]]|[-•*])\s*/i, '').trim();
    if(!ln) continue;

    if(ln.indexOf('\t') >= 0)      p = ln.split('\t');
    else if(ln.indexOf('|') >= 0)  p = ln.split('|');
    else if(ln.indexOf('::') >= 0) p = ln.split('::');
    else if(ln.indexOf('→') >= 0)  p = ln.split('→');
    else                           p = [ln];

    var q = (p[0]||'').trim(), a = (p.slice(1).join(' ')||'').trim();
    if(q) out.push({ q:q, a:a });
  }
  return out;
}
function bulkToggle(){ _bulk = !_bulk; render(); }
function bulkApply(mode){
  var s = curSet();
  if(!s){ toast('묶음을 먼저 만들어주세요'); return; }
  var ta = $('inBulk'); if(!ta) return;
  var got = parseBulk(ta.value);
  if(!got.length){ toast('알아볼 수 있는 문제가 없어요'); return; }
  if(mode === 'replace'){
    if(!confirm('지금 ' + s.qs.length + '개를 지우고 ' + got.length + '개로 바꿀까요?')) return;
    s.qs = got;
  } else {
    s.qs = s.qs.concat(got);
  }
  _bulk = false; _editIx = -1;
  setsSave(); imgSweep();
  toast('문제 ' + got.length + '개를 넣었어요');
  render();
}

/* ── 사진 붙이기 ── */
function imgFromFile(f){
  if(!f) return;
  shrinkImage(f, function(d){
    if(!d){ toast('이 파일은 사진이 아니에요'); return; }
    imgStore(d, function(id){
      if(_draftImg && _draftImg !== id){ /* 갈아끼우면 옛것은 정리 때 지워진다 */ }
      _draftImg = id; render();
      var el = $('inQ'); if(el) el.focus();
    });
  });
}
function imgPick(input){ var f = input.files && input.files[0]; imgFromFile(f); input.value = ''; }
function imgDropOn(e){ e.preventDefault(); e.currentTarget.classList.add('hot'); }
function imgDropOff(e){ e.preventDefault(); e.currentTarget.classList.remove('hot'); }
function imgDrop(e){
  e.preventDefault(); e.currentTarget.classList.remove('hot');
  var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  imgFromFile(f);
}
function imgClear(){ _draftImg = null; render(); }

/* 편집기가 열려 있을 때 Ctrl+V 로 캡처를 바로 붙인다 — 교과서 캡처가 제일 흔하다 */
document.addEventListener('paste', function(e){
  if(!_edit || _bulk) return;
  var items = (e.clipboardData && e.clipboardData.items) || [];
  for(var i=0;i<items.length;i++){
    if(items[i].type && items[i].type.indexOf('image') === 0){
      var f = items[i].getAsFile();
      if(f){ e.preventDefault(); imgFromFile(f); return; }
    }
  }
});

/* ── 파일로 주고받기 ── */
function qExport(){
  var s = curSet();
  if(!s || !s.qs.length){ toast('내보낼 문제가 없어요'); return; }
  var out = { app:'goldenbell', v:1, name:s.name, made:todayStr(), qs:[] };
  for(var i=0;i<s.qs.length;i++){
    var it = s.qs[i], row = { q:it.q, a:it.a || '' };
    if(it.img && IMGC[it.img]) row.img = IMGC[it.img];   /* 사진은 통째로 담는다 */
    out.qs.push(row);
  }
  var blob = new Blob([JSON.stringify(out)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '골든벨_' + s.name.replace(/[\\/:*?"<>|]/g,'_') + '.json';
  a.click(); URL.revokeObjectURL(a.href);
  toast('문제 ' + s.qs.length + '개를 내려받았어요');
}
function qImport(input){
  var f = input.files && input.files[0];
  input.value = '';
  if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    var data;
    try{ data = JSON.parse(String(r.result)); }catch(e){ toast('올바른 골든벨 문제 파일이 아니에요'); return; }
    var arr = (data instanceof Array) ? data : (data && data.qs);   /* 옛 형식(배열)도 받는다 */
    if(!(arr instanceof Array) || !arr.length){ toast('문제가 들어 있지 않아요'); return; }
    var name = (data && data.name) || (f.name || '').replace(/\.json$/i,'').replace(/^골든벨_/,'') || todayStr();
    var set = { id:'s_'+uid(), name:name, qs:[] }, pending = 0, done = false;

    function finish(){
      if(done || pending) return;
      done = true;
      SETS.push(set); CUR = set.id; _edit = false; _editIx = -1;
      setsSave(); render();
      toast('「' + name + '」 문제 ' + set.qs.length + '개를 불러왔어요');
    }
    for(var i=0;i<arr.length;i++){
      var it = arr[i]; if(!it) continue;
      var q = String(it.q == null ? '' : it.q), a = String(it.a == null ? '' : it.a);
      if(!q && !it.img) continue;
      var item = { q:q, a:a };
      set.qs.push(item);
      if(typeof it.img === 'string' && it.img.indexOf('data:') === 0){
        pending++;
        (function(item){
          imgStore(it.img, function(id){ item.img = id; pending--; finish(); });
        })(item);
      }
    }
    finish();
  };
  r.readAsText(f);
}

/* 같은 주소(github.io)라면 칭찬도장판이 쓰던 문제가 이 브라우저에 남아 있다 */
function legacyCount(){

    var a = JSON.parse(localStorage.getItem('gb_qs_v1') || '[]');
    return (a instanceof Array) ? a.length : 0;
  }catch(e){ return 0; }
}
function legacyImport(){

/* ══════════════════════════════════════════════════════════════════════════
   4. 진행 상태

   명단이 없어도 굴러가야 한다. 그래서 기본은 «인원수»다 — 25명으로 시작해
   라운드마다 틀린 사람 수만 누르면 남은 사람이 줄어든다. 이름을 붙여넣으면
   예전처럼 «틀린 사람만 탭»으로 바뀌고, 그 이름도 이 기기에만 남는다.
   ══════════════════════════════════════════════════════════════════════════ */
var ST = null;
function stNew(){
  return {
    mode:'count', head:25, names:[], out:{}, outN:{},
    total:4, round:1, rev:0, ready:false, done:false, revived:false,
    timer:0, setId:CUR, qs:1
  };
}
function stSave(){ try{ localStorage.setItem('gb2_state', JSON.stringify(ST)); }catch(e){} }
function stLoad(){
  try{ ST = JSON.parse(localStorage.getItem('gb2_state')); }catch(e){ ST = null; }
  if(!ST || typeof ST !== 'object') ST = stNew();
  var d = stNew();
  for(var k in d) if(ST[k] === undefined) ST[k] = d[k];
  if(!(ST.names instanceof Array)) ST.names = [];
  return ST;
}
function stReset(){ bgmStop(); tmrStop(); ST = stNew(); ST.setId = CUR; stSave(); render(); }

function isNames(){ return ST.mode === 'names' && ST.names.length > 0; }
function outAt(r){
  if(isNames()){ var n = 0; for(var i in ST.out) if(ST.out[i] === r) n++; return n; }
  return ST.outN[r] || 0;
}
function aliveN(){
  if(isNames()){
    var n = 0; for(var i=0;i<ST.names.length;i++) if(!ST.out[i]) n++;
    return n;
  }
  var tot = ST.head, k;
  for(k in ST.outN) tot -= (ST.outN[k] || 0);
  return Math.max(0, tot);
}
function aliveNames(){
  var l = [];
  for(var i=0;i<ST.names.length;i++) if(!ST.out[i]) l.push(ST.names[i]);
  return l;
}
/* 아무도 못 살아남았을 때 — 가장 멀리 간 사람 */
function furthest(){
  var best = 0, i, r;
  for(i in ST.out){ r = ST.out[i]; if(r > best) best = r; }
  var list = [];
  for(i in ST.out) if(ST.out[i] === best) list.push(ST.names[i]);
  return { round:best, names:list };
}

function setMode(m){ ST.mode = m; stSave(); render(); }
function setHead(n){ ST.head = Math.max(1, Math.min(200, n)); stSave(); render(); }
function headStep(d){ setHead((ST.head||0) + d); }
function namesApply(){
  var ta = $('inNames'); if(!ta) return;
  var list = String(ta.value).replace(/\r/g,'').split(/[\n,]/)
              .map(function(s){ return s.trim(); }).filter(function(s){ return s; });
  if(!list.length){ toast('이름을 한 줄에 한 명씩 적어주세요'); return; }
  ST.names = list; ST.out = {}; ST.mode = 'names';
  stSave(); render();
  toast(list.length + '명을 넣었어요');
}
function namesClear(){
  if(!confirm('넣어둔 이름을 지울까요?')) return;
  ST.names = []; ST.out = {}; ST.mode = 'count'; stSave(); render();
}
function setTotal(n){ ST.total = Math.max(1, Math.min(20, n)); stSave(); render(); }
function setTimer(s){ ST.timer = s; stSave(); tmrStop(); if(ST.ready && !ST.done && s) tmrStart(); render(); }
function setQs(v){ ST.qs = v; stSave(); document.documentElement.style.setProperty('--qs', v); render(); }

/* ── 시작 · 라운드 ── */
function begin(){
  if(aliveN() <= 0){ toast('참가할 사람이 없어요'); return; }
  ST.ready = true; ST.round = 1; ST.rev = 0; ST.done = false;
  ST.out = isNames() ? {} : ST.out; ST.outN = {};
  ST.setId = CUR;
  stSave(); bgmPlay(); tmrStart(); render();
}
function tap(i){
  if(!isNames()) return;
  if(ST.out[i] === undefined) ST.out[i] = ST.ready ? ST.round : 0;
  else delete ST.out[i];
  stSave(); render();
}
function outStep(d){
  var cur = ST.outN[ST.round] || 0, next = cur + d;
  if(next < 0) return;
  if(d > 0 && aliveN() <= 0) return;          /* 남은 사람보다 더 떨어뜨릴 수는 없다 */
  ST.outN[ST.round] = next;
  stSave(); render();
}
function next(){
  ST.rev = 0;
  if(ST.round >= ST.total){
    ST.done = true; bgmStop(); tmrStop();
    if(aliveN()) sfx('fanfare');
  } else {
    ST.round += 1; sfx('write'); tmrStart();
  }
  stSave(); render();
}
function back(){
  if(ST.round <= 1) return;
  if(ST.done) bgmPlay();
  var r = ST.round, i;
  if(isNames()){ for(i in ST.out) if(ST.out[i] === r) delete ST.out[i]; }
  delete ST.outN[r];
  ST.round -= 1; ST.done = false; ST.rev = 0;
  stSave(); tmrStart(); render();
}
function reveal(){ ST.rev = 1; stSave(); tmrStop(); render(); }
function quit(){
  if(!confirm('골든벨을 끝내고 준비 화면으로 돌아갈까요?')) return;
  stReset();
}
/* 패자부활 — 다 떨어졌을 때 한 번 더 기회를 준다 */
function revive(){
  if(!confirm('탈락한 사람을 모두 되살려 마지막 한 문제를 더 낼까요?')) return;
  ST.out = {}; ST.outN = {};
  ST.total += 1; ST.round = ST.total; ST.done = false; ST.rev = 0; ST.revived = true;
  stSave(); bgmPlay(); tmrStart(); render();
}

/* ── ⏱ 남은 시간 ── */
var _tmrEnd = 0, _tmrIv = null, _tmrRang = false;
function tmrStart(){
  tmrStop();
  if(!ST.timer) return;
  _tmrEnd = Date.now() + ST.timer * 1000; _tmrRang = false;
  _tmrIv = setInterval(tmrPaint, 200);
  tmrPaint();
}
function tmrStop(){ if(_tmrIv){ clearInterval(_tmrIv); _tmrIv = null; } }
function tmrPaint(){
  var bar = $('tmrBar'), num = $('tmrNum');
  if(!bar || !num){ return; }
  var left = Math.max(0, _tmrEnd - Date.now()), sec = Math.ceil(left/1000);
  var pct = ST.timer ? Math.max(0, Math.min(100, left / (ST.timer*1000) * 100)) : 0;
  bar.firstChild.style.width = pct + '%';
  bar.className = 'tmr' + (pct <= 20 ? ' over' : (pct <= 45 ? ' warn' : ''));
  num.textContent = sec > 0 ? (sec + '초') : '시간 끝!';
  if(left <= 0 && !_tmrRang){ _tmrRang = true; sfx('show'); tmrStop(); }
}

/* ══════════════════════════════════════════════════════════════════════════
   5. 화면
   ══════════════════════════════════════════════════════════════════════════ */
function render(){
  var el = $('scr'); if(!el) return;
  document.documentElement.style.setProperty('--qs', ST.qs || 1);
  if(!ST.ready)      el.innerHTML = viewSetup();
  else if(!ST.done)  el.innerHTML = viewPlay();
  else               el.innerHTML = viewDone();
  if(ST.ready && !ST.done && ST.timer) tmrPaint();
}

  return h;

/* ── 문제 편집기 ── */
function editor(){
  var s = curSet(), l = curQs();
  var ed = (_editIx >= 0 && l[_editIx]) ? l[_editIx] : null;
  var h = '<div style="margin-top:14px;padding-top:14px;border-top:2px dashed var(--line)">';

  h += '<div class="chips" style="margin-bottom:10px">' +
       '<button class="chip sm' + (!_bulk?' on':'') + '" onclick="' + (_bulk?'bulkToggle()':'') + '">한 문제씩</button>' +

  if(_bulk){
    h += '<div class="sub">한 줄에 한 문제씩 붙여넣으세요. 엑셀에서 두 칸 복사한 것도 그대로 됩니다.</div>' +
         '<div class="hint">알아보는 형식 · <b>문제 | 정답</b> · <b>문제 → 정답</b> · <b>문제 :: 정답</b> · 엑셀 두 칸(탭) · ' +
         '문제 다음 줄에 <b>답: 정답</b>. 앞의 번호(1. 1))는 알아서 뗍니다.</div>' +
         '<textarea class="inp" id="inBulk" rows="7" style="margin-top:9px" placeholder="1. 전류의 단위는? | 암페어(A)&#10;2. 전압의 단위는?&#10;답: 볼트(V)&#10;저항의 단위는? → 옴(Ω)"></textarea>' +
         '<div class="row" style="margin-top:9px">' +
         '<button class="btn g" onclick="bulkApply(\'add\')">+ 뒤에 이어붙이기</button>' +
         '<button class="btn ghost" onclick="bulkApply(\'replace\')">↺ 전부 바꾸기</button></div>';
  } else {
    h += '<textarea class="inp" id="inQ" rows="2" placeholder="문제 (예: 마찰한 두 물체가 서로 밀어냈다면 두 물체의 전하는 같은 종류일까, 다른 종류일까?)">' +
         (ed ? esc(ed.q) : '') + '</textarea>' +
         '<input class="inp" id="inA" style="margin-top:7px" placeholder="정답 (비워두면 정답 공개 버튼이 안 나와요)" value="' +
         (ed ? escq(ed.a) : '') + '">';

    /* 사진 */
    if(_draftImg && IMGC[_draftImg]){
      h += '<div class="imgprev"><img src="' + IMGC[_draftImg] + '" alt="">' +
           '<button class="x" onclick="imgClear()">✕</button></div>';
    } else {
      h += '<label class="drop" ondragover="imgDropOn(event)" ondragleave="imgDropOff(event)" ondrop="imgDrop(event)">' +
           '<div class="big">🖼</div>' +
           '<div class="sub" style="margin-top:4px"><b>사진 끌어다 놓기</b> · 눌러서 고르기 · <b>Ctrl+V</b> 로 캡처 붙여넣기</div>' +
           '<input type="file" accept="image/*" style="display:none" onchange="imgPick(this)"></label>';
    }

    h += '<div class="row" style="margin-top:9px">' +
         '<button class="btn g" onclick="qAdd()">' + (ed ? '✔ 이대로 고치기' : '+ 문제 추가') + '</button>' +
         (ed ? '<button class="btn ghost" style="flex:0 0 auto;padding-left:18px;padding-right:18px" onclick="qCancel()">취소</button>' : '') +
         '</div>';
  }

  h += '<div class="chips" style="margin-top:12px">' +
       '<button class="chip sm" onclick="qExport()">⬇ 파일로 내보내기</button>' +
       '<label class="chip sm" style="cursor:pointer">⬆ 파일에서 불러오기' +
       '<input type="file" accept=".json,application/json" style="display:none" onchange="qImport(this)"></label>' +
       '</div>' +
       '<div class="hint">내보낸 파일에는 <b>사진까지 같이</b> 담깁니다. 집에서 만들어 학교 기기에서 열거나, ' +
       '다른 선생님께 그대로 드려도 돼요.</div>';
  return h + '</div>';
}

/* ── 진행 ─────────────────────────────────────────────────────────────── */
function viewPlay(){
  var h = '', n = aliveN(), q = qAt(ST.round), i;

  /* 무대 */
  h += '<div class="stage">' +
       '<div class="stage-top">' +
       '<span class="stage-no">' + ST.round + '번 문제</span>' +
       '<span class="stage-alive">남은 사람 <b>' + n + '명</b> ' +
       '<span style="color:var(--mute);font-weight:600">/ ' + ST.total + '문제 중 ' + ST.round + '</span></span>' +
       '</div>';

  if(ST.timer){
    h += '<div class="tmr" id="tmrBar"><i style="width:100%"></i></div><div class="tmr-n" id="tmrNum">' + ST.timer + '초</div>';
  }

  if(!q){
    h += '<div class="noq">넣어둔 문제가 없어요 — 선생님이 구두로 내주세요</div>';
  } else {
    h += '<div class="qbody">';
    if(q.q) h += '<div class="qtext">' + esc(q.q) + '</div>';
    if(q.img && IMGC[q.img]) h += '<div class="qimg"><img src="' + IMGC[q.img] + '" alt=""></div>';
    h += '</div>';
    if(q.a){
      if(ST.rev){
        h += '<div class="ans"><div class="k">정답</div><div class="v">' + esc(q.a) + '</div></div>';
      } else {
        h += '<div style="text-align:center"><button class="chip" style="margin-top:16px;padding:12px 26px;font-size:var(--fs-s)" onclick="reveal()">👀 정답 공개 <span style="opacity:.6">(스페이스)</span></button></div>';
      }
    }
  }
  h += '</div>';

  /* 탈락 처리 */
  if(isNames()){
    h += '<div class="card"><div class="sub">답을 <b>틀린 사람만</b> 누르세요. 잘못 눌렀으면 다시 누르면 살아나요.</div>' +
         '<div class="stu-grid" style="margin-top:9px">' + stuCards() + '</div></div>';
  } else {
    var oc = ST.outN[ST.round] || 0;
    h += '<div class="card" style="text-align:center">' +
         '<div class="sub">이번 문제에서 <b>틀린 사람</b>이 몇 명인가요?</div>' +
         '<div class="stepper">' +
         '<button onclick="outStep(-1)">−</button>' +
         '<span class="n" style="color:' + (oc ? 'var(--bad)' : 'var(--mute)') + '">' + oc + '</span>' +
         '<button class="p" onclick="outStep(1)">+</button>' +
         '</div>' +
         '<div class="sub" style="margin-top:8px">누르면 남은 사람이 <b>' + n + '명</b>으로 줄어요</div></div>';
  }

  /* 신호음 */
  h += '<div class="card"><div class="row">' +
       '<button class="chip" style="padding:13px 0" onclick="sfx(\'write\')">✍️ 정답을 써주세요</button>' +
       '<button class="chip" style="padding:13px 0" onclick="sfx(\'show\')">🙌 정답을 들어주세요</button>' +
       '</div>' + sndBar() + '</div>';

  /* 넘기기 */
  h += '<div class="card"><button class="btn g big" onclick="next()">' +
       (ST.round >= ST.total ? '🏁 결과 보기' : '다음 문제 (' + (ST.round+1) + '번) →') + '</button>' +
       '<div class="chips" style="margin-top:10px">' +
       '<button class="chip sm" style="flex:1" onclick="back()">↩ 앞 문제로</button>' +
       (ST.timer ? '<button class="chip sm" style="flex:1" onclick="tmrStart()">⏱ 시간 다시</button>' : '') +
       '<button class="chip sm" style="flex:1" onclick="quit()">그만두기</button>' +
       '<button class="chip sm" style="flex:1" onclick="fullToggle()">⛶ 전체화면</button>' +
       '</div></div>';
  return h;
}

function stuCards(onlyAlive){
  var h = '', i, out;
  for(i=0;i<ST.names.length;i++){
    out = ST.out[i] !== undefined;
    if(onlyAlive && out) continue;
    h += '<button class="stu' + (out ? '' : ' sel') + '"' + (out ? ' style="opacity:.42"' : '') +
         (onlyAlive ? '' : ' onclick="tap(' + i + ')"') + '>' +
         '<span class="c' + (out ? ' zero' : '') + '">' + (out ? (ST.out[i] ? ST.out[i] + '번' : '—') : '○') + '</span>' +
         '<span class="n">' + esc(ST.names[i]) + '</span>' +
         '<span class="m">' + (out ? (ST.out[i] ? ST.out[i] + '번에서' : '오늘 안 함') : '생존') + '</span>' +
         '</button>';
  }
  return h || '<div class="empty" style="grid-column:1/-1">아무도 없어요</div>';
}

/* ── 결과 ─────────────────────────────────────────────────────────────── */
function viewDone(){
  var n = aliveN(), h = '', r, i;

  h += '<div class="card" style="text-align:center;padding:26px 16px">' +
       '<div style="font-size:clamp(38px,8vw,64px);line-height:1">' + (n ? '🎉' : '😮') + '</div>' +
       '<div style="font-size:calc(clamp(24px,5vw,44px) * var(--qs));font-weight:900;color:var(--ac-d);margin-top:4px">' +
       (n ? n + '명 생존!' : '끝까지 간 사람이 없어요') + '</div>' +
       '<div class="sub" style="margin-top:4px">' + ST.total + '문제' + (ST.revived ? ' · 패자부활 포함' : '') + '</div></div>';

  if(isNames()){
    if(n){
      h += '<div class="card"><h3>🏅 끝까지 남은 사람</h3>' +
           '<div class="stu-grid" style="margin-top:9px">' + stuCards(true) + '</div></div>';
    } else {
      var f = furthest();
      h += '<div class="card"><h3>가장 오래 남은 사람</h3>' +
           '<div class="sub" style="margin:6px 0 4px">' + f.round + '번 문제까지 갔어요 · ' + f.names.length + '명</div>' +
           '<div style="font-size:var(--fs-m);font-weight:800;line-height:1.7">' + esc(f.names.join(' · ')) + '</div></div>';
    }
  }

  /* 문제별로 몇 명이 떨어졌는지 — 어느 문제가 너무 어려웠는지 바로 보인다 */
  var per = [];
  for(r=1;r<=ST.total;r++) per.push(r + '번 ' + outAt(r) + '명');
  h += '<div class="card"><h3>문제별 탈락</h3><div class="sub" style="margin-top:6px">' + per.join(' · ') + '</div></div>';

  h += '<div class="card"><div class="chips">' +
       (n ? '' : '<button class="chip go" style="flex:1;padding:12px 0" onclick="revive()">🔁 패자부활전</button>') +
       '<button class="chip sm" style="flex:1" onclick="back()">↩ 앞 문제로</button>' +
       '<button class="chip sm" style="flex:1" onclick="stReset()">처음부터</button>' +
       '</div></div>';
  return h;
}

/* ══════════════════════════════════════════════════════════════════════════
   6. 자판 — 전자칠판 앞에서 마우스를 찾지 않아도 되게
   ══════════════════════════════════════════════════════════════════════════ */
document.addEventListener('keydown', function(e){
  var t = e.target, tag = (t && t.tagName || '').toLowerCase();
  if(tag === 'input' || tag === 'textarea') return;      /* 글 쓰는 중에는 가만히 */
  if(!ST || !ST.ready || ST.done) return;
  if(e.key === ' ' || e.code === 'Space'){ e.preventDefault(); if(!ST.rev) reveal(); else next(); }
  else if(e.key === 'ArrowRight'){ e.preventDefault(); next(); }
  else if(e.key === 'ArrowLeft'){ e.preventDefault(); back(); }
  else if(e.key === 'f' || e.key === 'F'){ fullToggle(); }
});

/* ══════════════════════════════════════════════════════════════════════════
   7. 시작
   ══════════════════════════════════════════════════════════════════════════ */
(function boot(){
  setsLoad();
  stLoad();
  render();                                   /* 사진 없이 먼저 그린다 — 기다림 없이 */
  IDB.all().then(function(m){
    IMGC = m || {};
    imgSweep();
    render();                                 /* 사진이 오면 다시 그린다 */
  }).catch(function(){ IMGC = {}; });
  /* 진행 중이던 판을 새로고침으로 살려냈다면 배경음은 교사가 누를 때까지 기다린다 */
})();
</script>

</html>
