<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>📱 골든벨 리모컨</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b1029">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0b1029;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.16);--tx:#fff;--mute:#aab6e8;--gold:#ffd666;--ok:#86e698;--bad:#ff8a8a;--fire:#ff7a59;
  --font:'Pretendard Variable',Pretendard,-apple-system,system-ui,'Malgun Gothic',sans-serif}
body.hw{--bg:#140a20;--gold:#ffb347}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:var(--font);color:var(--tx);background:radial-gradient(120% 60% at 50% -10%,#24306a,var(--bg) 60%);background-color:var(--bg);
  -webkit-font-smoothing:antialiased;padding:max(12px,env(safe-area-inset-top)) 14px max(20px,env(safe-area-inset-bottom))}
body.hw{background:radial-gradient(120% 60% at 50% -10%,#4b1d6b,var(--bg) 60%);background-color:var(--bg)}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{border:none;background:none;cursor:pointer}
.wrap{max-width:560px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.top h1{font-size:18px;font-weight:900}
.dot{font-size:12px;font-weight:800;color:var(--mute);display:flex;align-items:center;gap:5px}
.dot i{width:9px;height:9px;border-radius:50%;background:#777}
.dot.on i{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.sub{font-size:13px;color:var(--mute);font-weight:600;line-height:1.55}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:900;font-size:15px}
.bar .r{color:var(--gold);font-size:20px}
.bar .al b{color:var(--gold);font-size:22px}
.meta{display:flex;gap:6px;flex-wrap:wrap;font-size:11.5px;font-weight:800;color:var(--mute);margin-bottom:6px}
.meta .p{padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff}
.q{font-size:18px;font-weight:800;line-height:1.45;word-break:keep-all}
.ch{margin-top:8px;display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:700;color:#dfe5ff}
.ch div.ok{color:var(--ok)}
.ans{margin-top:10px;padding:10px 12px;border-radius:12px;background:rgba(134,230,152,.12);border:1.5px dashed rgba(134,230,152,.5)}
.ans .k{font-size:11.5px;font-weight:800;color:var(--mute)}
.ans .v{font-size:20px;font-weight:900;color:var(--ok);word-break:keep-all}
.ans .e{font-size:12.5px;color:#dfe5ff;margin-top:3px;line-height:1.5}
.tm{display:flex;align-items:center;gap:10px;margin-top:10px}
.tm .tb{flex:1;height:10px;border-radius:999px;background:rgba(255,255,255,.14);overflow:hidden}
.tm .tb i{display:block;height:100%;background:linear-gradient(90deg,#86e698,#ffd666,#ff8a5c)}
.tm .ts{font-size:24px;font-weight:900;min-width:2.2em;text-align:right;font-variant-numeric:tabular-nums}
.tm .ts.w{color:#ff8a5c}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.btns.three{grid-template-columns:1fr 1fr 1fr}
.b{padding:15px 8px;border-radius:16px;font-size:16px;font-weight:900;background:rgba(255,255,255,.12);border:1.5px solid var(--line);line-height:1.25}
.b:active{transform:scale(.97)}
.b.y{background:var(--gold);color:#1a1f3c;border-color:transparent}
.b.big{grid-column:1/-1;padding:20px 8px;font-size:20px}
.b.r{background:var(--fire);border-color:transparent}
.b.s{padding:11px 6px;font-size:13.5px}
.b:disabled{opacity:.35}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:7px;margin-top:8px}
.st{padding:12px 4px;border-radius:13px;background:rgba(255,255,255,.1);border:1.5px solid var(--line);text-align:center;font-weight:900;font-size:14px;min-height:56px}
.st small{display:block;font-size:10.5px;font-weight:800;color:var(--mute);margin-top:2px}
.st.out{opacity:.38;text-decoration:line-through}
.st.rv{background:rgba(255,122,89,.3);border-color:var(--fire);opacity:1;text-decoration:none}
.st.ab{opacity:.25}
.h3{font-size:14px;font-weight:900;display:flex;justify-content:space-between;align-items:center;gap:6px}
.inp{width:100%;padding:13px;border-radius:12px;border:1.5px solid var(--line);background:rgba(255,255,255,.08);margin-top:8px;font-size:16px;outline:none}
.inp:focus{border-color:var(--gold)}
.numrow{display:flex;gap:7px;margin-top:8px}
.numrow .inp{flex:1;min-width:0;margin-top:0}
.numrow .b{flex:0 0 auto;padding:0 14px}
.nm{margin-top:7px;font-size:12.5px;font-weight:800;color:var(--ok);line-height:1.5;word-break:keep-all}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{padding:6px 11px;border-radius:999px;border:1.5px solid var(--line);font-size:12px;font-weight:800}
.chip.on{background:var(--gold);color:#1a1f3c;border-color:transparent}
.big-msg{text-align:center;padding:26px 10px}
.big-msg .e{font-size:44px}
.big-msg p{margin-top:8px;font-size:15px;font-weight:700;line-height:1.6;color:#dfe5ff}
#app-credit{text-align:center;font-size:11px;color:var(--mute);margin-top:18px;line-height:1.7}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:11px 18px;border-radius:999px;font-size:13px;font-weight:800;z-index:9;max-width:90vw;text-align:center}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="big-msg"><div class="e">📱</div><p>불러오는 중…</p></div></div>
<div class="wrap">
  <footer id="app-credit">
    © 2026 조승재(과학이조선생) · 해누리중학교 · All rights reserved<br>
    <span style="opacity:.85">골든벨 리모컨 · 최종 업데이트 2026-10-27</span>
  </footer>
</div>
<script>
/* 📱 골든벨 리모컨 — 전자칠판의 칭찬 도장판(🔔 골든벨 탭)을 휴대폰에서 조종한다.
   같은 선생님 계정으로 로그인한 기기끼리만 만나도록 채널 이름 = 계정에만 있는 열쇠(user_metadata.gb_rk). */
var SB_URL = 'https://hmzklbrksfdhzsgwzfyg.supabase.co';
var SB_KEY = 'sb_publishable_OFVhbjVPbJiMWXVz2nKQuw_m6RmVVZE';
var sb = window.supabase.createClient(SB_URL, SB_KEY);
var CIRC = ['①','②','③','④','⑤','⑥'];
var TYPE = { ox:'O/X', mc:'객관식', short:'단답' };
var R = { st:'boot', user:null, ch:null, boards:{}, cur:null, err:'', since:0 };
R.pid = (function(){
  try{ var p = localStorage.getItem('gb_rm_pid'); if(!p){ p = 'p' + Math.random().toString(36).slice(2, 9); localStorage.setItem('gb_rm_pid', p); } return p; }
  catch(e){ return 'p' + Math.random().toString(36).slice(2, 9); }
})();

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }
function toast(m){
  var t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 2200);
}
function buzz(){ try{ navigator.vibrate && navigator.vibrate(18); }catch(e){} }
(function(){ var d = new Date(), m = d.getMonth() + 1; if(m === 10 || (m === 11 && d.getDate() <= 1)) document.body.classList.add('hw'); })();

/* 화면이 꺼지지 않게 — 휴대폰을 들고 다니는 동안 */
var _wl = null;
async function keepAwake(){ try{ if('wakeLock' in navigator && !_wl){ _wl = await navigator.wakeLock.request('screen'); _wl.addEventListener('release', function(){ _wl = null; }); } }catch(e){} }
document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'visible'){ keepAwake(); if(R.st === 'live' || R.st === 'wait') hello(); } });
document.addEventListener('click', keepAwake, { once:true });

async function boot(){
  try{
    var s = await sb.auth.getSession();
    if(!s.data || !s.data.session){ R.st = 'login'; draw(); return; }
    R.user = s.data.session.user;
    var t = await sb.from('teachers').select('auth_id').eq('auth_id', R.user.id).maybeSingle();
    if(!t.data){ R.st = 'notteacher'; draw(); return; }
    await connect();
  }catch(e){ R.st = 'err'; R.err = '연결에 문제가 있어요'; draw(); }
}
async function login(){
  var em = $('em').value.trim(), pw = $('pw').value;
  if(!em || !pw){ toast('이메일과 비밀번호를 입력해 주세요'); return; }
  $('lgb').disabled = true;
  var r = await sb.auth.signInWithPassword({ email:em, password:pw });
  $('lgb').disabled = false;
  if(r.error){ toast('이메일 또는 비밀번호를 확인해 주세요'); return; }
  boot();
}
async function logout(){ if(!confirm('이 휴대폰에서 로그아웃할까요?')) return; await sb.auth.signOut(); location.reload(); }

async function getKey(){
  var u = await sb.auth.getUser();
  var md = (u.data && u.data.user && u.data.user.user_metadata) || {};
  if(md.gb_rk) return md.gb_rk;
  var b = new Uint8Array(16); crypto.getRandomValues(b);
  var k = Array.prototype.map.call(b, function(x){ return ('0' + x.toString(16)).slice(-2); }).join('');
  var r = await sb.auth.updateUser({ data:{ gb_rk:k } });
  return r.error ? null : k;
}
async function connect(){
  R.st = 'connecting'; draw();
  var k = await getKey();
  if(!k){ R.st = 'err'; R.err = '리모컨 열쇠를 만들지 못했어요'; draw(); return; }
  R.ch = sb.channel('gbr-' + k, { config:{ broadcast:{ self:false } } });
  R.ch.on('broadcast', { event:'gb' }, function(m){ onMsg(m.payload || {}); });
  R.ch.subscribe(function(s){
    if(s === 'SUBSCRIBED'){ if(R.st !== 'live'){ R.st = 'wait'; R.since = Date.now(); } hello(); draw(); }
    else if(s === 'CHANNEL_ERROR' || s === 'TIMED_OUT'){ R.st = 'err'; R.err = '연결이 끊겼어요 — 잠시 뒤 다시 이어요'; draw(); }
  });
  setInterval(function(){
    send({ k:'ping' });
    var b = curBoard(), now = Date.now(), id;
    for(id in R.boards){ if(now - R.boards[id].rx > 120000) delete R.boards[id]; }
    if(!alive(b)){ pickBest(); b = curBoard(); }
    if(!b) hello();
    if(R.st === 'live' && !curBoard()){ R.st = 'wait'; R.since = now; draw(); }
  }, 15000);
  setInterval(tick, 250);
  setTimeout(function(){ if(R.st === 'wait') draw(); }, 4000);
}
function send(p){ p.from = R.pid; try{ if(R.ch) R.ch.send({ type:'broadcast', event:'gb', payload:p }); }catch(e){} }
function hello(){ send({ k:'hello' }); }
function curBoard(){ return R.cur && R.boards[R.cur] ? R.boards[R.cur] : null; }
/* 살아 있는 화면 = 20초 안에 소식이 온 화면(전자칠판은 15초마다 알린다) */
function alive(b){ return b && Date.now() - b.rx < 20000; }
function pickBest(){
  var best = null, id, x;
  for(id in R.boards){
    x = R.boards[id];
    if(!alive(x)) continue;
    if(!best || (best.ph === 'idle' && x.ph !== 'idle') || ((best.ph === 'idle') === (x.ph === 'idle') && x.rx > best.rx)) best = x;
  }
  R.cur = best ? best.bid : null;
}
function onMsg(p){
  if(p.k === 'bye' && p.bid){                     /* 전자칠판 페이지가 닫히거나 새로고침됨 */
    delete R.boards[p.bid];
    if(R.cur === p.bid) pickBest();
    if(!curBoard()){ R.st = 'wait'; R.since = Date.now(); }
    draw(); return;
  }
  if(p.k !== 'state' || !p.bid) return;
  p.rx = Date.now();
  R.boards[p.bid] = p;
  var cb = curBoard();
  if(!alive(cb) || cb === p || (cb.ph === 'idle' && p.ph !== 'idle')) R.cur = p.bid;   /* 진행 중인 화면을 먼저 */
  if(R.st !== 'live') R.st = 'live';
  draw();
}
function pickBoard(id){ R.cur = id; draw(); }
function cmd(c, extra){
  var b = curBoard(); if(!b) return;
  var p = { k:'cmd', c:c, to:b.bid }, k;
  if(extra) for(k in extra) p[k] = extra[k];
  send(p); buzz();
}
/* 학생 누르기 — 휴대폰 화면은 먼저 바꿔 두고, 전자칠판 상태가 오면 그걸로 맞춘다 */
function tap(i){
  var b = curBoard(); if(!b || !b.st || !b.st[i]) return;
  var x = b.st[i];
  if(b.ph === 'rv'){ if(x[3]){ x[3] = 0; x[2] = x.prev || 1; } else if(x[2] > 0){ x.prev = x[2]; x[3] = 1; x[2] = 0; } }
  else if(b.ph === 'play'){ x[2] = x[2] === 0 ? b.round : 0; }
  else if(b.ph === 'setup'){ x[2] = x[2] === 0 ? -1 : 0; }
  else return;
  cmd('tap', { id:x[0] }); draw();
}
function tLeft(b){
  if(!b || !b.tm) return 0;
  return b.tm.run ? Math.max(0, b.tm.left - (Date.now() - b.rx)) : (b.tm.done ? 0 : b.tm.left);
}
function tick(){
  var b = curBoard(), el = $('ts'), bar = $('tb');
  if(!b || !b.tm || !el) return;
  var l = tLeft(b), s = Math.ceil(l / 1000);
  el.textContent = s; el.className = 'ts' + (s <= 5 ? ' w' : '');
  if(bar) bar.style.width = (l / (b.tm.tl * 1000) * 100) + '%';
}

/* 🔢 번호로 한 번에 — 부른 번호를 1,3,5,6 처럼 넣으면 전자칠판이 그 번호만 생존(부활전이면 부활)으로 정한다 */
R.num = '';
function sendNums(){
  var v = String(R.num || '').trim();
  if(!/\d/.test(v)){ toast('번호를 넣어 주세요 — 예: 1,3,5,6'); return; }
  cmd('nums', { v:v }); R.num = '';
  var el = $('rmNum'); if(el) el.blur();
  R.dirty = 0; draw();
}
/* 치는 동안에는 화면을 다시 그리지 않는다(칸이 새로 생기면 글자·자판이 날아간다) — 칸을 벗어나면 그때 그린다 */
function numBlur(){ if(R.dirty){ R.dirty = 0; draw(); } }
function numCard(ph, btn){
  var b = curBoard();
  return '<div class="card"><div class="h3">🔢 번호로 한 번에' +
    '<span style="display:flex;gap:5px"><button class="chip" onclick="cmd(\'all\',{on:1})">✔ 전체 선택</button>' +
    '<button class="chip" onclick="cmd(\'all\',{on:0})">✕ 전체 해제</button></span></div>' +
    '<div class="numrow"><input class="inp" id="rmNum" inputmode="decimal" autocomplete="off" placeholder="' + ph + '" value="' + esc(R.num) + '"' +
    ' oninput="R.num=this.value" onkeydown="if(event.key===\'Enter\'){event.preventDefault();sendNums();}" onblur="setTimeout(numBlur,300)">' +
    '<button class="b y s" onclick="sendNums()">' + btn + '</button></div>' +
    (b && b.nm ? '<div class="nm">' + esc(b.nm) + '</div>' : '') + '</div>';
}

function draw(){
  var ae = document.activeElement;
  if(ae && ae.id === 'rmNum' && R.st === 'live'){ R.dirty = 1; return; }
  var app = $('app'), h = '', b = curBoard();
  var dot = '<span class="dot' + (R.st === 'live' ? ' on' : '') + '"><i></i>' +
            (R.st === 'live' ? '연결됨' : R.st === 'wait' || R.st === 'connecting' ? '찾는 중' : '꺼짐') + '</span>';
  h += '<div class="top"><h1>' + (document.body.classList.contains('hw') ? '🎃' : '🔔') + ' 골든벨 리모컨</h1>' + dot + '</div>';

  if(R.st === 'boot'){ app.innerHTML = h + msg('📱', '불러오는 중…'); return; }
  if(R.st === 'login'){
    app.innerHTML = h + '<div class="card"><div class="h3">🧑‍🏫 선생님 로그인</div>' +
      '<div class="sub" style="margin-top:4px">칭찬 도장판과 같은 선생님 계정이에요. 한 번 로그인하면 다음부터는 바로 열려요.</div>' +
      '<input class="inp" id="em" type="email" placeholder="이메일" autocomplete="username">' +
      '<input class="inp" id="pw" type="password" placeholder="비밀번호" autocomplete="current-password" onkeydown="if(event.key===\'Enter\')login()">' +
      '<button class="b y big" id="lgb" style="width:100%;margin-top:10px" onclick="login()">로그인</button></div>';
    return;
  }
  if(R.st === 'notteacher'){ app.innerHTML = h + msg('🙅', '선생님 계정이 아니에요.<br>리모컨은 선생님만 쓸 수 있어요.') + '<button class="b" style="width:100%" onclick="logout()">로그아웃</button>'; return; }
  if(R.st === 'err'){ app.innerHTML = h + msg('⚠️', esc(R.err)) + '<button class="b y" style="width:100%" onclick="location.reload()">다시 연결</button>'; return; }
  if(R.st !== 'live' || !b){
    app.innerHTML = h + msg('🔎', Date.now() - R.since > 3500
      ? '전자칠판 화면을 찾고 있어요.<br>전자칠판의 칭찬 도장판에서 <b>🔔 골든벨</b> 탭을 열어 두면 저절로 이어져요.'
      : '전자칠판 화면을 찾는 중…') + logoutRow();
    return;
  }

  var ids = Object.keys(R.boards).filter(function(id){ return alive(R.boards[id]) || id === R.cur; });
  if(ids.length > 1){
    h += '<div class="chips" style="margin:-4px 0 10px">' + ids.map(function(id){
      var x = R.boards[id];
      return '<button class="chip' + (id === R.cur ? ' on' : '') + '" onclick="pickBoard(\'' + id + '\')">' + esc(x.dev) + (x.cls ? ' · ' + esc(x.cls) + '반' : '') + (x.ph !== 'idle' ? ' ▶' : '') + '</button>';
    }).join('') + '</div>';
  }

  if(b.ph === 'idle'){
    app.innerHTML = h + msg('🔔', (b.cls ? b.cls + '반이 골라져 있어요.<br>' : '') + '전자칠판에서 반을 고르고 <b>🔔 골든벨 시작</b>을 눌러 주세요.') + soundRow() + logoutRow();
    return;
  }
  var st = b.st || [];
  if(b.ph === 'setup'){
    var n = st.filter(function(x){ return x[2] === 0; }).length;
    h += '<div class="card"><div class="bar"><span>' + esc(b.cls) + '반 · 준비</span><span class="al">참가 <b>' + n + '</b>명</span></div>' +
         '<div class="sub" style="margin-top:4px">오늘 없는 사람만 눌러서 빼 주세요.</div></div>' +
         '<div class="btns"><button class="b y big" onclick="cmd(\'start\')">🔔 시작 (' + b.total + '문제)</button></div>' +
         gridCard('참가할 사람', st, function(x){ return x[2] === -1 ? 'ab' : ''; }, function(x){ return x[2] === -1 ? '오늘 안 함' : '참가'; }) + logoutRow();
    app.innerHTML = h; return;
  }

  /* 진행·부활전·결과 */
  var head = b.ph === 'rv' ? (document.body.classList.contains('hw') ? '🧟 좀비 부활전' : '🔥 패자부활전') : b.ph === 'done' ? '🏁 결과' : b.round + '번 / ' + b.total;
  h += '<div class="card"><div class="bar"><span>' + esc(b.cls) + '반</span><span class="r">' + head + '</span>' +
       '<span class="al">생존 <b>' + b.alive + '</b></span></div></div>';

  if(b.g){
    h += '<div class="card" style="border-color:var(--gold)"><div class="h3">🎰 패자부활 가챠</div>';
    if(b.g.st === 'ready') h += '<div class="btns" style="margin:10px 0 0"><button class="b y big" onclick="cmd(\'gpull\')">🎰 레버 돌리기</button><button class="b big" onclick="cmd(\'gclose\')">닫기</button></div>';
    else if(b.g.st === 'spin') h += '<div class="sub" style="margin-top:6px">두구두구… 전자칠판을 보세요</div>';
    else h += '<div class="sub" style="margin-top:6px">' + (b.g.win ? '🔥 부활전 개최!' : '💤 부활은 없다!') + '</div><div class="btns" style="margin:10px 0 0">' +
              (b.g.win ? '<button class="b r big" onclick="cmd(\'ggo\')">🔥 부활전 시작</button>' : '') +
              '<button class="b big" onclick="cmd(\'gclose\')">' + (b.g.win ? '나중에' : '계속하기') + '</button></div>';
    h += '</div>';
  }

  var q = b.q;
  if(b.ph !== 'done'){
    h += '<div class="card">';
    if(q){
      var ai = q.t === 'mc' ? CIRC.indexOf(String(q.a).charAt(0)) : -1;
      h += '<div class="meta">' + (q.t ? '<span class="p">' + TYPE[q.t] + '</span>' : '') + (q.src ? '<span>' + esc(q.src) + '</span>' : '') + '</div>' +
           '<div class="q">' + esc(q.q) + '</div>' +
           (q.ch ? '<div class="ch">' + q.ch.map(function(c, i){ return '<div' + (i === ai ? ' class="ok"' : '') + '>' + CIRC[i] + ' ' + esc(c) + '</div>'; }).join('') + '</div>' : '') +
           (q.a ? '<div class="ans"><div class="k">' + (b.rev ? '✅ 학생 화면에 공개됨' : '🤫 정답 — 학생 화면엔 아직 가림') + '</div><div class="v">' +
                  esc(ai >= 0 && q.ch && q.ch[ai] ? q.a + ' ' + q.ch[ai] : q.a) + '</div>' +
                  (q.acc && q.acc.length ? '<div class="e">같이 인정: ' + esc(q.acc.join(', ')) + '</div>' : '') +
                  (q.ex ? '<div class="e">' + esc(q.ex) + '</div>' : '') + '</div>' : '');
    } else {
      h += '<div class="sub">이 번호는 화면에 문제가 없어요 — 선생님이 구두로 내 주세요.</div>';
    }
    if(b.tm && !b.rev){
      var l = tLeft(b);
      h += '<div class="tm"><div class="tb"><i id="tb" style="width:' + (l / (b.tm.tl * 1000) * 100) + '%"></i></div><div class="ts" id="ts">' + Math.ceil(l / 1000) + '</div></div>';
    }
    h += '</div>';
  }

  if(b.ph === 'play'){
    h += '<div class="btns">' +
         (b.tm && !b.rev ? '<button class="b" onclick="cmd(\'timer\')">' + (b.tm.run ? '⏹ 타이머 그만' : b.tm.done ? '⏱ 시간 끝' : '⏱ 타이머 시작') + '</button>' : '') +
         (q && q.a && !b.rev ? '<button class="b y" onclick="cmd(\'reveal\')">👀 정답 공개</button>' : '') +
         '<button class="b big' + (b.rev || !q || !q.a ? ' y' : '') + '" onclick="cmd(\'next\')">' + (b.round >= b.total ? '🏁 결과 보기' : '다음 문제 →') + '</button></div>' +
         '<div class="btns three"><button class="b s" onclick="cmd(\'back\')"' + (b.round <= 1 ? ' disabled' : '') + '>↩ 앞 문제</button>' +
         '<button class="b s" onclick="cmd(\'swap\')"' + (b.rev || !b.canSwap || !q ? ' disabled' : '') + '>🔄 문제 바꾸기</button>' +
         '<button class="b s" onclick="cmd(\'gacha\')"' + (b.outN ? '' : ' disabled') + '>🎰 가챠</button></div>' +
         soundRow() +
         numCard('살아남은 번호 — 예: 1,3,5,6', '✔ 생존') +
         gridCard('또는 틀린 사람 누르기 · 다시 누르면 살아나요', st.filter(function(x){ return x[2] !== -1; }),
           function(x){ return x[2] > 0 ? 'out' : ''; }, function(x){ return x[2] > 0 ? x[2] + '번에서 탈락' : (x[4] ? '🔥 부활' : '생존'); });
  } else if(b.ph === 'rv'){
    var rvN = st.filter(function(x){ return x[3]; }).length;
    h += '<div class="btns">' +
         (q && q.a && !b.rev ? '<button class="b y" onclick="cmd(\'reveal\')">👀 정답 공개</button>' : '') +
         (!b.rev && b.canSwap ? '<button class="b" onclick="cmd(\'swap\')">🔄 다른 문제</button>' : '') +
         '<button class="b r big" onclick="cmd(\'rvend\')">✔ 부활전 끝 (' + rvN + '명 부활)</button></div>' +
         numCard('맞힌 번호 — 예: 2,7,11', '🔥 부활') +
         gridCard('또는 맞힌 사람 누르기',st.filter(function(x){ return x[2] > 0 || x[3]; }),
           function(x){ return x[3] ? 'rv' : ''; }, function(x){ return x[3] ? '부활!' : x[2] + '번에서 탈락'; });
  } else if(b.ph === 'done'){
    h += '<div class="btns"><button class="b" onclick="cmd(\'extend\')">➕ 한 문제 더</button>' +
         '<button class="b" onclick="cmd(\'gacha\')"' + (b.outN ? '' : ' disabled') + '>🎰 가챠</button></div>' +
         '<div class="card"><div class="sub">🏅 도장은 전자칠판 화면에서 찍어 주세요. 끝까지 남은 사람:</div>' +
         '<div class="sub" style="margin-top:6px;color:#fff">' + st.filter(function(x){ return x[2] === 0; }).map(function(x){ return esc(x[1]) + (x[4] ? ' 🔥' : ''); }).join(' · ') + '</div></div>';
  }
  h += logoutRow();
  app.innerHTML = h;
}
function gridCard(title, list, cls, sub){
  var b = curBoard(), all = b.st || [];
  return '<div class="card"><div class="h3">' + title + '</div><div class="grid">' +
    list.map(function(x){
      var i = all.indexOf(x);
      return '<button class="st ' + cls(x) + '" onclick="tap(' + i + ')">' + esc(x[1]) + '<small>' + sub(x) + '</small></button>';
    }).join('') + '</div></div>';
}
function soundRow(){
  return '<div class="btns"><button class="b s" onclick="cmd(\'sfx\',{s:\'write\'})">✍️ 정답을 써주세요</button>' +
         '<button class="b s" onclick="cmd(\'sfx\',{s:\'show\'})">🙌 정답을 들어주세요</button></div>';
}
function logoutRow(){ return '<div style="text-align:center;margin-top:6px"><button class="chip" onclick="logout()">로그아웃</button></div>'; }
function msg(e, t){ return '<div class="card big-msg"><div class="e">' + e + '</div><p>' + t + '</p></div>'; }

boot();
</script>
</body>
</html>
