/* ── 🔊 합성음 — 파일 없이 바로 나는 짧은 신호(타이머·가챠) ── */
var _gbAC = null;
function gbAC(){
  try{
    if(!_gbAC){ var C = window.AudioContext || window.webkitAudioContext; if(!C) return null; _gbAC = new C(); }
    if(_gbAC.state === 'suspended') _gbAC.resume();
    return _gbAC;
  }catch(e){ return null; }
}
function gbTone(ac, f, t, d, type, v, f2){
  var o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f, t);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, v), t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + d + 0.03);
}
function gbNoise(ac, t, d, v){
  var n = Math.floor(ac.sampleRate * d), b = ac.createBuffer(1, n, ac.sampleRate), x = b.getChannelData(0), i;
  for(i=0;i<n;i++) x[i] = (Math.random() * 2 - 1) * (1 - i / n);
  var s = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
  f.type = 'bandpass'; f.frequency.value = 700; f.Q.value = .8;
  s.buffer = b; g.gain.value = v;
  s.connect(f); f.connect(g); g.connect(ac.destination);
  s.start(t);
}
function gbSyn(k){
  if(!gbSndOn()) return;
  var ac = gbAC(); if(!ac) return;
  var t = ac.currentTime + 0.02, v = Math.max(0.08, gbVol()), tt, gap;
  try{
    if(k === 'tick') gbTone(ac, 1320, t, 0.06, 'square', 0.12 * v);
    else if(k === 'go'){ gbTone(ac, 660, t, 0.12, 'triangle', 0.3 * v); gbTone(ac, 990, t + 0.12, 0.2, 'triangle', 0.3 * v); }
    else if(k === 'buzz') gbTone(ac, 190, t, 0.7, 'sawtooth', 0.22 * v, 120);
    else if(k === 'ding'){ gbTone(ac, 1046, t, 0.55, 'sine', 0.35 * v); gbTone(ac, 1568, t + 0.09, 0.7, 'sine', 0.25 * v); }
    else if(k === 'pop') gbTone(ac, 480, t, 0.13, 'sine', 0.3 * v, 1150);
    else if(k === 'roll'){
      tt = t; gap = 0.12;
      while(tt < t + 2.2){ gbNoise(ac, tt, 0.07, 0.9 * v); tt += gap; gap = Math.max(0.035, gap * 0.92); }
    }
    else if(k === 'drop'){ gbTone(ac, 900, t, 0.3, 'sine', 0.28 * v, 220); gbTone(ac, 240, t + 0.5, 0.12, 'triangle', 0.3 * v); gbTone(ac, 240, t + 0.68, 0.08, 'triangle', 0.18 * v); }
    else if(k === 'win'){
      [523, 659, 784, 1046].forEach(function(f, i){ gbTone(ac, f, t + i * 0.1, 0.32, 'triangle', 0.3 * v); });
      gbTone(ac, 1318, t + 0.45, 0.9, 'sine', 0.26 * v); gbTone(ac, 1568, t + 0.45, 0.9, 'sine', 0.18 * v);
    }
    else if(k === 'ghost'){
      var o = ac.createOscillator(), g = ac.createGain(), lf = ac.createOscillator(), lg = ac.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(620, t); o.frequency.exponentialRampToValueAtTime(260, t + 1.6);
      lf.frequency.value = 6; lg.gain.value = 18; lf.connect(lg); lg.connect(o.frequency);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.22 * v, t + 0.25); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.7);
      o.connect(g); g.connect(ac.destination); o.start(t); lf.start(t); o.stop(t + 1.75); lf.stop(t + 1.75);
    }
    else if(k === 'lose'){
      [392, 370, 349].forEach(function(f, i){ gbTone(ac, f, t + i * 0.3, 0.28, 'sawtooth', 0.16 * v); });
      gbTone(ac, 330, t + 0.9, 0.9, 'sawtooth', 0.16 * v, 250);
    }
  }catch(e){}
}

/* ══════════════════════════════════════════════════════════════════════════
   🏆 명예의 전당 — 반 전체 기록만 모은다(개인 순위·이름 없음)

   한 판이 끝날 때마다 반 기록(참가 인원·끝까지 남은 수·부활·문제별 탈락)을 남긴다.
   이 기기(gb_hof_v1)에 먼저 쓰고, 서버 표 gb_games(8_골든벨_명예의전당.sql)가 있으면
   거기에도 올린다 — 반마다 전자칠판이 달라도 기록이 한곳에 모인다. 표가 아직 없으면
   기기에만 쌓아 두었다가, 표가 생긴 뒤 명예의 전당을 열 때 한꺼번에 올린다.
   ══════════════════════════════════════════════════════════════════════════ */
var GBHOF_KEY = 'gb_hof_v1';
var _gbHofSrv = null;      /* 서버에서 받은 이번 학기 기록 */
var _gbHofSt = 'idle';     /* idle · loading · ok · notable(표 없음) · off(연결 안 됨) */
var _gbhG = null, _gbhSort = 'avg', _gbhEdit = false;

function gbHofLocal(){ var a = gbLsJ(GBHOF_KEY, []); return a instanceof Array ? a : []; }
function gbHofLocalSave(a){ gbLsSet(GBHOF_KEY, JSON.stringify(a.slice(-500))); }
function gbHofNow(x){ return x && x.sy === nowYear() && x.sem === nowSem(); }
function gbHofRate(x){ return x && x.n0 ? Math.min(1, x.alive / x.n0) : 0; }
function gbPct(r){ return Math.round(r * 100) + '%'; }
function gbHofNoTable(err){
  var m = (err && err.message || '') + ' ' + (err && err.code || '');
  return /PGRST205|PGRST202|42P01|does not exist|schema cache|Could not find the table/i.test(m);
}
function gbHofRow(r){
  return { owner:S.user.id, gid:r.gid, school_year:r.sy, semester:r.sem, grade:r.g, cls:r.c, played_on:r.d,
           total:r.total, players:r.n0, survivors:r.alive, revived:r.rv || 0, rounds:r.rounds || [], qids:r.qids || [],
           updated_at:new Date().toISOString() };
}
function gbHofFromRow(x){
  return { gid:x.gid, sy:x.school_year, sem:x.semester, g:x.grade, c:x.cls, d:x.played_on, total:x.total,
           n0:x.players, alive:x.survivors, rv:x.revived || 0, rounds:x.rounds || [], qids:x.qids || [], sync:1 };
}
async function gbHofPush(rec){
  if(!S.user || _gbHofSt === 'notable') return false;
  try{
    var r = await sb.from('gb_games').upsert(gbHofRow(rec), { onConflict:'owner,gid' });
    if(r.error){
      if(gbHofNoTable(r.error)) _gbHofSt = 'notable';
      else console.warn('[명예의 전당] 서버 저장 실패', r.error);
      return false;
    }
    return true;
  }catch(e){ return false; }
}
/* 결과가 나온 순간(한 문제 더·부활전 뒤에 다시 끝나면 같은 판을 고쳐 쓴다) */
async function gbHofRecord(){
  if(!GB || !GB.ready || !GB.gid) return;
  var rounds = [], qids = [], r, id, n, q, rvAlive = 0;
  for(r=1;r<=GB.total;r++){
    n = 0; for(id in GB.out){ if(GB.out[id] === r && !gbIsEx(id)) n++; }
    rounds.push(n);
    q = gbqAt(r); qids.push(q && q.id ? q.id : '');
  }
  if(GB.rvd) for(id in GB.rvd){ if(GB.alive[id]) rvAlive++; }
  var rec = { gid:GB.gid, sy:nowYear(), sem:nowSem(), g:GB.g, c:GB.c, d:GB.day || todayStr(), total:GB.total,
              n0:GB.n0 || (gbAliveIds().length + gbOutIds().length), alive:gbAliveIds().length, rv:rvAlive,
              rounds:rounds, qids:qids, sync:0 };
  var a = gbHofLocal().filter(function(x){ return x.gid !== rec.gid; });
  a.push(rec); gbHofLocalSave(a);
  if(_gbHofSrv) _gbHofSrv = _gbHofSrv.filter(function(x){ return x.gid !== rec.gid; });
  if(await gbHofPush(rec)){
    gbHofLocalSave(gbHofLocal().map(function(x){ if(x.gid === rec.gid) x.sync = 1; return x; }));
    rec.sync = 1;
    if(_gbHofSrv) _gbHofSrv.push(rec);
  }
}
/* 서버 기록을 받고, 기기에만 있던 기록을 올린다 */
async function gbHofLoad(){
  if(!S.user || _gbHofSt === 'loading') return;
  _gbHofSt = 'loading';
  try{
    var r = await sb.from('gb_games').select('*').eq('school_year', nowYear()).eq('semester', nowSem())
                    .order('played_on', { ascending:true }).limit(1000);
    if(r.error){ _gbHofSt = gbHofNoTable(r.error) ? 'notable' : 'off'; return; }
    _gbHofSt = 'ok';
    _gbHofSrv = (r.data || []).map(gbHofFromRow);
    var have = {}, loc = gbHofLocal(), keep = [], i, x;
    _gbHofSrv.forEach(function(s){ have[s.gid] = 1; });
    for(i=0;i<loc.length;i++){
      x = loc[i];
      if(gbHofNow(x) && x.sync && !have[x.gid]) continue;          /* 다른 기기에서 지운 기록 */
      if(gbHofNow(x) && !x.sync && await gbHofPush(x)){ x.sync = 1; if(!have[x.gid]){ _gbHofSrv.push(x); have[x.gid] = 1; } }
      keep.push(x);
    }
    gbHofLocalSave(keep);
  }catch(e){ _gbHofSt = 'off'; }
}
/* 이번 학기 기록 — 서버 것 + 아직 못 올린 이 기기 것 */
function gbHofAll(){
  var map = {}, out = [];
  (_gbHofSrv || []).forEach(function(x){ map[x.gid] = x; });
  gbHofLocal().forEach(function(x){ if(gbHofNow(x) && !map[x.gid] && (!_gbHofSrv || !x.sync)) map[x.gid] = x; });
  Object.keys(map).forEach(function(k){ out.push(map[k]); });
  return out;
}
function gbHofByClass(g){
  var list = gbHofAll().filter(function(x){ return x.g === g; }), by = {};
  list.sort(function(a, b){ return a.d < b.d ? -1 : a.d > b.d ? 1 : (a.gid < b.gid ? -1 : 1); });
  list.forEach(function(x){
    var o = by[x.c] || (by[x.c] = { c:x.c, n:0, sum:0, best:-1, clear:0, rv:0, games:[] }), r = gbHofRate(x);
    o.n++; o.sum += r;
    if(r > o.best) o.best = r;
    if(x.n0 && x.alive >= x.n0) o.clear++;
    o.rv += x.rv || 0;
    o.games.push(x);
  });
  return Object.keys(by).map(function(k){ var o = by[k]; o.avg = o.n ? o.sum / o.n : 0; return o; });
}
function gbHofSortKey(o){ return _gbhSort === 'best' ? o.best : _gbhSort === 'clear' ? o.clear : o.avg; }
function gbHofMetric(o){
  return _gbhSort === 'best' ? '최고 ' + gbPct(o.best) : _gbhSort === 'clear' ? '전원 생존 ' + o.clear + '번' : '평균 ' + gbPct(o.avg);
}
async function gbHofDel(gid){
  if(!confirm('이 판 기록을 지울까요? (도장은 그대로 남아요)')) return;
  gbHofLocalSave(gbHofLocal().filter(function(x){ return x.gid !== gid; }));
  if(_gbHofSrv) _gbHofSrv = _gbHofSrv.filter(function(x){ return x.gid !== gid; });
  try{ if(S.user && _gbHofSt === 'ok') await sb.from('gb_games').delete().eq('owner', S.user.id).eq('gid', gid); }catch(e){}
  gbHofDraw();
}

function gbHofSet(k, v){ if(k === 'g') _gbhG = v; if(k === 's') _gbhSort = v; if(k === 'e') _gbhEdit = !_gbhEdit; gbHofDraw(); }
function gbHofDraw(){
  var el = $('gbHof'); if(!el) return;

  });
  played = rows.filter(function(r){ return r.n; }).sort(function(a, b){ return (gbHofSortKey(b) - gbHofSortKey(a)) || (b.n - a.n) || (a.c - b.c); });
  rest = rows.filter(function(r){ return !r.n; }).sort(function(a, b){ return a.c - b.c; });

  h = '<button class="gbg-x" onclick="gbHofClose()">✕ 닫기</button>' +

      }).join('') + '<span class="sep"></span>' +
      [['avg','평균 생존률'], ['best','최고 기록'], ['clear','전원 생존']].map(function(s){

             '<div class="c">' + _gbhG + '-' + o.c + '</div><div class="v">' + gbHofMetric(o) + '</div>' +
             '<div class="n">' + o.n + '판' + (o.clear ? ' · 🌟' + o.clear : '') + (o.rv ? ' · 🔥' + o.rv : '') + '</div>' +

  played.concat(rest).forEach(function(o){
    h += '<div class="gbh-row' + (o.n ? '' : ' none') + '"><b class="cl">' + _gbhG + '-' + o.c + '</b>';

function gbHofBanner(){

  var me = null, i;
  for(i=0;i<mine.length;i++) if(mine[i].gid === GB.gid) me = mine[i];
  if(!me) return '';
  var prev = mine.filter(function(x){ return x.gid !== GB.gid; }), r = gbHofRate(me), msg = [], big = '';
  if(me.n0 && me.alive >= me.n0){ big = '🌟 전원 생존!'; msg.push('한 명도 떨어지지 않았어요'); }
  if(!prev.length){ if(!big) big = '🎉 첫 골든벨 기록'; msg.push(GB.g + '-' + GB.c + '반 명예의 전당에 첫 기록이 올라갔어요'); }
  else {
    var best = Math.max.apply(null, prev.map(gbHofRate));
    if(r > best){ if(!big) big = '🏆 우리 반 최고 기록 갱신!'; msg.push('생존률 ' + gbPct(r) + ' · 지난 최고 ' + gbPct(best)); }
    else msg.push('이번 생존률 ' + gbPct(r) + ' · 우리 반 최고 ' + gbPct(best));
  }
  var rows = gbHofByClass(GB.g).filter(function(o){ return o.n; }).sort(function(a, b){ return b.avg - a.avg; });
  if(rows.length >= 2){
    for(i=0;i<Math.min(3, rows.length);i++){
      if(rows[i].c === GB.c){ msg.push(['🥇', '🥈', '🥉'][i] + ' 평균 생존률 ' + GB.g + '학년 ' + (i + 1) + '위'); break; }
    }
  }
  return '<div class="gbh-ban' + (big ? ' hi' : '') + '">' + (big ? '<div class="t">' + big + '</div>' : '') +
         '<div class="s">' + msg.join(' · ') + '</div>' +
         '<button class="chip sm" onclick="gbHof()">🏆 명예의 전당 보기</button></div>';
}

/* ══════════════════════════════════════════════════════════════════════════
   📱 휴대폰 리모컨 — remote.html 에서 다음 문제·정답 공개·틀린 사람 누르기

   전자칠판(이 화면)과 휴대폰이 Supabase 방송 채널로 이야기한다. 표·SQL 이 필요 없다.
   채널 이름은 «이 선생님 계정에만 있는 열쇠»(user_metadata.gb_rk, 처음 한 번 만든다)라서
   같은 선생님 계정으로 로그인한 기기끼리만 만난다 — QR 을 학생이 찍어도 로그인이 없으면 못 들어온다.
   ══════════════════════════════════════════════════════════════════════════ */
var _gbRm = { ch:null, st:'off', phones:{}, t:0, hb:0, last:0,
  /* 화면 번호 — 새로고침해도 같은 탭이면 그대로(휴대폰이 옛 화면에 매달리지 않게) */
  bid:(function(){
    try{ var b = sessionStorage.getItem('gb_rm_bid'); if(!b){ b = 'b' + Math.random().toString(36).slice(2, 8); sessionStorage.setItem('gb_rm_bid', b); } return b; }
    catch(e){ return 'b' + Math.random().toString(36).slice(2, 8); }
  })() };
async function gbRmKey(){
  try{
    var u = await sb.auth.getUser();
    var md = (u.data && u.data.user && u.data.user.user_metadata) || {};
    if(md.gb_rk) return md.gb_rk;
    var b = new Uint8Array(16); crypto.getRandomValues(b);
    var k = Array.prototype.map.call(b, function(x){ return ('0' + x.toString(16)).slice(-2); }).join('');
    var r = await sb.auth.updateUser({ data:{ gb_rk:k } });
    return r.error ? null : k;
  }catch(e){ return null; }
}
async function gbRmOn(){
  if(_gbRm.ch || _gbRm.st === 'wait' || !S.teacher) return;
  _gbRm.st = 'wait';
  var k = await gbRmKey();
  if(!k){ _gbRm.st = 'off'; gbRmPill(); return; }
  var ch = sb.channel('gbr-' + k, { config:{ broadcast:{ self:false } } });
  ch.on('broadcast', { event:'gb' }, function(m){ gbRmIn(m.payload || {}); });
  ch.subscribe(function(s){
    if(s === 'SUBSCRIBED'){ _gbRm.st = 'on'; gbRmKick(true); }
    else if(s === 'CHANNEL_ERROR' || s === 'TIMED_OUT' || s === 'CLOSED'){ _gbRm.st = 'off'; }
    gbRmPill();
  });
  _gbRm.ch = ch;
  if(!_gbRm.hb) _gbRm.hb = setInterval(function(){ if(gbRmPhones()) gbRmKick(true); gbRmPill(); }, 15000);
}
function gbRmPhones(){
  var n = 0, now = Date.now(), id;
  for(id in _gbRm.phones){ if(now - _gbRm.phones[id] < 70000) n++; }
  return n;
}
function gbRmIn(p){
  if(!p || !p.from) return;
  var isNew = !_gbRm.phones[p.from] || Date.now() - _gbRm.phones[p.from] > 70000;
  if(p.k === 'hello' || p.k === 'ping'){
    _gbRm.phones[p.from] = Date.now();
    if(p.k === 'hello'){ gbRmKick(true); if(isNew) toast('📱 리모컨이 연결됐어요'); }
    gbRmPill(); return;
  }
  if(p.k === 'cmd'){
    if(p.to && p.to !== _gbRm.bid) return;
    _gbRm.phones[p.from] = Date.now();
    gbRmCmd(p);
  }
}
function gbRmCmd(p){
  var c = p.c, q;
  try{
    if(c === 'gpull') gbgPull();
    else if(c === 'ggo') gbgGo();
    else if(c === 'gclose') gbgClose();
    else if(c === 'sfx'){ if(p.s === 'write' || p.s === 'show') gbSfx(p.s); }
    else if(!GB || !gbMatchesClass()){ /* 이 화면에 진행 중인 골든벨이 없다 */ }
    else if(c === 'tap'){
      if(!p.id || !GB.names[p.id] || GB.done) { /* 끝난 뒤에는 누르지 않는다 */ }
      else if(GB.rv) gbRvTap(p.id);
      else gbTap(p.id);
    }
    else if(c === 'all') gbAll(p.on ? 1 : 0);                 /* ✔ 전체 선택 · ✕ 전체 해제 */
    else if(c === 'nums') gbNumApply(String(p.v || ''));      /* 🔢 살아남은(부활한) 번호 */
    else if(c === 'start'){ if(!GB.ready) gbStart(); }
    else if(!GB.ready){ }
    else if(c === 'gacha') gbGacha();
    else if(c === 'next'){ if(!GB.rv && !GB.done) gbNext(); }
    else if(c === 'back'){ if(!GB.rv) gbBack(); }
    else if(c === 'reveal'){ q = gbCurQ(); if(!gbRevNow() && q && q.a) gbReveal(); }
    else if(c === 'timer') gbTimerBtn();
    else if(c === 'swap'){ if(!gbRevNow()) gbSwapCur(); }
    else if(c === 'rvend') gbRvEnd();
    else if(c === 'extend') gbExtend();
  }catch(e){ console.warn('[리모컨]', e); }
  gbRmKick(true);
}

            GB.rv && GB.rv.ids[x.id] != null ? 1 : 0, GB.rvd && GB.rvd[x.id] && GB.alive[x.id] ? 1 : 0];
  });
  s.g = _gbg ? { st:_gbg.st, win:_gbg.win ? 1 : 0 } : null;

  var s = document.createElement('script');

            '<b style="flex:0 0 auto;color:' + (n ? 'var(--bad)' : 'var(--ok-d)') + '">' + n + '명</b></div>';
  }
  var gch = GB.gacha || [];
  h += '<div class="card"><h3 style="font-size:var(--fs-s)">문제별 탈락</h3><div style="margin-top:6px">' + rows + '</div>' +

/* 🏅 결과 화면 명단 — 남은 사람 + 시상에서 뺀 사람(흐리게). 누르면 빼고, 다시 누르면 돌아온다 */
function gbAwardCards(){
  var list = S.students.slice().sort(function(a,b){ return (a.number||0) - (b.number||0); });
  var h = '', i, s, ex;
  for(i=0;i<list.length;i++){
    s = list[i];
    ex = gbIsEx(s.id);
    if(!GB.alive[s.id] && !ex) continue;
    h += '<button class="stu' + (ex ? '' : ' sel') + '"' + (ex ? ' style="opacity:.42"' : '') +
         ' onclick="gbExTap(\'' + s.id + '\')">' +
         '<span class="stu-c' + (ex ? ' zero' : '') + '">' + (ex ? '✋' : '○') + '</span>' +
         '<div class="stu-n">' + esc((s.number ? s.number + '. ' : '') + (s.name || '')) + '</div>' +
         '<div class="stu-m">' + (ex ? '시상 제외' : (GB.rvd && GB.rvd[s.id] ? '🔥 부활' : '생존')) + '</div>' +
         '</button>';
  }
  return h;
}

/* 학생 카드 — onlyAlive 면 생존자만 */
function gbCards(onlyAlive){
  var list = S.students.slice().sort(function(a,b){ return (a.number||0) - (b.number||0); });
  var h = '', i, s, out;
  for(i=0;i<list.length;i++){
    s = list[i];
    out = !GB.alive[s.id];
    if(onlyAlive && out) continue;
    h += '<button class="stu' + (out ? '' : ' sel') + '"' +
         (out ? ' style="opacity:.42"' : '') +
         (onlyAlive ? '' : ' onclick="gbTap(\'' + s.id + '\')"') + '>' +
         '<span class="stu-c' + (out ? ' zero' : '') + '">' +
         (out ? (GB.out[s.id] ? (gbHW() ? '👻' : GB.out[s.id] + '번') : '—') : '○') + '</span>' +
         '<div class="stu-n">' + esc((s.number ? s.number + '. ' : '') + (s.name || '')) + '</div>' +
         '<div class="stu-m">' + (out ? (GB.out[s.id] ? GB.out[s.id] + '번에서' : '오늘 안 함') : (GB.rvd && GB.rvd[s.id] ? '🔥 부활' : '생존')) + '</div>' +
         '</button>';
  }
  return h || '<div class="empty" style="grid-column:1/-1"><p>아무도 없어요</p></div>';
}

/* ── 도장 ── */
async function gbAward(){ await gbDoAward(gbAliveIds(), GB.total, false); }
async function gbAwardFurthest(){
  var f = gbFurthest();
  await gbDoAward(f.ids, f.round, true);
}

async function gbDoAward(ids, upto, partial){
  if(!ids.length){ toast('줄 사람이 없어요'); return; }
  if(!confirm(ids.length + '명에게 도장을 찍을까요?')) return;
  showLoad();
  try{
    var byId = {}, i;
    for(i=0;i<S.students.length;i++) byId[S.students[i].id] = S.students[i];
    var note = S.selPlan ? planNote(S.selPlan) : null;
    var say  = S.selPlan ? planConcept(S.selPlan) : null;
    var beh = partial
      ? ('수업 여는 골든벨에서 ' + upto + '번 문제까지 통과함')
      : ('수업 여는 골든벨 ' + GB.total + '문제를 끝까지 통과함');
    if(say) beh = say + ' — ' + beh;
    var today = todayStr();
    var rows = [], s;
    for(i=0;i<ids.length;i++){
      s = byId[ids[i]] || {};
      var b1 = (!partial && GB.rvd && GB.rvd[ids[i]])
        ? ((say ? say + ' — ' : '') + '수업 여는 골든벨 ' + GB.total + '문제에서 패자부활전을 거쳐 끝까지 남음')
        : beh;
      rows.push({
        student_id: ids[i], school_year: nowYear(), semester: nowSem(),
        class_no_snap: s.class_no || GB.c || null, number_snap: s.number || null,
        category: 'concept', behavior: b1,
        lesson_note: note ? (note + ' · 골든벨') : '골든벨',
        observed_on: today
      });
    }
    /* 저장된 행을 되받아 «몇 명이 실제로 들어갔는지» 확인한다 —
       그냥 insert 만 하면 조용히 어긋났을 때 알 길이 없다 */
    var r = await sb.from('observations').insert(rows).select('id');
    if(r.error){
      toast('저장에 실패했어요 — ' + (r.error.message || r.error.code || ''));
      console.error('[골든벨 도장] 저장 실패', r.error, rows);
      return;
    }
    var saved = (r.data || []).length;
    if(saved !== rows.length){
      console.warn('[골든벨 도장] 요청 ' + rows.length + '명 · 저장 ' + saved + '명', r);
      alert('⚠️ ' + rows.length + '명에게 찍으려 했는데 ' + saved + '명만 저장됐어요.\n' +
            '「👥 학생」 탭에서 확인해 주세요.');
    }
    /* 결과 화면에서 이미 곡을 고르셨으면 그걸 그대로 둔다 — 골라둔 게 없을 때만 기본곡 */
    if(!_gbAwardKey) gbAwardPlay('award');
    gbTimerStop(); gbClear();
    await loadTeacherObs(); await loadStudents();
    closeGB();
    toast('🏅 ' + saved + '명에게 도장을 찍었어요!');
  } finally { hideLoad(); }
}

async function saveObs(){

  var cat = S.selCat || 'general';

      h += '<div class="cp-who"><span class="cp-av">🙋</span>'

/* 내보내기용 — 화면 목록(S.teaObs)은 최근 600건까지만 들고 있으므로, 내보낼 때는 서버에서 전부 다시 받는다.
   학생 이름은 profiles 를 같이 붙여 받는다(교사 계정은 명단을 읽을 수 있다). */
async function fetchAllObs(){
  var all = [], from = 0, page = 1000;
  while(true){
    var r = await sb.from('observations').select('*, profiles!observations_student_id_fkey(name,grade,class_no,number)')
              .eq('given_by', S.user.id).is('voided_at', null)
              .order('observed_on',{ascending:false}).order('id',{ascending:false}).range(from, from+page-1);
    if(r.error){
      /* 관계 이름이 다르거나 명단 읽기가 막혀 있으면 이름 없이라도 받는다 */
      var r2 = await sb.from('observations').select('*').eq('given_by', S.user.id).is('voided_at', null)
                 .order('observed_on',{ascending:false}).order('id',{ascending:false}).range(from, from+page-1);
      if(r2.error) throw new Error(r2.error.message || '기록을 받지 못했어요');
      r = r2;
    }
    all = all.concat(r.data || []);
    if((r.data || []).length < page) break;
    from += page;
  }
  return all;
}
function exFilter(rows){
  var c = ($('exC') && $('exC').value.trim()) || '';
  return rows.filter(function(o){ return !c || String(o.class_no_snap)===c; });
}
/* 학번 = 학년 + 반 2자리 + 번호 2자리 (관찰 당시 반·번호를 우선, 없으면 명단) */
function exSid(o){
  var p = o.profiles || {};
  var g = p.grade || '', c = o.class_no_snap || p.class_no || '', n = o.number_snap || p.number || '';
  if(!g && !c) return '';
  var z = function(v){ v = String(v||''); return v.length===1 ? '0'+v : v; };
  return String(g) + z(c) + z(n);
}
/* 도장의 출처 — 질문과수원 ⭐ 연계인지, 골든벨인지, 도장판에서 직접 찍었는지 */
function exSource(o){
  var n = String(o.lesson_note || '');
  if(n.indexOf('질문과수원') === 0) return '질문과수원 ⭐';
  if(/골든벨/.test(n)) return '골든벨';
  return '도장판';
}
/* 수업(차시) 칸 — 질문과수원 태그 「질문과수원 ⭐ 2-7-2-2 옴의 법칙 (Q#12)」는 가운데 차시만, 도장판 기록은 그대로 */
function exLesson(o){
  var n = String(o.lesson_note || '');
  if(n.indexOf('질문과수원') === 0) return n.replace(/^질문과수원\s*⭐\s*/, '').replace(/\s*\(Q#\d+\)\s*$/, '').trim();
  return n;
}
function exSort(rows){
  return rows.slice().sort(function(a,b){
    var ac = +(a.class_no_snap||0) - +(b.class_no_snap||0); if(ac) return ac;
    var an = +(a.number_snap||0) - +(b.number_snap||0); if(an) return an;
    return String(a.observed_on).localeCompare(String(b.observed_on));
  });
}
async function doExport(){
  showLoad();
  try{
    var rows = exSort(exFilter(await fetchAllObs()));
    if(!rows.length){ toast('내보낼 기록이 없어요'); return; }
    var head = '학년도,학기,반,번호,학번,이름,날짜,역량,관찰된 행동,수업(차시),출처\n';
    var body = rows.map(function(o){
      var q = function(v){ return '"' + String(v==null?'':v).replace(/"/g,'""') + '"'; };
      var nm = (o.profiles && o.profiles.name) || '';
      return [o.school_year,o.semester,o.class_no_snap||'',o.number_snap||'',exSid(o),nm,o.observed_on,
              catName(o.category),o.behavior,exLesson(o),exSource(o)].map(q).join(',');
    }).join('\n');
    var blob = new Blob(['﻿'+head+body], {type:'text/csv;charset=utf-8;'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '칭찬도장_관찰기록_' + todayStr() + '.csv';
    a.click(); URL.revokeObjectURL(a.href);
    toast('내려받았어요 (' + rows.length + '건)');
  }catch(e){ toast('내보내기에 실패했어요 — ' + (e.message||e)); console.error(e); }
  finally{ hideLoad(); }
}
async function doCopyAll(){
  var rows;
  showLoad();
  try{ rows = exSort(exFilter(await fetchAllObs())); }
  catch(e){ toast('기록을 받지 못했어요 — ' + (e.message||e)); return; }
  finally{ hideLoad(); }
  if(!rows.length){ toast('복사할 기록이 없어요'); return; }
  var by={}, i;
  for(i=0;i<rows.length;i++){
    var nm = (rows[i].profiles && rows[i].profiles.name) || '';
    var k = (rows[i].class_no_snap||'?') + '-' + (rows[i].number_snap||'?') + (nm ? ' ' + nm : '');
    (by[k]=by[k]||[]).push(rows[i]);
  }
  var out = Object.keys(by).sort().map(function(k){
    return '[' + k + ']\n' + by[k].map(function(o){
      var ls = exLesson(o);
      return '  ' + o.observed_on + ' (' + catName(o.category) + ') ' + o.behavior + (ls ? ' — ' + ls : '') + (exSource(o)!=='도장판' ? ' [' + exSource(o) + ']' : '');
    }).join('\n');
  }).join('\n\n');
  navigator.clipboard.writeText(out).then(function(){ toast('복사했어요 (' + rows.length + '건)'); },

(function(){
  var api = null;
  function start(){
    if(api || !window.Forest || !document.getElementById('s-login').classList.contains('on')) return;
    api = Forest({ box:document.getElementById('lgHero'), canvas:document.getElementById('lgCv'), lays:document.getElementById('lgLays'), mode:'hero',

      hubs:[ {id:'h1',f:.3,d:.2,name:'',links:['a','b','c','d']}, {id:'h2',f:.7,d:.5,name:'',links:['c','d','e','f']} ] });
  }
  var go0 = window.goScr;
  window.goScr = function(id){
    go0(id);
    if(id === 's-login') start();
    else if(api){ try{ api.destroy(); }catch(e){} api = null; }
  };
  var sc = document.createElement('script');
  sc.src = 'https://scienceisjo.github.io/scienceclass/forest.js';
  sc.onload = start;
  document.head.appendChild(sc);
})();
