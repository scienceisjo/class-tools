/* ── 차시 ──────────────────────────────────────────────────────────────── */
async function loadPlans(){
  try{
    var r = await sb.from('lesson_plans').select('*').order('sort_order').order('id',{ascending:false});
    S.plans = r.error ? [] : (r.data||[]);
  }catch(e){ S.plans = []; }
}
var PLAN_SEP = ' · ';   /* 차시명 구분자: 공백+가운뎃점+공백 */
function planTitle(id){
  for(var i=0;i<S.plans.length;i++) if(S.plans[i].id===id) return S.plans[i].title;
  return null;
}
/* 차시명은 «현상형 제목 · 개념» 형태다. 화면 칩에는 제목을 통째로 보여주되,
   생기부 누가기록에는 개념만 남긴다 — «지지직의 정체 수업에서 칭찬받음»보다
   «마찰 전기와 전기력 수업에서 칭찬받음»이 기록으로 읽힌다.
   구분자는 공백을 낀 가운뎃점이라, «전압·저항»처럼 붙여 쓴 것과 섞이지 않는다. */
/* 차시명은 «2-7-1-1 현상형 제목 · 개념» 형태다.
   앞의 «2-7-1-1» 은 학년-단원-중단원-차시. 학생이 어느 차시인지 알아보라고 붙였다. */
function planCode(title){
  var m = String(title || '').match(/^\d+-\d+-\d+-\d+/);
  return m ? m[0] : '';
}
/* 문장에 넣을 값 — 번호는 뺀다. «2-7-1-1 마찰 전기와 전기력 수업에서 칭찬받음» 은 안 읽힌다. */
function planConcept(id){
  var s = planTitle(id);
  if(!s) return null;
  var p = s.split(PLAN_SEP);
  var tail = (p.length > 1 ? p.slice(1).join(PLAN_SEP).trim() : s.trim()) || s;
  return tail.replace(/^\d+-\d+-\d+-\d+\s*/, '');
}
/* 기록(lesson_note)에 남길 값 — 번호를 앞에 붙여 둔다. 학생 기록 화면과 생기부 근거에서
   «어느 차시였는지»가 한눈에 보여야 한다. */
function planNote(id){
  var c = planConcept(id);
  if(!c) return null;
  var code = planCode(planTitle(id));
  return code ? (code + ' ' + c) : c;
}

/* ══════════════════════════════════════════════════════════════════════════
   🔔 골든벨 — 수업 시작 3~4문제, 끝까지 남은 사람에게 도장

   교실에서 30초 안에 한 라운드가 끝나야 한다. 그래서 «맞은 사람»이 아니라
   «틀린 사람»만 누른다 — 보통 반에서 서너 명이라 탭 수가 1/5 로 줄어든다.
   진행 중 상태는 localStorage 에 둔다. 새로고침·실수로 뒤로가기 해도 살아난다.
   DB 는 마지막에 도장 찍을 때만 쓴다(새 테이블 없음).
   ══════════════════════════════════════════════════════════════════════════ */
/* ── 🔊 골든벨 음향 ──────────────────────────────────────────────────────
   전자칠판·교사 기기 한 대에서만 나온다. preload='none' 이라 실제로 누르기
   전에는 한 바이트도 안 받는다(학교 와이파이 배려). 브라우저가 소리를 막는 건
   «사용자가 누르기 전»뿐이라, 교사가 시작을 누른 뒤부터는 문제없이 난다. */
var GB_SND = {
  write:   'audio/sfx-write.mp3',      // 정답을 써주세요
  show:    'audio/sfx-show.mp3',       // 정답을 들어주세요
  tense1:  'audio/bgm-tense1.mp3',     // 긴장감 1
  tense2:  'audio/bgm-tense2.mp3',     // 긴장감 2
  cute:    'audio/bgm-cute.mp3',       // 귀여운 퀴즈
  fanfare: 'audio/sfx-fanfare.mp3',    // 팡파레
  award:   'audio/bgm-award.mp3'       // 시상식
};
var GB_BGM_LIST = [
  {k:'tense1', n:'긴장감 1'},
  {k:'tense2', n:'긴장감 2'},
  {k:'cute',   n:'귀여운 퀴즈'},
  {k:'off',    n:'끄기'}
];
var _gbAud = {}, _gbBgm = null;

/* ── 🎵 내 음악 넣기 ───────────────────────────────────────────────────────
   집에서 고른 mp3 를 이 «기기 브라우저»에만 넣어둔다(IndexedDB). 파일이 저장소로
   올라가지 않으니 공개 배포와 무관하고, 전자칠판에서 한 번 넣어두면 학기 내내
   그대로 남는다. 배경음으로만 쓴다 — 효과음은 짧고 정해진 신호라 손대지 않는다.
   ────────────────────────────────────────────────────────────────────────── */
var GBU = null;            /* [{id,name,url}] — url 은 이 세션에서 만든 임시 주소 */
var _gbuBusy = false;

function gbuDB(){
  return new Promise(function(res, rej){
    if(!window.indexedDB){ rej(0); return; }
    var rq = indexedDB.open('gb_user_snd', 1);
    rq.onupgradeneeded = function(){
      var d = rq.result;
      if(!d.objectStoreNames.contains('snd')) d.createObjectStore('snd', {keyPath:'id'});
    };
    rq.onsuccess = function(){ res(rq.result); };
    rq.onerror   = function(){ rej(rq.error); };
  });
}
/* 화면을 그리다 처음 불리면 조용히 읽어오고, 다 읽으면 한 번만 다시 그린다 */
function gbuLoad(){
  if(GBU || _gbuBusy) return;
  _gbuBusy = true;
  gbuDB().then(function(d){
    var out = [], rq = d.transaction('snd','readonly').objectStore('snd').openCursor();
    rq.onsuccess = function(){
      var c = rq.result;
      if(c){
        var v = c.value;
        try{ out.push({ id:v.id, name:v.name, slot:(v.slot || 'bgm'), url:URL.createObjectURL(v.blob) }); }catch(e){}
        c.continue();
      } else {
        GBU = out; _gbuBusy = false;
        if(out.length) renderGB();
      }
    };
    rq.onerror = function(){ GBU = []; _gbuBusy = false; };
  }).catch(function(){ GBU = []; _gbuBusy = false; });
}
function gbuAdd(input){
  /* ⚠️ input.files 는 «살아 있는» 목록이라 input.value='' 를 먼저 하면 그 자리에서
     비어버린다. 그래서 파일을 배열로 다 옮겨 담은 «뒤에» 입력칸을 비운다. */
  var fs = input.files, picked = [], i, f;
  for(i=0;i<(fs ? fs.length : 0);i++){
    f = fs[i];
    if(/^audio\//.test(f.type || '') || /\.(mp3|m4a|ogg|wav|aac|flac|opus)$/i.test(f.name)) picked.push(f);
  }
  input.value = '';                       /* 같은 파일을 다시 골라도 들어가게 */
  if(!picked.length){ toast(fs && fs.length ? '음악 파일이 아니에요' : '고른 파일이 없어요'); return; }
  gbuDB().then(function(d){
    var tx = d.transaction('snd','readwrite'), st = tx.objectStore('snd');
    if(!GBU) GBU = [];
    for(var j=0;j<picked.length;j++){
      var g = picked[j];
      var rec = { id:'u_' + Date.now().toString(36) + j, name:gbuTidy(g.name), slot:'bgm', blob:g };
      st.put(rec);
      try{ GBU.push({ id:rec.id, name:rec.name, slot:'bgm', url:URL.createObjectURL(g) }); }catch(e){}
    }
    tx.oncomplete = function(){
      toast('음악 ' + picked.length + '개를 넣었어요 · 이름과 자리를 정해주세요');
      _gbuEdit = true;        /* 넣자마자 관리 칸을 펴 준다 — 파일 이름이 대개 길다 */
      renderGB();
    };
    tx.onerror = function(){ toast('넣지 못했어요 — 저장 공간을 확인해 주세요'); };
  }).catch(function(){ toast('이 브라우저에는 넣을 수 없어요'); });
}
/* 내려받은 파일 이름은 대개 지저분하다 — 확장자·화질표기·업로더 꼬리를 떼어 준다 */
function gbuTidy(n){
  return String(n)
    .replace(/\.[^.]+$/, '')
    .replace(/\s*\((?:\d{2,4}k|\d{3,4}p|공식|가사[^)]*|[^)]*자막[^)]*)\)\s*/gi, ' ')
    .replace(/\s*-\s*(?:Topic|[^-]*뮤직\s*라이브러리)\s*$/i, '')
    .replace(/[【】［］]/g, ' ')
    .replace(/\s{2,}/g, ' ')
    .trim()
    .slice(0, 28) || '내 음악';
}
function gbuRename(id){
  var it = gbuAt(id); if(!it) return;
  var n = prompt('이 음악을 뭐라고 부를까요?\n(예: 긴장감 3)', it.name);
  if(n === null) return;
  n = n.trim().slice(0, 28); if(!n) return;
  gbuPatch(id, { name: n });
}
function gbuSlot(id, slot){ gbuPatch(id, { slot: slot }); }
/* 저장된 알맹이(blob)는 그대로 두고 이름·자리만 고쳐 쓴다.
   ⚠️ 이름과 자리를 연달아 바꾸면 두 번의 «읽고 → 고쳐 → 쓰기»가 겹쳐서 뒤엣것이
   앞엣것을 지운다. 그래서 화면 값(it)을 먼저 바꾸고, 저장할 때는 언제 끝나든
   «그 시점의 화면 값»을 통째로 받아 적는다 — 겹쳐도 같은 결과로 모인다. */
function gbuPatch(id, patch){
  var it = gbuAt(id); if(!it) return;
  for(var k in patch) it[k] = patch[k];
  gbuDB().then(function(d){
    var st = d.transaction('snd','readwrite').objectStore('snd'), rq = st.get(id);
    rq.onsuccess = function(){
      var rec = rq.result; if(!rec) return;
      rec.name = it.name; rec.slot = it.slot || 'bgm';
      st.put(rec);
    };
  }).catch(function(){});
  if(it.slot === 'award' && gbBgmKey() === id) gbPickBgm('tense1');
  else renderGB();
}
function gbuDel(id){
  var it = gbuAt(id); if(!it) return;
  if(!confirm('「' + it.name + '」을 뺄까요? (원본 파일은 그대로예요)')) return;
  gbuDB().then(function(d){
    d.transaction('snd','readwrite').objectStore('snd').delete(id);
    GBU = GBU.filter(function(x){ return x.id !== id; });
    try{ URL.revokeObjectURL(it.url); }catch(e){}
    delete _gbAud[id];
    if(_gbAwardKey === id) gbAwardStop();          /* 시상식에서 틀고 있었으면 멎는다 */
    if(gbBgmKey() === id) gbPickBgm('tense1');     /* 틀던 곡을 뺐으면 기본으로 */
    else renderGB();
  }).catch(function(){});
}
function gbuAt(id){
  for(var i=0;i<(GBU||[]).length;i++) if(GBU[i].id === id) return GBU[i];
  return null;
}

function gbSndOn(){ try{ return localStorage.getItem('gb_snd') !== 'off'; }catch(e){ return true; } }

/* 볼륨 0~1. 기본 0.7 — 이때 배경음이 0.35 라 예전과 같은 크기다.
   배경음은 선생님 목소리 밑에 깔려야 하므로 슬라이더의 절반만 쓴다.
   효과음(써주세요·들어주세요)은 반 전체가 들어야 하는 신호라 슬라이더 값 그대로. */
function gbVol(){
  var v;
  try{ v = parseFloat(localStorage.getItem('gb_vol')); }catch(e){}
  return (isFinite(v) && v >= 0 && v <= 1) ? v : 0.7;
}
function gbBgmVol(){ return gbVol() * 0.5; }

/* 슬라이더를 끄는 동안 매번 화면을 다시 그리면 손가락이 슬라이더에서 떨어진다.
   그래서 여기서는 소리와 숫자만 바꾸고 renderGB 는 부르지 않는다. */
function gbSetVol(v){
  v = Math.max(0, Math.min(1, (parseFloat(v) || 0) / 100));
  try{ localStorage.setItem('gb_vol', String(v)); }catch(e){}
  if(_gbBgm){ try{ _gbBgm.volume = gbBgmVol(); }catch(e){} }
  if(_gbAwardAud){ try{ _gbAwardAud.volume = gbBgmVol(); }catch(e){} }
  for(var k in _gbAud){
    if(_gbAud[k] !== _gbBgm && _gbAud[k] !== _gbAwardAud){ try{ _gbAud[k].volume = v; }catch(e){} }
  }
  var lab = document.getElementById('gbVolLab');
  if(lab) lab.textContent = Math.round(v * 100) + '%';
}
function gbBgmKey(){ try{ return localStorage.getItem('gb_bgm') || 'tense1'; }catch(e){ return 'tense1'; } }
function gbToggleSnd(){
  var on = !gbSndOn();
  try{ localStorage.setItem('gb_snd', on ? 'on' : 'off'); }catch(e){}
  if(!on){ gbStopBgm(); gbAwardStop(); }
  renderGB();
}
function gbPickBgm(k){
  try{ localStorage.setItem('gb_bgm', k); }catch(e){}
  gbStopBgm();
  /* 예전에는 «골든벨이 돌고 있을 때»만 틀었다(GB.ready && !GB.done). 그래서 준비
     화면이나 결과 화면에서 배경음 칩을 눌러도 아무 소리가 안 났다 — 시상식 단추는
     바로 나는데 배경음만 안 나던 이유가 이것이다. 이제 소리가 켜져 있으면 누르는
     즉시 튼다. 멈추려면 「끄기」. */
  if(k !== 'off' && gbSndOn()) gbPlayBgm();
  renderGB();
}

function gbAudio(key){
  /* u_ 로 시작하면 내가 넣어둔 음악 — 파일이 아니라 이 기기 안의 주소를 쓴다 */
  var mine = (key && key.indexOf('u_') === 0) ? gbuAt(key) : null;
  var src = mine ? mine.url : GB_SND[key];
  if(!src) return null;
  if(!_gbAud[key]){
    var a = new Audio(); a.preload = 'none'; a.src = src;
    _gbAud[key] = a;
  }
  return _gbAud[key];
}
/* 효과음 — 실패해도 조용히 넘어간다. 소리 때문에 수업이 멈추면 안 된다. */
function gbSfx(key){
  if(!gbSndOn()) return;
  var a = gbAudio(key); if(!a) return;
  try{ a.volume = gbVol(); a.currentTime = 0; var p = a.play(); if(p && p.catch) p.catch(function(){}); }catch(e){}
}
function gbPlayBgm(){
  var k = gbBgmKey();
  if(!gbSndOn() || k === 'off') return;
  var a = gbAudio(k); if(!a) return;
  gbAwardStop();                  /* 시상식곡이 돌고 있었으면 겹치지 않게 멎힌다 */
  a.loop = true; a.volume = gbBgmVol();
  _gbBgm = a;
  try{ var p = a.play(); if(p && p.catch) p.catch(function(){}); }catch(e){}
  gbNowBar();
}
function gbStopBgm(){
  if(!_gbBgm) return;
  try{ _gbBgm.pause(); _gbBgm.currentTime = 0; }catch(e){}
  _gbBgm = null;
  gbNowBar();
}
/* ── 🏅 시상식 음악 ────────────────────────────────────────────────────────
   배경음과 다른 줄에 둔다. 시상식은 «틀어놓고 도장을 찍는» 순간이라 미리 골라두는
   게 아니라 그때 눌러서 고른다. 배경음 줄과 채널이 달라서, 누르면 배경음은 멎고
   고른 곡이 반복 재생된다. ── */
var _gbAwardAud = null, _gbAwardKey = null;
function gbAwardPlay(key){
  gbStopBgm();
  gbAwardStop();
  if(!gbSndOn()) return;
  var a = gbAudio(key); if(!a) return;
  a.loop = true; a.volume = gbBgmVol();
  _gbAwardAud = a; _gbAwardKey = key;
  try{ a.currentTime = 0; var p = a.play(); if(p && p.catch) p.catch(function(){}); }catch(e){}
  gbNowBar();
  renderGB();
}
function gbAwardStop(){
  if(_gbAwardAud){ try{ _gbAwardAud.pause(); _gbAwardAud.currentTime = 0; }catch(e){} }
  _gbAwardAud = null; _gbAwardKey = null;
  gbNowBar();
}
function gbAwardOff(){ gbAwardStop(); renderGB(); }

/* ── ▶ 지금 나오는 소리 ────────────────────────────────────────────────────
   배경음이든 시상식곡이든 한 줄에서 다룬다. 도장을 찍으면 「도장 주기」 탭으로
   넘어가 골든벨 화면이 사라지므로, 이 줄은 어느 탭에서든 떠 있게 둔다.
   재생 위치를 끌어 옮길 수 있다 — 긴 노래의 후렴부터 틀 때 쓴다.
   ────────────────────────────────────────────────────────────────────────── */
var _gbSeekIv = null, _gbSeekDrag = false, _gbNowTag = '';

function gbNowAud(){ return _gbAwardAud || _gbBgm; }
function gbNowName(){
  var k, i;
  if(_gbAwardAud){
    k = _gbAwardKey;
    return k === 'award' ? '기본 시상식' : ((gbuAt(k) || {}).name || '시상식 음악');
  }
  if(_gbBgm){
    k = gbBgmKey();
    for(i=0;i<GB_BGM_LIST.length;i++) if(GB_BGM_LIST[i].k === k) return GB_BGM_LIST[i].n;
    return (gbuAt(k) || {}).name || '배경음';
  }
  return '';
}
function gbNowStop(){ if(_gbAwardAud) gbAwardOff(); else gbPickBgm('off'); }
function gbNowToggle(){
  var a = gbNowAud(); if(!a) return;
  try{
    if(a.paused){ var p = a.play(); if(p && p.catch) p.catch(function(){}); }
    else a.pause();
  }catch(e){}
  gbSeekPaint();
}
function gbFmtT(s){
  if(!isFinite(s) || s < 0) return '--:--';
  s = Math.floor(s);
  return Math.floor(s/60) + ':' + ('0' + (s % 60)).slice(-2);
}

function gbNowBar(){
  var a = gbNowAud(), el = document.getElementById('gbNowBar');
  if(!a){
    if(el && el.parentNode) el.parentNode.removeChild(el);
    _gbNowTag = '';
    if(_gbSeekIv){ clearInterval(_gbSeekIv); _gbSeekIv = null; }
    return;
  }
  if(!el){
    el = document.createElement('div');
    el.id = 'gbNowBar';
    el.style.cssText = 'position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:70;' +
      'display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:center;' +
      'padding:9px 13px;border-radius:18px;background:var(--card);border:2px solid var(--ac);' +
      'box-shadow:0 6px 22px rgba(0,0,0,.18);font-size:12px;font-weight:800;width:min(560px,94vw)';
    document.body.appendChild(el);
  }
  /* 곡이 바뀔 때만 다시 그린다 — 끌고 있는 손잡이를 도로 뺏지 않으려고 */
  var tag = _gbAwardAud ? ('a:' + _gbAwardKey) : ('b:' + gbBgmKey());
  if(tag !== _gbNowTag){
    _gbNowTag = tag;
    el.innerHTML =
      '<span style="flex:1 0 100%;text-align:center;white-space:nowrap;overflow:hidden;' +
      'text-overflow:ellipsis">' + (_gbAwardAud ? '🏅 ' : '🎵 ') + esc(gbNowName()) + '</span>' +
      '<b id="gbSeekCur" style="font-size:11.5px;color:var(--ac-d);min-width:34px;text-align:right">0:00</b>' +
      '<input type="range" id="gbSeekBar" min="0" max="1000" step="1" value="0"' +
      ' oninput="gbSeekInput(this)" onchange="gbSeekApply(this)"' +
      ' style="flex:1;min-width:110px;accent-color:var(--ac)">' +
      '<b id="gbSeekDur" style="font-size:11.5px;color:var(--mute);min-width:34px">--:--</b>' +
      '<button class="chip sm" onclick="gbSeekBy(-10)">−10초</button>' +
      '<button class="chip sm" onclick="gbSeekBy(10)">+10초</button>' +
      '<button class="chip sm" id="gbSeekPlay" onclick="gbNowToggle()">⏸ 잠깐</button>' +
      '<button class="chip sm" onclick="gbNowStop()">■ 멈춤</button>';
  }
  if(!_gbSeekIv) _gbSeekIv = setInterval(gbSeekPaint, 400);
  gbSeekPaint();
}

function gbSeekPaint(){
  var a = gbNowAud(), bar = document.getElementById('gbSeekBar');
  if(!a || !bar){ if(_gbSeekIv){ clearInterval(_gbSeekIv); _gbSeekIv = null; } return; }
  var cur = document.getElementById('gbSeekCur'),
      dur = document.getElementById('gbSeekDur'),
      pp  = document.getElementById('gbSeekPlay'),
      d   = a.duration;
  if(!_gbSeekDrag){                          /* 끄는 중에는 손잡이를 건드리지 않는다 */
    bar.value = (isFinite(d) && d > 0) ? Math.round(a.currentTime / d * 1000) : 0;
    if(cur) cur.textContent = gbFmtT(a.currentTime);
  }
  if(dur) dur.textContent = gbFmtT(d);
  if(pp)  pp.textContent  = a.paused ? '▶ 이어서' : '⏸ 잠깐';
}
function gbSeekInput(el){
  _gbSeekDrag = true;
  var a = gbNowAud(), cur = document.getElementById('gbSeekCur');
  if(a && cur && isFinite(a.duration)) cur.textContent = gbFmtT(a.duration * el.value / 1000);
}
function gbSeekApply(el){
  var a = gbNowAud();
  if(a && isFinite(a.duration) && a.duration > 0){
    try{ a.currentTime = a.duration * el.value / 1000; }catch(e){}
  }
  _gbSeekDrag = false;
  gbSeekPaint();
}
function gbSeekBy(sec){
  var a = gbNowAud(); if(!a) return;
  var lim = isFinite(a.duration) ? a.duration - 0.3 : 1e9;
  try{ a.currentTime = Math.max(0, Math.min(lim, a.currentTime + sec)); }catch(e){}
  gbSeekPaint();
}
function gbuBySlot(s){
  gbuLoad();
  return (GBU || []).filter(function(x){ return (x.slot || 'bgm') === s; });
}

/* 음향 조작 줄 */
var _gbuEdit = false;
function gbuToggleEdit(){ _gbuEdit = !_gbuEdit; renderGB(); }

/* 시상식 곡 단추들 — 소리 줄에도, 결과 화면의 큰 칸에도 같은 걸 쓴다 */
function gbAwardChips(sz){
  var aw = gbuBySlot('award'), h = '', i;
  h += '<button class="chip' + sz + (_gbAwardKey==='award'?' on':'') +
       '" onclick="gbAwardPlay(\'award\')">기본 시상식</button>';
  for(i=0;i<aw.length;i++){
    h += '<button class="chip' + sz + (_gbAwardKey===aw[i].id?' on':'') +
         '" onclick="gbAwardPlay(\'' + aw[i].id + '\')">🎵 ' + esc(aw[i].name) + '</button>';
  }
  return h + '<button class="chip' + sz + (_gbAwardKey?'':' on') + '" onclick="gbAwardOff()">■ 멈춤</button>';
}

function gbSndBar(noAward){
  var on = gbSndOn(), k = gbBgmKey(), i;
  var lab = 'font-size:11px;color:var(--mute);font-weight:700';
  var h = '<div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:9px">' +
          '<button class="chip sm" onclick="gbToggleSnd()">' + (on ? '🔊 소리 켜짐' : '🔇 소리 꺼짐') + '</button>';
  if(!on) return h + '</div>';

  /* ── 배경음 ── */
  h += '<span style="' + lab + '">배경음</span>';
  for(i=0;i<GB_BGM_LIST.length;i++){
    if(GB_BGM_LIST[i].k === 'off') continue;          /* 「끄기」는 내 음악 뒤로 민다 */
    h += '<button class="chip sm' + (k===GB_BGM_LIST[i].k?' on':'') +
         '" onclick="gbPickBgm(\'' + GB_BGM_LIST[i].k + '\')">' + GB_BGM_LIST[i].n + '</button>';
  }
  var bgm = gbuBySlot('bgm');
  for(i=0;i<bgm.length;i++){
    h += '<button class="chip sm' + (k===bgm[i].id?' on':'') +
         '" onclick="gbPickBgm(\'' + bgm[i].id + '\')">🎵 ' + esc(bgm[i].name) + '</button>';
  }
  h += '<label class="chip sm" style="cursor:pointer">＋ 내 음악' +
       '<input type="file" accept="audio/*" multiple style="display:none" onchange="gbuAdd(this)"></label>' +
       '<button class="chip sm' + (k==='off'?' on':'') + '" onclick="gbPickBgm(\'off\')">끄기</button>' +
       ((GBU && GBU.length) ? '<button class="chip sm" onclick="gbuToggleEdit()">' +
         (_gbuEdit ? '접기' : '🎵 음악 관리') + '</button>' : '') +
       '</div>';

  /* ── 시상식 (결과 화면에서는 따로 큰 칸으로 보여주니 여기서는 뺀다) ── */
  if(!noAward){
    h += '<div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:7px">' +
         '<span style="' + lab + '">🏅 시상식</span>' + gbAwardChips(' sm') + '</div>';
  }

  /* ── 관리: 이름 바꾸기 · 배경음↔시상식 · 빼기 ── */
  if(_gbuEdit && GBU && GBU.length){
    h += '<div style="display:flex;flex-direction:column;gap:6px;margin-top:9px;padding-top:9px;' +
         'border-top:2px dashed var(--line)">';
    for(i=0;i<GBU.length;i++){
      var m = GBU[i], s = m.slot || 'bgm';
      h += '<div style="display:flex;gap:5px;align-items:center;flex-wrap:wrap;padding:7px 9px;' +
           'border:2px solid var(--line);border-radius:12px;background:#fff">' +
           '<b style="flex:1;min-width:110px;font-size:12.5px">🎵 ' + esc(m.name) + '</b>' +
           '<button class="chip sm" onclick="gbuRename(\'' + m.id + '\')">이름</button>' +
           '<button class="chip sm' + (s==='bgm'?' on':'') + '" onclick="gbuSlot(\'' + m.id + '\',\'bgm\')">배경음</button>' +
           '<button class="chip sm' + (s==='award'?' on':'') + '" onclick="gbuSlot(\'' + m.id + '\',\'award\')">시상식</button>' +
           '<button class="chip sm" onclick="gbuDel(\'' + m.id + '\')">✕</button>' +
           '</div>';
    }
    h += '<div style="' + lab + ';line-height:1.6">이 음악들은 이 기기에만 있어요 — 다른 기기에서는 다시 넣어야 합니다.</div></div>';
  }

  /* ── 크기 ── */
  h += '<div style="display:flex;gap:9px;align-items:center;margin-top:8px">' +
       '<span style="' + lab + ';flex:0 0 auto">🔉 크기</span>' +
       '<input type="range" min="0" max="100" step="5" value="' + Math.round(gbVol()*100) + '"' +
       ' oninput="gbSetVol(this.value)" style="flex:1;min-width:110px;accent-color:var(--ac)">' +
       '<b id="gbVolLab" style="flex:0 0 auto;font-size:12px;color:var(--ac-d);min-width:38px;text-align:right">' +
       Math.round(gbVol()*100) + '%</b>';
  return h + '</div>';
}

var GB_KEY = 'gb_state_v1';
var GB = null;   // {g,c,total,round,alive:{id:1},out:{id:round},names:{id:label},done}

function gbSave(){ try{ localStorage.setItem(GB_KEY, JSON.stringify(GB)); }catch(e){} }
function gbLoad(){
  try{
    var s = localStorage.getItem(GB_KEY);
    GB = s ? JSON.parse(s) : null;
  }catch(e){ GB = null; }
}
function gbClear(){ GB = null; try{ localStorage.removeItem(GB_KEY); }catch(e){} }

/* ══════════════════════════════════════════════════════════════════════════
   📝 골든벨 문제 — 칠판에 띄우는 몫

   문제도 DB 에 두지 않는다(골든벨은 «새 테이블 없음» 이 원칙). 대신 집에서 만든
   문제를 학교 전자칠판에서 열 수 있게 JSON 내보내기·불러오기를 둔다.
   목록이 비어 있으면 문제 칸이 아예 안 나온다 — 예전처럼 선생님이 구두로 낸다.
   ══════════════════════════════════════════════════════════════════════════ */
var GBQ_KEY = 'gb_qs_v1';
var GBQ = null;        // [{q:'문제', a:'정답'}]
var _gbEdit = false;   // 문제 편집기를 펼쳤는지
var _gbEditIx = -1;    // 고치는 중인 문제 번호(-1 이면 새로 추가)

function gbqLoad(){
  if(GBQ) return GBQ;
  try{ GBQ = JSON.parse(localStorage.getItem(GBQ_KEY) || '[]'); }catch(e){ GBQ = []; }
  if(!(GBQ instanceof Array)) GBQ = [];
  return GBQ;
}
function gbqSave(){ try{ localStorage.setItem(GBQ_KEY, JSON.stringify(GBQ)); }catch(e){ toast('저장 공간이 가득 찼어요'); } }
function gbqAt(round){ var l = gbqLoad(); return l[round-1] || null; }

/* 따옴표까지 막아야 value="…" 안에 넣을 수 있다 — esc 는 & < > 만 막는다 */
function escq(s){ return esc(s).replace(/"/g, '&quot;'); }

function gbqToggleEdit(){ _gbEdit = !_gbEdit; _gbEditIx = -1; renderGB(); }
function gbqEdit(i){ _gbEditIx = i; renderGB(); }
function gbqCancel(){ _gbEditIx = -1; renderGB(); }

function gbqAdd(){
  var qi = $('gbqQ'), ai = $('gbqA');
  var q = qi ? qi.value.trim() : '', a = ai ? ai.value.trim() : '';
  if(!q){ toast('문제를 적어주세요'); if(qi) qi.focus(); return; }
  gbqLoad();
  if(_gbEditIx >= 0 && GBQ[_gbEditIx]) GBQ[_gbEditIx] = { q:q, a:a };
  else GBQ.push({ q:q, a:a });
  _gbEditIx = -1;
  gbqSave(); renderGB();
}
function gbqDel(i){
  gbqLoad();
  if(!GBQ[i]) return;
  if(!confirm((i+1) + '번 문제를 지울까요?')) return;
  GBQ.splice(i, 1);
  if(_gbEditIx === i) _gbEditIx = -1;
  gbqSave(); renderGB();
}
function gbqMove(i, d){
  gbqLoad();
  var j = i + d;
  if(j < 0 || j >= GBQ.length) return;
  var t = GBQ[i]; GBQ[i] = GBQ[j]; GBQ[j] = t;
  _gbEditIx = -1;
  gbqSave(); renderGB();
}

/* 집 기기 → 학교 기기. 로그인은 따라오지만 문제는 이 기기에만 있다. */
function gbqExport(){
  gbqLoad();
  if(!GBQ.length){ toast('내보낼 문제가 없어요'); return; }
  var blob = new Blob([JSON.stringify(GBQ, null, 2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '골든벨_문제_' + todayStr() + '.json';
  a.click(); URL.revokeObjectURL(a.href);
  toast('문제 ' + GBQ.length + '개를 내려받았어요');
}
function gbqImport(input){
  var f = input && input.files && input.files[0];
  if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    try{
      var arr = JSON.parse(String(r.result)), out = [], i, it;
      if(!(arr instanceof Array)) throw 0;
      for(i=0;i<arr.length;i++){
        it = arr[i];
        if(it && typeof it.q === 'string' && it.q.trim()) out.push({ q:String(it.q), a:String(it.a == null ? '' : it.a) });
      }
      if(!out.length) throw 0;
      GBQ = out; _gbEditIx = -1;
      gbqSave(); renderGB();
      toast('문제 ' + out.length + '개를 불러왔어요');
    }catch(e){ toast('올바른 골든벨 문제 파일이 아니에요'); }
  };
  r.readAsText(f);
  input.value = '';     /* 같은 파일을 다시 골라도 불러와지게 */
}

/* 준비 화면의 문제 칸 — 접으면 목록만, 펴면 편집기 */
/* 시작 전(GB 가 아직 없을 때)에도 불린다 — 문제는 반·진행과 무관하게 미리 넣어둔다 */
function gbqPanel(){
  var l = gbqLoad(), tot = (GB && GB.total) || 0, h, i;
  var use = tot ? Math.min(tot, l.length) : l.length;
  h = '<div class="card"><div class="hd"><h3 style="font-size:var(--fs-s)">📝 오늘 낼 문제</h3>' +
      '<button class="chip sm" onclick="gbqToggleEdit()">' +
      (_gbEdit ? '접기' : (l.length ? '고치기' : '문제 넣기')) + '</button></div>';
  if(!l.length){
    h += '<div class="sub">넣어둔 문제가 없어요. 이대로 시작하면 <b>선생님이 구두로</b> 내는 예전 방식으로 진행돼요.</div>';
  } else if(!tot){
    h += '<div class="sub"><b style="color:var(--ac-d)">' + l.length +
         '개</b> 준비돼 있어요 · 시작할 때 고른 문제 수만큼 앞에서부터 씁니다</div>';
  } else {
    h += '<div class="sub">' + l.length + '개 중 <b style="color:var(--ac-d)">앞에서 ' + use + '개</b>를 씁니다' +
         (l.length > use ? ' · 나머지 ' + (l.length - use) + '개는 다음에' : '') + '</div>';
    if(l.length < GB.total){
      h += '<div class="sub" style="color:var(--ac-d)">' + (GB.total - l.length) +
           '문제는 화면에 안 떠요 — 그건 구두로 내면 됩니다</div>';
    }
    h += '<ol style="margin:9px 0 0;padding-left:20px;font-size:13px;line-height:1.7">';
    for(i=0;i<l.length;i++){
      h += '<li' + (i < use ? '' : ' style="opacity:.38"') + '>' + esc(l[i].q) +
           (l[i].a ? ' <b style="color:var(--ok-d)">→ ' + esc(l[i].a) + '</b>' : '') + '</li>';
    }
    h += '</ol>';
  }
  if(_gbEdit) h += gbqEditor();
  return h + '</div>';
}

function gbqEditor(){
  var l = gbqLoad(), ed = (_gbEditIx >= 0 && l[_gbEditIx]) ? l[_gbEditIx] : null, h, i;
  h = '<div style="margin-top:13px;padding-top:13px;border-top:2px dashed var(--line)">' +
      '<textarea class="inp" id="gbqQ" rows="2" placeholder="문제 (예: 마찰한 두 물체가 서로 밀어냈다면 두 물체의 전하는 같은 종류일까, 다른 종류일까?)">' +
      (ed ? esc(ed.q) : '') + '</textarea>' +
      '<input class="inp" id="gbqA" style="margin-top:7px" placeholder="정답 (비워두면 정답 공개 버튼이 안 나와요)" value="' +
      (ed ? escq(ed.a) : '') + '">' +
      '<div style="display:flex;gap:7px;margin-top:9px">' +
      '<button class="btn g" style="flex:1" onclick="gbqAdd()">' + (ed ? '✔ 이대로 고치기' : '+ 문제 추가') + '</button>' +
      (ed ? '<button class="chip sm" style="flex:0 0 auto;padding-left:16px;padding-right:16px" onclick="gbqCancel()">취소</button>' : '') +
      '</div>';
  if(l.length){
    h += '<div style="display:flex;flex-direction:column;gap:6px;margin-top:11px">';
    for(i=0;i<l.length;i++){
      h += '<div style="display:flex;gap:5px;align-items:center;padding:8px 10px;border:2px solid var(--line);border-radius:12px;background:#fff' +
           (i === _gbEditIx ? ';border-color:var(--ac)' : '') + '">' +
           '<b style="flex:0 0 auto;color:var(--ac-d);font-size:13px">' + (i+1) + '</b>' +
           '<div style="flex:1;min-width:0;font-size:13px;line-height:1.45">' + esc(l[i].q) +
           (l[i].a ? '<b style="color:var(--ok-d)"> → ' + esc(l[i].a) + '</b>' : '') + '</div>' +
           '<button class="chip sm" onclick="gbqMove(' + i + ',-1)">↑</button>' +
           '<button class="chip sm" onclick="gbqMove(' + i + ',1)">↓</button>' +
           '<button class="chip sm" onclick="gbqEdit(' + i + ')">고침</button>' +
           '<button class="chip sm" onclick="gbqDel(' + i + ')">✕</button>' +
           '</div>';
    }
    h += '</div>';
  }
  h += '<div style="display:flex;gap:7px;margin-top:11px;flex-wrap:wrap">' +
       '<button class="chip sm" onclick="gbqExport()">⬇ 파일로 내보내기</button>' +
       '<label class="chip sm" style="cursor:pointer">⬆ 파일에서 불러오기' +
       '<input type="file" accept=".json,application/json" style="display:none" onchange="gbqImport(this)"></label>' +
       '</div>' +
       '<div class="sub" style="margin-top:7px">문제는 이 기기에만 저장돼요. 집에서 만들었다면 파일로 내보내 학교 기기에서 불러오세요.</div>';
  return h + '</div>';
}

/* 진행 중 화면에 띄우는 문제 — 넣어둔 게 없으면 아무것도 안 그린다 */
function gbqShow(){
  var q = gbqAt(GB.round), h;
  if(!q) return '';
  h = '<div class="card" style="text-align:center;padding:22px 16px">' +
      '<div style="font-size:clamp(20px,3.4vw,44px);font-weight:900;line-height:1.4;word-break:keep-all">' +
      esc(q.q) + '</div>';
  if(!q.a) return h + '</div>';
  if(GB.rev){
    h += '<div style="margin-top:15px;padding-top:14px;border-top:2px dashed var(--line)">' +
         '<div style="font-size:12px;font-weight:800;color:var(--mute)">정답</div>' +
         '<div style="font-size:clamp(19px,3vw,38px);font-weight:900;color:var(--ok-d);line-height:1.35;word-break:keep-all">' +
         esc(q.a) + '</div></div>';
  } else {
    h += '<button class="chip" style="margin-top:15px;padding:11px 22px" onclick="gbReveal()">👀 정답 공개</button>';
  }
  return h + '</div>';
}
function gbReveal(){ if(!GB) return; GB.rev = 1; gbSave(); renderGB(); }

/* 전자칠판 — 주소창·탭까지 걷어내야 뒷자리에서 글씨가 보인다 */
function gbFull(){
  try{
    if(document.fullscreenElement){ document.exitFullscreen(); }
    else if(document.documentElement.requestFullscreen){ document.documentElement.requestFullscreen(); }
    else { toast('이 브라우저는 전체화면을 지원하지 않아요'); }
  }catch(e){}
}

/* 도장 주기 탭의 반 칩과 같은 목록을 쓰되, 고르면 골든벨 화면을 다시 그린다 */
function renderGBClassChips(){
  var el = $('gbClassChips'); if(!el) return;
  if(!S.classes || !S.classes.length){ el.innerHTML = '<span class="sub">반 목록을 불러오는 중…</span>'; loadClasses(); return; }
  var h = '', i, c;
  for(i=0;i<S.classes.length;i++){
    c = S.classes[i];
    h += '<button class="chip' + (S.selClass && S.selClass.grade===c.grade && S.selClass.cls===c.cls ? ' on' : '') +
         '" onclick="gbPickClass(' + c.grade + ',' + c.cls + ')">' + c.grade + '-' + c.cls + '</button>';
  }
  el.innerHTML = h;
}
async function gbPickClass(g,c){ await pickClass(g,c); renderGB(); }

function gbAliveIds(){ return GB ? Object.keys(GB.alive) : []; }
function gbLabel(id){ return (GB && GB.names[id]) || '학생'; }

/* 진행 중이던 골든벨이 이 반 것이 맞는지 */
function gbMatchesClass(){
  return GB && S.selClass && GB.g === S.selClass.grade && GB.c === S.selClass.cls;
}

/* 탭에서 «시작»을 눌렀을 때만 상태를 만든다. 탭에 들어왔다고 바로 시작하면
   지난 골든벨을 덮어쓰게 된다. */
function gbBegin(){
  if(!S.selClass){ toast('반을 먼저 골라주세요'); return; }
  gbLoad();
  if(GB && !gbMatchesClass()){
    if(!confirm('다른 반(' + GB.g + '-' + GB.c + ') 골든벨이 진행 중이에요. 새로 시작할까요?')) return;
    gbClear();
  }
  if(!GB) gbSetup();
  renderGB();
}
function closeGB(){ teaTab('give'); }

/* ── 준비: 전원 참가, 결석·불참만 빼고 시작 ── */
function gbSetup(){
  var names = {}, alive = {}, i, s;
  for(i=0;i<S.students.length;i++){
    s = S.students[i];
    names[s.id] = (s.number ? s.number + '. ' : '') + (s.name || '');
    alive[s.id] = 1;
  }
  GB = { g:S.selClass.grade, c:S.selClass.cls, total:4, round:1,
         alive:alive, out:{}, names:names, done:false, ready:false };
  gbSave();
}

function gbSetTotal(n){ if(!GB) return; GB.total = n; gbSave(); renderGB(); }

/* 준비 단계에서 누르면 «오늘 안 함»(결석 등) — 시작 뒤에는 «탈락» */
function gbTap(id){
  if(!GB) return;
  if(GB.alive[id]){ delete GB.alive[id]; GB.out[id] = GB.ready ? GB.round : 0; }
  else { delete GB.out[id]; GB.alive[id] = 1; }
  gbSave(); renderGB();
}

function gbStart(){
  if(!GB) return;
  if(!gbAliveIds().length){ toast('참가할 학생이 없어요'); return; }
  GB.ready = true; GB.round = 1; GB.rev = 0; gbSave();
  gbPlayBgm();          /* 교사가 누른 직후라 브라우저가 소리를 막지 않는다 */
  renderGB();
}

function gbNext(){
  if(!GB) return;
  GB.rev = 0;           /* 문제가 바뀌면 정답은 다시 감춘다 */
  if(GB.round >= GB.total){
    GB.done = true;
    gbStopBgm();
    if(gbAliveIds().length) gbSfx('fanfare');
  } else {
    GB.round += 1;
    gbSfx('write');     /* 다음 문제 — «정답을 써주세요» */
  }
  gbSave(); renderGB();
}
function gbBack(){
  if(!GB || GB.round <= 1) return;
  if(GB.done) gbPlayBgm();     /* 결과에서 되돌아왔으면 배경음을 다시 켠다 */
  /* 한 라운드 되돌리기 — 그 라운드에서 탈락한 사람을 모두 되살린다 */
  var r = GB.round, id;
  for(id in GB.out){ if(GB.out[id] === r){ delete GB.out[id]; GB.alive[id] = 1; } }
  GB.round -= 1; GB.done = false; GB.rev = 0; gbSave(); renderGB();
}
function gbReset(){
  if(!confirm('지금까지 진행한 걸 지우고 처음부터 다시 할까요?')) return;
  gbSetup(); renderGB();
}
function gbQuit(){
  if(!confirm('골든벨을 끝내고 나갈까요? (도장을 아직 안 찍었다면 기록은 사라집니다)')) return;
  gbStopBgm(); gbClear(); closeGB();
}

/* 가장 오래 살아남은 사람들 — 아무도 끝까지 못 갔을 때 쓴다 */
function gbFurthest(){
  var best = 0, id, r;
  for(id in GB.out){ r = GB.out[id]; if(r > best) best = r; }
  var list = [];
  for(id in GB.out){ if(GB.out[id] === best) list.push(id); }
  return { round: best, ids: list };
}

/* ── 화면 ── */
function renderGB(){
  var el = $('p-gb'); if(!el) return;
  if(!GB) gbLoad();

  /* 반을 안 골랐거나 시작 전이면 여기서 끝 */
  if(!S.selClass){
    el.innerHTML = '<div class="card"><div class="hd"><h3 style="font-size:var(--fs-s)">🔔 골든벨</h3></div>' +
      '<div class="sub">수업 시작에 3~5문제를 내고, 끝까지 남은 사람에게 도장을 찍어요.</div>' +
      '<div class="chips" id="gbClassChips" style="margin-top:10px"></div>' +
      '<div class="sub" style="margin-top:8px">반을 먼저 골라주세요</div>' + gbSndBar() + '</div>' +
      gbqPanel();          /* 반과 무관하게 문제는 미리 넣어둘 수 있다 */
    renderGBClassChips(); return;
  }
  if(!GB || !gbMatchesClass()){
    el.innerHTML = '<div class="card"><div class="hd"><h3 style="font-size:var(--fs-s)">🔔 골든벨 · ' +
      S.selClass.grade + '학년 ' + S.selClass.cls + '반</h3></div>' +
      '<div class="chips" id="gbClassChips" style="margin:8px 0"></div>' +
      '<div class="sub">학생들은 이면지에 답을 적어 들어 보이고, 선생님은 <b>틀린 사람만</b> 누르면 돼요.</div>' +
      gbSndBar() +
      '<button class="btn" style="margin-top:12px;background:var(--ac);color:#fff" onclick="gbBegin()">🔔 골든벨 시작</button></div>' +
      gbqPanel();
    renderGBClassChips(); return;
  }

  var alive = gbAliveIds(), h = '';
  var cls = GB.g + '학년 ' + GB.c + '반';

  if(!GB.ready){
    /* 준비 */
    h += gbqPanel();
    h += '<div class="card"><div class="hd"><h3 style="font-size:var(--fs-s)">🔔 골든벨 · ' + cls + '</h3></div>' +
         '<div class="sub">문제 수를 고르고, <b>오늘 없는 사람만</b> 눌러서 빼주세요.</div>' +
         '<div class="chips" style="margin-top:10px">';
    [3,4,5].forEach(function(n){
      h += '<button class="chip' + (GB.total===n?' on':'') + '" onclick="gbSetTotal(' + n + ')">' + n + '문제</button>';
    });
    h += '</div>' +
         '<div class="sub" style="margin-top:12px"><b style="color:var(--ac-d)">' + alive.length + '명</b> 참가</div>' +
         '<div class="stu-grid" style="margin-top:8px">' + gbCards() + '</div>' +
         gbSndBar() +
         '<div style="margin-top:12px"><button class="chip sm" onclick="gbFull()">⛶ 전체화면</button></div>' +
         '<button class="btn g" style="margin-top:12px" onclick="gbStart()">🔔 시작 (' + GB.total + '문제)</button>' +
         '<button class="btn" style="margin-top:8px;background:var(--line);color:var(--tx)" onclick="closeGB()">← 도장 주기로</button>' +
         '</div>';
    el.innerHTML = h; return;
  }

  if(!GB.done){
    /* 진행 */
    h += '<div class="card" style="text-align:center">' +
         '<div class="sub">' + cls + ' · 골든벨</div>' +
         '<div style="font-size:2.6em;font-weight:900;color:var(--ac-d);line-height:1.1;margin:4px 0">' +
         GB.round + '번 문제</div>' +
         '<div style="font-size:var(--fs-m);font-weight:800">남은 사람 <b style="color:var(--ok-d)">' +
         alive.length + '명</b> <span style="color:var(--mute);font-weight:600">/ ' + GB.total + '문제 중 ' + GB.round + '</span></div>' +
         '<div class="sub" style="margin-top:6px">답을 <b>틀린 사람만</b> 누르세요. 잘못 눌렀으면 다시 누르면 살아나요.</div>' +
         '</div>';
    h += gbqShow();
    h += '<div class="card"><div class="stu-grid">' + gbCards() + '</div></div>';
    /* 진행 중 효과음 — 교사가 말로 하는 신호를 소리로 대신한다 */
    h += '<div class="card"><div style="display:flex;gap:7px">' +
         '<button class="chip" style="flex:1;padding:11px 0" onclick="gbSfx(\'write\')">✍️ 정답을 써주세요</button>' +
         '<button class="chip" style="flex:1;padding:11px 0" onclick="gbSfx(\'show\')">🙌 정답을 들어주세요</button>' +
         '</div>' + gbSndBar() + '</div>';
    h += '<div class="card"><button class="btn g" onclick="gbNext()">' +
         (GB.round >= GB.total ? '🏁 결과 보기' : '다음 문제 (' + (GB.round+1) + '번) →') + '</button>' +
         '<div style="display:flex;gap:8px;margin-top:9px">' +
         '<button class="chip sm" style="flex:1" onclick="gbBack()">↩ 앞 문제로</button>' +
         '<button class="chip sm" style="flex:1" onclick="gbReset()">처음부터</button>' +
         '<button class="chip sm" style="flex:1" onclick="gbQuit()">그만두기</button>' +
         '<button class="chip sm" style="flex:1" onclick="gbFull()">⛶ 전체화면</button>' +
         '</div></div>';
    el.innerHTML = h; return;
  }

  /* 결과 */
  h += '<div class="card" style="text-align:center">' +
       '<div style="font-size:2.2em">' + (alive.length ? '🎉' : '😮') + '</div>' +
       '<div style="font-size:var(--fs-l);font-weight:900;color:var(--ac-d)">' +
       (alive.length ? alive.length + '명 생존!' : '끝까지 간 사람이 없어요') + '</div>' +
       '<div class="sub">' + cls + ' · ' + GB.total + '문제</div></div>';

  /* 🏅 시상식 음악 — 여기가 «틀 곡을 고르는» 자리다. 도장을 찍고 탭이 넘어가도
     고른 곡은 계속 나가고, 아래쪽 떠 있는 줄에서 멈출 수 있다. */
  h += '<div class="card"><div class="hd"><h3 style="font-size:var(--fs-s)">🏅 시상식 음악</h3>' +
       (gbSndOn() ? '' : '<span class="chip sm" onclick="gbToggleSnd()">🔇 소리가 꺼져 있어요</span>') + '</div>' +
       '<div class="sub">눌러서 고르세요 · 도장을 찍는 동안 계속 나옵니다</div>' +
       '<div class="chips" style="margin-top:10px">' + gbAwardChips('') + '</div>' +
       (gbuBySlot('award').length ? '' :
         '<div class="sub" style="margin-top:8px">넣어둔 곡을 여기에 띄우려면 준비 화면에서 ' +
         '<b>＋ 내 음악</b>으로 넣고 <b>🎵 음악 관리</b>에서 자리를 <b>시상식</b>으로 옮기세요</div>') +
       '</div>';

  if(alive.length){
    h += '<div class="card"><h3 style="font-size:var(--fs-s)">🏅 끝까지 남은 사람</h3>' +
         '<div class="sub" style="margin:6px 0 9px">이 사람들에게 도장을 찍습니다</div>' +
         '<div class="stu-grid">' + gbCards(true) + '</div>' +
         '<button class="btn g" style="margin-top:13px" onclick="gbAward()">🏅 ' + alive.length + '명에게 도장 찍기</button></div>';
  } else {
    var f = gbFurthest();
    h += '<div class="card"><h3 style="font-size:var(--fs-s)">가장 오래 남은 사람</h3>' +
         '<div class="sub" style="margin:6px 0 9px">' + f.round + '번 문제까지 갔어요' +
         (f.ids.length ? ' · ' + f.ids.length + '명' : '') + '</div>' +
         '<div class="sub">' + f.ids.map(function(i){ return esc(gbLabel(i)); }).join(' · ') + '</div>' +
         (f.ids.length ? '<button class="btn g" style="margin-top:13px" onclick="gbAwardFurthest()">🏅 이 ' +
            f.ids.length + '명에게 도장 찍기</button>' : '') + '</div>';
  }

  /* 라운드별로 몇 명이 떨어졌는지 — 문제가 너무 어려웠는지 바로 보인다 */
  var perRound = [], r, n, id;
  for(r=1;r<=GB.total;r++){
    n = 0; for(id in GB.out){ if(GB.out[id]===r) n++; }
    perRound.push(r + '번 ' + n + '명');
  }
  h += '<div class="card"><h3 style="font-size:var(--fs-s)">문제별 탈락</h3>' +
       '<div class="sub" style="margin-top:6px">' + perRound.join(' · ') + '</div></div>';

  h += '<div class="card">' + gbSndBar(true) + '</div>';   /* 시상식 줄은 위 칸에 있다 */

  h += '<div class="card"><div style="display:flex;gap:8px">' +
       '<button class="chip sm" style="flex:1" onclick="gbBack()">↩ 앞 문제로</button>' +
       '<button class="chip sm" style="flex:1" onclick="gbReset()">처음부터</button>' +
       '<button class="chip sm" style="flex:1" onclick="gbQuit()">그만두기</button>' +
       '</div></div>';
  el.innerHTML = h;
}

/* 학생 카드 — onlyAlive 면 생존자만 */
function gbCards(onlyAlive){
  var list = S.students.slice().sort(function(a,b){ return (a.number||0) - (b.number||0); });
  var h = '', i, s, out;
  for(i=0;i<list.length;i++){
    s = list[i];
    out = !GB.alive[s.id];
    if(onlyAlive && out) continue;
    h += '<button class="stu' + (out ? '' : ' sel') + '"' +
         (out ? ' style="opacity:.42"' : '') +
         (onlyAlive ? '' : ' onclick="gbTap(\'' + s.id + '\')"') + '>' +
         '<span class="stu-c' + (out ? ' zero' : '') + '">' +
         (out ? (GB.out[s.id] ? GB.out[s.id] + '번' : '—') : '○') + '</span>' +
         '<div class="stu-n">' + esc((s.number ? s.number + '. ' : '') + (s.name || '')) + '</div>' +
         '<div class="stu-m">' + (out ? (GB.out[s.id] ? GB.out[s.id] + '번에서' : '오늘 안 함') : '생존') + '</div>' +
         '</button>';
  }
  return h || '<div class="empty" style="grid-column:1/-1"><p>아무도 없어요</p></div>';
}

/* ── 도장 ── */
async function gbAward(){ await gbDoAward(gbAliveIds(), GB.total, false); }
async function gbAwardFurthest(){
  var f = gbFurthest();
  await gbDoAward(f.ids, f.round, true);
}

async function gbDoAward(ids, upto, partial){
  if(!ids.length){ toast('줄 사람이 없어요'); return; }
  if(!confirm(ids.length + '명에게 도장을 찍을까요?')) return;
  showLoad();
  try{
    var byId = {}, i;
    for(i=0;i<S.students.length;i++) byId[S.students[i].id] = S.students[i];
    var note = S.selPlan ? planNote(S.selPlan) : null;
    var say  = S.selPlan ? planConcept(S.selPlan) : null;
    var beh = partial
      ? ('수업 여는 골든벨에서 ' + upto + '번 문제까지 통과함')
      : ('수업 여는 골든벨 ' + GB.total + '문제를 끝까지 통과함');
    if(say) beh = say + ' — ' + beh;
    var today = todayStr();
    var rows = [], s;
    for(i=0;i<ids.length;i++){
      s = byId[ids[i]] || {};
      rows.push({
        student_id: ids[i], school_year: nowYear(), semester: nowSem(),
        class_no_snap: s.class_no || GB.c || null, number_snap: s.number || null,
        category: 'concept', behavior: beh,
        lesson_note: note ? (note + ' · 골든벨') : '골든벨',
        observed_on: today
      });
    }
    /* 저장된 행을 되받아 «몇 명이 실제로 들어갔는지» 확인한다 —
       그냥 insert 만 하면 조용히 어긋났을 때 알 길이 없다 */
    var r = await sb.from('observations').insert(rows).select('id');
    if(r.error){
      toast('저장에 실패했어요 — ' + (r.error.message || r.error.code || ''));
      console.error('[골든벨 도장] 저장 실패', r.error, rows);
      return;
    }
    var saved = (r.data || []).length;
    if(saved !== rows.length){
      console.warn('[골든벨 도장] 요청 ' + rows.length + '명 · 저장 ' + saved + '명', r);
      alert('⚠️ ' + rows.length + '명에게 찍으려 했는데 ' + saved + '명만 저장됐어요.\n' +
            '「👥 학생」 탭에서 확인해 주세요.');
    }
    /* 결과 화면에서 이미 곡을 고르셨으면 그걸 그대로 둔다 — 골라둔 게 없을 때만 기본곡 */
    if(!_gbAwardKey) gbAwardPlay('award');
    gbClear();
    await loadTeacherObs(); await loadStudents();
    closeGB();
    toast('🏅 ' + saved + '명에게 도장을 찍었어요!');
  } finally { hideLoad(); }
}

function renderPlanChips(){
  var el = $('planChips'); if(!el) return;
  if(!S.plans.length){
    el.innerHTML = '<span class="sub">등록한 차시가 없어요. <b>📚 차시 관리</b>에서 미리 넣어두면 여기서 고를 수 있어요.</span>';
    return;
  }
  var h = '<button class="chip sm' + (!S.selPlan?' on':'') + '"' + (!S.selPlan?' style="background:var(--mute)"':'') +
          ' onclick="pickPlan(null)">선택 안 함</button>', i, p, on;
  for(i=0;i<S.plans.length;i++){
    p = S.plans[i]; on = S.selPlan===p.id;
    h += '<button class="chip sm' + (on?' on':'') + '"' + (on?' style="background:var(--ac)"':'') +
         ' onclick="pickPlan(' + p.id + ')">' + esc(p.title) + '</button>';
  }
  el.innerHTML = h;
}
function pickPlan(id){ S.selPlan = id; renderPlanChips(); }
function openPlans(){
  var h = '<h3 style="font-size:var(--fs-m);font-weight:900">📚 차시 관리</h3>' +
          '<div class="sub" style="font-size:var(--fs-xxs);color:var(--ink2);margin-top:4px">' +
          '수업 차시명을 미리 넣어두면, 도장 줄 때 골라 쓸 수 있어요.</div>' +
          '<div style="display:flex;gap:6px;margin-top:14px">' +
          '<input class="inp" id="planIn" maxlength="60" placeholder="예: 3단원 2차시 전기 회로">' +
          '<button class="btn" style="width:auto;padding:11px 18px" onclick="addPlan()">추가</button></div>' +
          '<div id="planList" style="margin-top:14px"></div>' +
          '<button class="btn ghost" style="margin-top:12px" onclick="closeMdl()">닫기</button>';
  $('mdlIn').innerHTML = h; $('mdl').classList.add('show');
  var inp = $('planIn');
  if(inp) inp.addEventListener('keydown', function(e){ if(e.key==='Enter') addPlan(); });
  renderPlanList();
}
function renderPlanList(){
  var el = $('planList'); if(!el) return;
  if(!S.plans.length){ el.innerHTML = '<div class="empty"><div class="e">📚</div><p>아직 등록한 차시가 없어요</p></div>'; return; }
  var h = '', i, p;
  for(i=0;i<S.plans.length;i++){
    p = S.plans[i];
    h += '<div style="display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1.5px dashed var(--line)">' +
         '<span style="flex:1;font-size:var(--fs-xs);font-weight:800">' + esc(p.title) + '</span>' +
         '<button class="chip sm" onclick="delPlan(' + p.id + ')">삭제</button></div>';
  }
  el.innerHTML = h;
}
async function addPlan(){
  var v = (($('planIn') && $('planIn').value) || '').trim();
  if(!v){ toast('차시명을 입력해주세요'); return; }
  showLoad();
  try{
    var r = await sb.from('lesson_plans').insert({ title:v, sort_order:S.plans.length }).select().single();
    if(r.error){
      toast(/relation|does not exist|schema cache/i.test(r.error.message||'')
            ? '차시 기능 준비가 안 됐어요 (4_차시명_추가.sql 실행 필요)' : '추가에 실패했어요');
      console.error(r.error); return;
    }
    $('planIn').value = '';
    await loadPlans(); renderPlanList(); renderPlanChips();
    toast('차시를 추가했어요');
  } finally { hideLoad(); }
}
async function delPlan(id){
  if(!confirm('이 차시를 목록에서 지울까요?\n\n이미 찍은 도장의 기록은 그대로 남습니다.')) return;
  showLoad();
  try{
    await sb.from('lesson_plans').delete().eq('id', id);
    if(S.selPlan===id) S.selPlan = null;
    await loadPlans(); renderPlanList(); renderPlanChips();
  } finally { hideLoad(); }
}

/* ── 역량 · 행동 (선택 사항) ───────────────────────────────────────────── */
function renderCatChips(){
  var el = $('catChips'); if(!el) return;
  var h = '<button class="chip' + (!S.selCat?' on':'') + '"' + (!S.selCat?' style="background:var(--mute)"':'') +
          ' onclick="pickCat(null)">💐 그냥 칭찬</button>', i, bb, on;
  for(i=0;i<BRANCHES.length;i++){
    bb = BRANCHES[i]; on = S.selCat===bb.id;
    h += '<button class="chip' + (on?' on':'') + '"' + (on?' style="background:'+bb.c+'"':'') +
         ' onclick="pickCat(\'' + bb.id + '\')">' + bb.icon + ' ' + esc(catName(bb.id)) + '</button>';
  }
  el.innerHTML = h;
}
function pickCat(id){ S.selCat = id; renderCatChips(); renderBehChips(); }
function renderBehChips(){
  var el = $('behChips'); if(!el) return;
  if(!S.selCat){
    el.innerHTML = '<span style="font-size:var(--fs-xxs);color:var(--mute);font-weight:700">' +
                   '역량을 고르면 자주 쓰는 문장이 여기 나와요 (안 골라도 직접 적을 수 있어요)</span>';
    return;
  }
  var arr = BEHAVIOR_CHIPS[S.selCat] || [], h = '', i;
  for(i=0;i<arr.length;i++) h += '<button class="chip sm" onclick="putBeh(this)">' + esc(arr[i]) + '</button>';
  el.innerHTML = h;
}
function putBeh(btn){
  var ta = $('behIn'), v = btn.textContent;
  ta.value = (ta.value.trim() ? ta.value.trim() + ' ' : '') + v + ' — ';
  ta.focus();
}

/* ── 저장 ──────────────────────────────────────────────────────────────── */
async function saveObs(){
  var ids = Object.keys(S.selSt);
  if(!ids.length){ toast('학생을 먼저 골라주세요'); return; }

  var cat = S.selCat || 'general';
  var note = S.selPlan ? planNote(S.selPlan) : null;       /* 기록: 차시번호 + 개념 */
  var say  = S.selPlan ? planConcept(S.selPlan) : null;    /* 문장: 개념만 */
  var beh = (($('behIn') && $('behIn').value) || '').trim().replace(/[\s\u2014-]+$/,'');
  if(beh.length < 2) beh = say ? (say + ' 수업에서 칭찬받음') : '수업에서 칭찬받음';

  if(ids.length > 5 && !confirm(ids.length + '명에게 도장을 찍을까요?')) return;

  showLoad();
  try{
    var rows = [], i, byId = {}, s;
    for(i=0;i<S.students.length;i++) byId[S.students[i].id] = S.students[i];
    var today = todayStr();
    for(i=0;i<ids.length;i++){
      s = byId[ids[i]] || {};
      rows.push({
        student_id: ids[i], school_year: nowYear(), semester: nowSem(),
        class_no_snap: s.class_no || (S.selClass && S.selClass.cls) || null,
        number_snap: s.number || null,
        category: cat, behavior: beh, lesson_note: note, observed_on: today
      });
    }
    var r = await sb.from('observations').insert(rows).select('id');
    if(r.error){
      toast('저장에 실패했어요 — ' + (r.error.message || r.error.code || ''));
      console.error('[도장] 저장 실패', r.error, rows);
      return;
    }
    var saved = (r.data || []).length;
    if(saved !== rows.length) console.warn('[도장] 요청 ' + rows.length + '명 · 저장 ' + saved + '명', r);
    S.selSt = {}; if($('behIn')) $('behIn').value = ''; _qCache = {};
    await loadTeacherObs(); await loadStudents();
    renderGive();
    toast('🏅 ' + saved + '명에게 도장을 찍었어요!');
  } finally { hideLoad(); }
}

/* 학생 목록 */
function renderStuList(){
  var byId={}, i;
  for(i=0;i<S.teaObs.length;i++){
    var o=S.teaObs[i];
    if(!byId[o.student_id]) byId[o.student_id]={cnt:0,last:null,name:null,cat:{}};
    byId[o.student_id].cnt++;
    byId[o.student_id].cat[o.category]=(byId[o.student_id].cat[o.category]||0)+1;
    if(!byId[o.student_id].last || o.observed_on>byId[o.student_id].last) byId[o.student_id].last=o.observed_on;
  }
  var keys = Object.keys(byId);
  var h = '<div class="card"><div class="hd"><h3>👥 내가 기록한 학생</h3><span class="chip sm">' + keys.length + '명</span></div>';
  if(!keys.length){
    h += '<div class="empty"><div class="e">🌱</div><p>아직 기록이 없어요.<br>「도장 주기」에서 시작해보세요</p></div>';
  } else {
    h += '<div class="sub" style="margin-bottom:10px">이름을 누르면 그 학생의 기록을 볼 수 있어요</div>';
    keys.sort(function(a,b){ return byId[b].cnt - byId[a].cnt; });
    for(i=0;i<keys.length;i++){
      var k=keys[i], v=byId[k], d=daysAgo(v.last);
      var nm = null;
      for(var j=0;j<S.teaObs.length;j++) if(S.teaObs[j].student_id===k){ nm = S.teaObs[j].number_snap; break; }
      h += '<button style="display:flex;width:100%;align-items:center;gap:10px;padding:11px 0;border-bottom:1.5px dashed var(--line);text-align:left" onclick="openStu(\'' + k + '\')">';
      h +=   '<span style="width:34px;height:34px;border-radius:50%;background:var(--ac-l);color:var(--ac-d);display:grid;place-items:center;font-weight:900;font-size:13px;flex-shrink:0">' + (nm||'?') + '</span>';
      h +=   '<span style="flex:1"><span style="font-size:var(--fs-xs);font-weight:900">' + (nm?nm+'번':'학생') + '</span>' +
             '<span style="display:block;font-size:10.5px;color:var(--mute);font-weight:800">마지막 ' + (d===0?'오늘':d+'일 전') + '</span></span>';
      h +=   '<span class="chip sm" style="background:#EAF7EC;border-color:var(--ok);color:var(--ok-d)">🏅 ' + v.cnt + '</span>';
      h += '</button>';
    }
  }
  h += '</div>';
  $('p-stu').innerHTML = h;
}
function openStu(id){
  var list = S.teaObs.filter(function(o){ return o.student_id===id; });
  var h = '<h3 style="font-size:var(--fs-m);font-weight:900">📄 학생 기록 (' + list.length + '개)</h3>';
  h += '<div class="sub" style="font-size:var(--fs-xxs);color:var(--ink2);margin:4px 0 12px">세특 작성 시 이 <b>행동 문장</b>을 근거로 쓰세요</div>';
  if(list.length < 3)
    h += '<div style="background:rgba(232,169,58,.14);border-radius:10px;padding:10px;font-size:var(--fs-xxs);font-weight:800;color:#8a5a00;margin-bottom:10px">⚠️ 기록이 적어요 — 학생이 부족한 게 아니라 <b>내가 덜 본 것</b>일 수 있어요. 다른 근거도 함께 보세요.</div>';
  for(var i=0;i<list.length;i++) h += stampRow(list[i]);
  h += '<button class="btn ghost" style="margin-top:12px" onclick="copyStu(\'' + id + '\')">📋 요약 복사</button>';
  h += '<button class="btn ghost" style="margin-top:8px" onclick="closeMdl()">닫기</button>';
  $('mdlIn').innerHTML = h; $('mdl').classList.add('show');
}
function copyStu(id){
  var list = S.teaObs.filter(function(o){ return o.student_id===id; });
  var t = list.map(function(o){ return o.observed_on + ' [' + catName(o.category) + '] ' + o.behavior + (o.lesson_note?' ('+o.lesson_note+')':''); }).join('\n');
  navigator.clipboard.writeText(t).then(function(){ toast('복사했어요! 생기부 도우미에 붙여넣으세요'); },
                                        function(){ toast('복사에 실패했어요'); });
}

/* 쿠폰 */
async function renderCoupons(){
  $('p-cp').innerHTML = '<div class="card"><div class="empty"><div class="spin" style="margin:0 auto"></div></div></div>';
  var r = await sb.from('stamp_rewards').select('*').eq('status','issued').order('issued_at',{ascending:false}).limit(100);
  S.coupons = r.data || [];

  /* 누가 요청했는지 알아야 지급을 할 수 있다.
     stamp_rewards 를 그냥 조인하면 RLS 에 걸릴 수 있어 이름만 따로 가져와 붙인다. */
  var who = {}, ids = [], i, k;
  for(i=0;i<S.coupons.length;i++){
    k = S.coupons[i].student_id;
    if(k && ids.indexOf(k) < 0) ids.push(k);
  }
  if(ids.length){
    var pr = await sb.from('profiles').select('id,name,grade,class_no,number').in('id', ids);
    var rows = pr.data || [];
    for(i=0;i<rows.length;i++) who[rows[i].id] = rows[i];
  }

  /* 같은 학생의 쿠폰은 한 묶음으로 — 한 명 불러 한꺼번에 주려고 */
  var grp = {};
  for(i=0;i<S.coupons.length;i++){
    k = S.coupons[i].student_id;
    (grp[k] = grp[k] || []).push(S.coupons[i]);
  }
  var keys = Object.keys(grp);
  keys.sort(function(a,b){
    var x = who[a] || {}, y = who[b] || {};
    return (x.grade||99) - (y.grade||99)
        || (x.class_no||99) - (y.class_no||99)
        || (x.number||999) - (y.number||999)
        || String(x.name||'').localeCompare(String(y.name||''));
  });

  function md(t){ var d = String(t||''); return d.length >= 10 ? d.slice(5,7)+'/'+d.slice(8,10) : ''; }

  var h = '<div class="card"><div class="hd"><h3>🎟️ 지급할 쿠폰</h3><span class="chip sm">'
        + S.coupons.length + '건 · ' + keys.length + '명</span></div>';
  if(!S.coupons.length){
    h += '<div class="empty"><div class="e">🎫</div><p>지급할 쿠폰이 없어요</p></div>';
  } else {
    h += '<div class="sub" style="margin-bottom:10px">학생에게 실물을 준 뒤 「지급 완료」를 눌러주세요</div>';
    for(var g=0;g<keys.length;g++){
      var p = who[keys[g]], list = grp[keys[g]];
      var nm = p && p.name ? esc(p.name) : '이름을 불러오지 못했어요';
      var cls = p && p.grade ? (p.grade + '학년 ' + (p.class_no||'?') + '반 ' + (p.number||'?') + '번') : '';
      h += '<div class="cp-who"><span class="cp-av">🙋</span>'
         +   '<span class="cp-nm">' + nm + '</span>'
         +   (cls ? '<span class="cp-cls">' + esc(cls) + '</span>' : '')
         +   '<span class="cp-cnt">' + list.length + '건</span></div>';
      for(i=0;i<list.length;i++){
        var c = list[i];
        h += '<div class="coupon"><div style="display:flex;align-items:center;gap:10px">';
        h +=   '<span style="font-size:22px">🎫</span>';
        h +=   '<div style="flex:1"><div style="font-size:var(--fs-xs);font-weight:900">' + esc(c.reward_name) + '</div>' +
               '<div style="font-size:10.5px;font-weight:800;color:var(--mute)">🎟️ ' + c.cost + '개 · 요청 ' +
               md(c.issued_at) + ' · ~' + esc(c.expires_on) + '</div></div>';
        h +=   '<button class="rw-btn" onclick="doneCoupon(' + c.id + ')">지급 완료</button>';
        h += '</div></div>';
      }
    }
  }
  h += '</div>';
  $('p-cp').innerHTML = h;
}
async function doneCoupon(id){
  showLoad();
  try{
    var r = await sb.from('stamp_rewards').update({status:'done', done_at:new Date().toISOString(), done_by:S.user.id}).eq('id', id);
    if(r.error){ toast('처리에 실패했어요'); console.error(r.error); return; }
    await renderCoupons(); toast('지급 완료 처리했어요');
  } finally { hideLoad(); }
}

/* 내보내기 */
function renderExport(){
  var h = '<div class="card"><h3>📤 생기부용 내보내기</h3>';
  h += '<div class="sub">학생별 <b>날짜 · 역량 · 행동</b> 기록을 내려받아 세특 작성에 씁니다</div>';
  h += '<div style="background:rgba(217,83,79,.09);border-radius:10px;padding:10px;font-size:var(--fs-xxs);font-weight:800;color:var(--bad);margin:12px 0">⚠️ 학생 개인정보가 담긴 파일입니다. 다운로드 후 관리에 주의해주세요.</div>';
  h += '<label class="fl">반 (비우면 전체)</label><input class="inp" id="exC" type="number" inputmode="numeric" placeholder="예: 3">';
  h += '<button class="btn" style="margin-top:12px" onclick="doExport()">⬇️ CSV 내려받기</button>';
  h += '<button class="btn ghost" style="margin-top:8px" onclick="doCopyAll()">📋 전체 요약 복사</button>';
  h += '<div class="sub" style="margin-top:12px">현재 내 기록: <b>' + S.teaObs.length + '건</b></div></div>';
  $('p-out').innerHTML = h;
}
function exRows(){
  var c = ($('exC') && $('exC').value.trim()) || '';
  return S.teaObs.filter(function(o){ return !c || String(o.class_no_snap)===c; });
}
function doExport(){
  var rows = exRows();
  if(!rows.length){ toast('내보낼 기록이 없어요'); return; }
  var head = '학년도,학기,반,번호,날짜,역량,관찰된 행동,수업\n';
  var body = rows.map(function(o){
    var q = function(v){ return '"' + String(v==null?'':v).replace(/"/g,'""') + '"'; };
    return [o.school_year,o.semester,o.class_no_snap||'',o.number_snap||'',o.observed_on,
            catName(o.category),o.behavior,o.lesson_note||''].map(q).join(',');
  }).join('\n');
  var blob = new Blob(['﻿'+head+body], {type:'text/csv;charset=utf-8;'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '칭찬도장_관찰기록_' + todayStr() + '.csv';
  a.click(); URL.revokeObjectURL(a.href);
  toast('내려받았어요 (' + rows.length + '건)');
}
function doCopyAll(){
  var rows = exRows();
  if(!rows.length){ toast('복사할 기록이 없어요'); return; }
  var by={}, i;
  for(i=0;i<rows.length;i++){
    var k = (rows[i].class_no_snap||'?') + '-' + (rows[i].number_snap||'?');
    (by[k]=by[k]||[]).push(rows[i]);
  }
  var out = Object.keys(by).sort().map(function(k){
    return '[' + k + ']\n' + by[k].map(function(o){
      return '  ' + o.observed_on + ' (' + catName(o.category) + ') ' + o.behavior;
    }).join('\n');
  }).join('\n\n');
  navigator.clipboard.writeText(out).then(function(){ toast('복사했어요 (' + rows.length + '건)'); },
                                          function(){ toast('복사에 실패했어요'); });
}

/* ══════════════════════════════════════════════════════════════════════════
   시작
   ══════════════════════════════════════════════════════════════════════════ */
$('schoolName').textContent = CONFIG.schoolName;
document.title = '🏅 ' + CONFIG.schoolName + ' 칭찬도장판';
$('mdl').addEventListener('click', function(e){ if(e.target===this) closeMdl(); });

(async function init(){
  var s = await sb.auth.getSession();
  if(s.data && s.data.session && s.data.session.user){
    S.user = s.data.session.user;
    var t = await sb.from('teachers').select('*').eq('auth_id', S.user.id).maybeSingle();
    if(t.data){ S.teacher = t.data; await bootTeacher(); }
    else { await bootStudent(); }
  }
})();
</script>
