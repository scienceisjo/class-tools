async function delPlan(id){
  if(!confirm('이 차시를 목록에서 지울까요?\n\n이미 찍은 도장의 기록은 그대로 남습니다.')) return;
  showLoad();
  try{
    await sb.from('lesson_plans').delete().eq('id', id);
    if(S.selPlan===id) S.selPlan = null;
    await loadPlans(); renderPlanList(); renderPlanChips();
  } finally { hideLoad(); }
}

/* ── 역량 · 행동 (선택 사항) ───────────────────────────────────────────── */
function renderCatChips(){
  var el = $('catChips'); if(!el) return;
  var h = '<button class="chip' + (!S.selCat?' on':'') + '"' + (!S.selCat?' style="background:var(--mute)"':'') +
          ' onclick="pickCat(null)">💐 그냥 칭찬</button>', i, bb, on;
  for(i=0;i<BRANCHES.length;i++){
    bb = BRANCHES[i]; on = S.selCat===bb.id;
    h += '<button class="chip' + (on?' on':'') + '"' + (on?' style="background:'+bb.c+'"':'') +
         ' onclick="pickCat(\'' + bb.id + '\')">' + bb.icon + ' ' + esc(catName(bb.id)) + '</button>';
  }
  el.innerHTML = h;
}
function pickCat(id){ S.selCat = id; renderCatChips(); renderBehChips(); }
function renderBehChips(){
  var el = $('behChips'); if(!el) return;
  if(!S.selCat){
    el.innerHTML = '<span style="font-size:var(--fs-xxs);color:var(--mute);font-weight:700">' +
                   '역량을 고르면 자주 쓰는 문장이 여기 나와요 (안 골라도 직접 적을 수 있어요)</span>';
    return;
  }
  var arr = BEHAVIOR_CHIPS[S.selCat] || [], h = '', i;
  for(i=0;i<arr.length;i++) h += '<button class="chip sm" onclick="putBeh(this)">' + esc(arr[i]) + '</button>';
  el.innerHTML = h;
}
function putBeh(btn){
  var ta = $('behIn'), v = btn.textContent;
  ta.value = (ta.value.trim() ? ta.value.trim() + ' ' : '') + v + ' — ';
  ta.focus();
}

/* ── 저장 ──────────────────────────────────────────────────────────────── */
async function saveObs(){
  var ids = Object.keys(S.selSt);
  if(!ids.length){ toast('학생을 먼저 골라주세요'); return; }

  var cat = S.selCat || 'general';
  var note = S.selPlan ? planNote(S.selPlan) : null;       /* 기록: 차시번호 + 개념 */
  var say  = S.selPlan ? planConcept(S.selPlan) : null;    /* 문장: 개념만 */
  var beh = (($('behIn') && $('behIn').value) || '').trim().replace(/[\s\u2014-]+$/,'');
  if(beh.length < 2) beh = say ? (say + ' 수업에서 칭찬받음') : '수업에서 칭찬받음';

  if(ids.length > 5 && !confirm(ids.length + '명에게 도장을 찍을까요?')) return;

  showLoad();
  try{
    var rows = [], i, byId = {}, s;
    for(i=0;i<S.students.length;i++) byId[S.students[i].id] = S.students[i];
    var today = new Date().toISOString().slice(0,10);
    for(i=0;i<ids.length;i++){
      s = byId[ids[i]] || {};
      rows.push({
        student_id: ids[i], school_year: nowYear(), semester: nowSem(),
        class_no_snap: s.class_no || (S.selClass && S.selClass.cls) || null,
        number_snap: s.number || null,
        category: cat, behavior: beh, lesson_note: note, observed_on: today
      });
    }
    var r = await sb.from('observations').insert(rows);
    if(r.error){ toast('저장에 실패했어요'); console.error(r.error); return; }
    S.selSt = {}; if($('behIn')) $('behIn').value = ''; _qCache = {};
    await loadTeacherObs(); await loadStudents();
    renderGive();
    toast('🏅 ' + rows.length + '명에게 도장을 찍었어요!');
  } finally { hideLoad(); }
}

/* 학생 목록 */
function renderStuList(){
  var byId={}, i;
  for(i=0;i<S.teaObs.length;i++){
    var o=S.teaObs[i];
    if(!byId[o.student_id]) byId[o.student_id]={cnt:0,last:null,name:null,cat:{}};
    byId[o.student_id].cnt++;
    byId[o.student_id].cat[o.category]=(byId[o.student_id].cat[o.category]||0)+1;
    if(!byId[o.student_id].last || o.observed_on>byId[o.student_id].last) byId[o.student_id].last=o.observed_on;
  }
  var keys = Object.keys(byId);
  var h = '<div class="card"><div class="hd"><h3>👥 내가 기록한 학생</h3><span class="chip sm">' + keys.length + '명</span></div>';
  if(!keys.length){
    h += '<div class="empty"><div class="e">🌱</div><p>아직 기록이 없어요.<br>「도장 주기」에서 시작해보세요</p></div>';
  } else {
    h += '<div class="sub" style="margin-bottom:10px">이름을 누르면 그 학생의 기록을 볼 수 있어요</div>';
    keys.sort(function(a,b){ return byId[b].cnt - byId[a].cnt; });
    for(i=0;i<keys.length;i++){
      var k=keys[i], v=byId[k], d=daysAgo(v.last);
      var nm = null;
      for(var j=0;j<S.teaObs.length;j++) if(S.teaObs[j].student_id===k){ nm = S.teaObs[j].number_snap; break; }
      h += '<button style="display:flex;width:100%;align-items:center;gap:10px;padding:11px 0;border-bottom:1.5px dashed var(--line);text-align:left" onclick="openStu(\'' + k + '\')">';
      h +=   '<span style="width:34px;height:34px;border-radius:50%;background:var(--ac-l);color:var(--ac-d);display:grid;place-items:center;font-weight:900;font-size:13px;flex-shrink:0">' + (nm||'?') + '</span>';
      h +=   '<span style="flex:1"><span style="font-size:var(--fs-xs);font-weight:900">' + (nm?nm+'번':'학생') + '</span>' +
             '<span style="display:block;font-size:10.5px;color:var(--mute);font-weight:800">마지막 ' + (d===0?'오늘':d+'일 전') + '</span></span>';
      h +=   '<span class="chip sm" style="background:#EAF7EC;border-color:var(--ok);color:var(--ok-d)">🏅 ' + v.cnt + '</span>';
      h += '</button>';
    }
  }
  h += '</div>';
  $('p-stu').innerHTML = h;
}
function openStu(id){
  var list = S.teaObs.filter(function(o){ return o.student_id===id; });
  var h = '<h3 style="font-size:var(--fs-m);font-weight:900">📄 학생 기록 (' + list.length + '개)</h3>';
  h += '<div class="sub" style="font-size:var(--fs-xxs);color:var(--ink2);margin:4px 0 12px">세특 작성 시 이 <b>행동 문장</b>을 근거로 쓰세요</div>';
  if(list.length < 3)
    h += '<div style="background:rgba(232,169,58,.14);border-radius:10px;padding:10px;font-size:var(--fs-xxs);font-weight:800;color:#8a5a00;margin-bottom:10px">⚠️ 기록이 적어요 — 학생이 부족한 게 아니라 <b>내가 덜 본 것</b>일 수 있어요. 다른 근거도 함께 보세요.</div>';
  for(var i=0;i<list.length;i++) h += stampRow(list[i]);
  h += '<button class="btn ghost" style="margin-top:12px" onclick="copyStu(\'' + id + '\')">📋 요약 복사</button>';
  h += '<button class="btn ghost" style="margin-top:8px" onclick="closeMdl()">닫기</button>';
  $('mdlIn').innerHTML = h; $('mdl').classList.add('show');
}
function copyStu(id){
  var list = S.teaObs.filter(function(o){ return o.student_id===id; });
  var t = list.map(function(o){ return o.observed_on + ' [' + catName(o.category) + '] ' + o.behavior + (o.lesson_note?' ('+o.lesson_note+')':''); }).join('\n');
  navigator.clipboard.writeText(t).then(function(){ toast('복사했어요! 생기부 도우미에 붙여넣으세요'); },
                                        function(){ toast('복사에 실패했어요'); });
}

/* 쿠폰 */
async function renderCoupons(){
  $('p-cp').innerHTML = '<div class="card"><div class="empty"><div class="spin" style="margin:0 auto"></div></div></div>';
  var r = await sb.from('stamp_rewards').select('*').eq('status','issued').order('issued_at',{ascending:false}).limit(100);
  S.coupons = r.data || [];
  var h = '<div class="card"><div class="hd"><h3>🎟️ 지급할 쿠폰</h3><span class="chip sm">' + S.coupons.length + '건</span></div>';
  if(!S.coupons.length){
    h += '<div class="empty"><div class="e">🎫</div><p>지급할 쿠폰이 없어요</p></div>';
  } else {
    h += '<div class="sub" style="margin-bottom:10px">학생에게 실물을 준 뒤 「지급 완료」를 눌러주세요</div>';
    for(var i=0;i<S.coupons.length;i++){
      var c=S.coupons[i];
      h += '<div class="coupon"><div style="display:flex;align-items:center;gap:10px">';
      h +=   '<span style="font-size:22px">🎫</span>';
      h +=   '<div style="flex:1"><div style="font-size:var(--fs-xs);font-weight:900">' + esc(c.reward_name) + '</div>' +
             '<div style="font-size:10.5px;font-weight:800;color:var(--mute)">🎟️ ' + c.cost + '개 · ~' + esc(c.expires_on) + '</div></div>';
      h +=   '<button class="rw-btn" onclick="doneCoupon(' + c.id + ')">지급 완료</button>';
      h += '</div></div>';
    }
  }
  h += '</div>';
  $('p-cp').innerHTML = h;
}
async function doneCoupon(id){
  showLoad();
  try{
    var r = await sb.from('stamp_rewards').update({status:'done', done_at:new Date().toISOString(), done_by:S.user.id}).eq('id', id);
    if(r.error){ toast('처리에 실패했어요'); console.error(r.error); return; }
    await renderCoupons(); toast('지급 완료 처리했어요');
  } finally { hideLoad(); }
}

/* 내보내기 */
function renderExport(){
  var h = '<div class="card"><h3>📤 생기부용 내보내기</h3>';
  h += '<div class="sub">학생별 <b>날짜 · 역량 · 행동</b> 기록을 내려받아 세특 작성에 씁니다</div>';
  h += '<div style="background:rgba(217,83,79,.09);border-radius:10px;padding:10px;font-size:var(--fs-xxs);font-weight:800;color:var(--bad);margin:12px 0">⚠️ 학생 개인정보가 담긴 파일입니다. 다운로드 후 관리에 주의해주세요.</div>';
  h += '<label class="fl">반 (비우면 전체)</label><input class="inp" id="exC" type="number" inputmode="numeric" placeholder="예: 3">';
  h += '<button class="btn" style="margin-top:12px" onclick="doExport()">⬇️ CSV 내려받기</button>';
  h += '<button class="btn ghost" style="margin-top:8px" onclick="doCopyAll()">📋 전체 요약 복사</button>';
  h += '<div class="sub" style="margin-top:12px">현재 내 기록: <b>' + S.teaObs.length + '건</b></div></div>';
  $('p-out').innerHTML = h;
}
function exRows(){
  var c = ($('exC') && $('exC').value.trim()) || '';
  return S.teaObs.filter(function(o){ return !c || String(o.class_no_snap)===c; });
}
function doExport(){
  var rows = exRows();
  if(!rows.length){ toast('내보낼 기록이 없어요'); return; }
  var head = '학년도,학기,반,번호,날짜,역량,관찰된 행동,수업\n';
  var body = rows.map(function(o){
    var q = function(v){ return '"' + String(v==null?'':v).replace(/"/g,'""') + '"'; };
    return [o.school_year,o.semester,o.class_no_snap||'',o.number_snap||'',o.observed_on,
            catName(o.category),o.behavior,o.lesson_note||''].map(q).join(',');
  }).join('\n');
  var blob = new Blob(['﻿'+head+body], {type:'text/csv;charset=utf-8;'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '칭찬도장_관찰기록_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click(); URL.revokeObjectURL(a.href);
  toast('내려받았어요 (' + rows.length + '건)');
}
function doCopyAll(){
  var rows = exRows();
  if(!rows.length){ toast('복사할 기록이 없어요'); return; }
  var by={}, i;
  for(i=0;i<rows.length;i++){
    var k = (rows[i].class_no_snap||'?') + '-' + (rows[i].number_snap||'?');
    (by[k]=by[k]||[]).push(rows[i]);
  }
  var out = Object.keys(by).sort().map(function(k){
    return '[' + k + ']\n' + by[k].map(function(o){
      return '  ' + o.observed_on + ' (' + catName(o.category) + ') ' + o.behavior;
    }).join('\n');
  }).join('\n\n');
  navigator.clipboard.writeText(out).then(function(){ toast('복사했어요 (' + rows.length + '건)'); },
                                          function(){ toast('복사에 실패했어요'); });
}

/* ══════════════════════════════════════════════════════════════════════════
   시작
   ══════════════════════════════════════════════════════════════════════════ */
$('schoolName').textContent = CONFIG.schoolName;
document.title = '🏅 ' + CONFIG.schoolName + ' 칭찬도장판';
$('mdl').addEventListener('click', function(e){ if(e.target===this) closeMdl(); });

(async function init(){
  var s = await sb.auth.getSession();
  if(s.data && s.data.session && s.data.session.user){
    S.user = s.data.session.user;
    var t = await sb.from('teachers').select('*').eq('auth_id', S.user.id).maybeSingle();
    if(t.data){ S.teacher = t.data; await bootTeacher(); }
    else { await bootStudent(); }
  }
})();
</script>
