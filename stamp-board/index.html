<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🏅 과학 칭찬도장판</title>
<meta name="theme-color" content="#0f2622">
<meta name="description" content="칭찬을 모으면 나만의 캐릭터가 자라는 과학 칭찬도장판">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Gowun+Batang:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="packs.js?v=world-packs-20260914"></script>
<style>
:root{
  --paper:#FBF6E9; --paper2:#F3EBD6; --card:#FFFDF7;
  --ink:#3A3226; --ink2:#6B5F4E; --mute:#A39682;
  --line:#E0D3B8; --line2:#CDBC9A;
  --ac:#C2703E; --ac-d:#9C5427; --ac-l:#F0D9C6;
  --ok:#5CB86E; --ok-d:#3D8B4F; --warn:#E8A93A; --bad:#D9534F;
  --fs-xxs:clamp(11px,2.5vw,13px); --fs-xs:clamp(12.5px,2.9vw,14.5px);
  --fs-s:clamp(14px,3.2vw,16px);   --fs-m:clamp(16px,3.8vw,19px);
  --fs-l:clamp(19px,4.6vw,24px);   --fs-xl:clamp(24px,6vw,34px);
  --font:'Pretendard Variable',Pretendard,-apple-system,system-ui,'Malgun Gothic',sans-serif;
  --sh:0 4px 20px rgba(120,100,70,.10);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--font);color:var(--ink);background:var(--paper);
  background-image:radial-gradient(rgba(180,160,120,.10) 1px,transparent 1px),
                   radial-gradient(rgba(180,160,120,.07) 1px,transparent 1px);
  background-size:22px 22px,22px 22px;background-position:0 0,11px 11px;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{border:none;background:none;cursor:pointer}

/* ── 화면 ── */
.scr{display:none;min-height:100dvh;flex-direction:column}
.scr.on{display:flex}
.wrap{width:100%;max-width:960px;margin:0 auto;padding:0 clamp(12px,3.5vw,22px)}

/* ── 로그인 ── */
#s-login{align-items:center;justify-content:center;padding:24px 0 40px}
.lg-card{background:var(--card);border:2px solid var(--line);border-radius:24px;
  padding:clamp(22px,5vw,36px);box-shadow:var(--sh);width:min(430px,94vw)}
.lg-logo{text-align:center;font-size:clamp(44px,11vw,68px);line-height:1}
.lg-t{text-align:center;font-size:var(--fs-xl);font-weight:900;margin-top:4px;letter-spacing:-.02em}
.lg-s{text-align:center;font-size:var(--fs-xs);color:var(--ink2);font-weight:600;margin-top:6px;line-height:1.5}
.lg-tabs{display:flex;gap:6px;margin:22px 0 16px;background:rgba(0,0,0,.045);padding:4px;border-radius:12px}
.lg-tab{flex:1;padding:9px;border-radius:9px;font-size:var(--fs-xs);font-weight:800;color:var(--mute)}
.lg-tab.on{background:#fff;color:var(--ac-d);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.fl{display:block;font-size:var(--fs-xxs);font-weight:800;color:var(--ink2);margin:12px 0 5px}
.inp{width:100%;padding:11px 13px;border:2px solid var(--line);border-radius:11px;background:#fff;
  font-size:var(--fs-s);font-weight:600;outline:none}
.inp:focus{border-color:var(--ac)}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:13px;
  border-radius:13px;background:var(--ac);color:#fff;font-size:var(--fs-s);font-weight:900;
  box-shadow:0 4px 14px rgba(194,112,62,.3);transition:transform .12s}
.btn:active{transform:translateY(2px)}
.btn.g{background:var(--ok-d);box-shadow:0 4px 14px rgba(61,139,79,.28)}
.btn.ghost{background:#fff;color:var(--ink2);border:2px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.5}
.err{display:none;margin-top:10px;background:rgba(217,83,79,.1);color:var(--bad);
  border-radius:9px;padding:9px 12px;font-size:var(--fs-xxs);font-weight:800}
.err.show{display:block}

/* ── 헤더 ── */
.hdr{position:sticky;top:0;z-index:30;background:rgba(251,246,233,.94);backdrop-filter:blur(12px);
  border-bottom:2px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:10px;padding:10px 0}
.hdr-t{font-size:var(--fs-s);font-weight:900;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-b{font-size:var(--fs-xxs);font-weight:800;color:var(--mute);padding:6px 11px;border-radius:999px;
  border:1.5px solid var(--line);background:#fff}

/* ── 탭바 ── */
.tabs{display:flex;gap:4px;padding:0 0 8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:78px;min-height:44px;padding:11px 6px;border-radius:12px;font-size:var(--fs-xxs);
  font-weight:800;color:var(--mute);background:#fff;border:1.5px solid var(--line);white-space:nowrap}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}

main{flex:1;padding:14px 0 90px}
.pane{display:none}
.pane.on{display:block;animation:up .25s ease}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ── 카드 ── */
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;
  padding:clamp(14px,3.4vw,20px);box-shadow:var(--sh);margin-bottom:12px}
.card h3{font-size:var(--fs-m);font-weight:900;margin-bottom:4px}
.card .sub{font-size:var(--fs-xxs);color:var(--ink2);font-weight:600;line-height:1.5}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}

/* ── 학생 도장판 ── */
.char-box{text-align:center;position:relative}
.char-box svg,.char-box img.charimg{width:min(260px,64vw);height:auto;display:block;margin:0 auto}

/* 🔭 다음 단계 미리보기 — 무엇이 되는지 알아야 모으고 싶어진다 */
.peek{margin-top:12px;border:2px dashed var(--line);border-radius:14px;
 padding:11px 13px;background:var(--paper2)}
.peek.done{border-style:solid;border-color:var(--ok);background:var(--paper2)}
.peek-row{display:flex;align-items:center;gap:13px;text-align:left}
.peek-img{position:relative;width:68px;flex:none}
.char-box .peek-img svg,.char-box .peek-img img.charimg{
 width:68px;height:68px;object-fit:contain;display:block;margin:0;
 filter:grayscale(.2) contrast(.95);opacity:.9}
.peek-img .lk{position:absolute;right:-1px;bottom:-1px;font-size:15px;
 background:#fff;border-radius:999px;padding:1px 3px;box-shadow:var(--sh)}
.peek-tx{flex:1;min-width:0}
.peek-tx .k{display:block;font-size:var(--fs-xxs);color:var(--mute)}
.peek-tx .nm{display:block;font-size:var(--fs-m);font-weight:900;margin:1px 0 2px;line-height:1.25}
.peek-tx .nd{display:block;font-size:var(--fs-xs);color:var(--ink2);line-height:1.5}
.peek-tx .nd b{color:var(--ac-d)}
.peek-b{font-size:var(--fs-xxs);color:var(--mute);margin-top:9px;line-height:1.65;text-align:left}
.peek-b b{color:var(--ink)}
.peek-go{margin-top:10px;width:100%}
.char-name{font-size:var(--fs-l);font-weight:900;margin-top:2px}
.char-sub{font-size:var(--fs-xs);color:var(--ink2);font-weight:700}
.counters{display:flex;gap:10px;justify-content:center;margin:14px 0 6px}
.cnt{background:#fff;border:2px solid var(--line);border-radius:14px;padding:9px 16px;min-width:100px}
.cnt .n{font-size:var(--fs-l);font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.cnt .l{font-size:10.5px;font-weight:800;color:var(--mute);margin-top:3px}
.cnt.earn .n{color:var(--ac-d)} .cnt.bal .n{color:var(--ok-d)}
.bar{height:14px;border-radius:999px;background:#E8DCC4;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--warn));
  border-radius:999px;transition:width .5s ease}
.bar-l{display:flex;justify-content:space-between;font-size:10.5px;font-weight:800;color:var(--mute);margin-top:5px}

/* ── 도장 목록 ── */
.stamp{display:flex;gap:11px;padding:11px 0;border-bottom:1.5px dashed var(--line)}
.stamp:last-child{border-bottom:none}
.stamp-ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:20px;flex-shrink:0;
  border:2.5px dashed rgba(0,0,0,.14)}
.stamp-b{flex:1;min-width:0}
.stamp-cat{font-size:10.5px;font-weight:900;padding:2px 8px;border-radius:999px;display:inline-block}
.stamp-bh{font-size:var(--fs-xs);font-weight:700;line-height:1.5;margin-top:4px;word-break:keep-all}
.stamp-m{font-size:10.5px;color:var(--mute);font-weight:700;margin-top:3px}

/* ── 선택 칩 ── */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:8px 13px;border-radius:999px;border:2px solid var(--line);background:#fff;
  font-size:var(--fs-xxs);font-weight:800;color:var(--ink2)}
/* 고른 칩 — 바탕색을 여기서 준다. 예전엔 글자만 희게 두고 바탕은 부르는 쪽에서
   inline 으로 붙였는데, 안 붙인 곳(배경음 칩 등)은 흰 바탕에 흰 글씨가 됐다.
   inline 이 우선이라 따로 색을 준 칩은 그대로 간다. */
.chip.on{background:var(--ac);color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(0,0,0,.16)}
.chip.sm{padding:6px 11px;font-size:11.5px}

/* ── 교사: 학생 그리드 ── */
.stu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:7px}
.stu{padding:9px 5px;border-radius:12px;border:2px solid var(--line);background:#fff;text-align:center;position:relative}
.stu.sel{border-color:var(--ac);background:#FFF4EA;box-shadow:0 3px 10px rgba(194,112,62,.2)}
.stu-n{font-size:var(--fs-xs);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stu-m{font-size:10px;font-weight:800;color:var(--mute);margin-top:2px}
.stu-m.cold{color:var(--bad)}
.stu-c{position:absolute;top:-5px;right:-4px;background:var(--ok-d);color:#fff;font-size:10px;font-weight:900;
  min-width:19px;height:19px;border-radius:999px;display:grid;place-items:center;padding:0 5px}
.stu-c.zero{background:var(--mute)}
/* 🌳 질문과수원 연계 — 학생의 최근 질문 */
.qhint{background:#F2FAF3;border:2px solid rgba(92,184,110,.35);border-radius:14px;padding:11px 13px;margin-top:11px}
.qhint-h{font-size:11.5px;font-weight:900;color:var(--ok-d);margin-bottom:7px;display:flex;align-items:center;gap:5px}
.qh-item{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed rgba(92,184,110,.3)}
.qh-item:last-child{border-bottom:none}
.qh-t{flex:1;font-size:var(--fs-xxs);font-weight:700;line-height:1.5;word-break:keep-all}
.qh-d{font-size:10px;color:var(--mute);font-weight:800;margin-top:2px}
.qh-b{flex-shrink:0;padding:5px 9px;border-radius:8px;background:var(--ok-d);color:#fff;font-size:10.5px;font-weight:900}
/* 💡 이럴 때 도장을 받아요 */
.how{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1.5px dashed var(--line)}
.how:last-child{border-bottom:none}
.how-ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:17px;flex-shrink:0;background:var(--ac-l)}
.how-t{flex:1;font-size:var(--fs-xs);font-weight:800;line-height:1.5;word-break:keep-all}
.how-s{font-size:10.5px;color:var(--mute);font-weight:700;margin-top:2px}

/* ── 우리 반 기지 ── */
.base-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:9px}
.mate{text-align:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:7px 4px}
.mate svg,.mate img.charimg{width:100%;height:auto}
.mate-n{font-size:11.5px;font-weight:900;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mate-b{font-size:10px;font-weight:800;color:var(--mute)}
.mate.me{border-color:var(--ac);background:#FFF8F1}

/* ── 보상 ── */
.rw{display:flex;align-items:center;gap:11px;padding:11px;border:2px solid var(--line);
  border-radius:14px;background:#fff;margin-bottom:8px}
.rw-ic{font-size:23px;width:38px;text-align:center;flex-shrink:0}
.rw-b{flex:1;min-width:0}
.rw-n{font-size:var(--fs-xs);font-weight:900}
.rw-c{font-size:10.5px;font-weight:800;color:var(--mute);margin-top:2px}
.rw-btn{padding:7px 13px;border-radius:10px;background:var(--ok-d);color:#fff;font-size:11.5px;font-weight:900;flex-shrink:0}
.rw-btn:disabled{background:#D8CDB6;color:#fff}
.rw.locked{opacity:.55}
.rw.honor{border-color:var(--warn);background:#FFFBF0}
.coupon{border:2.5px dashed var(--ac);border-radius:14px;padding:12px;background:#FFF4EA;margin-bottom:8px}
/* 누가 요청했는지 — 쿠폰 묶음의 머리 */
.cp-who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 2px 7px;padding-bottom:6px;border-bottom:2px solid var(--ac)}
.cp-who:first-of-type{margin-top:2px}
.cp-av{font-size:19px}
.cp-nm{font-size:var(--fs-s);font-weight:900;color:var(--ac)}
.cp-cls{font-size:11px;font-weight:800;color:var(--mute)}
.cp-cnt{margin-left:auto;font-size:11px;font-weight:900;color:var(--ac);background:#FFF4EA;border:1.5px solid var(--ac);border-radius:999px;padding:3px 10px}
.coupon.done{border-style:solid;border-color:var(--line);background:#F6F1E4;opacity:.7}

/* ── 기타 ── */
.empty{text-align:center;padding:34px 16px;color:var(--mute)}
.empty .e{font-size:40px} .empty p{font-size:var(--fs-xs);font-weight:700;margin-top:8px;line-height:1.6}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(58,50,38,.95);
  color:#fff;padding:12px 20px;border-radius:999px;font-size:var(--fs-xs);font-weight:800;z-index:200;
  box-shadow:0 8px 26px rgba(0,0,0,.3);max-width:88vw;text-align:center}
.load{position:fixed;inset:0;background:rgba(251,246,233,.9);display:none;place-items:center;z-index:300}
.load.show{display:grid}
.spin{width:38px;height:38px;border:4px solid var(--line);border-top-color:var(--ac);border-radius:50%;
  animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.mdl{position:fixed;inset:0;background:rgba(58,50,38,.45);display:none;align-items:center;justify-content:center;
  z-index:150;padding:16px}
.mdl.show{display:flex}
.mdl-in{background:var(--card);border-radius:20px;padding:20px;width:min(440px,94vw);max-height:86dvh;overflow-y:auto;
  border:2px solid var(--line)}
.pick{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}
/* 📖 캐릭터 도감 — 앞으로 어떤 모습이 되는지 미리 본다 */
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:10px}
.dex-i{position:relative;border:2px solid var(--line);border-radius:13px;padding:7px 4px 6px;background:#fff;text-align:center}
.dex-i.got{border-color:var(--ok);background:#F4FBF5}
.dex-i.now{border-color:var(--ac);background:var(--ac-l);box-shadow:0 0 0 3px rgba(194,112,62,.16)}
.dex-i.soon{opacity:.62}
.dex-i svg,.dex-i img.charimg{width:100%;height:auto;max-height:74px;object-fit:contain}
.dex-n{font-size:11px;font-weight:900;color:var(--ink);margin-top:3px;line-height:1.3;word-break:keep-all}
.dex-c{font-size:10px;font-weight:800;color:var(--mute);margin-top:1px}
.dex-i.got .dex-c{color:var(--ok-d)}
.dex-i.now .dex-c{color:var(--ac-d)}
.dex-b{position:absolute;top:4px;right:5px;font-size:11px}
.dex-tabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.dex-tabs::-webkit-scrollbar{display:none}
.dex-tabs button{flex:0 0 auto}
.pick-i{border:2px solid var(--line);border-radius:14px;padding:9px 5px;background:#fff;text-align:center}
.pick-i.on{border-color:var(--ac);background:#FFF4EA}
.pick-i svg,.pick-i img.charimg{width:100%;height:auto}
/* 밝은 배경의 개별 이미지가 선택 카드 색과 자연스럽게 어울리도록 한다. */
.dex-i img.charimg,.pick-i img.charimg{mix-blend-mode:multiply}
.pick-i .t{font-size:11.5px;font-weight:900;margin-top:3px}

/* ══ 🔔 골든벨 — 문제은행 · 무대 · 패자부활 가챠 (2026-10-16) ══ */
.gbtabs{display:flex;gap:5px;background:rgba(0,0,0,.045);padding:4px;border-radius:13px;margin:4px 0 12px}
.gbtabs button{flex:1;padding:9px 4px;border-radius:10px;font-size:var(--fs-xxs);font-weight:900;color:var(--ink2)}
.gbtabs button.on{background:#fff;color:var(--ac-d);box-shadow:0 2px 7px rgba(0,0,0,.09)}
.gbsec{margin-top:12px}
/* 명단 접기·전체 선택·번호로 정하기 (2026-10-27) */
.gbros-t{cursor:pointer;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:var(--fs-s);user-select:none}
.gbros-f{font-family:var(--font,inherit);font-size:11px;font-weight:800;color:var(--ink2);border:1.5px solid var(--line);border-radius:999px;padding:2px 9px;background:#fff}
.gbros-n{font-size:12.5px;color:var(--ink2)}
.gbnum{display:flex;gap:7px;align-items:stretch}
.gbnum .inp{flex:1;min-width:0;padding:9px 12px;font-size:16px}
.gbnum .chip{flex:0 0 auto;white-space:nowrap}
.gbnum-m{font-size:11.5px;font-weight:800;color:var(--ink2);margin-top:6px;line-height:1.5;word-break:keep-all}
.gbnum-m.ok{color:var(--ok-d)}
.gbsec>.k{font-size:11.5px;font-weight:900;color:var(--ink2);margin-bottom:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.gbunit{border:2px solid var(--line);border-radius:14px;padding:10px;background:#fff;margin-bottom:8px}
.gbunit-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;font-size:12.5px;font-weight:900}
.gbsh{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;border:2px solid var(--line);
  background:#fff;font-size:12px;font-weight:800;color:var(--ink2);text-align:left;line-height:1.3}
.gbsh .n{font-size:10.5px;font-weight:900;color:var(--mute)}
.gbsh.on{border-color:var(--ac);background:#FFF4EA;color:var(--ac-d)}
.gbsh.on .n{color:var(--ac)}
.gbq-row{display:flex;gap:8px;align-items:flex-start;padding:9px 10px;border:2px solid var(--line);border-radius:12px;background:#fff;margin-bottom:6px}
.gbq-row.in{border-color:var(--ok);background:#F4FBF5}
.gbq-row .tx{flex:1;min-width:0;font-size:13px;font-weight:700;line-height:1.5;word-break:keep-all}

.gm-dome{position:relative;width:100%;aspect-ratio:1/1;border-radius:50%;overflow:hidden;

  background:linear-gradient(180deg,#ff5b7f,#d82c5a);box-shadow:inset 0 -10px 0 rgba(0,0,0,.18),0 10px 30px rgba(0,0,0,.4)}

  box-shadow:0 4px 0 rgba(0,0,0,.2);display:grid;place-items:center;transition:transform 1.4s cubic-bezier(.5,0,.3,1)}

.gm-knob.turn{transform:rotate(720deg)}
.gm-chute{position:absolute;right:12%;top:30%;width:32%;height:46%;border-radius:12px;background:#3a0f22;box-shadow:inset 0 6px 10px rgba(0,0,0,.6)}
.gm-lbl{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:clamp(11px,1.2vw,15px);font-weight:900;color:#ffe0ea;letter-spacing:.12em}

  75%{transform:translateY(118%) scale(1.25)}100%{opacity:1;transform:translateY(150%) scale(1.25)}}
.gm-drop .h1,.gm-drop .h2{position:absolute;left:0;right:0;height:50%;transition:transform .5s ease,opacity .5s}
.gm-drop .h1{top:0;border-radius:999px 999px 0 0;background:rgba(255,255,255,.88)}
.gm-drop .h2{bottom:0;border-radius:0 0 999px 999px}
.gm-drop.open .h1{transform:translate(-30px,-60px) rotate(-70deg);opacity:0}
.gm-drop.open .h2{transform:translate(30px,40px) rotate(60deg);opacity:0}

/* ── 세계관 팩 (packs.js) ─────────────────────────────────────────────────
   THEMES 는 등록된 팩에서 만든다. 교사가 config.js 의 stamp.pack 으로 팩을 정하면
   학생은 팩을 못 바꾸고(잠금) 갈래(6종)만 고른다. stamp.pack 이 비어 있거나 'choice'
   이면 학생이 stamp.packs 에 적힌 팩 가운데 고른다(비우면 전부). */
var PACK_LOCK  = String(kitGet('stamp.pack', '') || '').trim();
var PACK_ALLOW = kitGet('stamp.packs', null);
if(!packById(PACK_LOCK)) PACK_LOCK = '';
var THEMES = (function(){
  var out = [], i, p;
  for(i=0;i<STAMP_PACKS.length;i++){
    p = STAMP_PACKS[i];
    if(PACK_LOCK && p.id !== PACK_LOCK) continue;
    if(!PACK_LOCK && Array.isArray(PACK_ALLOW) && PACK_ALLOW.length && PACK_ALLOW.indexOf(p.id) < 0) continue;
    out.push({id:p.id, emoji:p.emoji, name:p.name, stages:p.stages.slice(), pack:p});
  }
  if(!out.length && STAMP_PACKS.length){ p = STAMP_PACKS[0]; out.push({id:p.id, emoji:p.emoji, name:p.name, stages:p.stages.slice(), pack:p}); }
  return out;
})();
function packLocked(){ return !!PACK_LOCK; }
/* 지금 그릴 팩 — 잠겨 있으면 교사가 정한 팩, 아니면 학생이 고른 것(없는 팩이면 첫 팩) */
function curTheme(){ var id = PACK_LOCK || (typeof S !== 'undefined' && S && S.sp && S.sp.theme); return themeName(id).id; }
/* 갈래 이름 — 팩의 species 가 우선, 없으면 BRANCHES.n, 그것도 없으면 역량 라벨 */
function spName(themeId, b){ var p = packById(themeId); return (p && p.species && p.species[b.id]) || (b.n && b.n[themeId]) || b.label; }
function packWord(key, dflt){ var p = packById(curTheme()); return (p && p.words && p.words[key]) || dflt; }
/* 🧰 config.js 로 역량 이름·아이콘·색·행동 칩, 테마 이름을 덮어쓴다 (코드 id 는 그대로) */
(function(){
  var cc = kitGet('stamp.competencies', null);
  if(cc && typeof cc === 'object'){
    BRANCHES.forEach(function(b){
      var o = cc[b.id]; if(!o) return;
      if(o.label) b.label = o.label;
      if(o.icon)  b.icon  = o.icon;
      if(o.color) b.c = o.color;
      if(o.colorDark)  b.d = o.colorDark;
      if(o.colorLight) b.l = o.colorLight;
      if(o.names && typeof o.names === 'object') Object.keys(o.names).forEach(function(k){ if(o.names[k]) b.n[k] = o.names[k]; });
      if(Array.isArray(o.chips) && o.chips.length) BEHAVIOR_CHIPS[b.id] = o.chips;
    });
  }
  var tt = kitGet('stamp.themes', null);
  if(tt && typeof tt === 'object'){
    THEMES.forEach(function(t){
      var o = tt[t.id]; if(!o) return;
      if(o.name) t.name = o.name;
      if(o.emoji) t.emoji = o.emoji;
      if(Array.isArray(o.stages) && o.stages.length === t.stages.length){ t.stages = o.stages.slice(); if(t.pack) t.pack.stages = o.stages.slice(); }
      if(o.species && typeof o.species === 'object' && t.pack){ t.pack.species = t.pack.species || {}; Object.keys(o.species).forEach(function(k){ if(o.species[k]) t.pack.species[k] = o.species[k]; }); }
    });
  }
})();

function stageOf(n){ var s=0; for(var i=0;i<TH.length;i++){ if(n>=TH[i]) s=i; } return s; }

function daysAgo(d){
  if(!d) return null;
  var a=new Date(d); a.setHours(0,0,0,0);
  var b=new Date(); b.setHours(0,0,0,0);
  return Math.round((b-a)/86400000);
}

async function doStudentLogin(){
  var g=$('sG').value.trim(), c=$('sC').value.trim(), n=$('sN').value.trim(), pw=$('sPw').value;
  hideErr('sErr');
  if(!g||!c||!n){ showErr('sErr','학년·반·번호를 모두 입력해주세요'); return; }
  if(!pw){ showErr('sErr','비밀번호를 입력해주세요'); return; }
  $('sBtn').disabled=true; showLoad();
  try{
    var r = await sb.auth.signInWithPassword({ email:fakeEmail(g,c,n), password:pw });
    if(r.error){
      showErr('sErr', /Invalid/i.test(r.error.message) ? '학년·반·번호 또는 비밀번호를 확인해주세요' : '로그인에 실패했어요');
      return;
    }
    S.user = r.data.user;
    await bootStudent();
  }catch(e){ console.error(e); showErr('sErr','연결에 문제가 있어요. 잠시 후 다시 시도해주세요'); }
  finally{ $('sBtn').disabled=false; hideLoad(); }
}
async function doTeacherLogin(){
  var em=$('tE').value.trim(), pw=$('tPw').value;
  hideErr('tErr');
  if(!em||!pw){ showErr('tErr','이메일과 비밀번호를 입력해주세요'); return; }
  $('tBtn').disabled=true; showLoad();
  try{
    var r = await sb.auth.signInWithPassword({ email:em, password:pw });
    if(r.error){ showErr('tErr','이메일 또는 비밀번호를 확인해주세요'); return; }

    var t = await sb.from('teachers').select('*').eq('auth_id', S.user.id).maybeSingle();

    S.teacher = t.data;
    await bootTeacher();

}

async function bootStudent(){
  S.role='student';
  showLoad();
  try{
    var p = await sb.from('profiles').select('*').eq('id', S.user.id).maybeSingle();
    S.profile = p.data || {};
    $('stuName').textContent = S.profile.name || '나';

    var sp = await sb.from('stamp_profiles').select('*').eq('student_id', S.user.id).maybeSingle();
    if(sp.data){ S.sp = sp.data; }
    else {
      await sb.from('stamp_profiles').insert({ student_id:S.user.id, theme:'creature' });
      S.sp = {theme:'creature', branch:null, nickname:null};
    }
    await reloadStudent();
    goScr('s-stu'); stuTab('board');
  } finally { hideLoad(); }
}
async function reloadStudent(){
  var o = await sb.from('observations').select('*')
            .eq('student_id', S.user.id).is('voided_at', null)
            .order('observed_on', {ascending:false}).order('id', {ascending:false});
  S.obs = o.data || [];
  var b = await sb.rpc('my_stamp_balance');
  if(b.data && b.data[0]) S.bal = b.data[0];
  else S.bal = { earned:S.obs.length, spent:0, balance:S.obs.length };
  var r = await sb.from('stamp_rewards').select('*').eq('student_id', S.user.id)
            .order('issued_at',{ascending:false});
  S.rewards = r.data || [];
}
function catCount(){
  var m={}, i;
  for(i=0;i<S.obs.length;i++) m[S.obs[i].category] = (m[S.obs[i].category]||0)+1;
  return m;
}
function autoBranch(){
  var m=catCount(), best=null, bn=0, k;
  for(k in m){ if(m[k]>bn){ bn=m[k]; best=k; } }
  return best || 'inquiry';
}
function curBranch(){ return S.sp.branch || autoBranch(); }

async function doChangePw(){
  var a = ($('pwNew') && $('pwNew').value) || '';

  var m = $('pwMsg');
  var setMsg = function(txt, ok){ if(m){ m.textContent = txt; m.style.color = ok ? 'var(--ok-d)' : 'var(--bad)'; } };
  if(a.length < 4){ setMsg('비밀번호는 4자 이상이어야 해요', false); return; }
  if(a !== b){ setMsg('두 비밀번호가 서로 달라요', false); return; }
  var btn = $('pwSaveBtn'); if(btn) btn.disabled = true;
  setMsg('변경 중…', true);
  try{
    /* pw_changed 표시를 계정에 남긴다 — 질문 과수원이 더 이상 묻지 않게 */
    var r = await sb.auth.updateUser({ password: a, data:{ pw_changed:true } });
    if(btn) btn.disabled = false;
    if(r.error){ setMsg('변경 실패: ' + r.error.message, false); return; }
    setMsg('✅ 바뀌었어요! 질문 과수원도 같은 비밀번호예요.', true);
    toast('🔑 비밀번호가 바뀌었어요');
    setTimeout(closePw, 1800);
  }catch(e){
    if(btn) btn.disabled = false;
    setMsg('변경 실패: ' + (e && e.message || '오류'), false);
  }
}

function stuTab(k){
  var a=document.querySelectorAll('#s-stu .tab'), i;
  for(i=0;i<a.length;i++) a[i].classList.toggle('on', a[i].dataset.p===k);
  var b=document.querySelectorAll('#s-stu .pane');
  for(i=0;i<b.length;i++) b[i].classList.toggle('on', b[i].id==='p-'+k);
  if(k==='board') renderBoard();
  if(k==='shop')  renderShop();
  if(k==='base')  renderBase();
  if(k==='log')   renderLog();
  window.scrollTo(0,0);
}

function renderBoard(){
  var n = S.bal.earned, st = stageOf(n), b = branchOf(curBranch()), tid = curTheme(), th = themeName(tid);
  var next = null, i;
  for(i=0;i<TH.length;i++){ if(TH[i] > n){ next = TH[i]; break; } }
  var prev = TH[st], pct = next ? Math.round((n-prev)/(next-prev)*100) : 100;

  var h = '';
  h += '<div class="card char-box">';
  h +=   '<div style="display:flex;gap:6px;justify-content:center;margin-bottom:6px">';
  h +=     '<button class="chip sm" onclick="openThemePick()">' + (packLocked() ? '✏️ 이름 짓기' : '🎨 모습 바꾸기') + '</button>';
  h +=     (n>=TH[3] ? '<button class="chip sm" onclick="openBranchPick()">' + esc(packWord('branchBtn', '🌱 갈래 고르기')) + '</button>' : '');
  h +=     '<button class="chip sm" onclick="openDex()">📖 도감</button>';
  h +=   '</div>';
  h +=   drawPack(tid, st, b);
  h +=   '<div class="char-name">' + esc(S.sp.nickname || (S.profile.name||'나')+'의 ' + th.name) + '</div>';
  h +=   '<div class="char-sub">' + esc(th.stages[st]) + (n>=TH[3] ? ' · ' + esc(spName(tid, b)) : '') + '</div>';
  h +=   '<div class="counters">';
  h +=     '<div class="cnt earn"><div class="n">' + n + '</div><div class="l">🏅 모은 도장</div></div>';
  h +=     '<div class="cnt bal"><div class="n">' + S.bal.balance + '</div><div class="l">🎟️ 쓸 수 있는 도장</div></div>';
  h +=   '</div>';
  h +=   '<div class="bar"><i style="width:' + pct + '%"></i></div>';
  h +=   '<div class="bar-l"><span>' + esc(th.stages[st]) + '</span><span>' +
           (next ? ('다음 단계까지 ' + (next-n) + '개') : '최고 단계 달성! 🎉') + '</span></div>';

  /* 🔭 다음에 뭐가 되는지 — 여기서 바로 보여 준다 */
  var nx = st + 1;
  if(nx < TH.length){
    h += '<div class="peek"><div class="peek-row">';
    h +=   '<div class="peek-img">' + drawPack(tid, nx, b) + '<span class="lk">🔒</span></div>';
    h +=   '<div class="peek-tx">' +
             '<span class="k">도장을 더 모으면</span>' +
             '<span class="nm">' + esc(th.stages[nx]) + '</span>' +
             '<span class="nd">도장 <b>' + (TH[nx] - n) + '개</b>만 더 모으면 이 모습이 돼요</span>' +
           '</div>';
    h += '</div>';
    if(nx === 3){
      h += '<p class="peek-b">🌱 이때 <b>여섯 갈래</b> 중 하나를 고르게 돼요 — ' +
           esc(BRANCHES.map(function(x){ return spName(tid, x); }).join(' · ')) + ' 가운데 어떤 모습이 될지 도감에서 미리 볼 수 있어요.</p>';
    } else if(nx > 3){
      h += '<p class="peek-b">🌱 지금 갈래는 <b>' + esc(b.icon + ' ' + spName(tid, b)) + '</b>예요. ' +
           '「' + esc(packWord('branchBtn', '갈래 고르기').replace(/^\S+\s/, '')) + '」로 언제든 바꿀 수 있어요.</p>';
    }
    h += '</div>';
  } else {
    h += '<div class="peek done"><div class="peek-row"><div class="peek-tx">' +
           '<span class="nm">🎉 최고 단계까지 키웠어요!</span>' +
           '<span class="nd">도감에서 다른 모습과 여섯 갈래를 모두 볼 수 있어요</span>' +
         '</div></div></div>';
  }
  h += '<button class="chip sm peek-go" onclick="openDex()">📖 자라면 뭐가 되는지 전부 보기 →</button>';
  h += '</div>';

  h += '<div class="card"><div class="hd"><h3>✨ 최근 받은 도장</h3></div>';
  if(!S.obs.length){
    h += '<div class="empty"><div class="e">🌱</div><p>아직 도장이 없어요.<br>수업에서 좋은 모습을 보이면 선생님이 도장을 찍어주세요!</p></div>';
  } else {
    for(i=0;i<Math.min(5,S.obs.length);i++) h += stampRow(S.obs[i]);

  h += '<div class="card"><div class="hd"><h3>💡 이럴 때 도장을 받아요</h3></div>';

  }

  $('p-board').innerHTML = h;

/* ── 📖 캐릭터 도감 ─────────────────────────────────────────────────────────
   «20개 모으면 뭐가 되는지»가 안 보이면 모을 이유도 안 생긴다. 그래서 잠근 단계도
   흐리게만 하고 그림은 다 보여 준다. 지금 단계에는 테두리를 둘러 어디쯤인지 알려 준다. */
var _dexTheme = null;

function openDex(theme){
  var n = S.bal.earned, cur = stageOf(n);
  _dexTheme = packLocked() ? curTheme() : (theme || _dexTheme || curTheme());
  var th = themeName(_dexTheme), b = branchOf(curBranch());

  var h = '<h3 style="font-size:var(--fs-m);font-weight:900">📖 캐릭터 도감</h3>';
  h += '<div class="sub" style="font-size:var(--fs-xxs);color:var(--ink2);margin-top:4px">' +
       '도장을 모으면 이렇게 자라요. 🔒는 아직 안 열린 모습이에요.<br>' +
       '지금은 <b>' + n + '개</b> · <b>' + esc(th.stages[cur]) + '</b></div>';

  /* 테마 탭 — 다른 모습도 미리 보고 고를 수 있게 (교사가 팩을 잠갔으면 숨긴다) */
  var i;
  if(!packLocked() && THEMES.length > 1){
    h += '<div class="dex-tabs" style="margin-top:10px">';
    for (i = 0; i < THEMES.length; i++) {
      h += '<button class="chip sm' + (THEMES[i].id === _dexTheme ? ' on' : '') +
           '" onclick="openDex(\'' + THEMES[i].id + '\')">' + THEMES[i].emoji + ' ' + THEMES[i].name + '</button>';
    }
    h += '</div>';
  } else {
    h += '<div class="sub" style="margin-top:8px;font-size:var(--fs-xxs)">' + th.emoji + ' ' + esc(th.name) + (packLocked() ? ' · 선생님이 정한 세계관이에요' : '') + '</div>';
  }

  /* 7단계 */
  h += '<div class="dex">';
  for (i = 0; i < TH.length; i++) {
    var got = n >= TH[i], now = (i === cur);
    var cls = now ? 'now' : (got ? 'got' : 'soon');
    h += '<div class="dex-i ' + cls + '">' +
         '<div class="dex-b">' + (now ? '📍' : (got ? '✓' : '🔒')) + '</div>' +
         drawPack(_dexTheme, i, b) +
         '<div class="dex-n">' + esc(th.stages[i]) + '</div>' +
         '<div class="dex-c">' + (TH[i] === 0 ? '시작' : '도장 ' + TH[i] + '개') + '</div>' +
         '</div>';
  }
  h += '</div>';

  /* 성장 갈래 — 6개 중 하나를 내가 고른다 */
  h += '<div style="margin-top:16px;font-size:var(--fs-s);font-weight:900">🌱 성장 갈래 ' +
       '<span style="font-weight:700;color:var(--mute);font-size:.8em">도장 ' + TH[3] + '개부터 고를 수 있어요</span></div>';
  h += '<p style="font-size:var(--fs-xxs);color:var(--mute);margin:4px 0 0;line-height:1.6">' +
       '아래는 갈래마다 <b>끝까지 자랐을 때</b>의 모습이에요. 도장을 어떤 이유로 많이 받았는지에 따라 자동으로 정해지고, ' +
       '「갈래 고르기」로 직접 바꿀 수도 있어요.</p>';
  h += '<div class="dex">';
  for (i = 0; i < BRANCHES.length; i++) {
    var bb = BRANCHES[i], mine = (bb.id === curBranch());
    h += '<div class="dex-i' + (mine ? ' now' : '') + '">' +
         (mine ? '<div class="dex-b">📍</div>' : '') +
         drawPack(_dexTheme, TH.length - 1, bb) +
         '<div class="dex-n" style="color:' + bb.d + '">' + esc(spName(_dexTheme, bb)) + '</div>' +
         '<div class="dex-c">' + bb.icon + ' ' + esc(bb.label) + '</div>' +
         '</div>';
  }
  h += '</div>';

  if (!packLocked() && _dexTheme !== curTheme()) {
    h += '<button class="btn" style="margin-top:14px" onclick="pickThemeFromDex(\'' + _dexTheme + '\')">' +
         '이 모습으로 바꾸기</button>';
  }
  h += '<button class="btn ghost" style="margin-top:8px" onclick="closeMdl()">닫기</button>';
  $('mdlIn').innerHTML = h;
  $('mdl').classList.add('show');
}

async function pickThemeFromDex(id){
  if(!await pickTheme(id)) return;   /* 저장 + 도장판 다시 그리기 */
  closeMdl();
  _dexTheme = id;
  openDex(id);
}

/* 테마·갈래 저장 — 허용 값인지, 잠금·단계 조건을 만족하는지 확인하고 서버가 돌려준 값까지 대조한다 */
var _characterChoiceSaving = false;
async function saveCharacterChoice(field, value){
  if(_characterChoiceSaving) return false;
  var allowed = field === 'theme' ? THEMES : (field === 'branch' ? BRANCHES : []);
  if(!allowed.some(function(item){ return item.id === value; })) return false;
  if(field === 'theme' && packLocked()) return false;
  if(field === 'branch' && S.bal.earned < TH[3]) return false;
  _characterChoiceSaving = true;
  try{
    var patch = {updated_at:new Date().toISOString()};
    patch[field] = value;
    var result = await sb.from('stamp_profiles').update(patch).eq('student_id', S.user.id).select(field).single();
    if(result.error || !result.data || result.data[field] !== value){
      toast('저장하지 못했어요. 잠시 뒤 다시 골라 주세요.');
      return false;
    }
    S.sp[field] = value;
    return true;
  }catch(e){
    toast('저장하지 못했어요. 연결을 확인하고 다시 골라 주세요.');
    return false;
  }finally{
    _characterChoiceSaving = false;
  }
}
async function pickTheme(t){
  if(!await saveCharacterChoice('theme', t)) return false;
  openThemePick(); renderBoard(); toast('모습을 바꿨어요!');
  return true;
}
async function saveNick(){
  var v = ($('nickIn').value||'').trim().slice(0,12);
  S.sp.nickname = v || null;
  await sb.from('stamp_profiles').update({nickname:S.sp.nickname, updated_at:new Date().toISOString()}).eq('student_id', S.user.id);
  closeMdl(); renderBoard(); toast('저장했어요!');
}

  for(i=0;i<HONORS.length;i++){

    h +=   '<div class="rw-ic">' + ho.ic + '</div>';
    h +=   '<div class="rw-b"><div class="rw-n">' + esc(ho.name) + '</div>' +

    h += '</div>';
  }

async function redeem(code){

/* 우리 반 기지
   ─────────────────────────────────────────────────────────────────────────
   학생 화면과 교사 화면이 «똑같이» 보여야 한다. 교사가 전자칠판에 띄웠을 때
   학생이 자기 폰에서 보는 것과 다르면 그 화면을 같이 볼 이유가 없다.
   그래서 HTML 을 만드는 곳은 baseHTML() 한 군데뿐이고, 학생/교사는 데이터를
   어디서 가져오는지만 다르다.
     · 학생 : class_base()     — auth.uid() 로 «내 반» 을 찾는다
     · 교사 : class_base_for() — 반을 인자로 받는다 (6_교사_우리반보기.sql)
   도장 «개수» 는 교사 화면에서도 안 보여 준다. 개수는 «👥 학생» 탭에 있다. */
function baseHTML(total, mates, meId){
  var lvl = total>=150?4 : total>=80?3 : total>=30?2 : 1;
  var pk = packById(curTheme()) || {}, bs = pk.base || {};
  var lvName = (bs.levels && bs.levels[lvl-1]) || ['','⛺ 텐트','🏚️ 오두막','🏫 연구소','🏛️ 대형 연구단지'][lvl];
  var nextAt = [0,30,80,150,999][lvl];

  var h = '<div class="card" style="text-align:center">';
  h += '<h3>' + esc(bs.title || '🏕️ 우리 반 탐구기지') + '</h3>';
  if(typeof pk.baseDraw === 'function') h += '<div style="max-width:260px;margin:8px auto 0">' + pk.baseDraw(lvl, total) + '</div>';
  h += '<div style="font-size:var(--fs-xl);font-weight:900;color:var(--ac-d);margin-top:6px">' + total + '<span style="font-size:.45em;color:var(--ink2)">개</span></div>';
  h += '<div class="sub">우리 반이 함께 모은 도장</div>';
  h += '<div style="font-size:var(--fs-m);font-weight:900;margin-top:10px">' + lvName + '</div>';
  if(lvl<4){
    h += '<div class="bar" style="max-width:320px;margin:8px auto 0"><i style="width:' + Math.min(100,Math.round(total/nextAt*100)) + '%"></i></div>';
    h += '<div class="bar-l" style="max-width:320px;margin:5px auto 0"><span>기지 레벨 ' + lvl + '</span><span>다음까지 ' + Math.max(0,nextAt-total) + '개</span></div>';
  }
  h += '</div>';

  h += '<div class="card"><div class="hd"><h3 style="font-size:var(--fs-s)">🧑‍🤝‍🧑 우리 반 친구들</h3>' +
       '<span class="chip sm">' + mates.length + '명</span></div>';
  h += '<div class="sub" style="margin-bottom:10px">친구들의 도장 개수는 보이지 않아요 🤫</div>';
  h += '<div class="base-grid">';
  for(var i=0;i<mates.length;i++){
    var mm = mates[i], me = (meId != null && mm.student_id === meId);
    var bb = branchOf(mm.branch || 'inquiry'), mt = packLocked() ? curTheme() : themeName(mm.theme||'creature').id;
    h += '<div class="mate' + (me?' me':'') + '">' + drawPack(mt, mm.stage, bb) +
         '<div class="mate-n">' + esc(me ? '나' : (mm.name||'친구')) + '</div>' +
         '<div class="mate-b">' + esc(mm.stage>=3 ? spName(mt, bb) : themeName(mt).stages[mm.stage]) + '</div></div>';
  }
  h += '</div></div>';
  return h;
}

             '<div class="chips" id="clsChips"></div>' +

    var tip = (msg.indexOf('class_base_for') >= 0 || msg.indexOf('404') >= 0 ||
               msg.indexOf('does not exist') >= 0 || msg.indexOf('schema cache') >= 0)
      ? 'Supabase → SQL Editor 에서 <b>6_교사_우리반보기.sql</b> 을 한 번 실행해 주세요.'
      : esc(msg);

}

/* ── 반 ────────────────────────────────────────────────────────────────── */
async function loadClasses(){
  var r = await sb.from('profiles').select('grade,class_no').not('class_no','is',null);
  var seen = {}, out = [], k;
  (r.data||[]).forEach(function(p){
    k = (p.grade||0) + '-' + p.class_no;
    if(!seen[k]){ seen[k] = 1; out.push({grade:p.grade||0, cls:p.class_no}); }
  });
  out.sort(function(x,y){ return (x.grade-y.grade) || (x.cls-y.cls); });
  S.classes = out;
}
function renderClassChips(){
  var el = $('classChips'); if(!el) return;
  if(!S.classes.length){ el.innerHTML = '<span class="sub">학생 명단을 불러오지 못했어요</span>'; return; }
  var h = '', i, c, on;
  for(i=0;i<S.classes.length;i++){
    c = S.classes[i];
    on = S.selClass && S.selClass.grade===c.grade && S.selClass.cls===c.cls;
    h += '<button class="chip' + (on?' on':'') + '"' + (on?' style="background:var(--ac)"':'') +
         ' onclick="pickClass(' + c.grade + ',' + c.cls + ')">' + c.grade + '-' + c.cls + '</button>';
  }
  el.innerHTML = h;
}
async function pickClass(g,c){
  S.selClass = {grade:g, cls:c};
  S.selSt = {}; _qCache = {};
  showLoad();
  try{ await loadStudents(); } finally { hideLoad(); }
  renderGive();
}

/* ── 학생 ──────────────────────────────────────────────────────────────── */
async function loadStudents(){
  if(!S.selClass){ S.students = []; return; }
  var p = await sb.from('profiles').select('id,name,grade,class_no,number')
            .eq('grade', S.selClass.grade).eq('class_no', S.selClass.cls).order('number');
  S.students = p.data || [];
  var last = {}, cnt = {}, i, o;
  for(i=0;i<S.teaObs.length;i++){
    o = S.teaObs[i];
    cnt[o.student_id] = (cnt[o.student_id]||0) + 1;
    if(!last[o.student_id] || o.observed_on > last[o.student_id]) last[o.student_id] = o.observed_on;
  }
  for(i=0;i<S.students.length;i++){
    S.students[i]._last = last[S.students[i].id] || null;
    S.students[i]._cnt  = cnt[S.students[i].id] || 0;
  }
}
function toggleSort(){ S.sortCold = (S.sortCold===false); renderGive(); }
function sortedStudents(){
  var list = S.students.slice();
  if(S.sortCold !== false){
    list.sort(function(x,y){
      var dx = x._last ? daysAgo(x._last) : 9999, dy = y._last ? daysAgo(y._last) : 9999;
      return dy - dx;
    });
  } else {
    list.sort(function(x,y){ return (x.number||0) - (y.number||0); });
  }
  return list;
}
function renderStuGrid(){
  var el = $('stuGrid'); if(!el) return;
  var list = sortedStudents();
  if(!list.length){ el.innerHTML = '<div class="empty" style="grid-column:1/-1"><p>이 반 학생이 없어요</p></div>'; return; }
  var h = '', i, s, d, mt;
  for(i=0;i<list.length;i++){
    s = list[i]; d = s._last ? daysAgo(s._last) : null;
    mt = d===null ? '처음' : (d===0 ? '오늘' : d + '일 전');
    h += '<button class="stu' + (S.selSt[s.id]?' sel':'') + '" onclick="togSt(\'' + s.id + '\')">' +
         '<span class="stu-c' + (s._cnt?'':' zero') + '">' + s._cnt + '</span>' +
         '<div class="stu-n">' + esc((s.number?s.number+'. ':'') + (s.name||'')) + '</div>' +
         '<div class="stu-m' + (d===null||d>=14?' cold':'') + '">' + mt + '</div></button>';
  }
  el.innerHTML = h;
}
function togSt(id){ if(S.selSt[id]) delete S.selSt[id]; else S.selSt[id]=1; renderStuGrid(); updateSelCnt(); loadRecentQs(); }

/* ══════════════════════════════════════════════════════════════════════════
   🌳 질문과수원 연계 — 고른 학생이 최근에 심은 질문을 근거로 보여준다.
   조용해서 눈에 잘 안 띄는 학생도 질문에는 흔적을 남기므로,
   교사가 놓친 학생의 관찰 근거를 질문 기록이 대신 채워 준다(관찰 편향 완화).
   ══════════════════════════════════════════════════════════════════════════ */
var _qCache = {};
async function loadRecentQs(){
  var el = $('qHint'); if(!el) return;
  var ids = Object.keys(S.selSt);
  if(ids.length !== 1){ el.innerHTML=''; return; }   // 한 명일 때만
  var id = ids[0];
  if(_qCache[id]){ renderQHint(id); return; }
  el.innerHTML = '<div class="qhint"><div class="qhint-h">🌳 ' + QUESTION_APP + '에서 불러오는 중...</div></div>';
  try{
    var r = await sb.from('questions').select('id,text,question_date,starred,resolved')
              .eq('user_id', id).order('question_date',{ascending:false}).limit(3);
    _qCache[id] = (r.error ? [] : (r.data||[]));
  }catch(e){ _qCache[id] = []; }
  renderQHint(id);
}
function renderQHint(id){
  var el = $('qHint'); if(!el) return;
  var list = _qCache[id] || [];
  if(!list.length){ el.innerHTML=''; return; }
  var h = '<div class="qhint"><div class="qhint-h">🌳 이 학생이 최근에 심은 질문</div>';
  for(var i=0;i<list.length;i++){
    var q = list[i];
    h += '<div class="qh-item"><div class="qh-t">' + (q.starred?'⭐ ':'') + esc(q.text) +
         '<div class="qh-d">' + esc(q.question_date||'') + '</div></div>' +
         '<button class="qh-b" onclick="useQ(' + i + ')">근거로</button></div>';
  }
  h += '</div>';
  el.innerHTML = h;
}
function useQ(i){

  var q = (_qCache[ids[0]]||[])[i]; if(!q) return;

function selAll(on){

  renderStuGrid(); updateSelCnt(); loadRecentQs();
}
function updateSelCnt(){

/* ── 차시 ──────────────────────────────────────────────────────────────── */
async function loadPlans(){
  try{
    var r = await sb.from('lesson_plans').select('*').order('sort_order').order('id',{ascending:false});
    S.plans = r.error ? [] : (r.data||[]);
  }catch(e){ S.plans = []; }
}
var PLAN_SEP = ' · ';   /* 차시명 구분자: 공백+가운뎃점+공백 */
function planTitle(id){
  for(var i=0;i<S.plans.length;i++) if(S.plans[i].id===id) return S.plans[i].title;
  return null;
}
/* 차시명은 «현상형 제목 · 개념» 형태다. 화면 칩에는 제목을 통째로 보여주되,
   생기부 누가기록에는 개념만 남긴다 — «지지직의 정체 수업에서 칭찬받음»보다
   «마찰 전기와 전기력 수업에서 칭찬받음»이 기록으로 읽힌다.
   구분자는 공백을 낀 가운뎃점이라, «전압·저항»처럼 붙여 쓴 것과 섞이지 않는다. */
/* 차시명은 «2-7-1-1 현상형 제목 · 개념» 형태다.
   앞의 «2-7-1-1» 은 학년-단원-중단원-차시. 학생이 어느 차시인지 알아보라고 붙였다. */
function planCode(title){
  var m = String(title || '').match(/^\d+-\d+-\d+-\d+/);
  return m ? m[0] : '';
}
/* 문장에 넣을 값 — 번호는 뺀다. «2-7-1-1 마찰 전기와 전기력 수업에서 칭찬받음» 은 안 읽힌다. */
function planConcept(id){
  var s = planTitle(id);
  if(!s) return null;
  var p = s.split(PLAN_SEP);
  var tail = (p.length > 1 ? p.slice(1).join(PLAN_SEP).trim() : s.trim()) || s;
  return tail.replace(/^\d+-\d+-\d+-\d+\s*/, '');
}
/* 기록(lesson_note)에 남길 값 — 번호를 앞에 붙여 둔다. 학생 기록 화면과 생기부 근거에서
   «어느 차시였는지»가 한눈에 보여야 한다. */
function planNote(id){
  var c = planConcept(id);
  if(!c) return null;
  var code = planCode(planTitle(id));
  return code ? (code + ' ' + c) : c;
}

/* ══════════════════════════════════════════════════════════════════════════
   🔔 골든벨 — 수업 시작 3~4문제, 끝까지 남은 사람에게 도장

   교실에서 30초 안에 한 라운드가 끝나야 한다. 그래서 «맞은 사람»이 아니라
   «틀린 사람»만 누른다 — 보통 반에서 서너 명이라 탭 수가 1/5 로 줄어든다.
   진행 중 상태는 localStorage 에 둔다. 새로고침·실수로 뒤로가기 해도 살아난다.
   DB 는 마지막에 도장 찍을 때만 쓴다(새 테이블 없음).
   ══════════════════════════════════════════════════════════════════════════ */
/* ── 🔊 골든벨 음향 ──────────────────────────────────────────────────────
   전자칠판·교사 기기 한 대에서만 나온다. preload='none' 이라 실제로 누르기
   전에는 한 바이트도 안 받는다(학교 와이파이 배려). 브라우저가 소리를 막는 건
   «사용자가 누르기 전»뿐이라, 교사가 시작을 누른 뒤부터는 문제없이 난다. */
var GB_SND = {
  write:   'audio/sfx-write.mp3',      // 정답을 써주세요
  show:    'audio/sfx-show.mp3',       // 정답을 들어주세요
  tense1:  'audio/bgm-tense1.mp3',     // 긴장감 1
  tense2:  'audio/bgm-tense2.mp3',     // 긴장감 2
  cute:    'audio/bgm-cute.mp3',       // 귀여운 퀴즈
  fanfare: 'audio/sfx-fanfare.mp3',    // 팡파레
  award:   'audio/bgm-award.mp3'       // 시상식
};
var GB_BGM_LIST = [
  {k:'tense1', n:'긴장감 1'},
  {k:'tense2', n:'긴장감 2'},
  {k:'cute',   n:'귀여운 퀴즈'},
  {k:'off',    n:'끄기'}
];
var _gbAud = {}, _gbBgm = null;

/* ── 🎵 내 음악 넣기 ───────────────────────────────────────────────────────
   집에서 고른 mp3 를 이 «기기 브라우저»에만 넣어둔다(IndexedDB). 파일이 저장소로
   올라가지 않으니 공개 배포와 무관하고, 전자칠판에서 한 번 넣어두면 학기 내내
   그대로 남는다. 배경음으로만 쓴다 — 효과음은 짧고 정해진 신호라 손대지 않는다.
   ────────────────────────────────────────────────────────────────────────── */
var GBU = null;            /* [{id,name,url}] — url 은 이 세션에서 만든 임시 주소 */
var _gbuBusy = false;

function gbuDB(){
  return new Promise(function(res, rej){
    if(!window.indexedDB){ rej(0); return; }
    var rq = indexedDB.open('gb_user_snd', 1);
    rq.onupgradeneeded = function(){
      var d = rq.result;
      if(!d.objectStoreNames.contains('snd')) d.createObjectStore('snd', {keyPath:'id'});
    };
    rq.onsuccess = function(){ res(rq.result); };
    rq.onerror   = function(){ rej(rq.error); };
  });
}
/* 화면을 그리다 처음 불리면 조용히 읽어오고, 다 읽으면 한 번만 다시 그린다 */
function gbuLoad(){
  if(GBU || _gbuBusy) return;
  _gbuBusy = true;
  gbuDB().then(function(d){
    var out = [], rq = d.transaction('snd','readonly').objectStore('snd').openCursor();
    rq.onsuccess = function(){
      var c = rq.result;
      if(c){
        var v = c.value;
        try{ out.push({ id:v.id, name:v.name, slot:(v.slot || 'bgm'), url:URL.createObjectURL(v.blob) }); }catch(e){}
        c.continue();
      } else {
        GBU = out; _gbuBusy = false;
        if(out.length) renderGB();
      }
    };
    rq.onerror = function(){ GBU = []; _gbuBusy = false; };
  }).catch(function(){ GBU = []; _gbuBusy = false; });
}
function gbuAdd(input){
  /* ⚠️ input.files 는 «살아 있는» 목록이라 input.value='' 를 먼저 하면 그 자리에서
     비어버린다. 그래서 파일을 배열로 다 옮겨 담은 «뒤에» 입력칸을 비운다. */
  var fs = input.files, picked = [], i, f;
  for(i=0;i<(fs ? fs.length : 0);i++){
    f = fs[i];
    if(/^audio\//.test(f.type || '') || /\.(mp3|m4a|ogg|wav|aac|flac|opus)$/i.test(f.name)) picked.push(f);
  }
  input.value = '';                       /* 같은 파일을 다시 골라도 들어가게 */
  if(!picked.length){ toast(fs && fs.length ? '음악 파일이 아니에요' : '고른 파일이 없어요'); return; }
  gbuDB().then(function(d){
    var tx = d.transaction('snd','readwrite'), st = tx.objectStore('snd');
    if(!GBU) GBU = [];
    for(var j=0;j<picked.length;j++){
      var g = picked[j];
      var rec = { id:'u_' + Date.now().toString(36) + j, name:gbuTidy(g.name), slot:'bgm', blob:g };
      st.put(rec);
      try{ GBU.push({ id:rec.id, name:rec.name, slot:'bgm', url:URL.createObjectURL(g) }); }catch(e){}
    }
    tx.oncomplete = function(){
      toast('음악 ' + picked.length + '개를 넣었어요 · 이름과 자리를 정해주세요');
      _gbuEdit = true;        /* 넣자마자 관리 칸을 펴 준다 — 파일 이름이 대개 길다 */
      renderGB();
    };
    tx.onerror = function(){ toast('넣지 못했어요 — 저장 공간을 확인해 주세요'); };
  }).catch(function(){ toast('이 브라우저에는 넣을 수 없어요'); });
}
/* 내려받은 파일 이름은 대개 지저분하다 — 확장자·화질표기·업로더 꼬리를 떼어 준다 */
function gbuTidy(n){
  return String(n)
    .replace(/\.[^.]+$/, '')
    .replace(/\s*\((?:\d{2,4}k|\d{3,4}p|공식|가사[^)]*|[^)]*자막[^)]*)\)\s*/gi, ' ')
    .replace(/\s*-\s*(?:Topic|[^-]*뮤직\s*라이브러리)\s*$/i, '')
    .replace(/[【】［］]/g, ' ')
    .replace(/\s{2,}/g, ' ')
    .trim()
    .slice(0, 28) || '내 음악';
}
function gbuRename(id){
  var it = gbuAt(id); if(!it) return;
  var n = prompt('이 음악을 뭐라고 부를까요?\n(예: 긴장감 3)', it.name);
  if(n === null) return;
  n = n.trim().slice(0, 28); if(!n) return;
  gbuPatch(id, { name: n });
}
function gbuSlot(id, slot){ gbuPatch(id, { slot: slot }); }
/* 저장된 알맹이(blob)는 그대로 두고 이름·자리만 고쳐 쓴다.
   ⚠️ 이름과 자리를 연달아 바꾸면 두 번의 «읽고 → 고쳐 → 쓰기»가 겹쳐서 뒤엣것이
   앞엣것을 지운다. 그래서 화면 값(it)을 먼저 바꾸고, 저장할 때는 언제 끝나든
   «그 시점의 화면 값»을 통째로 받아 적는다 — 겹쳐도 같은 결과로 모인다. */
function gbuPatch(id, patch){
  var it = gbuAt(id); if(!it) return;
  for(var k in patch) it[k] = patch[k];
  gbuDB().then(function(d){
    var st = d.transaction('snd','readwrite').objectStore('snd'), rq = st.get(id);
    rq.onsuccess = function(){
      var rec = rq.result; if(!rec) return;
      rec.name = it.name; rec.slot = it.slot || 'bgm';
      st.put(rec);
    };
  }).catch(function(){});
  if(it.slot === 'award' && gbBgmKey() === id) gbPickBgm('tense1');
  else renderGB();
}
function gbuDel(id){
  var it = gbuAt(id); if(!it) return;
  if(!confirm('「' + it.name + '」을 뺄까요? (원본 파일은 그대로예요)')) return;
  gbuDB().then(function(d){
    d.transaction('snd','readwrite').objectStore('snd').delete(id);
    GBU = GBU.filter(function(x){ return x.id !== id; });
    try{ URL.revokeObjectURL(it.url); }catch(e){}
    delete _gbAud[id];
    if(_gbAwardKey === id) gbAwardStop();          /* 시상식에서 틀고 있었으면 멎는다 */
    if(gbBgmKey() === id) gbPickBgm('tense1');     /* 틀던 곡을 뺐으면 기본으로 */
    else renderGB();
  }).catch(function(){});
}
function gbuAt(id){
  for(var i=0;i<(GBU||[]).length;i++) if(GBU[i].id === id) return GBU[i];
  return null;
}

function gbSndOn(){ try{ return localStorage.getItem('gb_snd') !== 'off'; }catch(e){ return true; } }

/* 볼륨 0~1. 기본 0.7 — 이때 배경음이 0.35 라 예전과 같은 크기다.
   배경음은 선생님 목소리 밑에 깔려야 하므로 슬라이더의 절반만 쓴다.
   효과음(써주세요·들어주세요)은 반 전체가 들어야 하는 신호라 슬라이더 값 그대로. */
function gbVol(){
  var v;
  try{ v = parseFloat(localStorage.getItem('gb_vol')); }catch(e){}
  return (isFinite(v) && v >= 0 && v <= 1) ? v : 0.7;
}
function gbBgmVol(){ return gbVol() * 0.5; }

/* 슬라이더를 끄는 동안 매번 화면을 다시 그리면 손가락이 슬라이더에서 떨어진다.
   그래서 여기서는 소리와 숫자만 바꾸고 renderGB 는 부르지 않는다. */
function gbSetVol(v){
  v = Math.max(0, Math.min(1, (parseFloat(v) || 0) / 100));
  try{ localStorage.setItem('gb_vol', String(v)); }catch(e){}
  if(_gbBgm){ try{ _gbBgm.volume = gbBgmVol(); }catch(e){} }
  if(_gbAwardAud){ try{ _gbAwardAud.volume = gbBgmVol(); }catch(e){} }
  for(var k in _gbAud){
    if(_gbAud[k] !== _gbBgm && _gbAud[k] !== _gbAwardAud){ try{ _gbAud[k].volume = v; }catch(e){} }
  }
  var lab = document.getElementById('gbVolLab');
  if(lab) lab.textContent = Math.round(v * 100) + '%';
}
function gbBgmKey(){ try{ return localStorage.getItem('gb_bgm') || 'tense1'; }catch(e){ return 'tense1'; } }
function gbToggleSnd(){
  var on = !gbSndOn();
  try{ localStorage.setItem('gb_snd', on ? 'on' : 'off'); }catch(e){}
  if(!on){ gbStopBgm(); gbAwardStop(); }
  renderGB();
}
function gbPickBgm(k){
  try{ localStorage.setItem('gb_bgm', k); }catch(e){}
  gbStopBgm();
  /* 예전에는 «골든벨이 돌고 있을 때»만 틀었다(GB.ready && !GB.done). 그래서 준비
     화면이나 결과 화면에서 배경음 칩을 눌러도 아무 소리가 안 났다 — 시상식 단추는
     바로 나는데 배경음만 안 나던 이유가 이것이다. 이제 소리가 켜져 있으면 누르는
     즉시 튼다. 멈추려면 「끄기」. */
  if(k !== 'off' && gbSndOn()) gbPlayBgm();
  renderGB();
}

function gbAudio(key){
  /* u_ 로 시작하면 내가 넣어둔 음악 — 파일이 아니라 이 기기 안의 주소를 쓴다 */
  var mine = (key && key.indexOf('u_') === 0) ? gbuAt(key) : null;
  var src = mine ? mine.url : GB_SND[key];
  if(!src) return null;
  if(!_gbAud[key]){
    var a = new Audio(); a.preload = 'none'; a.src = src;
    _gbAud[key] = a;
  }
  return _gbAud[key];
}
/* 효과음 — 실패해도 조용히 넘어간다. 소리 때문에 수업이 멈추면 안 된다. */
function gbSfx(key){
  if(!gbSndOn()) return;
  var a = gbAudio(key); if(!a) return;
  try{ a.volume = gbVol(); a.currentTime = 0; var p = a.play(); if(p && p.catch) p.catch(function(){}); }catch(e){}
}
function gbPlayBgm(){
  var k = gbBgmKey();
  if(!gbSndOn() || k === 'off') return;
  var a = gbAudio(k); if(!a) return;
  gbAwardStop();                  /* 시상식곡이 돌고 있었으면 겹치지 않게 멎힌다 */
  a.loop = true; a.volume = gbBgmVol();
  _gbBgm = a;
  try{ var p = a.play(); if(p && p.catch) p.catch(function(){}); }catch(e){}
  gbNowBar();
}
function gbStopBgm(){
  if(!_gbBgm) return;
  try{ _gbBgm.pause(); _gbBgm.currentTime = 0; }catch(e){}
  _gbBgm = null;
  gbNowBar();
}
/* ── 🏅 시상식 음악 ────────────────────────────────────────────────────────
   배경음과 다른 줄에 둔다. 시상식은 «틀어놓고 도장을 찍는» 순간이라 미리 골라두는
   게 아니라 그때 눌러서 고른다. 배경음 줄과 채널이 달라서, 누르면 배경음은 멎고
   고른 곡이 반복 재생된다. ── */
var _gbAwardAud = null, _gbAwardKey = null;
function gbAwardPlay(key){
  gbStopBgm();
  gbAwardStop();
  if(!gbSndOn()) return;
  var a = gbAudio(key); if(!a) return;
  a.loop = true; a.volume = gbBgmVol();
  _gbAwardAud = a; _gbAwardKey = key;
  try{ a.currentTime = 0; var p = a.play(); if(p && p.catch) p.catch(function(){}); }catch(e){}
  gbNowBar();
  renderGB();
}
function gbAwardStop(){
  if(_gbAwardAud){ try{ _gbAwardAud.pause(); _gbAwardAud.currentTime = 0; }catch(e){} }
  _gbAwardAud = null; _gbAwardKey = null;
  gbNowBar();
}
function gbAwardOff(){ gbAwardStop(); renderGB(); }

/* ── ▶ 지금 나오는 소리 ────────────────────────────────────────────────────
   배경음이든 시상식곡이든 한 줄에서 다룬다. 도장을 찍으면 「도장 주기」 탭으로
   넘어가 골든벨 화면이 사라지므로, 이 줄은 어느 탭에서든 떠 있게 둔다.
   재생 위치를 끌어 옮길 수 있다 — 긴 노래의 후렴부터 틀 때 쓴다.
   ────────────────────────────────────────────────────────────────────────── */
var _gbSeekIv = null, _gbSeekDrag = false, _gbNowTag = '';

function gbNowAud(){ return _gbAwardAud || _gbBgm; }
function gbNowName(){
  var k, i;
  if(_gbAwardAud){
    k = _gbAwardKey;
    return k === 'award' ? '기본 시상식' : ((gbuAt(k) || {}).name || '시상식 음악');
  }
  if(_gbBgm){
    k = gbBgmKey();
    for(i=0;i<GB_BGM_LIST.length;i++) if(GB_BGM_LIST[i].k === k) return GB_BGM_LIST[i].n;
    return (gbuAt(k) || {}).name || '배경음';
  }
  return '';
}
function gbNowStop(){ if(_gbAwardAud) gbAwardOff(); else gbPickBgm('off'); }
function gbNowToggle(){
  var a = gbNowAud(); if(!a) return;
  try{
    if(a.paused){ var p = a.play(); if(p && p.catch) p.catch(function(){}); }
    else a.pause();
  }catch(e){}
  gbSeekPaint();
}
function gbFmtT(s){
  if(!isFinite(s) || s < 0) return '--:--';
  s = Math.floor(s);
  return Math.floor(s/60) + ':' + ('0' + (s % 60)).slice(-2);
}

function gbNowBar(){
  var a = gbNowAud(), el = document.getElementById('gbNowBar');
  if(!a){
    if(el && el.parentNode) el.parentNode.removeChild(el);
    _gbNowTag = '';
    if(_gbSeekIv){ clearInterval(_gbSeekIv); _gbSeekIv = null; }
    return;
  }
  if(!el){
    el = document.createElement('div');
    el.id = 'gbNowBar';
    el.style.cssText = 'position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:70;' +

var GBB_URL = '/scienceclass/goldenbell/bank.json';

function gbbIndex(){
  GBB_IDX = {};
  if(!GBB || !GBB.grades) return;
  GBB.grades.forEach(function(G){
    (G.units || []).forEach(function(U){
      (U.sheets || []).forEach(function(Sh){
        (Sh.qs || []).forEach(function(q){ GBB_IDX[q.id] = { q:q, sheet:Sh, unit:U, g:G.g }; });
      });
    });
  });
}
function gbbLoad(){
  if(_gbbSt === 'loading' || _gbbSt === 'net') return;
  if(!GBB){
    var c = gbLsJ(GBB_CACHE, null);
    if(c && c.grades){ GBB = c; gbbIndex(); _gbbSt = 'cache'; }
  }
  _gbbSt = 'loading';
  fetch(GBB_URL, { cache:'no-cache' })
    .then(function(r){ if(!r.ok) throw r.status; return r.json(); })
    .then(function(j){
      if(!j || !j.grades) throw 0;
      GBB = j; gbbIndex(); _gbbSt = 'net';
      gbLsSet(GBB_CACHE, JSON.stringify(j));
      gbRerender();
    })
    .catch(function(){ _gbbSt = GBB ? 'cache' : 'none'; gbRerender(); });
}

/* ── 🎯 범위(랜덤 출제) — 학년마다 따로 기억한다 ── */
function gbRangeGet(g){
  var r = gbLsJ('gb_range_v1', {}), a = r['g' + g];
  if(a instanceof Array) return a;
  return gbbSheets(g).filter(function(s){ return s.random !== false; })
                     .map(function(s){ return s.id; });     /* 보너스는 처음엔 랜덤 범위에서 뺀다 */
}
function gbRangeSet(g, a){
  var r = gbLsJ('gb_range_v1', {});
  if(!r || typeof r !== 'object') r = {};
  r['g' + g] = a; gbLsSet('gb_range_v1', JSON.stringify(r));
}
function gbRangeToggle(g, id){
  var a = gbRangeGet(g).slice(), i = a.indexOf(id);
  if(i >= 0) a.splice(i, 1); else a.push(id);
  gbRangeSet(g, a); renderGB();
}
function gbRangeUnit(g, uid){
  var G = gbbGrade(g), U = null, i;
  if(!G) return;
  for(i=0;i<G.units.length;i++) if(G.units[i].id === uid) U = G.units[i];
  if(!U) return;
  var a = gbRangeGet(g).slice(), ids = U.sheets.map(function(s){ return s.id; });
  var all = ids.every(function(id){ return a.indexOf(id) >= 0; });
  ids.forEach(function(id){
    var k = a.indexOf(id);
    if(all && k >= 0) a.splice(k, 1);
    if(!all && k < 0) a.push(id);
  });
  gbRangeSet(g, a); renderGB();
}
function gbRangePreset(g, k){
  var ids = gbbSheets(g).filter(function(s){ return s.random !== false; })
                        .map(function(s){ return s.id; }), keepMy = gbRangeGet(g).indexOf('my') >= 0;
  var a = k === 'last1' ? ids.slice(-1) : k === 'last2' ? ids.slice(-2) : ids;
  if(keepMy) a = a.concat(['my']);
  gbRangeSet(g, a); renderGB();
}
/* 범위에 든 문제 id — loose 면 범위가 비었을 때 그 학년 전체로 */
function gbPool(g, loose){
  var rg = gbRangeGet(g), out = [];
  gbbSheets(g).forEach(function(s){
    if(rg.indexOf(s.id) < 0) return;
    s.qs.forEach(function(q){ out.push(q.id); });
  });
  if(rg.indexOf('my') >= 0) gbmyFor(g).forEach(function(q){ out.push(q.id); });
  if(!out.length && loose){
    gbbSheets(g).filter(function(s){ return s.random !== false; })
                .forEach(function(s){ s.qs.forEach(function(q){ out.push(q.id); }); });
  }
  return out;
}

function gbWantN(){

  return n > 0 ? n : 4;
}

function gbDraw(){
  var g = gbPanelG(), n = gbWantN(), pool = gbPool(g, false);
  if(!pool.length){ toast('범위에 든 문제가 없어요 — 학습지를 하나 이상 눌러 주세요'); return; }
  var used = gbUsedOf(gbClsKey()), noRep = gbLs('gb_norep', '1') === '1';
  var fresh = noRep ? pool.filter(function(id){ return !used[id]; }) : pool.slice();
  var mixed = false;
  if(fresh.length < n){
    var rest = gbShuffle(pool.filter(function(id){ return fresh.indexOf(id) < 0; }));
    mixed = noRep && rest.length > 0;
    fresh = fresh.concat(rest.slice(0, n - fresh.length));
  }
  /* 학습지마다 섞은 뒤 번갈아 뽑는다 — 한 학습지에만 몰리지 않게 */
  var by = {}, order = [], pick = [], i, any;
  fresh.forEach(function(id){
    var s = gbSheetOf(id) || '?';
    if(!by[s]){ by[s] = []; order.push(s); }
    by[s].push(id);
  });
  gbShuffle(order);
  order.forEach(function(s){ gbShuffle(by[s]); });
  while(pick.length < n){
    any = false;
    for(i=0;i<order.length && pick.length < n;i++){
      if(by[order[i]].length){ pick.push(by[order[i]].shift()); any = true; }
    }
    if(!any) break;
  }
  var qs = pick.map(gbQById).filter(Boolean);
  if(gbLs('gb_easy', '1') === '1'){
    qs = qs.map(function(q, k){ return { q:q, k:k }; })
           .sort(function(a, b){ return ((a.q.lv || 2) - (b.q.lv || 2)) || (a.k - b.k); })
           .map(function(x){ return x.q; });
  }
  GBQ = qs; _gbEditIx = -1;
  gbqSave(); gbSyn('pop'); renderGB();
  toast('🎲 ' + qs.length + '문제를 뽑았어요' + (mixed ? ' · 이 반에서 낸 문제도 섞였어요' : ''));
}

/* 진행 중에 바꿔 낼 문제 — 오늘 목록·이 반에서 낸 문제는 되도록 피하고, 같은 학습지를 먼저 */
function gbSpare(pref){
  var g = gbPlayG(), pool = gbPool(g, true), inList = {}, used = gbUsedOf(gbClsKey());
  gbqLoad().forEach(function(q){ if(q && q.id) inList[q.id] = 1; });
  if(GB && GB.rvq) GB.rvq.forEach(function(id){ inList[id] = 1; });
  var c = pool.filter(function(id){ return !inList[id]; });
  var c2 = c.filter(function(id){ return !used[id]; });
  if(c2.length) c = c2;
  if(pref){
    var c3 = c.filter(function(id){ return gbSheetOf(id) === pref; });
    if(c3.length) c = c3;
  }
  if(!c.length) return null;
  return gbQById(c[Math.floor(Math.random() * c.length)]);
}

/* 집 기기 → 학교 기기. 문제은행은 어디서나 저절로 오고, 오늘 목록·내 문제만 파일로 옮긴다. */
function gbqExport(){
  var today = gbqLoad(), mine = gbmyAll();
  if(!today.length && !mine.length){ toast('내보낼 문제가 없어요'); return; }
  var data = { format:'goldenbell', v:2, saved:todayStr(), today:today, mine:mine };
  var blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '골든벨_문제_' + todayStr() + '.json';
  a.click(); URL.revokeObjectURL(a.href);
  toast('오늘 ' + today.length + '개 · 내 문제 ' + mine.length + '개를 내려받았어요');
}
function gbqClean(arr){
  var out = [], i, it, o;
  if(!(arr instanceof Array)) return out;
  for(i=0;i<arr.length;i++){
    it = arr[i];
    if(!it || typeof it.q !== 'string' || !it.q.trim()) continue;
    o = { q:String(it.q), a:String(it.a == null ? '' : it.a) };
    ['id','t','src','ex'].forEach(function(k){ if(typeof it[k] === 'string' && it[k]) o[k] = it[k]; });
    if(it.lv) o.lv = +it.lv || undefined;
    if(it.g) o.g = +it.g || undefined;
    if(it.ch instanceof Array) o.ch = it.ch.map(String);
    if(it.acc instanceof Array) o.acc = it.acc.map(String);
    out.push(o);
  }
  return out;
}
function gbqImport(input){
  var f = input && input.files && input.files[0];
  if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    try{
      var j = JSON.parse(String(r.result)), today, mine = [], msg = [];
      if(j instanceof Array) today = gbqClean(j);                       /* 예전 파일: 오늘 목록만 */
      else if(j && typeof j === 'object'){ today = gbqClean(j.today); mine = gbqClean(j.mine); }
      else throw 0;
      if(!today.length && !mine.length) throw 0;
      if(today.length){ GBQ = today; _gbEditIx = -1; gbqSave(); msg.push('오늘 ' + today.length + '개'); }
      if(mine.length){
        var have = gbmyAll(), seen = {}, add = 0;
        have.forEach(function(q){ seen[q.id || q.q] = 1; });
        mine.forEach(function(q){
          if(!q.id) q.id = 'my-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
          if(!seen[q.id]){ have.push(q); seen[q.id] = 1; add++; }
        });
        gbmySave(have); msg.push('내 문제 ' + add + '개');
      }
      renderGB();
      toast(msg.join(' · ') + '를 불러왔어요');
    }catch(e){ toast('올바른 골든벨 문제 파일이 아니에요'); }
  };
  r.readAsText(f);
  input.value = '';     /* 같은 파일을 다시 골라도 불러와지게 — f 를 먼저 잡아 두었으니 비워도 된다 */
}

/* 지금 «선택·해제»가 걸려 있는 사람 — 준비: 반 전체 / 진행: 살아 있거나 이번 문제에서 떨어진 사람 / 부활전: 탈락한 사람 */
function gbCand(){
  return S.students.filter(function(s){
    var id = s.id;
    if(GB.rv) return GB.rv.ids[id] != null || GB.out[id] > 0;
    if(!GB.ready) return true;
    return !!GB.alive[id] || GB.out[id] === GB.round;
  });
}
/* 한 사람을 선택(on) 또는 해제 — 바뀌었으면 1 */
function gbSetOn(id, on){
  if(GB.rv){
    if(on && GB.rv.ids[id] == null && GB.out[id] > 0){ GB.rv.ids[id] = GB.out[id]; delete GB.out[id]; GB.alive[id] = 1; return 1; }
    if(!on && GB.rv.ids[id] != null){ GB.out[id] = GB.rv.ids[id]; delete GB.alive[id]; delete GB.rv.ids[id]; return 1; }
    return 0;
  }
  if(on && !GB.alive[id]){ delete GB.out[id]; GB.alive[id] = 1; if(GB.ex) delete GB.ex[id]; return 1; }
  if(!on && GB.alive[id]){ delete GB.alive[id]; GB.out[id] = GB.ready ? GB.round : 0; return 1; }
  return 0;
}
function gbAll(on){
  if(!GB || (GB.done && !GB.rv)) return;
  var c = gbCand(), i, n = 0;
  for(i=0;i<c.length;i++) n += gbSetOn(c[i].id, !!on);
  if(!n){ toast(on ? '이미 모두 선택돼 있어요' : '이미 모두 해제돼 있어요'); return; }
  gbSave();
  if(GB.rv && on) gbSyn('pop');
  renderGB();
}
/* «1,3,5,6» «1 3 5» «1.3.5» «1~5» «3-7» → { 1:1, 3:1, … } — 숫자 말고는 모두 나누는 자리로 본다 */
function gbParseNums(t){
  var out = {}, m, a, b, i, re = /(\d+)\s*[~\-–]\s*(\d+)|(\d+)/g;
  t = String(t || '');
  while((m = re.exec(t))){
    if(m[1]){
      a = +m[1]; b = +m[2]; if(a > b){ i = a; a = b; b = i; }
      if(b - a <= 60) for(i=a;i<=b;i++) out[i] = 1;
    }
    else out[+m[3]] = 1;
  }
  return out;
}
/* 입력 칸 글자·결과 한 줄은 문제(또는 부활전)가 바뀌면 비운다 */
var _gbNum = '', _gbNumK = '', _gbNumMsg = '';
function gbNumSync(){ var k = gbTKey(); if(_gbNumK !== k){ _gbNumK = k; _gbNum = ''; _gbNumMsg = ''; } }
/* 부른 번호만 생존(부활전이면 부활)으로, 나머지 후보는 탈락으로 — text 가 없으면 입력 칸에서 읽는다(리모컨은 text 로) */
function gbNumApply(text){
  if(!GB || !GB.ready || (GB.done && !GB.rv)) return;
  var el = $('gbNumIn');
  if(text == null) text = el ? el.value : _gbNum;
  var want = gbParseNums(text), rv = !!GB.rv;
  if(!Object.keys(want).length){
    toast(rv ? '맞힌 사람 번호를 넣어 주세요 — 예: 2,7,11' : '살아남은 번호를 넣어 주세요 — 예: 1,3,5,6');
    if(el) el.focus(); return;
  }
  var c = gbCand(), hit = {}, i, s, no, on = 0, off = 0, keep = 0;
  for(i=0;i<c.length;i++){ no = +c[i].number; if(no && want[no]) hit[no] = 1; }
  if(!Object.keys(hit).length){
    toast('그 번호는 ' + (rv ? '탈락한 사람' : '지금 살아 있는 사람') + ' 중에 없어요');
    return;
  }
  for(i=0;i<c.length;i++){
    s = c[i]; no = +s.number;
    if(!no){ keep++; continue; }              /* 번호가 없는 학생은 손대지 않는다 */
    gbSetOn(s.id, !!want[no]);
  }
  for(i=0;i<c.length;i++){
    if(rv ? GB.rv.ids[c[i].id] != null : GB.alive[c[i].id]) on++; else off++;
  }
  var miss = Object.keys(want).filter(function(n){ return !hit[n]; }).map(Number).sort(function(a, b){ return a - b; });
  gbNumSync();
  _gbNum = String(text);
  _gbNumMsg = (rv ? '🔥 ' + on + '명 부활' : '✔ ' + on + '명 생존 · ' + off + '명 탈락') +
              (miss.length ? ' · ' + miss.join(', ') + '번은 ' + (rv ? '탈락한 사람이 아니라' : '살아 있는 사람이 아니라') + ' 그대로 뒀어요' : '') +
              (keep ? ' · 번호 없는 ' + keep + '명은 그대로' : '');
  gbSave();
  if(rv && on) gbSyn('pop');
  renderGB();
}
/* 명단 머리 — 제목(눌러서 접고 펴기, 이 기기에 기억) · 전체 선택 · 전체 해제 */
function gbRosterHd(k, title){
  var f = gbFoldOn(k);
  return '<div class="hd"><h3 class="gbros-t" onclick="gbFold(\'' + k + '\')">' + title +
         '<span class="gbros-f">' + (f ? '▸ 펼치기' : '▾ 접기') + '</span></h3>' +
         '<span style="display:flex;gap:5px"><button class="chip sm" onclick="gbAll(1)">✔ 전체 선택</button>' +
         '<button class="chip sm" onclick="gbAll(0)">✕ 전체 해제</button></span></div>';
}
function gbNumRow(ph, btn, note){
  gbNumSync();
  return '<div class="gbnum"><input class="inp" id="gbNumIn" inputmode="decimal" autocomplete="off" placeholder="' + ph + '"' +
         ' value="' + escq(_gbNum) + '" oninput="_gbNum=this.value"' +
         ' onkeydown="if(event.key===\'Enter\'){event.preventDefault();gbNumApply();}">' +
         '<button class="chip" onclick="gbNumApply()">' + btn + '</button></div>' +
         '<div class="gbnum-m' + (_gbNumMsg ? ' ok' : '') + '">' + (_gbNumMsg ? esc(_gbNumMsg) : note) + '</div>';
}

/* ── 🏅 시상식에서 빼기 — 실수로 살려 둔 사람(사실은 틀린 사람)을 결과 화면에서 누르면
   마지막 문제에서 떨어진 것으로 돌려 도장 명단·생존 수·명예의 전당 기록에서 뺀다.
   몇 번에서 틀렸는지는 모르니 «문제별 탈락»에는 세지 않는다. 다시 누르면 돌아온다. */
function gbIsEx(id){ return !!(GB && GB.ex && GB.ex[id] && !GB.alive[id] && GB.out[id] > 0); }
function gbExIds(){ return GB && GB.ex ? Object.keys(GB.ex).filter(gbIsEx) : []; }
function gbExTap(id){
  if(!GB || !GB.done || GB.rv) return;
  GB.ex = GB.ex || {};
  if(GB.alive[id]){
    delete GB.alive[id]; GB.out[id] = GB.total; GB.ex[id] = 1;
    toast('✋ ' + gbLabel(id) + ' — 시상에서 뺐어요 · 다시 누르면 돌아와요');
  } else if(gbIsEx(id)){
    delete GB.ex[id]; delete GB.out[id]; GB.alive[id] = 1;
    toast('🏅 ' + gbLabel(id) + ' — 다시 넣었어요');
  } else return;
  gbSave(); gbHofRecord(); renderGB();
}

/* 진행 중이던 골든벨이 이 반 것이 맞는지 */
function gbMatchesClass(){
  return GB && S.selClass && GB.g === S.selClass.grade && GB.c === S.selClass.cls;
}

/* 탭에서 «시작»을 눌렀을 때만 상태를 만든다. 탭에 들어왔다고 바로 시작하면
   지난 골든벨을 덮어쓰게 된다. */
function gbBegin(){
  if(!S.selClass){ toast('반을 먼저 골라주세요'); return; }
  gbLoad();
  if(GB && !gbMatchesClass()){
    if(!confirm('다른 반(' + GB.g + '-' + GB.c + ') 골든벨이 진행 중이에요. 새로 시작할까요?')) return;
    gbClear();
  }
  if(!GB) gbSetup();
  renderGB();
}
function closeGB(){ teaTab('give'); }

/* ── 준비: 전원 참가, 결석·불참만 빼고 시작 ── */
function gbSetup(){
  var names = {}, alive = {}, i, s, n = parseInt(gbLs('gb_cnt', '4'), 10);
  for(i=0;i<S.students.length;i++){
    s = S.students[i];
    names[s.id] = (s.number ? s.number + '. ' : '') + (s.name || '');
    alive[s.id] = 1;
  }
  GB = { g:S.selClass.grade, c:S.selClass.cls, total:(n > 0 ? n : 4), round:1,
         alive:alive, out:{}, names:names, done:false, ready:false };
  gbSave();
}

function gbSetTotal(n){ gbSetWant(n); }

/* 준비 단계에서 누르면 «오늘 안 함»(결석 등) — 시작 뒤에는 «탈락» */
function gbTap(id){
  if(!GB) return;
  if(GB.alive[id]){ delete GB.alive[id]; GB.out[id] = GB.ready ? GB.round : 0; }
  else { delete GB.out[id]; GB.alive[id] = 1; if(GB.rvd) delete GB.rvd[id]; if(GB.ex) delete GB.ex[id]; }
  gbSave(); renderGB();
}

function gbStart(){
  if(!GB) return;
  if(!gbAliveIds().length){ toast('참가할 학생이 없어요'); return; }
  GB.ready = true; GB.round = 1; GB.rev = 0; GB.st = {}; GB.rvd = {}; GB.rv = null; GB.rvq = []; GB.gacha = [];
  GB.gid = 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);   /* 명예의 전당 한 판 */
  GB.n0 = gbAliveIds().length; GB.day = todayStr();
  gbSave();
  gbTimerStop();
  gbMarkUsed(gbqAt(1));
  gbPlayBgm();          /* 교사가 누른 직후라 브라우저가 소리를 막지 않는다 */
  renderGB();
  window.scrollTo(0, 0);
}

/* 이번 문제에서 몇 명이 떨어졌는지 — 문제별 탈락률로 모은다(한 판에 한 번만) */
function gbStatRound(){
  if(!GB || !GB.ready) return;
  GB.st = GB.st || {};
  if(GB.st[GB.round]) return;
  var q = gbqAt(GB.round); if(!q || !q.id) return;
  var x = 0, id;
  for(id in GB.out){ if(GB.out[id] === GB.round) x++; }
  gbStatRec(q, gbAliveIds().length + x, x);
  GB.st[GB.round] = 1;
}

function gbNext(){
  if(!GB || GB.rv) return;
  gbStatRound();
  gbTimerStop();
  GB.rev = 0;           /* 문제가 바뀌면 정답은 다시 감춘다 */
  if(GB.round >= GB.total){
    GB.done = true;
    gbHofRecord();      /* 🏆 반 기록 — 이 기기에 먼저, 서버에도 */
    gbStopBgm();
    if(gbAliveIds().length) gbSfx('fanfare');
  } else {
    GB.round += 1;
    gbMarkUsed(gbqAt(GB.round));
    gbSfx('write');     /* 다음 문제 — «정답을 써주세요» */
  }
  gbSave(); renderGB();
  window.scrollTo(0, 0);
}
function gbBack(){
  if(!GB || GB.rv || GB.round <= 1 && !GB.done) return;
  gbTimerStop();
  if(GB.done){          /* 결과에서 되돌아오면 마지막 문제로 — 배경음을 다시 켠다 */
    GB.done = false; GB.rev = 0; gbPlayBgm(); gbSave(); renderGB(); return;
  }
  /* 한 라운드 되돌리기 — 그 라운드에서 탈락한 사람을 모두 되살린다 */
  var r = GB.round, id;
  for(id in GB.out){ if(GB.out[id] === r){ delete GB.out[id]; GB.alive[id] = 1; } }
  GB.round -= 1; GB.rev = 0; gbSave(); renderGB();
}
function gbReset(){
  if(!confirm('지금까지 진행한 걸 지우고 처음부터 다시 할까요?')) return;
  gbTimerStop(); gbgClose(true);
  gbSetup(); renderGB();
}
function gbQuit(){
  if(!confirm('골든벨을 끝내고 나갈까요? (도장을 아직 안 찍었다면 기록은 사라집니다)')) return;
  gbTimerStop(); gbgClose(true);
  gbStopBgm(); gbClear(); closeGB();
}
/* 끝난 뒤 «한 문제 더» — 부활한 사람까지 다 같이 연장전 */
function gbExtend(){
  if(!GB || !GB.done) return;
  GB.total += 1; GB.round = GB.total; GB.done = false; GB.rev = 0;
  if(!gbqAt(GB.round)){
    gbqLoad();
    var q = GBQ.length === GB.round - 1 ? gbSpare(null) : null;
    if(q){ GBQ.push(q); gbqSave(); }
  }
  gbMarkUsed(gbqAt(GB.round));
  gbSave(); gbPlayBgm(); gbSfx('write'); renderGB();
  window.scrollTo(0, 0);
}

/* 가장 오래 살아남은 사람들 — 아무도 끝까지 못 갔을 때 쓴다 */
function gbFurthest(){
  var best = 0, id, r;
  for(id in GB.out){ if(gbIsEx(id)) continue; r = GB.out[id]; if(r > best) best = r; }   /* 시상에서 뺀 사람은 제외 */
  var list = [];
  for(id in GB.out){ if(best > 0 && GB.out[id] === best && !gbIsEx(id)) list.push(id); }
  return { round: best, ids: list };
}

/* ══════════════════════════════════════════════════════════════════════════
   🔥 패자부활전 — 가챠로 «할지 말지»를 정하고, 부활 문제를 맞힌 사람을 살린다
   ══════════════════════════════════════════════════════════════════════════ */
function gbRvStart(){
  if(!GB || !GB.ready) return;
  if(!gbOutIds().length){ toast('탈락한 사람이 없어요'); return; }
  gbTimerStop();
  var q = gbSpare(null);
  GB.rv = { q:q, rev:0, ids:{} };
  if(q){ (GB.rvq = GB.rvq || []).push(q.id); gbMarkUsed(q); }
  gbSave(); gbSfx('write'); renderGB();
  window.scrollTo(0, 0);
}
function gbRvTap(id){
  if(!GB || !GB.rv) return;
  if(GB.rv.ids[id] != null){ GB.out[id] = GB.rv.ids[id]; delete GB.alive[id]; delete GB.rv.ids[id]; }
  else if(GB.out[id] > 0){ GB.rv.ids[id] = GB.out[id]; delete GB.out[id]; GB.alive[id] = 1; gbSyn('pop'); }
  gbSave(); renderGB();
}
function gbRvEnd(){
  if(!GB || !GB.rv) return;
  var ids = Object.keys(GB.rv.ids), i;
  GB.rvd = GB.rvd || {};
  for(i=0;i<ids.length;i++){ GB.rvd[ids[i]] = GB.round; if(GB.ex) delete GB.ex[ids[i]]; }   /* 부활했으면 «시상 제외»도 풀린다 */
  GB.rvn = (GB.rvn || 0) + 1;
  GB.rv = null; gbTimerStop(); gbSave();
  if(GB.done) gbHofRecord();      /* 끝난 뒤 부활전이면 기록도 고친다 */
  if(ids.length){ gbSfx('fanfare'); toast('🔥 ' + ids.length + '명 부활!'); }
  else toast('이번엔 아무도 부활하지 못했어요');
  if(GB.done && ids.length) gbPlayBgm();
  renderGB();
  window.scrollTo(0, 0);
}
function gbRvCancel(){
  if(!GB || !GB.rv) return;
  if(!confirm('패자부활전을 없던 일로 할까요? (살린 사람도 다시 탈락으로 돌아가요)')) return;
  var id;
  for(id in GB.rv.ids){ GB.out[id] = GB.rv.ids[id]; delete GB.alive[id]; }
  GB.rv = null; gbTimerStop(); gbSave(); renderGB();
}
function gbRvCards(){
  var list = S.students.slice().sort(function(a,b){ return (a.number||0) - (b.number||0); });
  var h = '', i, s, inRv, out;
  for(i=0;i<list.length;i++){
    s = list[i];
    inRv = GB.rv.ids[s.id] != null; out = GB.out[s.id] > 0;
    if(!inRv && !out) continue;
    h += '<button class="stu' + (inRv ? ' sel' : '') + '"' + (inRv ? '' : ' style="opacity:.6"') +
         ' onclick="gbRvTap(\'' + s.id + '\')">' +
         '<span class="stu-c' + (inRv ? '' : ' zero') + '">' + (inRv ? '🔥' : GB.out[s.id] + '번') + '</span>' +
         '<div class="stu-n">' + esc((s.number ? s.number + '. ' : '') + (s.name || '')) + '</div>' +
         '<div class="stu-m">' + (inRv ? '부활!' : GB.out[s.id] + '번에서 탈락') + '</div></button>';
  }
  return h || '<div class="empty" style="grid-column:1/-1"><p>탈락한 사람이 없어요</p></div>';
}

/* ── 🎰 가챠 ── */
var _gbg = null;      /* {st:'ready'|'spin'|'done', win} */
function gbGachaP(){ var n = parseInt(gbLs('gb_gacha_p', '50'), 10); return (n > 0 && n < 100) ? n : 50; }
function gbgSetP(n){
  gbLsSet('gb_gacha_p', String(n));
  var el = $('gbgP'); if(el) el.innerHTML = gbgPChips();
}
function gbgPChips(){
  var p = gbGachaP();
  return '부활 확률 ' + [30, 50, 70].map(function(k){
    return '<button class="' + (p === k ? 'on' : '') + '" onclick="gbgSetP(' + k + ')">' + k + '%</button>';
  }).join('');
}
function gbGacha(){
  if(!GB || !GB.ready){ toast('골든벨을 시작한 뒤에 쓸 수 있어요'); return; }
  if(GB.rv){ toast('패자부활전이 진행 중이에요'); return; }
  if($('gbGacha')) return;
  var outN = gbOutIds().length;
  if(!outN){ toast('아직 탈락한 사람이 없어요'); return; }
  gbTimerStop();
  var hw = gbHW(), cols = hw ? ['#ff8a1f','#7b3fe4','#9be564','#ff8a1f','#2b2b2b','#ffd166','#c0392b']
                            : ['#ff5b7f','#ffcc33','#5bc0ff','#7ee08f','#c38bff','#ff9a3c','#ffffff'], caps = '', i, x, y;
  for(i=0;i<16;i++){
    x = 8 + Math.random() * 66; y = 38 + Math.random() * 44;
    caps += '<span class="gm-cap" style="left:' + x.toFixed(1) + '%;top:' + y.toFixed(1) + '%;background:' +
            cols[i % cols.length] + ';animation-delay:-' + (Math.random() * .3).toFixed(2) + 's"></span>';
  }
  var el = document.createElement('div');
  el.id = 'gbGacha'; el.className = 'gbg';
  el.innerHTML = '<button class="gbg-x" onclick="gbgClose()">✕ 닫기</button>' +
    '<div class="gbg-t">' + (hw ? '🎃 트릭 오어 트릿 가챠' : '🎰 패자부활전 가챠') + '</div>' + (hw ? gbHWDeco() : '') +
    '<div class="gbg-s">탈락한 ' + outN + '명에게 한 번 더 기회가 올까?</div>' +
    '<div class="gm" id="gbgM"><div class="gm-dome">' + caps + '</div><div class="gm-neck"></div>' +
    '<div class="gm-body"><div class="gm-knob" id="gbgK"></div><div class="gm-chute"></div><div class="gm-lbl">' + (hw ? 'TRICK or TREAT' : 'REVIVAL') + '</div>' +
    '<div class="gm-drop" id="gbgD"><div class="h1"></div><div class="h2" id="gbgH2"></div></div></div></div>' +
    '<div class="gbg-res" id="gbgR"><div class="small">레버를 돌려 주세요</div></div>' +
    '<div class="gbg-p" id="gbgP">' + gbgPChips() + '</div>' +
    '<div class="gbg-btns" id="gbgB"><button class="gbg-btn" onclick="gbgPull()">🎰 레버 돌리기</button></div>' +
    '<div class="gbs-kbd" style="color:#9d8fd6">스페이스 = 돌리기 · Esc = 닫기</div>';
  document.body.appendChild(el);
  _gbg = { st:'ready' };
  gbRmKick(true);
}
function gbgPull(){
  if(!_gbg || _gbg.st !== 'ready') return;
  _gbg.st = 'spin';
  var win = Math.random() * 100 < gbGachaP();
  _gbg.win = win;
  $('gbgP').style.visibility = 'hidden';
  $('gbgB').innerHTML = '';
