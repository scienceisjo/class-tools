<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🏅 과학 칭찬도장판</title>
<meta name="theme-color" content="#C2703E">
<meta name="description" content="칭찬을 모으면 나만의 캐릭터가 자라는 과학 칭찬도장판">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --paper:#FBF6E9; --paper2:#F3EBD6; --card:#FFFDF7;
  --ink:#3A3226; --ink2:#6B5F4E; --mute:#A39682;
  --line:#E0D3B8; --line2:#CDBC9A;
  --ac:#C2703E; --ac-d:#9C5427; --ac-l:#F0D9C6;
  --ok:#5CB86E; --ok-d:#3D8B4F; --warn:#E8A93A; --bad:#D9534F;
  --fs-xxs:clamp(11px,2.5vw,13px); --fs-xs:clamp(12.5px,2.9vw,14.5px);
  --fs-s:clamp(14px,3.2vw,16px);   --fs-m:clamp(16px,3.8vw,19px);
  --fs-l:clamp(19px,4.6vw,24px);   --fs-xl:clamp(24px,6vw,34px);
  --font:'Pretendard Variable',Pretendard,-apple-system,system-ui,'Malgun Gothic',sans-serif;
  --sh:0 4px 20px rgba(120,100,70,.10);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--font);color:var(--ink);background:var(--paper);
  background-image:radial-gradient(rgba(180,160,120,.10) 1px,transparent 1px),
                   radial-gradient(rgba(180,160,120,.07) 1px,transparent 1px);
  background-size:22px 22px,22px 22px;background-position:0 0,11px 11px;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{border:none;background:none;cursor:pointer}

/* ── 화면 ── */
.scr{display:none;min-height:100dvh;flex-direction:column}
.scr.on{display:flex}
.wrap{width:100%;max-width:960px;margin:0 auto;padding:0 clamp(12px,3.5vw,22px)}

/* ── 로그인 ── */
#s-login{align-items:center;justify-content:center;padding:24px 0 40px}
.lg-card{background:var(--card);border:2px solid var(--line);border-radius:24px;
  padding:clamp(22px,5vw,36px);box-shadow:var(--sh);width:min(430px,94vw)}
.lg-logo{text-align:center;font-size:clamp(44px,11vw,68px);line-height:1}
.lg-t{text-align:center;font-size:var(--fs-xl);font-weight:900;margin-top:4px;letter-spacing:-.02em}
.lg-s{text-align:center;font-size:var(--fs-xs);color:var(--ink2);font-weight:600;margin-top:6px;line-height:1.5}
.lg-tabs{display:flex;gap:6px;margin:22px 0 16px;background:rgba(0,0,0,.045);padding:4px;border-radius:12px}
.lg-tab{flex:1;padding:9px;border-radius:9px;font-size:var(--fs-xs);font-weight:800;color:var(--mute)}
.lg-tab.on{background:#fff;color:var(--ac-d);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.fl{display:block;font-size:var(--fs-xxs);font-weight:800;color:var(--ink2);margin:12px 0 5px}
.inp{width:100%;padding:11px 13px;border:2px solid var(--line);border-radius:11px;background:#fff;
  font-size:var(--fs-s);font-weight:600;outline:none}
.inp:focus{border-color:var(--ac)}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:13px;
  border-radius:13px;background:var(--ac);color:#fff;font-size:var(--fs-s);font-weight:900;
  box-shadow:0 4px 14px rgba(194,112,62,.3);transition:transform .12s}
.btn:active{transform:translateY(2px)}
.btn.g{background:var(--ok-d);box-shadow:0 4px 14px rgba(61,139,79,.28)}
.btn.ghost{background:#fff;color:var(--ink2);border:2px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.5}
.err{display:none;margin-top:10px;background:rgba(217,83,79,.1);color:var(--bad);
  border-radius:9px;padding:9px 12px;font-size:var(--fs-xxs);font-weight:800}
.err.show{display:block}

/* ── 헤더 ── */
.hdr{position:sticky;top:0;z-index:30;background:rgba(251,246,233,.94);backdrop-filter:blur(12px);
  border-bottom:2px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:10px;padding:10px 0}
.hdr-t{font-size:var(--fs-s);font-weight:900;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-b{font-size:var(--fs-xxs);font-weight:800;color:var(--mute);padding:6px 11px;border-radius:999px;
  border:1.5px solid var(--line);background:#fff}

/* ── 탭바 ── */
.tabs{display:flex;gap:4px;padding:0 0 8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:78px;min-height:44px;padding:11px 6px;border-radius:12px;font-size:var(--fs-xxs);
  font-weight:800;color:var(--mute);background:#fff;border:1.5px solid var(--line);white-space:nowrap}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}

main{flex:1;padding:14px 0 90px}
.pane{display:none}
.pane.on{display:block;animation:up .25s ease}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ── 카드 ── */
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;
  padding:clamp(14px,3.4vw,20px);box-shadow:var(--sh);margin-bottom:12px}
.card h3{font-size:var(--fs-m);font-weight:900;margin-bottom:4px}
.card .sub{font-size:var(--fs-xxs);color:var(--ink2);font-weight:600;line-height:1.5}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}

/* ── 학생 도장판 ── */
.char-box{text-align:center;position:relative}
.char-box svg,.char-box img.charimg{width:min(260px,64vw);height:auto;display:block;margin:0 auto}

/* 🔭 다음 단계 미리보기 — 무엇이 되는지 알아야 모으고 싶어진다 */
.peek{margin-top:12px;border:2px dashed var(--line);border-radius:14px;
 padding:11px 13px;background:var(--paper2)}
.peek.done{border-style:solid;border-color:var(--ok);background:var(--paper2)}
.peek-row{display:flex;align-items:center;gap:13px;text-align:left}
.peek-img{position:relative;width:68px;flex:none}
.char-box .peek-img svg,.char-box .peek-img img.charimg{
 width:68px;height:68px;object-fit:contain;display:block;margin:0;
 filter:grayscale(.2) contrast(.95);opacity:.9}
.peek-img .lk{position:absolute;right:-1px;bottom:-1px;font-size:15px;
 background:#fff;border-radius:999px;padding:1px 3px;box-shadow:var(--sh)}
.peek-tx{flex:1;min-width:0}
.peek-tx .k{display:block;font-size:var(--fs-xxs);color:var(--mute)}
.peek-tx .nm{display:block;font-size:var(--fs-m);font-weight:900;margin:1px 0 2px;line-height:1.25}
.peek-tx .nd{display:block;font-size:var(--fs-xs);color:var(--ink2);line-height:1.5}
.peek-tx .nd b{color:var(--ac-d)}
.peek-b{font-size:var(--fs-xxs);color:var(--mute);margin-top:9px;line-height:1.65;text-align:left}
.peek-b b{color:var(--ink)}
.peek-go{margin-top:10px;width:100%}
.char-name{font-size:var(--fs-l);font-weight:900;margin-top:2px}
.char-sub{font-size:var(--fs-xs);color:var(--ink2);font-weight:700}
.counters{display:flex;gap:10px;justify-content:center;margin:14px 0 6px}
.cnt{background:#fff;border:2px solid var(--line);border-radius:14px;padding:9px 16px;min-width:100px}
.cnt .n{font-size:var(--fs-l);font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.cnt .l{font-size:10.5px;font-weight:800;color:var(--mute);margin-top:3px}
.cnt.earn .n{color:var(--ac-d)} .cnt.bal .n{color:var(--ok-d)}
.bar{height:14px;border-radius:999px;background:#E8DCC4;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--warn));
  border-radius:999px;transition:width .5s ease}
.bar-l{display:flex;justify-content:space-between;font-size:10.5px;font-weight:800;color:var(--mute);margin-top:5px}

/* ── 도장 목록 ── */
.stamp{display:flex;gap:11px;padding:11px 0;border-bottom:1.5px dashed var(--line)}
.stamp:last-child{border-bottom:none}
.stamp-ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:20px;flex-shrink:0;
  border:2.5px dashed rgba(0,0,0,.14)}
.stamp-b{flex:1;min-width:0}
.stamp-cat{font-size:10.5px;font-weight:900;padding:2px 8px;border-radius:999px;display:inline-block}
.stamp-bh{font-size:var(--fs-xs);font-weight:700;line-height:1.5;margin-top:4px;word-break:keep-all}
.stamp-m{font-size:10.5px;color:var(--mute);font-weight:700;margin-top:3px}

/* ── 선택 칩 ── */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:8px 13px;border-radius:999px;border:2px solid var(--line);background:#fff;
  font-size:var(--fs-xxs);font-weight:800;color:var(--ink2)}
.chip.on{color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(0,0,0,.16)}
.chip.sm{padding:6px 11px;font-size:11.5px}

/* ── 교사: 학생 그리드 ── */
.stu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:7px}
.stu{padding:9px 5px;border-radius:12px;border:2px solid var(--line);background:#fff;text-align:center;position:relative}
.stu.sel{border-color:var(--ac);background:#FFF4EA;box-shadow:0 3px 10px rgba(194,112,62,.2)}
.stu-n{font-size:var(--fs-xs);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stu-m{font-size:10px;font-weight:800;color:var(--mute);margin-top:2px}
.stu-m.cold{color:var(--bad)}
.stu-c{position:absolute;top:-5px;right:-4px;background:var(--ok-d);color:#fff;font-size:10px;font-weight:900;
  min-width:19px;height:19px;border-radius:999px;display:grid;place-items:center;padding:0 5px}
.stu-c.zero{background:var(--mute)}
/* 🌳 질문과수원 연계 — 학생의 최근 질문 */
.qhint{background:#F2FAF3;border:2px solid rgba(92,184,110,.35);border-radius:14px;padding:11px 13px;margin-top:11px}
.qhint-h{font-size:11.5px;font-weight:900;color:var(--ok-d);margin-bottom:7px;display:flex;align-items:center;gap:5px}
.qh-item{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed rgba(92,184,110,.3)}
.qh-item:last-child{border-bottom:none}
.qh-t{flex:1;font-size:var(--fs-xxs);font-weight:700;line-height:1.5;word-break:keep-all}
.qh-d{font-size:10px;color:var(--mute);font-weight:800;margin-top:2px}
.qh-b{flex-shrink:0;padding:5px 9px;border-radius:8px;background:var(--ok-d);color:#fff;font-size:10.5px;font-weight:900}
/* 💡 이럴 때 도장을 받아요 */
.how{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1.5px dashed var(--line)}
.how:last-child{border-bottom:none}
.how-ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:17px;flex-shrink:0;background:var(--ac-l)}
.how-t{flex:1;font-size:var(--fs-xs);font-weight:800;line-height:1.5;word-break:keep-all}
.how-s{font-size:10.5px;color:var(--mute);font-weight:700;margin-top:2px}

/* ── 우리 반 기지 ── */
.base-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:9px}
.mate{text-align:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:7px 4px}
.mate svg,.mate img.charimg{width:100%;height:auto}
.mate-n{font-size:11.5px;font-weight:900;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mate-b{font-size:10px;font-weight:800;color:var(--mute)}
.mate.me{border-color:var(--ac);background:#FFF8F1}

/* ── 보상 ── */
.rw{display:flex;align-items:center;gap:11px;padding:11px;border:2px solid var(--line);
  border-radius:14px;background:#fff;margin-bottom:8px}
.rw-ic{font-size:23px;width:38px;text-align:center;flex-shrink:0}
.rw-b{flex:1;min-width:0}
.rw-n{font-size:var(--fs-xs);font-weight:900}
.rw-c{font-size:10.5px;font-weight:800;color:var(--mute);margin-top:2px}
.rw-btn{padding:7px 13px;border-radius:10px;background:var(--ok-d);color:#fff;font-size:11.5px;font-weight:900;flex-shrink:0}
.rw-btn:disabled{background:#D8CDB6;color:#fff}
.rw.locked{opacity:.55}
.rw.honor{border-color:var(--warn);background:#FFFBF0}
.coupon{border:2.5px dashed var(--ac);border-radius:14px;padding:12px;background:#FFF4EA;margin-bottom:8px}
.coupon.done{border-style:solid;border-color:var(--line);background:#F6F1E4;opacity:.7}

/* ── 기타 ── */
.empty{text-align:center;padding:34px 16px;color:var(--mute)}
.empty .e{font-size:40px} .empty p{font-size:var(--fs-xs);font-weight:700;margin-top:8px;line-height:1.6}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(58,50,38,.95);
  color:#fff;padding:12px 20px;border-radius:999px;font-size:var(--fs-xs);font-weight:800;z-index:200;
  box-shadow:0 8px 26px rgba(0,0,0,.3);max-width:88vw;text-align:center}
.load{position:fixed;inset:0;background:rgba(251,246,233,.9);display:none;place-items:center;z-index:300}
.load.show{display:grid}
.spin{width:38px;height:38px;border:4px solid var(--line);border-top-color:var(--ac);border-radius:50%;
  animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.mdl{position:fixed;inset:0;background:rgba(58,50,38,.45);display:none;align-items:center;justify-content:center;
  z-index:150;padding:16px}
.mdl.show{display:flex}
.mdl-in{background:var(--card);border-radius:20px;padding:20px;width:min(440px,94vw);max-height:86dvh;overflow-y:auto;
  border:2px solid var(--line)}
.pick{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}
/* 📖 캐릭터 도감 — 앞으로 어떤 모습이 되는지 미리 본다 */
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:10px}
.dex-i{position:relative;border:2px solid var(--line);border-radius:13px;padding:7px 4px 6px;background:#fff;text-align:center}
.dex-i.got{border-color:var(--ok);background:#F4FBF5}
.dex-i.now{border-color:var(--ac);background:var(--ac-l);box-shadow:0 0 0 3px rgba(194,112,62,.16)}
.dex-i.soon{opacity:.62}
.dex-i svg,.dex-i img.charimg{width:100%;height:auto;max-height:74px;object-fit:contain}
.dex-n{font-size:11px;font-weight:900;color:var(--ink);margin-top:3px;line-height:1.3;word-break:keep-all}
.dex-c{font-size:10px;font-weight:800;color:var(--mute);margin-top:1px}
.dex-i.got .dex-c{color:var(--ok-d)}
.dex-i.now .dex-c{color:var(--ac-d)}
.dex-b{position:absolute;top:4px;right:5px;font-size:11px}
.dex-tabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.dex-tabs::-webkit-scrollbar{display:none}
.dex-tabs button{flex:0 0 auto}
.pick-i{border:2px solid var(--line);border-radius:14px;padding:9px 5px;background:#fff;text-align:center}
.pick-i.on{border-color:var(--ac);background:#FFF4EA}
.pick-i svg,.pick-i img.charimg{width:100%;height:auto}
.pick-i .t{font-size:11.5px;font-weight:900;margin-top:3px}
footer{padding:18px 0 26px;text-align:center;color:var(--mute);font-size:11px;font-weight:700;line-height:1.7}
</style>
</head>
<body>

<!-- ══════════ 로그인 ══════════ -->
<div class="scr on" id="s-login">
  <div class="lg-card">
    <div class="lg-logo">🏅</div>
    <div class="lg-t">과학 칭찬도장판</div>
    <div class="lg-s">칭찬을 모으면 나만의 캐릭터가 자라요<br><b id="schoolName">해누리중학교</b></div>

    <div class="lg-tabs">
      <button class="lg-tab on" data-lg="student" onclick="lgTab('student')">🧒 학생</button>
      <button class="lg-tab" data-lg="teacher" onclick="lgTab('teacher')">🧑‍🏫 선생님</button>
    </div>

    <div id="lg-student">
      <label class="fl">학년 · 반 · 번호</label>
      <div class="row3">
        <input class="inp" id="sG" type="number" inputmode="numeric" placeholder="학년">
        <input class="inp" id="sC" type="number" inputmode="numeric" placeholder="반">
        <input class="inp" id="sN" type="number" inputmode="numeric" placeholder="번호">
      </div>
      <label class="fl">비밀번호</label>
      <input class="inp" id="sPw" type="password" placeholder="비밀번호" onkeydown="if(event.key==='Enter')doStudentLogin()">
      <div class="err" id="sErr"></div>
      <button class="btn" style="margin-top:16px" id="sBtn" onclick="doStudentLogin()">🏅 내 도장판 열기</button>
      <div class="lg-s" style="margin-top:12px;font-size:11px">질문과수원과 같은 계정으로 들어와요</div>
    </div>

    <div id="lg-teacher" style="display:none">
      <label class="fl">이메일</label>
      <input class="inp" id="tE" type="email" placeholder="teacher@haenuri.app">
      <label class="fl">비밀번호</label>
      <input class="inp" id="tPw" type="password" placeholder="비밀번호" onkeydown="if(event.key==='Enter')doTeacherLogin()">
      <div class="err" id="tErr"></div>
      <button class="btn" style="margin-top:16px" id="tBtn" onclick="doTeacherLogin()">🧑‍🏫 교사 모드 열기</button>
    </div>
  </div>
</div>

<!-- ══════════ 학생 ══════════ -->
<div class="scr" id="s-stu">
  <header class="hdr"><div class="wrap hdr-in">
    <div class="hdr-t">🏅 <span id="stuName">나</span>의 도장판</div>
    <span style="display:flex;gap:6px">
      <button class="hdr-b" onclick="openPw()" title="비밀번호 변경">🔑</button>
      <button class="hdr-b" onclick="doLogout()">로그아웃</button>
    </span>
  </div>
  <div class="wrap"><div class="tabs">
    <button class="tab on" data-p="board" onclick="stuTab('board')">🏅 도장판</button>
    <button class="tab" data-p="shop" onclick="stuTab('shop')">🎁 교환소</button>
    <button class="tab" data-p="base" onclick="stuTab('base')">🏕️ 우리 반</button>
    <button class="tab" data-p="log" onclick="stuTab('log')">📜 기록</button>
  </div></div>
  </header>
  <main class="wrap">
    <div class="pane on" id="p-board"></div>
    <div class="pane" id="p-shop"></div>
    <div class="pane" id="p-base"></div>
    <div class="pane" id="p-log"></div>
  </main>
</div>

<!-- 🔑 비밀번호 변경 -->
<div class="mdl" id="pwMdl" onclick="if(event.target.id==='pwMdl')closePw()">
  <div class="mdl-in" onclick="event.stopPropagation()">
    <h3 style="font-size:var(--fs-m);font-weight:900">🔑 비밀번호 변경</h3>

function drawCreature(st, b){

  st = st|0; if(st<0) st=0; if(st>6) st=6;
  var uid = ID + '-' + st;
  var G = 'url(#bg' + uid + ')';
  var PUP = '#1f2430';
  var SHELL = '#fdf7ea';

  function E(x,y,rx,ry,f,sw,ex){ return '<ellipse cx="'+x+'" cy="'+y+'" rx="'+rx+'" ry="'+ry+'" fill="'+f+'"'+(sw?' stroke="'+D+'" stroke-width="'+sw+'"':'')+(ex||'')+'/>'; }
  function CI(x,y,r,f,sw,ex){ return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+f+'"'+(sw?' stroke="'+D+'" stroke-width="'+sw+'"':'')+(ex||'')+'/>'; }
  function P(dd,f,sw,ex){ return '<path d="'+dd+'" fill="'+f+'"'+(sw?' stroke="'+D+'" stroke-width="'+sw+'" stroke-linejoin="round" stroke-linecap="round"':'')+(ex||'')+'/>'; }
  function LN(dd,col,w,ex){ return '<path d="'+dd+'" fill="none" stroke="'+col+'" stroke-width="'+w+'" stroke-linecap="round" stroke-linejoin="round"'+(ex||'')+'/>'; }

  function eye(x,y,r){
    var t = E(x,y,r,r*1.12,'#ffffff',Math.max(1.8,r*0.24));
    t += E(x+r*0.10,y+r*0.14,r*0.52,r*0.62,PUP,0);
    t += CI(x-r*0.26,y-r*0.34,r*0.28,'#ffffff',0);
    t += CI(x+r*0.30,y+r*0.44,r*0.14,'#ffffff',0,' opacity=".75"');
    return t;
  }
  function eyes(x,y,gap,r){ return eye(x-gap,y,r) + eye(x+gap,y,r); }
  function blush(x,y,gap,r){
    return E(x-gap,y,r,r*0.66,'#ff7a95',0,' opacity=".42"') + E(x+gap,y,r,r*0.66,'#ff7a95',0,' opacity=".42"');
  }
  function smile(x,y,w){ return LN('M '+(x-w)+' '+y+' Q '+x+' '+(y+w*0.9)+' '+(x+w)+' '+y, D, 2.4); }

    var dd = 'M '+x+' '+(y-r)+' Q '+x+' '+y+' '+(x+r)+' '+y+' Q '+x+' '+y+' '+x+' '+(y+r)+' Q '+x+' '+y+' '+(x-r)+' '+y+' Q '+x+' '+y+' '+x+' '+(y-r)+' Z';

  function sparkles(list){

    for(i=0;i<list.length;i++){ t += star(list[i][0],list[i][1],list[i][2],(i%2?L:'#ffffff'),0.9); }
    return t;
  }
  function ground(w){ return E(100,177.5,w,w*0.26,D,0,' opacity=".18"'); }

  s += '</defs>';

  /* ================= AURA (st 6) ================= */

    s += '<circle cx="100" cy="110" r="82" fill="url(#au'+uid+')"/>';
    s += '<circle cx="100" cy="110" r="68" fill="none" stroke="'+L+'" stroke-width="2" opacity=".55" stroke-dasharray="7 9"/>';
    s += '<circle cx="100" cy="110" r="79" fill="none" stroke="#ffffff" stroke-width="1.5" opacity=".35" stroke-dasharray="3 12"/>';
  }

  /* ================= ST 0 : EGG ================= */
  if(st===0){
    s += ground(30);
    s += E(100,138,34,42,G,3.4);

    } else if(ID==='collaborate'){

/* ═══════════════════════════════════════════════════════════════

function drawLab(st, b){
  var c = b.c, d = b.d, l = b.l, id = b.id || 'inquiry';
  st = st < 0 ? 0 : (st > 6 ? 6 : st);
  var GY = 176, LT = '#ffe08a', LG = '#fff3c4', GL = '#e9f6ff';
  function n(v){ return Math.round(v*100)/100; }
  function P(dd,f,sw){ return '<path d="'+dd+'" fill="'+(f||'none')+'" stroke="'+d+'" stroke-width="'+(sw==null?3:sw)+'" stroke-linejoin="round" stroke-linecap="round"/>'; }
  function PN(dd,f,op){ return '<path d="'+dd+'" fill="'+f+'"'+(op==null?'':' opacity="'+op+'"')+'/>'; }
  function PS(dd,col,sw,op){ return '<path d="'+dd+'" fill="none" stroke="'+col+'" stroke-width="'+sw+'" stroke-linecap="round" stroke-linejoin="round"'+(op==null?'':' opacity="'+op+'"')+'/>'; }
  function R(x,y,w,h,f,rx,sw){ return '<rect x="'+n(x)+'" y="'+n(y)+'" width="'+n(w)+'" height="'+n(h)+'" rx="'+(rx||0)+'" fill="'+f+'" stroke="'+d+'" stroke-width="'+(sw==null?3:sw)+'" stroke-linejoin="round"/>'; }
  function RN(x,y,w,h,f,rx,op){ return '<rect x="'+n(x)+'" y="'+n(y)+'" width="'+n(w)+'" height="'+n(h)+'" rx="'+(rx||0)+'" fill="'+f+'"'+(op==null?'':' opacity="'+op+'"')+'/>'; }
  function E(cx,cy,rx,ry,f,sw){ return '<ellipse cx="'+n(cx)+'" cy="'+n(cy)+'" rx="'+n(rx)+'" ry="'+n(ry)+'" fill="'+f+'" stroke="'+d+'" stroke-width="'+(sw==null?3:sw)+'"/>'; }
  function EN(cx,cy,rx,ry,f,op){ return '<ellipse cx="'+n(cx)+'" cy="'+n(cy)+'" rx="'+n(rx)+'" ry="'+n(ry)+'" fill="'+f+'"'+(op==null?'':' opacity="'+op+'"')+'/>'; }
  function LN(x1,y1,x2,y2,col,sw,op){ return '<line x1="'+n(x1)+'" y1="'+n(y1)+'" x2="'+n(x2)+'" y2="'+n(y2)+'" stroke="'+col+'" stroke-width="'+sw+'" stroke-linecap="round"'+(op==null?'':' opacity="'+op+'"')+'/>'; }
  function W(x,y,w,h,rx){ var r = (rx==null?1.5:rx);
    return RN(x-2,y-2,w+4,h+4,LG,r+2,0.35)+R(x,y,w,h,LT,r,2)
      +PN('M'+n(x+1.6)+' '+n(y+h-1.6)+'L'+n(x+w*0.62)+' '+n(y+1.6)+'L'+n(x+w-1.6)+' '+n(y+1.6)+'Z','#ffffff',0.5); }
  function grid(gx,gy,gw,gh,cols,rows){ var q='',i,j,cw=gw/cols,ch=gh/rows,ww=Math.min(cw*0.58,12),hh=Math.min(ch*0.55,11);
    for(j=0;j<rows;j++){ for(i=0;i<cols;i++){ q+=W(gx+cw*(i+0.5)-ww/2, gy+ch*(j+0.5)-hh/2, ww, hh, 1.2); } } return q; }
  function star(x,y,r,col,op){ return PN('M'+n(x)+' '+n(y-r)+'Q'+n(x+r*0.18)+' '+n(y-r*0.18)+' '+n(x+r)+' '+n(y)
      +'Q'+n(x+r*0.18)+' '+n(y+r*0.18)+' '+n(x)+' '+n(y+r)
      +'Q'+n(x-r*0.18)+' '+n(y+r*0.18)+' '+n(x-r)+' '+n(y)
      +'Q'+n(x-r*0.18)+' '+n(y-r*0.18)+' '+n(x)+' '+n(y-r)+'Z',(col||'#ffffff'),(op==null?0.95:op)); }
  function gear(cx,cy,r,t,f){ var q='',i;
    for(i=0;i<t;i++){ q+='<rect x="-2.4" y="'+n(-r-4.2)+'" width="4.8" height="6.4" rx="1.4" fill="'+f+'" stroke="'+d+'" stroke-width="2" stroke-linejoin="round" transform="translate('+n(cx)+','+n(cy)+') rotate('+n(i*360/t)+')"/>'; }
    q+=E(cx,cy,r,r,f,2.6)+E(cx,cy,r*0.32,r*0.32,d,0)+EN(cx-r*0.32,cy-r*0.34,r*0.3,r*0.2,'#ffffff',0.4); return q; }
  function smoke(x,y,k){ return '<g opacity="0.9">'+E(x,y,5*k,4.2*k,'#ffffff',2)+E(x+5.5*k,y-9*k,6.6*k,5.4*k,'#ffffff',2)+E(x-1.5*k,y-19*k,8.2*k,6.4*k,'#ffffff',2)+'</g>'; }
  function tuft(x,y,k,col){ return PS('M'+n(x)+' '+n(y)+'Q'+n(x-2*k)+' '+n(y-6*k)+' '+n(x-4.5*k)+' '+n(y-8*k),col,2.4,0.95)
      +PS('M'+n(x)+' '+n(y)+'Q'+n(x+1.5*k)+' '+n(y-7*k)+' '+n(x+3.5*k)+' '+n(y-9*k),col,2.4,0.95)
      +PS('M'+n(x)+' '+n(y)+'L'+n(x)+' '+n(y-6.5*k),col,2.4,0.95); }
  function flag(x,y,h,fc,dir){ return LN(x,y,x,y-h,d,3.2)+P('M'+n(x)+' '+n(y-h)+'L'+n(x+19*dir)+' '+n(y-h+6.5)+'L'+n(x)+' '+n(y-h+13)+'Z',fc,2.5)+E(x,y-h-2,2.6,2.6,LT,2); }
  function door(cx,w,h){ return R(cx-w/2,GY-h,w,h,d,2)+RN(cx-w/2+2.5,GY-h+2.5,w-5,3.5,'#ffffff',1.5,0.2)
      +PN('M'+n(cx-w/2)+' '+n(GY)+'L'+n(cx+w/2)+' '+n(GY)+'L'+n(cx+w)+' '+n(GY+6)+'L'+n(cx-w)+' '+n(GY+6)+'Z',LG,0.28); }
  function lamp(x,h){ return LN(x,GY,x,GY-h,d,3.4)+E(x,GY-h-4,5,5,LT,2.5)+EN(x,GY-h-4,10,10,LG,0.28); }
  function plant(x,y,k,c1,c2){ return E(x,y,7*k,5.5*k,c1,2.4)+E(x-6*k,y+2*k,5*k,4*k,c2,2.4)+E(x+6*k,y+2.5*k,4.5*k,3.6*k,c2,2.4)+E(x,y-4*k,3.2*k,3.2*k,LT,2); }

  else if(st === 1){

    else if(id === 'analysis'){

      var hbody = bh*0.60, ybody = GY - hbody;
      var ytop = ybody - (28 + lv*9);
      var apex = 100 - bw*0.14;
      var chx = 100 + bw*0.24, chTop = ytop - (4 + lv*7);
      s += R(chx, chTop, 13+lv, ybody-chTop, l, 2);
      s += R(chx-3.5, chTop-8, 20+lv, 9, c, 2);
      s += LN(chx, chTop+9, chx+13+lv, chTop+9, d, 2, 0.4) + LN(chx, chTop+18, chx+13+lv, chTop+18, d, 2, 0.35);
      s += smoke(chx+7, chTop-13, 0.72+lv*0.1);
      if(lv >= 2){
        s += R(chx-26, chTop+12, 10, ybody-chTop-12, l, 2) + R(chx-28.5, chTop+5, 15, 8, c, 2);
        s += smoke(chx-21, chTop-2, 0.55);
      }
      s += P('M'+n(x0-8)+' '+n(ybody)+'L'+n(apex)+' '+n(ytop)+'L'+n(x1+8)+' '+n(ybody)+'Z', l, 3.2);
      s += PN('M'+n(apex)+' '+n(ytop)+'L'+n(x1+8)+' '+n(ybody)+'L'+n(apex+7)+' '+n(ybody)+'Z', '#000', 0.13);
      for(i=1; i<=2+lv; i++){
        s += LN(apex-(apex-x0+8)*i/(3+lv), ytop+(ybody-ytop)*i/(3+lv), apex+(x1+8-apex)*i/(3+lv), ytop+(ybody-ytop)*i/(3+lv), d, 1.6, 0.22);
      }
      s += R(x0, ybody, bw, hbody, c, 2);
      s += RN(x0, ybody, 12, hbody, '#000', 0, 0.09);
      s += RN(x0+2.5, ybody+2.5, bw-5, 4, '#ffffff', 2, 0.2);
      s += P('M86 '+n(GY)+'L86 '+n(ybody+hbody*0.42)+'Q100 '+n(ybody+hbody*0.14)+' 114 '+n(ybody+hbody*0.42)+'L114 '+n(GY)+'Z', d, 2.6);
      s += LN(88, GY-2, 112, ybody+hbody*0.44, d, 2, 0.4) + LN(112, GY-2, 88, ybody+hbody*0.44, d, 2, 0.4);
      s += W(x0+6, ybody+hbody*0.24, 12, 10) + W(x1-18, ybody+hbody*0.24, 12, 10);
      s += W(apex-8, ytop+(ybody-ytop)*0.42, 15, 11, 2);
      s += gear(apex+bw*0.20, ytop+(ybody-ytop)*0.30, 8+lv*1.6, 8, l);
      s += gear(x0-7, ybody-8, 7+lv, 7, c);
      if(lv >= 1){ s += gear(x1+7, ybody+hbody*0.34, 6+lv*0.8, 6, l); }
      if(lv >= 2){
        s += LN(x1+4, ytop+16, x1+26, ytop+8, d, 4);
        s += LN(x1+24, ytop+8, x1+24, ytop+22, d, 2.4) + R(x1+18, ytop+22, 13, 10, l, 2);
      }
      if(lv >= 3){
        s += gear(x0-16, ybody-30, 13, 9, l);
        s += R(88, ybody-14, 26, 11, l, 2.5) + RN(91, ybody-10.5, 20, 3.5, d, 1.5, 0.5);
        s += star(x1+20, ytop+2, 5) + star(x0-24, ytop+26, 4.5,'#ffffff',0.85);
      }
    }
    /* ---------- COMMUNICATE : lecture hall ---------- */
    else if(id === 'communicate'){
      var stepH = 16, drumH = bh*0.48, ydrum = GY - stepH - drumH;
      var domeR = bw*0.5 + 4, yapex = ydrum - domeR*0.90;
      s += flag(x0-16, GY-stepH, 46+lv*8, l, -1) + flag(x1+16, GY-stepH, 46+lv*8, l, 1);
      s += P('M'+n(100-domeR)+' '+n(ydrum)+'A'+n(domeR)+' '+n(domeR*0.90)+' 0 0 1 '+n(100+domeR)+' '+n(ydrum)+'Z', c, 3.2);
      for(i=1; i<=3+lv; i++){
        s += LN(100, yapex+3, 100-domeR+ (2*domeR)*i/(4+lv), ydrum, d, 1.8, 0.25);
      }
      s += PN('M'+n(100-domeR*0.72)+' '+n(ydrum-2)+'Q'+n(100-domeR*0.62)+' '+n(yapex+10)+' '+n(100-domeR*0.16)+' '+n(yapex+3)
        +'Q'+n(100-domeR*0.5)+' '+n(yapex+16)+' '+n(100-domeR*0.52)+' '+n(ydrum-2)+'Z', '#ffffff', 0.32);
      s += R(93, yapex-13, 15, 14, l, 2);
      s += P('M88 '+n(yapex-13)+'L100 '+n(yapex-25)+'L112 '+n(yapex-13)+'Z', c, 2.6);
      s += E(100, yapex-28, 3.6, 3.6, LT, 2.4) + EN(100, yapex-28, 9, 9, LG, 0.3);
      s += W(96.5, yapex-9, 8, 8, 1.5);
      s += R(x0-7, ydrum-7, bw+14, 9, l, 2.5);
      s += RN(x0-4, ydrum-4.5, bw+8, 3, '#ffffff', 1.5, 0.28);
      s += R(x0, ydrum, bw, drumH, c, 2);
      s += RN(x0, ydrum, 11, drumH, '#000', 0, 0.10);
      var nc = 3 + lv;
      for(i=0; i<nc; i++){
        var cx2 = x0 + bw*(i+0.5)/nc;
        s += R(cx2-4.5, ydrum+2, 9, drumH-2, l, 3, 2.4);
      }
      s += door(100, 17+lv*2, drumH*0.62 + stepH);
      var ns = 3 + lv, wk, yk;
      for(k=0; k<ns; k++){
        wk = bw*0.62 + bw*0.78*(k+1)/ns;
        yk = GY - stepH + stepH*k/ns;
        s += R(100-wk/2, yk, wk, stepH/ns + 3, l, 2, 2.6);
      }
      if(lv >= 2){
        s += P('M'+n(x0+9)+' '+n(ydrum+3)+'L'+n(x1-9)+' '+n(ydrum+3)+'L'+n(x1-9)+' '+n(ydrum+16)+'L100 '+n(ydrum+12)+'L'+n(x0+9)+' '+n(ydrum+16)+'Z', LT, 2.6);
        s += RN(x0+17, ydrum+7, bw-34, 3.5, d, 2, 0.5);
      }
      if(lv >= 3){
        s += lamp(x0-26, 26) + lamp(x1+26, 26);
        s += star(x0-30, yapex+6, 5) + star(x1+30, yapex+18, 4.5, '#ffffff', 0.85);
      }
    }
    /* ---------- COLLABORATE : twin towers + skybridge ---------- */
    else if(id === 'collaborate'){
      var gapw = 18 + lv*3;
      var tw = (bw - gapw)/2;
      var lxx = x0, rxx = x1 - tw;
      var lh = bh + 10 + lv*5, rh = bh - 2;
      var lyt = GY - lh, ryt = GY - rh;
      if(lv >= 2){
        s += R(100-11, GY-bh*0.55, 22, bh*0.55, l, 2);
        s += P('M'+n(100-14)+' '+n(GY-bh*0.55)+'L100 '+n(GY-bh*0.55-13)+'L'+n(100+14)+' '+n(GY-bh*0.55)+'Z', c, 2.6);
        s += W(94, GY-bh*0.55+8, 12, 10);
      }
      s += R(lxx, lyt, tw, lh, c, 2);
      s += RN(lxx, lyt, 9, lh, '#000', 0, 0.10);
      s += P('M'+n(lxx-6)+' '+n(lyt)+'L'+n(lxx+tw/2)+' '+n(lyt-17-lv*4)+'L'+n(lxx+tw+6)+' '+n(lyt)+'Z', l, 3.2);
      s += PN('M'+n(lxx+tw/2)+' '+n(lyt-17-lv*4)+'L'+n(lxx+tw+6)+' '+n(lyt)+'L'+n(lxx+tw/2+5)+' '+n(lyt)+'Z', '#000', 0.13);
      s += E(lxx+tw/2, lyt-20-lv*4, 3.4, 3.4, LT, 2.2);
      s += R(rxx, ryt, tw, rh, l, 2);
      s += RN(rxx+tw-9, ryt, 9, rh, '#000', 0, 0.08);
      s += R(rxx-6, ryt-8, tw+12, 9, c, 2.6);
      s += LN(rxx+tw/2-6, ryt-8, rxx+tw/2-6, ryt-16, d, 2.6) + LN(rxx+tw/2+6, ryt-8, rxx+tw/2+6, ryt-16, d, 2.6);
      s += E(rxx+tw/2, ryt-20, 9.5, 8, c, 2.8) + EN(rxx+tw/2-3.5, ryt-22, 3.6, 2.4, '#ffffff', 0.35);
      s += grid(lxx+4, lyt+8, tw-8, lh-26, 2, 2+lv);
      s += grid(rxx+4, ryt+7, tw-8, rh-24, 2, 1+lv);
      var byy = lyt + lh*0.34;
      s += PS('M'+n(lxx+tw)+' '+n(byy+15)+'Q100 '+n(byy+34)+' '+n(rxx)+' '+n(byy+15), d, 2.4, 0.4);
      s += R(lxx+tw-3, byy, (rxx-lxx-tw)+6, 16, l, 3);
      s += RN(lxx+tw-1, byy+11, (rxx-lxx-tw)+2, 4, d, 1.5, 0.35);
      for(i=0; i<2; i++){ s += W(lxx+tw+2 + i*((rxx-lxx-tw)-4)/2, byy+3, 8, 8, 1.2); }
      if(lv >= 1){
        var by2 = lyt + lh*0.68;
        s += R(lxx+tw-3, by2, (rxx-lxx-tw)+6, 12, l, 3);
        s += LN(lxx+tw+3, by2, rxx-3, by2, d, 2, 0.4);
      }
      s += door(lxx+tw/2, 13, 16) + door(rxx+tw/2, 13, 16);
      if(lv >= 3){
        s += R(lxx-11, GY-9, bw+22, 9, l, 2.5);
        s += lamp(lxx-19, 24) + lamp(rxx+tw+19, 24);
        s += star(lxx-22, lyt-6, 5) + star(rxx+tw+20, ryt-22, 4.5, '#ffffff', 0.85);
      }
    }
    /* ---------- RESPONSIBLE : safety HQ ---------- */
    else {
      var cf = 7 + lv*1.5;
      var tx = 100 + bw*0.20, tth = 24 + lv*9;
      var cabB = y0 - 8, cabT = cabB - tth - 16;
      if(lv >= 2){
        s += R(x0-20, GY-bh*0.55, 24, bh*0.55, l, 2.5);
        s += R(x0-23, GY-bh*0.55-7, 30, 8, c, 2.5);
        s += grid(x0-16, GY-bh*0.55+6, 16, bh*0.55-16, 2, 2);
      }
      s += R(tx-9, cabT+16, 18, tth, c, 2);
      s += RN(tx-9, cabT+16, 6, tth, '#000', 0, 0.10);
      s += P('M'+n(tx-16)+' '+n(cabT+17)+'L'+n(tx-11)+' '+n(cabT)+'L'+n(tx+11)+' '+n(cabT)+'L'+n(tx+16)+' '+n(cabT+17)+'Z', l, 3);
      s += W(tx-11, cabT+4, 9, 9, 1.5) + W(tx+1.5, cabT+4, 9, 9, 1.5);
      s += E(tx, cabT-5, 4.2, 4.2, '#ff8a8a', 2.4);
      s += PN('M'+n(tx)+' '+n(cabT-5)+'L'+n(tx-30)+' '+n(cabT-15)+'L'+n(tx-30)+' '+n(cabT-3)+'Z', '#fff0ee', 0.34);
      s += PN('M'+n(tx)+' '+n(cabT-5)+'L'+n(tx+30)+' '+n(cabT-13)+'L'+n(tx+30)+' '+n(cabT-4)+'Z', '#fff0ee', 0.2);
      s += P('M'+n(x0)+' '+n(GY)+'L'+n(x0)+' '+n(y0+cf)+'L'+n(x0+cf)+' '+n(y0)+'L'+n(x1-cf)+' '+n(y0)+'L'+n(x1)+' '+n(y0+cf)+'L'+n(x1)+' '+n(GY)+'Z', c, 3.2);
      s += PN('M'+n(x0)+' '+n(GY)+'L'+n(x0)+' '+n(y0+cf)+'L'+n(x0+cf)+' '+n(y0)+'L'+n(x0+cf+11)+' '+n(y0)+'L'+n(x0+11)+' '+n(y0+cf)+'L'+n(x0+11)+' '+n(GY)+'Z', '#000', 0.10);
      s += R(x0-5, y0-8, bw+10, 10, l, 2);
      s += RN(x0-2, y0-5.5, bw+4, 3, '#ffffff', 1.5, 0.3);
      s += grid(x0+8, y0+10, bw-16, bh*0.44, 3+lv, 1+Math.min(lv,2));
      s += R(x0-7, GY-15, bw+14, 15, l, 2.5);
      for(i=0; i<Math.floor((bw+14)/11); i++){
        s += PN('M'+n(x0-7+i*11)+' '+n(GY-1.5)+'L'+n(x0-7+i*11+5)+' '+n(GY-13.5)+'L'+n(x0-7+i*11+9.5)+' '+n(GY-13.5)+'L'+n(x0-7+i*11+4.5)+' '+n(GY-1.5)+'Z', d, 0.35);
      }
      s += R(x0-7, GY-15, bw+14, 15, 'none', 2.5);
      s += door(100, 18, 15);
      var fx0 = x0 - 18, fx1 = x1 + 18;
      s += LN(fx0, GY-13, 86, GY-13, d, 3, 0.9) + LN(114, GY-13, fx1, GY-13, d, 3, 0.9);
      s += LN(fx0, GY-6, 86, GY-6, d, 3, 0.9) + LN(114, GY-6, fx1, GY-6, d, 3, 0.9);
      var px;
      for(i=0; fx0 + i*13 <= fx1; i++){ px = fx0 + i*13; if(px > 86 && px < 114){ continue; } s += LN(px, GY, px, GY-18, d, 3.4, 0.9); }
      s += E(fx0, GY-20, 3, 3, LT, 2) + E(fx1, GY-20, 3, 3, LT, 2);
      if(lv >= 1){
        s += R(88, y0+2, 24, 10, l, 2.5) + RN(91, y0+5.2, 18, 3.5, d, 1.5, 0.5);
      }
      if(lv >= 3){
        s += lamp(fx0-10, 30) + lamp(fx1+10, 30);
        s += star(x0-16, y0-24, 5) + star(x1+16, y0-14, 4.5, '#ffffff', 0.85);
      }
    }

    /* ---------- shared upgrades ---------- */
    if(lv >= 2){ s += tuft(x0-30, GY+1, 0.9, c) + tuft(x1+30, GY+1, 0.85, c); }
    else { s += tuft(x0-14, GY+1, 0.85, c) + tuft(x1+14, GY+1, 0.8, c); }
    if(st === 6){
      s += star(46, 60, 6) + star(158, 52, 5, '#ffffff', 0.9) + star(30, 118, 4.5, '#ffffff', 0.8)
         + star(174, 108, 4, '#ffffff', 0.75) + star(100, 26, 5.5, '#ffffff', 0.9)
         + star(66, 34, 3.5, '#ffffff', 0.7) + star(140, 30, 4, '#ffffff', 0.8);
      s += EN(100, GY+4, 66, 9, LG, 0.3);
    }
  }

  return '<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">' + s + '</svg>';
}

/* ═══════════════════════════════════════════════════════════════
   ④ 로봇
   ═══════════════════════════════════════════════════════════════ */
function drawRobot(st, b){
  var c = b.c, d = b.d, l = b.l, id = b.id || 'inquiry';
  var s = '';
  function n(v){ return Math.round(v*100)/100; }
  function R(x,y,w,h,rx,f,sw){ return '<rect x="'+n(x)+'" y="'+n(y)+'" width="'+n(w)+'" height="'+n(h)+'" rx="'+n(rx)+'" fill="'+f+'" stroke="'+d+'" stroke-width="'+(sw==null?3:sw)+'" stroke-linejoin="round"/>'; }
  function RF(x,y,w,h,rx,f,op){ return '<rect x="'+n(x)+'" y="'+n(y)+'" width="'+n(w)+'" height="'+n(h)+'" rx="'+n(rx)+'" fill="'+f+'" opacity="'+op+'"/>'; }
  function C(cx,cy,r,f,sw){ return '<circle cx="'+n(cx)+'" cy="'+n(cy)+'" r="'+n(r)+'" fill="'+f+'" stroke="'+d+'" stroke-width="'+(sw==null?3:sw)+'"/>'; }
  function CF(cx,cy,r,f,op){ return '<circle cx="'+n(cx)+'" cy="'+n(cy)+'" r="'+n(r)+'" fill="'+f+'" opacity="'+op+'"/>'; }
  function E(cx,cy,rx,ry,f,sw){ return '<ellipse cx="'+n(cx)+'" cy="'+n(cy)+'" rx="'+n(rx)+'" ry="'+n(ry)+'" fill="'+f+'" stroke="'+d+'" stroke-width="'+(sw==null?3:sw)+'"/>'; }
  function EF(cx,cy,rx,ry,f,op){ return '<ellipse cx="'+n(cx)+'" cy="'+n(cy)+'" rx="'+n(rx)+'" ry="'+n(ry)+'" fill="'+f+'" opacity="'+op+'"/>'; }
  function P(pts,f,sw){ return '<polygon points="'+pts+'" fill="'+f+'" stroke="'+d+'" stroke-width="'+(sw==null?3:sw)+'" stroke-linejoin="round"/>'; }
  function PA(dd,f,sw){ return '<path d="'+dd+'" fill="'+f+'" stroke="'+d+'" stroke-width="'+(sw==null?3:sw)+'" stroke-linejoin="round" stroke-linecap="round"/>'; }
  function LN(x1,y1,x2,y2,col,w,op){ return '<line x1="'+n(x1)+'" y1="'+n(y1)+'" x2="'+n(x2)+'" y2="'+n(y2)+'" stroke="'+col+'" stroke-width="'+w+'" stroke-linecap="round" opacity="'+(op==null?1:op)+'"/>'; }
  function riv(x,y){ return '<circle cx="'+n(x)+'" cy="'+n(y)+'" r="1.7" fill="'+l+'" stroke="'+d+'" stroke-width="0.9"/>'; }
  function sheen(x,y,w,h,rx){ return RF(x+1.5,y+1.5,w*0.32,h-3,rx,'#ffffff',0.20)+RF(x+w*0.70,y+1.5,w*0.28,h-3,rx,d,0.17); }
  function limb(dd,w){ return '<path d="'+dd+'" fill="none" stroke="'+d+'" stroke-width="'+(w+2.4)+'" stroke-linecap="round" stroke-linejoin="round"/><path d="'+dd+'" fill="none" stroke="'+c+'" stroke-width="'+w+'" stroke-linecap="round" stroke-linejoin="round"/>'; }
  function star(x,y,r,op){
    var p='M'+n(x)+' '+n(y-r)+'L'+n(x+r*0.26)+' '+n(y-r*0.26)+'L'+n(x+r)+' '+n(y)+'L'+n(x+r*0.26)+' '+n(y+r*0.26)+'L'+n(x)+' '+n(y+r)+'L'+n(x-r*0.26)+' '+n(y+r*0.26)+'L'+n(x-r)+' '+n(y)+'L'+n(x-r*0.26)+' '+n(y-r*0.26)+'Z';
    return '<path d="'+p+'" fill="#ffffff" opacity="'+op+'"/>';
  }
  function eye(cx,cy,r){
    return C(cx,cy,r,'#1d2740',r*0.30)+CF(cx,cy,r*0.68,l,0.95)+CF(cx,cy,r*0.40,'#ffffff',0.85)+CF(cx-r*0.30,cy-r*0.32,r*0.26,'#ffffff',0.95);
  }
  function cheek(cx,cy,rx){ return '<ellipse cx="'+n(cx)+'" cy="'+n(cy)+'" rx="'+n(rx)+'" ry="'+n(rx*0.66)+'" fill="#ff90a8" opacity="0.5"/>'; }
  function grille(x,y,w,h){
    var g=R(x,y,w,h,h*0.42,'#1d2740',2), i;
    for(i=1;i<4;i++){ g+=LN(x+w*i/4,y+1.6,x+w*i/4,y+h-1.6,l,1.5,0.9); }
    return g;
  }
  function gear(cx,cy,r,t,f){
    var g='', i;
    for(i=0;i<t;i++){
      g+='<rect x="'+n(cx-2.7)+'" y="'+n(cy-r-4.4)+'" width="5.4" height="7.6" rx="1.6" fill="'+f+'" stroke="'+d+'" stroke-width="2" stroke-linejoin="round" transform="rotate('+n(i*360/t)+','+n(cx)+','+n(cy)+')"/>';
    }
    g+=C(cx,cy,r,f,2.6)+CF(cx,cy,r*0.36,d,0.85)+CF(cx-r*0.35,cy-r*0.35,r*0.30,'#ffffff',0.35);
    return g;
  }
  function chestIcon(cx,cy,k){
    var g='';
    if(id==='inquiry'){ g+='<circle cx="'+n(cx-1.5*k)+'" cy="'+n(cy-1.5*k)+'" r="'+n(4.5*k)+'" fill="none" stroke="'+d+'" stroke-width="2"/>'+LN(cx+2*k,cy+2*k,cx+6*k,cy+6*k,d,2.4); }
    else if(id==='analysis'){ g+=R(cx-6*k,cy-1*k,3.4*k,7*k,1,d,0)+R(cx-1.4*k,cy-6*k,3.4*k,12*k,1,d,0)+R(cx+3.2*k,cy-3.5*k,3.4*k,9.5*k,1,d,0); }
    else if(id==='concept'){ g+=gear(cx,cy,5*k,7,l); }
    else if(id==='communicate'){ g+='<path d="M'+n(cx-6*k)+' '+n(cy+5*k)+' A '+n(8*k)+' '+n(8*k)+' 0 0 1 '+n(cx+6*k)+' '+n(cy+5*k)+'" fill="none" stroke="'+d+'" stroke-width="2.2"/><path d="M'+n(cx-3*k)+' '+n(cy+5*k)+' A '+n(4*k)+' '+n(4*k)+' 0 0 1 '+n(cx+3*k)+' '+n(cy+5*k)+'" fill="none" stroke="'+d+'" stroke-width="2.2"/>'+CF(cx,cy+5*k,1.8*k,d,1); }
    else if(id==='collaborate'){ g+='<circle cx="'+n(cx-4*k)+'" cy="'+n(cy)+'" r="'+n(4.6*k)+'" fill="none" stroke="'+d+'" stroke-width="2.2"/><circle cx="'+n(cx+4*k)+'" cy="'+n(cy)+'" r="'+n(4.6*k)+'" fill="none" stroke="'+d+'" stroke-width="2.2"/>'; }
    else { g+=PA('M'+n(cx)+' '+n(cy-7*k)+'L'+n(cx+6*k)+' '+n(cy-4*k)+'L'+n(cx+6*k)+' '+n(cy+2*k)+'Q'+n(cx)+' '+n(cy+8*k)+' '+n(cx-6*k)+' '+n(cy+2*k)+'L'+n(cx-6*k)+' '+n(cy-4*k)+'Z',l,2.2); }
    return g;
  }

  /* ---------- ground shadow ---------- */
  s += EF(100,180,26+st*4,6.5,'#1b2430',0.17);

  /* ---------- st0 : parts crate ---------- */
  if(st===0){
    s += gear(58,166,7,7,l);
    s += P('146,160 152,163.5 152,170.5 146,174 140,170.5 140,163.5',l,2.4);
    s += R(68,130,64,44,7,c,3.2)+sheen(68,130,64,44,7);

  if(!d) return null;
  var a=new Date(d); a.setHours(0,0,0,0);

  return Math.round((b-a)/86400000);
}

async function bootStudent(){
  S.role='student';
  showLoad();
  try{
    var p = await sb.from('profiles').select('*').eq('id', S.user.id).maybeSingle();
    S.profile = p.data || {};
    $('stuName').textContent = S.profile.name || '나';

    var sp = await sb.from('stamp_profiles').select('*').eq('student_id', S.user.id).maybeSingle();
    if(sp.data){ S.sp = sp.data; }
    else {
      await sb.from('stamp_profiles').insert({ student_id:S.user.id, theme:'creature' });
      S.sp = {theme:'creature', branch:null, nickname:null};
    }
    await reloadStudent();
    goScr('s-stu'); stuTab('board');
  } finally { hideLoad(); }
}
async function reloadStudent(){
  var o = await sb.from('observations').select('*')
            .eq('student_id', S.user.id).is('voided_at', null)
            .order('observed_on', {ascending:false}).order('id', {ascending:false});
  S.obs = o.data || [];
  var b = await sb.rpc('my_stamp_balance');
  if(b.data && b.data[0]) S.bal = b.data[0];
  else S.bal = { earned:S.obs.length, spent:0, balance:S.obs.length };
  var r = await sb.from('stamp_rewards').select('*').eq('student_id', S.user.id)
            .order('issued_at',{ascending:false});
  S.rewards = r.data || [];
}
function catCount(){
  var m={}, i;
  for(i=0;i<S.obs.length;i++) m[S.obs[i].category] = (m[S.obs[i].category]||0)+1;
  return m;
}
function autoBranch(){
  var m=catCount(), best=null, bn=0, k;
  for(k in m){ if(m[k]>bn){ bn=m[k]; best=k; } }
  return best || 'inquiry';
}
function curBranch(){ return S.sp.branch || autoBranch(); }

/* ── 🔑 비밀번호 변경 ────────────────────────────────────────────────────
   질문 과수원과 같은 Supabase 계정을 쓰므로, 여기서 바꾸면 두 앱 모두 바뀐다.
   (같은 프로젝트 + 같은 도메인이라 로그인 자체가 하나로 이어져 있다) */
function openPw(){
  var a = $('pwNew'), b = $('pwNew2'), m = $('pwMsg');
  if(a) a.value = ''; if(b) b.value = '';
  if(m){ m.textContent = ''; }
  $('pwMdl').classList.add('show');
  setTimeout(function(){ var e = $('pwNew'); if(e) e.focus(); }, 100);
}
function closePw(){ $('pwMdl').classList.remove('show'); }

async function doChangePw(){
  var a = ($('pwNew') && $('pwNew').value) || '';
  var b = ($('pwNew2') && $('pwNew2').value) || '';
  var m = $('pwMsg');
  var setMsg = function(txt, ok){ if(m){ m.textContent = txt; m.style.color = ok ? 'var(--ok-d)' : 'var(--bad)'; } };
  if(a.length < 4){ setMsg('비밀번호는 4자 이상이어야 해요', false); return; }
  if(a !== b){ setMsg('두 비밀번호가 서로 달라요', false); return; }
  var btn = $('pwSaveBtn'); if(btn) btn.disabled = true;
  setMsg('변경 중…', true);
  try{
    /* pw_changed 표시를 계정에 남긴다 — 질문 과수원이 더 이상 묻지 않게 */
    var r = await sb.auth.updateUser({ password: a, data:{ pw_changed:true } });
    if(btn) btn.disabled = false;
    if(r.error){ setMsg('변경 실패: ' + r.error.message, false); return; }
    setMsg('✅ 바뀌었어요! 질문 과수원도 같은 비밀번호예요.', true);
    toast('🔑 비밀번호가 바뀌었어요');
    setTimeout(closePw, 1800);
  }catch(e){
    if(btn) btn.disabled = false;
    setMsg('변경 실패: ' + (e && e.message || '오류'), false);
  }
}

/* ── 📖 캐릭터 도감 ─────────────────────────────────────────────────────────
   «20개 모으면 뭐가 되는지»가 안 보이면 모을 이유도 안 생긴다. 그래서 잠근 단계도

var _dexTheme = null;

function openDex(theme){
  var n = S.bal.earned, cur = stageOf(n);
  _dexTheme = theme || _dexTheme || S.sp.theme;
  var th = themeName(_dexTheme), b = branchOf(curBranch());

  var h = '<h3 style="font-size:var(--fs-m);font-weight:900">📖 캐릭터 도감</h3>';
  h += '<div class="sub" style="font-size:var(--fs-xxs);color:var(--ink2);margin-top:4px">' +
       '도장을 모으면 이렇게 자라요. 🔒는 아직 안 열린 모습이에요.<br>' +
       '지금은 <b>' + n + '개</b> · <b>' + esc(th.stages[cur]) + '</b></div>';

  /* 테마 탭 — 다른 모습도 미리 보고 고를 수 있게 */
  h += '<div class="dex-tabs" style="margin-top:10px">';
  for (var i = 0; i < THEMES.length; i++) {
    h += '<button class="chip sm' + (THEMES[i].id === _dexTheme ? ' on' : '') +
         '" onclick="openDex(\'' + THEMES[i].id + '\')">' + THEMES[i].emoji + ' ' + THEMES[i].name + '</button>';
  }
  h += '</div>';

  /* 7단계 */
  h += '<div class="dex">';
  for (i = 0; i < TH.length; i++) {
    var got = n >= TH[i], now = (i === cur);
    var cls = now ? 'now' : (got ? 'got' : 'soon');
    h += '<div class="dex-i ' + cls + '">' +
         '<div class="dex-b">' + (now ? '📍' : (got ? '✓' : '🔒')) + '</div>' +
         DRAW[_dexTheme](i, b) +
         '<div class="dex-n">' + esc(th.stages[i]) + '</div>' +
         '<div class="dex-c">' + (TH[i] === 0 ? '시작' : '도장 ' + TH[i] + '개') + '</div>' +
         '</div>';
  }
  h += '</div>';

  /* 진화 갈래 — 6개 중 하나를 내가 고른다 */
  h += '<div style="margin-top:16px;font-size:var(--fs-s);font-weight:900">🧬 진화 갈래 ' +
       '<span style="font-weight:700;color:var(--mute);font-size:.8em">도장 ' + TH[3] + '개부터 고를 수 있어요</span></div>';
  h += '<p style="font-size:var(--fs-xxs);color:var(--mute);margin:4px 0 0;line-height:1.6">' +
       '아래는 갈래마다 <b>끝까지 자랐을 때</b>의 모습이에요. 도장을 어떤 이유로 많이 받았는지에 따라 자동으로 정해지고, ' +
       '「진화 고르기」로 직접 바꿀 수도 있어요.</p>';
  h += '<div class="dex">';
  for (i = 0; i < BRANCHES.length; i++) {
    var bb = BRANCHES[i], mine = (bb.id === curBranch());
    h += '<div class="dex-i' + (mine ? ' now' : '') + '">' +
         (mine ? '<div class="dex-b">📍</div>' : '') +
         DRAW[_dexTheme](TH.length - 1, bb) +
         '<div class="dex-n" style="color:' + bb.d + '">' + esc(bb.n[_dexTheme]) + '</div>' +
         '<div class="dex-c">' + bb.icon + ' ' + esc(bb.label) + '</div>' +
         '</div>';
  }
  h += '</div>';

  if (_dexTheme !== S.sp.theme) {
    h += '<button class="btn" style="margin-top:14px" onclick="pickThemeFromDex(\'' + _dexTheme + '\')">' +
         '이 모습으로 바꾸기</button>';
  }
  h += '<button class="btn ghost" style="margin-top:8px" onclick="closeMdl()">닫기</button>';
  $('mdlIn').innerHTML = h;
  $('mdl').classList.add('show');
}

          '<span class="chip sm" style="background:#EAF7EC;border-color:var(--ok);color:var(--ok-d)">🎟️ ' + bal + '개 사용 가능</span></div>' +

    h +=   '<div class="rw-b"><div class="rw-n">' + esc(ho.name) + '</div>' +
           '<div class="rw-c">' + (open ? '✅ 열렸어요! 선생님께 말씀드리세요' : '🏅 ' + ho.need + '개 모으면 (지금 ' + earned + '개)') + '</div></div>';

async function redeem(code){
  var r=null, i;
  for(i=0;i<REWARDS.length;i++) if(REWARDS[i].code===code) r=REWARDS[i];

  if(!confirm('🎟️ 도장 ' + r.cost + '개로 「' + r.name + '」을(를) 바꿀까요?\n\n모은 도장은 줄지 않아요!')) return;
  showLoad();
  try{
    var res = await sb.rpc('redeem_reward', { p_code:r.code, p_name:r.name, p_cost:r.cost });
    if(res.error){ toast(/부족/.test(res.error.message) ? '쓸 수 있는 도장이 부족해요' : '교환에 실패했어요'); console.error(res.error); return; }
    await reloadStudent(); renderShop();

/* ── 반 ────────────────────────────────────────────────────────────────── */
async function loadClasses(){
  var r = await sb.from('profiles').select('grade,class_no').not('class_no','is',null);
  var seen = {}, out = [], k;
  (r.data||[]).forEach(function(p){
    k = (p.grade||0) + '-' + p.class_no;
    if(!seen[k]){ seen[k] = 1; out.push({grade:p.grade||0, cls:p.class_no}); }
  });
  out.sort(function(x,y){ return (x.grade-y.grade) || (x.cls-y.cls); });
  S.classes = out;
}
function renderClassChips(){
  var el = $('classChips'); if(!el) return;
  if(!S.classes.length){ el.innerHTML = '<span class="sub">학생 명단을 불러오지 못했어요</span>'; return; }
  var h = '', i, c, on;
  for(i=0;i<S.classes.length;i++){
    c = S.classes[i];
    on = S.selClass && S.selClass.grade===c.grade && S.selClass.cls===c.cls;
    h += '<button class="chip' + (on?' on':'') + '"' + (on?' style="background:var(--ac)"':'') +
         ' onclick="pickClass(' + c.grade + ',' + c.cls + ')">' + c.grade + '-' + c.cls + '</button>';
  }
  el.innerHTML = h;
}
async function pickClass(g,c){
  S.selClass = {grade:g, cls:c};
  S.selSt = {}; _qCache = {};
  showLoad();
  try{ await loadStudents(); } finally { hideLoad(); }
  renderGive();
}

/* ── 학생 ──────────────────────────────────────────────────────────────── */
async function loadStudents(){
  if(!S.selClass){ S.students = []; return; }
  var p = await sb.from('profiles').select('id,name,grade,class_no,number')
            .eq('grade', S.selClass.grade).eq('class_no', S.selClass.cls).order('number');
  S.students = p.data || [];
  var last = {}, cnt = {}, i, o;
  for(i=0;i<S.teaObs.length;i++){
    o = S.teaObs[i];
    cnt[o.student_id] = (cnt[o.student_id]||0) + 1;
    if(!last[o.student_id] || o.observed_on > last[o.student_id]) last[o.student_id] = o.observed_on;
  }
  for(i=0;i<S.students.length;i++){
    S.students[i]._last = last[S.students[i].id] || null;
    S.students[i]._cnt  = cnt[S.students[i].id] || 0;
  }
}
function toggleSort(){ S.sortCold = (S.sortCold===false); renderGive(); }
function sortedStudents(){
  var list = S.students.slice();
  if(S.sortCold !== false){
    list.sort(function(x,y){
      var dx = x._last ? daysAgo(x._last) : 9999, dy = y._last ? daysAgo(y._last) : 9999;
      return dy - dx;
    });
  } else {
    list.sort(function(x,y){ return (x.number||0) - (y.number||0); });
  }
  return list;
}
function renderStuGrid(){
  var el = $('stuGrid'); if(!el) return;
  var list = sortedStudents();
  if(!list.length){ el.innerHTML = '<div class="empty" style="grid-column:1/-1"><p>이 반 학생이 없어요</p></div>'; return; }
  var h = '', i, s, d, mt;
  for(i=0;i<list.length;i++){
    s = list[i]; d = s._last ? daysAgo(s._last) : null;
    mt = d===null ? '처음' : (d===0 ? '오늘' : d + '일 전');
    h += '<button class="stu' + (S.selSt[s.id]?' sel':'') + '" onclick="togSt(\'' + s.id + '\')">' +
         '<span class="stu-c' + (s._cnt?'':' zero') + '">' + s._cnt + '</span>' +
         '<div class="stu-n">' + esc((s.number?s.number+'. ':'') + (s.name||'')) + '</div>' +
         '<div class="stu-m' + (d===null||d>=14?' cold':'') + '">' + mt + '</div></button>';
  }
  el.innerHTML = h;
}
function togSt(id){ if(S.selSt[id]) delete S.selSt[id]; else S.selSt[id]=1; renderStuGrid(); updateSelCnt(); loadRecentQs(); }

/* ══════════════════════════════════════════════════════════════════════════
   🌳 질문과수원 연계 — 고른 학생이 최근에 심은 질문을 근거로 보여준다.
   조용해서 눈에 잘 안 띄는 학생도 질문에는 흔적을 남기므로,
   교사가 놓친 학생의 관찰 근거를 질문 기록이 대신 채워 준다(관찰 편향 완화).
   ══════════════════════════════════════════════════════════════════════════ */
var _qCache = {};
async function loadRecentQs(){
  var el = $('qHint'); if(!el) return;
  var ids = Object.keys(S.selSt);
  if(ids.length !== 1){ el.innerHTML=''; return; }   // 한 명일 때만
  var id = ids[0];
  if(_qCache[id]){ renderQHint(id); return; }
  el.innerHTML = '<div class="qhint"><div class="qhint-h">🌳 질문과수원에서 불러오는 중...</div></div>';
  try{
    var r = await sb.from('questions').select('id,text,question_date,starred,resolved')
              .eq('user_id', id).order('question_date',{ascending:false}).limit(3);
    _qCache[id] = (r.error ? [] : (r.data||[]));
  }catch(e){ _qCache[id] = []; }
  renderQHint(id);
}
function renderQHint(id){
  var el = $('qHint'); if(!el) return;
  var list = _qCache[id] || [];
  if(!list.length){ el.innerHTML=''; return; }
  var h = '<div class="qhint"><div class="qhint-h">🌳 이 학생이 최근에 심은 질문</div>';
  for(var i=0;i<list.length;i++){
    var q = list[i];
    h += '<div class="qh-item"><div class="qh-t">' + (q.starred?'⭐ ':'') + esc(q.text) +
         '<div class="qh-d">' + esc(q.question_date||'') + '</div></div>' +
         '<button class="qh-b" onclick="useQ(' + i + ')">근거로</button></div>';
  }
  h += '</div>';
  el.innerHTML = h;
}
function useQ(i){
  var ids = Object.keys(S.selSt); if(ids.length!==1) return;
  var q = (_qCache[ids[0]]||[])[i]; if(!q) return;
  var txt = String(q.text||'').replace(/s+/g,' ').trim();
  if(txt.length > 120) txt = txt.slice(0,120) + '…';
  var ta = $('behIn');
  ta.value = '「' + txt + '」라는 질문을 제기하고 ';

  if(!S.selCat){ pickCat('inquiry'); }

}
function selAll(on){

  if(on){ for(var i=0;i<S.students.length;i++) S.selSt[S.students[i].id] = 1; }
  renderStuGrid(); updateSelCnt(); loadRecentQs();
}
function updateSelCnt(){

/* ── 차시 ──────────────────────────────────────────────────────────────── */
async function loadPlans(){
  try{
    var r = await sb.from('lesson_plans').select('*').order('sort_order').order('id',{ascending:false});
    S.plans = r.error ? [] : (r.data||[]);
  }catch(e){ S.plans = []; }
}
var PLAN_SEP = ' · ';   /* 차시명 구분자: 공백+가운뎃점+공백 */
function planTitle(id){
  for(var i=0;i<S.plans.length;i++) if(S.plans[i].id===id) return S.plans[i].title;
  return null;
}
/* 차시명은 «현상형 제목 · 개념» 형태다. 화면 칩에는 제목을 통째로 보여주되,
   생기부 누가기록에는 개념만 남긴다 — «지지직의 정체 수업에서 칭찬받음»보다
   «마찰 전기와 전기력 수업에서 칭찬받음»이 기록으로 읽힌다.
   구분자는 공백을 낀 가운뎃점이라, «전압·저항»처럼 붙여 쓴 것과 섞이지 않는다. */
/* 차시명은 «2-7-1-1 현상형 제목 · 개념» 형태다.
   앞의 «2-7-1-1» 은 학년-단원-중단원-차시. 학생이 어느 차시인지 알아보라고 붙였다. */
function planCode(title){
  var m = String(title || '').match(/^\d+-\d+-\d+-\d+/);
  return m ? m[0] : '';
}
/* 문장에 넣을 값 — 번호는 뺀다. «2-7-1-1 마찰 전기와 전기력 수업에서 칭찬받음» 은 안 읽힌다. */
function planConcept(id){
  var s = planTitle(id);
  if(!s) return null;
  var p = s.split(PLAN_SEP);
  var tail = (p.length > 1 ? p.slice(1).join(PLAN_SEP).trim() : s.trim()) || s;
  return tail.replace(/^\d+-\d+-\d+-\d+\s*/, '');
}
/* 기록(lesson_note)에 남길 값 — 번호를 앞에 붙여 둔다. 학생 기록 화면과 생기부 근거에서
   «어느 차시였는지»가 한눈에 보여야 한다. */
function planNote(id){
  var c = planConcept(id);
  if(!c) return null;
  var code = planCode(planTitle(id));
  return code ? (code + ' ' + c) : c;
}

/* ══════════════════════════════════════════════════════════════════════════
   🔔 골든벨 — 수업 시작 3~4문제, 끝까지 남은 사람에게 도장

   교실에서 30초 안에 한 라운드가 끝나야 한다. 그래서 «맞은 사람»이 아니라
   «틀린 사람»만 누른다 — 보통 반에서 서너 명이라 탭 수가 1/5 로 줄어든다.
   진행 중 상태는 localStorage 에 둔다. 새로고침·실수로 뒤로가기 해도 살아난다.
   DB 는 마지막에 도장 찍을 때만 쓴다(새 테이블 없음).
   ══════════════════════════════════════════════════════════════════════════ */
/* ── 🔊 골든벨 음향 ──────────────────────────────────────────────────────
   전자칠판·교사 기기 한 대에서만 나온다. preload='none' 이라 실제로 누르기
   전에는 한 바이트도 안 받는다(학교 와이파이 배려). 브라우저가 소리를 막는 건
   «사용자가 누르기 전»뿐이라, 교사가 시작을 누른 뒤부터는 문제없이 난다. */
var GB_SND = {
  write:   'audio/sfx-write.mp3',      // 정답을 써주세요
  show:    'audio/sfx-show.mp3',       // 정답을 들어주세요
  tense1:  'audio/bgm-tense1.mp3',     // 긴장감 1
  tense2:  'audio/bgm-tense2.mp3',     // 긴장감 2
  cute:    'audio/bgm-cute.mp3',       // 귀여운 퀴즈
  fanfare: 'audio/sfx-fanfare.mp3',    // 팡파레
  award:   'audio/bgm-award.mp3'       // 시상식
};
var GB_BGM_LIST = [
  {k:'tense1', n:'긴장감 1'},
  {k:'tense2', n:'긴장감 2'},
  {k:'cute',   n:'귀여운 퀴즈'},
  {k:'off',    n:'끄기'}
];
var _gbAud = {}, _gbBgm = null;

function gbSndOn(){ try{ return localStorage.getItem('gb_snd') !== 'off'; }catch(e){ return true; } }

/* 볼륨 0~1. 기본 0.7 — 이때 배경음이 0.35 라 예전과 같은 크기다.
   배경음은 선생님 목소리 밑에 깔려야 하므로 슬라이더의 절반만 쓴다.
   효과음(써주세요·들어주세요)은 반 전체가 들어야 하는 신호라 슬라이더 값 그대로. */
function gbVol(){
  var v;
  try{ v = parseFloat(localStorage.getItem('gb_vol')); }catch(e){}
  return (isFinite(v) && v >= 0 && v <= 1) ? v : 0.7;
}
function gbBgmVol(){ return gbVol() * 0.5; }

/* 슬라이더를 끄는 동안 매번 화면을 다시 그리면 손가락이 슬라이더에서 떨어진다.
   그래서 여기서는 소리와 숫자만 바꾸고 renderGB 는 부르지 않는다. */
function gbSetVol(v){
  v = Math.max(0, Math.min(1, (parseFloat(v) || 0) / 100));
  try{ localStorage.setItem('gb_vol', String(v)); }catch(e){}
  if(_gbBgm){ try{ _gbBgm.volume = gbBgmVol(); }catch(e){} }
  for(var k in _gbAud){ if(_gbAud[k] !== _gbBgm){ try{ _gbAud[k].volume = v; }catch(e){} } }
  var lab = document.getElementById('gbVolLab');
  if(lab) lab.textContent = Math.round(v * 100) + '%';
}
function gbBgmKey(){ try{ return localStorage.getItem('gb_bgm') || 'tense1'; }catch(e){ return 'tense1'; } }
function gbToggleSnd(){
  var on = !gbSndOn();
  try{ localStorage.setItem('gb_snd', on ? 'on' : 'off'); }catch(e){}
  if(!on) gbStopBgm();
  renderGB();
}
function gbPickBgm(k){
  try{ localStorage.setItem('gb_bgm', k); }catch(e){}
  gbStopBgm();
  if(k !== 'off' && gbSndOn() && GB && GB.ready && !GB.done) gbPlayBgm();
  renderGB();
}

function gbAudio(key){
  if(!GB_SND[key]) return null;
  if(!_gbAud[key]){
    var a = new Audio(); a.preload = 'none'; a.src = GB_SND[key];
    _gbAud[key] = a;
  }
  return _gbAud[key];
}
/* 효과음 — 실패해도 조용히 넘어간다. 소리 때문에 수업이 멈추면 안 된다. */
function gbSfx(key){
  if(!gbSndOn()) return;
  var a = gbAudio(key); if(!a) return;
  try{ a.volume = gbVol(); a.currentTime = 0; var p = a.play(); if(p && p.catch) p.catch(function(){}); }catch(e){}
}
function gbPlayBgm(){
  var k = gbBgmKey();
  if(!gbSndOn() || k === 'off') return;
  var a = gbAudio(k); if(!a) return;
  a.loop = true; a.volume = gbBgmVol();
  _gbBgm = a;
  try{ var p = a.play(); if(p && p.catch) p.catch(function(){}); }catch(e){}
}
function gbStopBgm(){
  if(!_gbBgm) return;
  try{ _gbBgm.pause(); _gbBgm.currentTime = 0; }catch(e){}
  _gbBgm = null;
}
/* 음향 조작 줄 */
function gbSndBar(){
  var on = gbSndOn(), k = gbBgmKey();
  var h = '<div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:9px">' +
          '<button class="chip sm" onclick="gbToggleSnd()">' + (on ? '🔊 소리 켜짐' : '🔇 소리 꺼짐') + '</button>';
  if(on){
    h += '<span style="font-size:11px;color:var(--mute);font-weight:700">배경음</span>';
    for(var i=0;i<GB_BGM_LIST.length;i++){
      h += '<button class="chip sm' + (k===GB_BGM_LIST[i].k?' on':'') +
           '" onclick="gbPickBgm(\'' + GB_BGM_LIST[i].k + '\')">' + GB_BGM_LIST[i].n + '</button>';
    }
    h += '</div><div style="display:flex;gap:9px;align-items:center;margin-top:8px">' +
         '<span style="font-size:11px;color:var(--mute);font-weight:700;flex:0 0 auto">🔉 크기</span>' +
         '<input type="range" min="0" max="100" step="5" value="' + Math.round(gbVol()*100) + '"' +
         ' oninput="gbSetVol(this.value)" style="flex:1;min-width:110px;accent-color:var(--ac)">' +
         '<b id="gbVolLab" style="flex:0 0 auto;font-size:12px;color:var(--ac-d);min-width:38px;text-align:right">' +
         Math.round(gbVol()*100) + '%</b>';
  }
  return h + '</div>';
}

var GB_KEY = 'gb_state_v1';
var GB = null;   // {g,c,total,round,alive:{id:1},out:{id:round},names:{id:label},done}

function gbSave(){ try{ localStorage.setItem(GB_KEY, JSON.stringify(GB)); }catch(e){} }
function gbLoad(){
  try{
    var s = localStorage.getItem(GB_KEY);
    GB = s ? JSON.parse(s) : null;
  }catch(e){ GB = null; }
}
function gbClear(){ GB = null; try{ localStorage.removeItem(GB_KEY); }catch(e){} }

/* ══════════════════════════════════════════════════════════════════════════
   📝 골든벨 문제 — 칠판에 띄우는 몫

   문제도 DB 에 두지 않는다(골든벨은 «새 테이블 없음» 이 원칙). 대신 집에서 만든
   문제를 학교 전자칠판에서 열 수 있게 JSON 내보내기·불러오기를 둔다.
   목록이 비어 있으면 문제 칸이 아예 안 나온다 — 예전처럼 선생님이 구두로 낸다.
   ══════════════════════════════════════════════════════════════════════════ */
var GBQ_KEY = 'gb_qs_v1';
var GBQ = null;        // [{q:'문제', a:'정답'}]
var _gbEdit = false;   // 문제 편집기를 펼쳤는지
var _gbEditIx = -1;    // 고치는 중인 문제 번호(-1 이면 새로 추가)

function gbqLoad(){
  if(GBQ) return GBQ;
  try{ GBQ = JSON.parse(localStorage.getItem(GBQ_KEY) || '[]'); }catch(e){ GBQ = []; }
  if(!(GBQ instanceof Array)) GBQ = [];
  return GBQ;
}
function gbqSave(){ try{ localStorage.setItem(GBQ_KEY, JSON.stringify(GBQ)); }catch(e){ toast('저장 공간이 가득 찼어요'); } }
function gbqAt(round){ var l = gbqLoad(); return l[round-1] || null; }

/* 따옴표까지 막아야 value="…" 안에 넣을 수 있다 — esc 는 & < > 만 막는다 */
function escq(s){ return esc(s).replace(/"/g, '&quot;'); }

function gbqToggleEdit(){ _gbEdit = !_gbEdit; _gbEditIx = -1; renderGB(); }
function gbqEdit(i){ _gbEditIx = i; renderGB(); }
function gbqCancel(){ _gbEditIx = -1; renderGB(); }

function gbqAdd(){
  var qi = $('gbqQ'), ai = $('gbqA');
  var q = qi ? qi.value.trim() : '', a = ai ? ai.value.trim() : '';
  if(!q){ toast('문제를 적어주세요'); if(qi) qi.focus(); return; }
  gbqLoad();
  if(_gbEditIx >= 0 && GBQ[_gbEditIx]) GBQ[_gbEditIx] = { q:q, a:a };
  else GBQ.push({ q:q, a:a });
  _gbEditIx = -1;
  gbqSave(); renderGB();
}
function gbqDel(i){
  gbqLoad();
  if(!GBQ[i]) return;
  if(!confirm((i+1) + '번 문제를 지울까요?')) return;
  GBQ.splice(i, 1);
  if(_gbEditIx === i) _gbEditIx = -1;
  gbqSave(); renderGB();
}
function gbqMove(i, d){
  gbqLoad();
  var j = i + d;
  if(j < 0 || j >= GBQ.length) return;
  var t = GBQ[i]; GBQ[i] = GBQ[j]; GBQ[j] = t;
  _gbEditIx = -1;
  gbqSave(); renderGB();
}

/* 집 기기 → 학교 기기. 로그인은 따라오지만 문제는 이 기기에만 있다. */
function gbqExport(){
  gbqLoad();
  if(!GBQ.length){ toast('내보낼 문제가 없어요'); return; }
  var blob = new Blob([JSON.stringify(GBQ, null, 2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '골든벨_문제_' + new Date().toISOString().slice(0,10) + '.json';
  a.click(); URL.revokeObjectURL(a.href);
  toast('문제 ' + GBQ.length + '개를 내려받았어요');
}
function gbqImport(input){
  var f = input && input.files && input.files[0];
  if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    try{
      var arr = JSON.parse(String(r.result)), out = [], i, it;
      if(!(arr instanceof Array)) throw 0;
      for(i=0;i<arr.length;i++){
        it = arr[i];
        if(it && typeof it.q === 'string' && it.q.trim()) out.push({ q:String(it.q), a:String(it.a == null ? '' : it.a) });
      }
      if(!out.length) throw 0;
      GBQ = out; _gbEditIx = -1;
      gbqSave(); renderGB();
      toast('문제 ' + out.length + '개를 불러왔어요');
    }catch(e){ toast('올바른 골든벨 문제 파일이 아니에요'); }
  };
  r.readAsText(f);
  input.value = '';     /* 같은 파일을 다시 골라도 불러와지게 */
}

/* 준비 화면의 문제 칸 — 접으면 목록만, 펴면 편집기 */
/* 시작 전(GB 가 아직 없을 때)에도 불린다 — 문제는 반·진행과 무관하게 미리 넣어둔다 */
function gbqPanel(){

    h += '<div class="sub">넣어둔 문제가 없어요. 이대로 시작하면 <b>선생님이 구두로</b> 내는 예전 방식으로 진행돼요.</div>';
  } else if(!tot){
    h += '<div class="sub"><b style="color:var(--ac-d)">' + l.length +
         '개</b> 준비돼 있어요 · 시작할 때 고른 문제 수만큼 앞에서부터 씁니다</div>';
  } else {

    h += '<ol style="margin:9px 0 0;padding-left:20px;font-size:13px;line-height:1.7">';

    }
    h += '</ol>';
  }
  if(_gbEdit) h += gbqEditor();
  return h + '</div>';
}

function gbqEditor(){
  var l = gbqLoad(), ed = (_gbEditIx >= 0 && l[_gbEditIx]) ? l[_gbEditIx] : null, h, i;
  h = '<div style="margin-top:13px;padding-top:13px;border-top:2px dashed var(--line)">' +
      '<textarea class="inp" id="gbqQ" rows="2" placeholder="문제 (예: 마찰한 두 물체가 서로 밀어냈다면 두 물체의 전하는 같은 종류일까, 다른 종류일까?)">' +
      (ed ? esc(ed.q) : '') + '</textarea>' +
      '<input class="inp" id="gbqA" style="margin-top:7px" placeholder="정답 (비워두면 정답 공개 버튼이 안 나와요)" value="' +
      (ed ? escq(ed.a) : '') + '">' +
      '<div style="display:flex;gap:7px;margin-top:9px">' +
      '<button class="btn g" style="flex:1" onclick="gbqAdd()">' + (ed ? '✔ 이대로 고치기' : '+ 문제 추가') + '</button>' +
      (ed ? '<button class="chip sm" style="flex:0 0 auto;padding-left:16px;padding-right:16px" onclick="gbqCancel()">취소</button>' : '') +
      '</div>';
  if(l.length){
    h += '<div style="display:flex;flex-direction:column;gap:6px;margin-top:11px">';
    for(i=0;i<l.length;i++){
      h += '<div style="display:flex;gap:5px;align-items:center;padding:8px 10px;border:2px solid var(--line);border-radius:12px;background:#fff' +
           (i === _gbEditIx ? ';border-color:var(--ac)' : '') + '">' +
           '<b style="flex:0 0 auto;color:var(--ac-d);font-size:13px">' + (i+1) + '</b>' +
           '<div style="flex:1;min-width:0;font-size:13px;line-height:1.45">' + esc(l[i].q) +
           (l[i].a ? '<b style="color:var(--ok-d)"> → ' + esc(l[i].a) + '</b>' : '') + '</div>' +
           '<button class="chip sm" onclick="gbqMove(' + i + ',-1)">↑</button>' +
           '<button class="chip sm" onclick="gbqMove(' + i + ',1)">↓</button>' +
           '<button class="chip sm" onclick="gbqEdit(' + i + ')">고침</button>' +
           '<button class="chip sm" onclick="gbqDel(' + i + ')">✕</button>' +
           '</div>';
    }
    h += '</div>';
  }
  h += '<div style="display:flex;gap:7px;margin-top:11px;flex-wrap:wrap">' +
       '<button class="chip sm" onclick="gbqExport()">⬇ 파일로 내보내기</button>' +
       '<label class="chip sm" style="cursor:pointer">⬆ 파일에서 불러오기' +
       '<input type="file" accept=".json,application/json" style="display:none" onchange="gbqImport(this)"></label>' +
       '</div>' +
       '<div class="sub" style="margin-top:7px">문제는 이 기기에만 저장돼요. 집에서 만들었다면 파일로 내보내 학교 기기에서 불러오세요.</div>';
  return h + '</div>';
}

/* 진행 중 화면에 띄우는 문제 — 넣어둔 게 없으면 아무것도 안 그린다 */
function gbqShow(){
  var q = gbqAt(GB.round), h;
  if(!q) return '';
  h = '<div class="card" style="text-align:center;padding:22px 16px">' +
      '<div style="font-size:clamp(20px,3.4vw,44px);font-weight:900;line-height:1.4;word-break:keep-all">' +
      esc(q.q) + '</div>';
  if(!q.a) return h + '</div>';
  if(GB.rev){
    h += '<div style="margin-top:15px;padding-top:14px;border-top:2px dashed var(--line)">' +
         '<div style="font-size:12px;font-weight:800;color:var(--mute)">정답</div>' +
         '<div style="font-size:clamp(19px,3vw,38px);font-weight:900;color:var(--ok-d);line-height:1.35;word-break:keep-all">' +
         esc(q.a) + '</div></div>';
  } else {
    h += '<button class="chip" style="margin-top:15px;padding:11px 22px" onclick="gbReveal()">👀 정답 공개</button>';
  }
  return h + '</div>';
}
function gbReveal(){ if(!GB) return; GB.rev = 1; gbSave(); renderGB(); }

/* 전자칠판 — 주소창·탭까지 걷어내야 뒷자리에서 글씨가 보인다 */
function gbFull(){
  try{
    if(document.fullscreenElement){ document.exitFullscreen(); }
    else if(document.documentElement.requestFullscreen){ document.documentElement.requestFullscreen(); }
    else { toast('이 브라우저는 전체화면을 지원하지 않아요'); }
  }catch(e){}
}

/* 도장 주기 탭의 반 칩과 같은 목록을 쓰되, 고르면 골든벨 화면을 다시 그린다 */
function renderGBClassChips(){
  var el = $('gbClassChips'); if(!el) return;
  if(!S.classes || !S.classes.length){ el.innerHTML = '<span class="sub">반 목록을 불러오는 중…</span>'; loadClasses(); return; }
  var h = '', i, c;
  for(i=0;i<S.classes.length;i++){
    c = S.classes[i];
    h += '<button class="chip' + (S.selClass && S.selClass.grade===c.grade && S.selClass.cls===c.cls ? ' on' : '') +
         '" onclick="gbPickClass(' + c.grade + ',' + c.cls + ')">' + c.grade + '-' + c.cls + '</button>';
  }
  el.innerHTML = h;
}
async function gbPickClass(g,c){ await pickClass(g,c); renderGB(); }

function gbAliveIds(){ return GB ? Object.keys(GB.alive) : []; }
function gbLabel(id){ return (GB && GB.names[id]) || '학생'; }

/* 진행 중이던 골든벨이 이 반 것이 맞는지 */
function gbMatchesClass(){
  return GB && S.selClass && GB.g === S.selClass.grade && GB.c === S.selClass.cls;
}

/* 탭에서 «시작»을 눌렀을 때만 상태를 만든다. 탭에 들어왔다고 바로 시작하면
   지난 골든벨을 덮어쓰게 된다. */
function gbBegin(){
  if(!S.selClass){ toast('반을 먼저 골라주세요'); return; }
  gbLoad();
  if(GB && !gbMatchesClass()){
    if(!confirm('다른 반(' + GB.g + '-' + GB.c + ') 골든벨이 진행 중이에요. 새로 시작할까요?')) return;
    gbClear();
  }
  if(!GB) gbSetup();
  renderGB();
}
function closeGB(){ teaTab('give'); }

/* ── 준비: 전원 참가, 결석·불참만 빼고 시작 ── */
function gbSetup(){
  var names = {}, alive = {}, i, s;
  for(i=0;i<S.students.length;i++){
    s = S.students[i];
    names[s.id] = (s.number ? s.number + '. ' : '') + (s.name || '');
    alive[s.id] = 1;
  }
  GB = { g:S.selClass.grade, c:S.selClass.cls, total:4, round:1,
         alive:alive, out:{}, names:names, done:false, ready:false };
  gbSave();
}

function gbSetTotal(n){ if(!GB) return; GB.total = n; gbSave(); renderGB(); }

/* 준비 단계에서 누르면 «오늘 안 함»(결석 등) — 시작 뒤에는 «탈락» */
function gbTap(id){
  if(!GB) return;
  if(GB.alive[id]){ delete GB.alive[id]; GB.out[id] = GB.ready ? GB.round : 0; }
  else { delete GB.out[id]; GB.alive[id] = 1; }
  gbSave(); renderGB();
}

function gbStart(){
  if(!GB) return;
  if(!gbAliveIds().length){ toast('참가할 학생이 없어요'); return; }
  GB.ready = true; GB.round = 1; GB.rev = 0; gbSave();
  gbPlayBgm();          /* 교사가 누른 직후라 브라우저가 소리를 막지 않는다 */
  renderGB();
}

function gbNext(){
  if(!GB) return;
  GB.rev = 0;           /* 문제가 바뀌면 정답은 다시 감춘다 */
  if(GB.round >= GB.total){
    GB.done = true;
    gbStopBgm();
    if(gbAliveIds().length) gbSfx('fanfare');
  } else {
    GB.round += 1;
    gbSfx('write');     /* 다음 문제 — «정답을 써주세요» */
  }
  gbSave(); renderGB();
}
function gbBack(){
  if(!GB || GB.round <= 1) return;
  if(GB.done) gbPlayBgm();     /* 결과에서 되돌아왔으면 배경음을 다시 켠다 */
  /* 한 라운드 되돌리기 — 그 라운드에서 탈락한 사람을 모두 되살린다 */
  var r = GB.round, id;
  for(id in GB.out){ if(GB.out[id] === r){ delete GB.out[id]; GB.alive[id] = 1; } }
  GB.round -= 1; GB.done = false; GB.rev = 0; gbSave(); renderGB();
}
function gbReset(){
  if(!confirm('지금까지 진행한 걸 지우고 처음부터 다시 할까요?')) return;
  gbSetup(); renderGB();
}
function gbQuit(){
  if(!confirm('골든벨을 끝내고 나갈까요? (도장을 아직 안 찍었다면 기록은 사라집니다)')) return;
  gbStopBgm(); gbClear(); closeGB();
}

/* 가장 오래 살아남은 사람들 — 아무도 끝까지 못 갔을 때 쓴다 */
function gbFurthest(){
  var best = 0, id, r;
  for(id in GB.out){ r = GB.out[id]; if(r > best) best = r; }
  var list = [];
  for(id in GB.out){ if(GB.out[id] === best) list.push(id); }
  return { round: best, ids: list };
}

/* ── 화면 ── */
function renderGB(){
  var el = $('p-gb'); if(!el) return;
  if(!GB) gbLoad();

      '<div class="chips" id="gbClassChips" style="margin-top:10px"></div>' +

      '<div class="chips" id="gbClassChips" style="margin:8px 0"></div>' +
      '<div class="sub">학생들은 이면지에 답을 적어 들어 보이고, 선생님은 <b>틀린 사람만</b> 누르면 돼요.</div>' +
      gbSndBar() +
      '<button class="btn" style="margin-top:12px;background:var(--ac);color:#fff" onclick="gbBegin()">🔔 골든벨 시작</button></div>' +
      gbqPanel();
    renderGBClassChips(); return;
  }

  var alive = gbAliveIds(), h = '';
  var cls = GB.g + '학년 ' + GB.c + '반';

  if(!GB.ready){
    /* 준비 */
    h += gbqPanel();
    h += '<div class="card"><div class="hd"><h3 style="font-size:var(--fs-s)">🔔 골든벨 · ' + cls + '</h3></div>' +
         '<div class="sub">문제 수를 고르고, <b>오늘 없는 사람만</b> 눌러서 빼주세요.</div>' +
         '<div class="chips" style="margin-top:10px">';
    [3,4,5].forEach(function(n){
      h += '<button class="chip' + (GB.total===n?' on':'') + '" onclick="gbSetTotal(' + n + ')">' + n + '문제</button>';
    });
    h += '</div>' +
         '<div class="sub" style="margin-top:12px"><b style="color:var(--ac-d)">' + alive.length + '명</b> 참가</div>' +
         '<div class="stu-grid" style="margin-top:8px">' + gbCards() + '</div>' +
         gbSndBar() +
         '<div style="margin-top:12px"><button class="chip sm" onclick="gbFull()">⛶ 전체화면</button></div>' +
         '<button class="btn g" style="margin-top:12px" onclick="gbStart()">🔔 시작 (' + GB.total + '문제)</button>' +
         '<button class="btn" style="margin-top:8px;background:var(--line);color:var(--tx)" onclick="closeGB()">← 도장 주기로</button>' +
         '</div>';
    el.innerHTML = h; return;
  }

  if(!GB.done){
    /* 진행 */
    h += '<div class="card" style="text-align:center">' +
         '<div class="sub">' + cls + ' · 골든벨</div>' +
         '<div style="font-size:2.6em;font-weight:900;color:var(--ac-d);line-height:1.1;margin:4px 0">' +
         GB.round + '번 문제</div>' +
         '<div style="font-size:var(--fs-m);font-weight:800">남은 사람 <b style="color:var(--ok-d)">' +
         alive.length + '명</b> <span style="color:var(--mute);font-weight:600">/ ' + GB.total + '문제 중 ' + GB.round + '</span></div>' +
         '<div class="sub" style="margin-top:6px">답을 <b>틀린 사람만</b> 누르세요. 잘못 눌렀으면 다시 누르면 살아나요.</div>' +
         '</div>';
    h += gbqShow();
    h += '<div class="card"><div class="stu-grid">' + gbCards() + '</div></div>';
    /* 진행 중 효과음 — 교사가 말로 하는 신호를 소리로 대신한다 */
    h += '<div class="card"><div style="display:flex;gap:7px">' +
         '<button class="chip" style="flex:1;padding:11px 0" onclick="gbSfx(\'write\')">✍️ 정답을 써주세요</button>' +
         '<button class="chip" style="flex:1;padding:11px 0" onclick="gbSfx(\'show\')">🙌 정답을 들어주세요</button>' +
         '</div>' + gbSndBar() + '</div>';
    h += '<div class="card"><button class="btn g" onclick="gbNext()">' +
         (GB.round >= GB.total ? '🏁 결과 보기' : '다음 문제 (' + (GB.round+1) + '번) →') + '</button>' +
         '<div style="display:flex;gap:8px;margin-top:9px">' +
         '<button class="chip sm" style="flex:1" onclick="gbBack()">↩ 앞 문제로</button>' +
         '<button class="chip sm" style="flex:1" onclick="gbReset()">처음부터</button>' +
         '<button class="chip sm" style="flex:1" onclick="gbQuit()">그만두기</button>' +
         '<button class="chip sm" style="flex:1" onclick="gbFull()">⛶ 전체화면</button>' +
         '</div></div>';
    el.innerHTML = h; return;
  }

  /* 결과 */
  h += '<div class="card" style="text-align:center">' +
       '<div style="font-size:2.2em">' + (alive.length ? '🎉' : '😮') + '</div>' +
       '<div style="font-size:var(--fs-l);font-weight:900;color:var(--ac-d)">' +
       (alive.length ? alive.length + '명 생존!' : '끝까지 간 사람이 없어요') + '</div>' +
       '<div class="sub">' + cls + ' · ' + GB.total + '문제</div></div>';

  if(alive.length){
    h += '<div class="card"><h3 style="font-size:var(--fs-s)">🏅 끝까지 남은 사람</h3>' +
         '<div class="sub" style="margin:6px 0 9px">이 사람들에게 도장을 찍습니다</div>' +
         '<div class="stu-grid">' + gbCards(true) + '</div>' +
         '<button class="btn g" style="margin-top:13px" onclick="gbAward()">🏅 ' + alive.length + '명에게 도장 찍기</button></div>';

         (f.ids.length ? ' · ' + f.ids.length + '명' : '') + '</div>' +
         '<div class="sub">' + f.ids.map(function(i){ return esc(gbLabel(i)); }).join(' · ') + '</div>' +
         (f.ids.length ? '<button class="btn g" style="margin-top:13px" onclick="gbAwardFurthest()">🏅 이 ' +
            f.ids.length + '명에게 도장 찍기</button>' : '') + '</div>';
  }

  /* 라운드별로 몇 명이 떨어졌는지 — 문제가 너무 어려웠는지 바로 보인다 */
  var perRound = [], r, n, id;
  for(r=1;r<=GB.total;r++){
    n = 0; for(id in GB.out){ if(GB.out[id]===r) n++; }
    perRound.push(r + '번 ' + n + '명');
  }
  h += '<div class="card"><h3 style="font-size:var(--fs-s)">문제별 탈락</h3>' +
       '<div class="sub" style="margin-top:6px">' + perRound.join(' · ') + '</div></div>';

  h += '<div class="card"><div style="display:flex;gap:8px">' +
       '<button class="chip sm" style="flex:1" onclick="gbBack()">↩ 앞 문제로</button>' +
       '<button class="chip sm" style="flex:1" onclick="gbReset()">처음부터</button>' +
       '<button class="chip sm" style="flex:1" onclick="gbQuit()">그만두기</button>' +
       '</div></div>';
  el.innerHTML = h;
}

/* 학생 카드 — onlyAlive 면 생존자만 */
function gbCards(onlyAlive){
  var list = S.students.slice().sort(function(a,b){ return (a.number||0) - (b.number||0); });
  var h = '', i, s, out;
  for(i=0;i<list.length;i++){
    s = list[i];
    out = !GB.alive[s.id];
    if(onlyAlive && out) continue;
    h += '<button class="stu' + (out ? '' : ' sel') + '"' +
         (out ? ' style="opacity:.42"' : '') +
         (onlyAlive ? '' : ' onclick="gbTap(\'' + s.id + '\')"') + '>' +
         '<span class="stu-c' + (out ? ' zero' : '') + '">' +
         (out ? (GB.out[s.id] ? GB.out[s.id] + '번' : '—') : '○') + '</span>' +
         '<div class="stu-n">' + esc((s.number ? s.number + '. ' : '') + (s.name || '')) + '</div>' +
         '<div class="stu-m">' + (out ? (GB.out[s.id] ? GB.out[s.id] + '번에서' : '오늘 안 함') : '생존') + '</div>' +
         '</button>';
  }
  return h || '<div class="empty" style="grid-column:1/-1"><p>아무도 없어요</p></div>';
}

/* ── 도장 ── */
async function gbAward(){ await gbDoAward(gbAliveIds(), GB.total, false); }
async function gbAwardFurthest(){
  var f = gbFurthest();
  await gbDoAward(f.ids, f.round, true);
}

async function gbDoAward(ids, upto, partial){
  if(!ids.length){ toast('줄 사람이 없어요'); return; }
  if(!confirm(ids.length + '명에게 도장을 찍을까요?')) return;
  showLoad();
  try{
    var byId = {}, i;
    for(i=0;i<S.students.length;i++) byId[S.students[i].id] = S.students[i];
    var note = S.selPlan ? planNote(S.selPlan) : null;
    var say  = S.selPlan ? planConcept(S.selPlan) : null;
    var beh = partial
      ? ('수업 여는 골든벨에서 ' + upto + '번 문제까지 통과함')
      : ('수업 여는 골든벨 ' + GB.total + '문제를 끝까지 통과함');
    if(say) beh = say + ' — ' + beh;
    var today = new Date().toISOString().slice(0,10);
    var rows = [], s;
    for(i=0;i<ids.length;i++){
      s = byId[ids[i]] || {};
      rows.push({
        student_id: ids[i], school_year: nowYear(), semester: nowSem(),
        class_no_snap: s.class_no || GB.c || null, number_snap: s.number || null,
        category: 'concept', behavior: beh,
        lesson_note: note ? (note + ' · 골든벨') : '골든벨',
        observed_on: today
      });
    }
    var r = await sb.from('observations').insert(rows);
    if(r.error){ toast('저장에 실패했어요'); console.error(r.error); return; }
    gbStopBgm(); gbSfx('award');
    gbClear();
    await loadTeacherObs(); await loadStudents();
    closeGB();
    toast('🏅 ' + rows.length + '명에게 도장을 찍었어요!');
  } finally { hideLoad(); }
}

    if(r.error){
      toast(/relation|does not exist|schema cache/i.test(r.error.message||'')
            ? '차시 기능 준비가 안 됐어요 (4_차시명_추가.sql 실행 필요)' : '추가에 실패했어요');
