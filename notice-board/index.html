<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>해누리중학교 공지</title>
<link rel="icon" href="logo.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#f4f7fc; --panel:#ffffff; --panel2:#eef2fa; --line:#e3e8f4;
    --txt:#1d2742; --sub:#6c7894; --accent:#3b6ef5; --gold:#d97706;
    --urgent:#ef3b46; --green:#0ea371; --pink:#e84d92; --purple:#7c5cff;
    --shadow:0 2px 12px rgba(30,44,90,.06);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none}
  /* 📐 화면 크기 자동 맞춤 — 가로(vw)와 세로(vh) 중 작은 쪽 기준으로 전체 축소.
     16:9 전자칠판은 물론 세로가 짧은 노트북에서도 잘리지 않습니다. */
  html{font-size:min(1vw, 1.62vh)}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;}
  body{display:flex;flex-direction:column}

  /* ── 상단바 ── */
  header{display:flex;align-items:center;justify-content:space-between;
    padding:1.1rem 1.8rem;background:#fff;
    border-bottom:1px solid var(--line);box-shadow:var(--shadow);flex:0 0 auto}
  .brand{display:flex;align-items:center;gap:.9rem}
  .brand .logo{width:3.4rem;height:3.4rem;object-fit:contain;display:block;flex:0 0 auto}
  .brand .logo-fb{font-size:2.6rem;width:auto;height:auto}  /* 로고 못 불러올 때 이모지 대체 */
  .brand h1{font-size:2.2rem;font-weight:800;letter-spacing:-.5px}
  .hright{display:flex;align-items:center;gap:1.4rem}
  .clock{text-align:right;line-height:1.1}
  .clock .time{font-size:2.8rem;font-weight:800;font-variant-numeric:tabular-nums}
  .clock .date{font-size:1.25rem;color:var(--sub);font-weight:600}
  .wx{display:flex;align-items:center;gap:.5rem;font-size:1.5rem;font-weight:700}
  .wx .ico{font-size:2rem}
  .aqi{display:flex;align-items:center;gap:.35rem;font-size:1.25rem;font-weight:700}
  .aqi b{font-weight:900}
  .rain{display:flex;align-items:center;font-size:1.25rem;font-weight:800;color:var(--accent)}
  #mealList sup.alg{font-size:.72rem;color:var(--sub);font-weight:700;margin-left:.2rem}
  .locpin{color:var(--green);font-weight:800}
  .classbadge{display:inline-flex;align-items:center;background:var(--accent);color:#fff;
    font-size:1.5rem;font-weight:800;padding:.2rem 1rem;border-radius:.6rem;letter-spacing:.5px}
  .period{display:flex;align-items:center;gap:.4rem;font-size:1.4rem;font-weight:700;color:var(--green)}
  .period b{font-weight:800;color:var(--txt)}

  /* ── 긴급 배너 ── */
  #urgentBar{flex:0 0 auto;display:none;align-items:center;gap:1rem;
    background:linear-gradient(90deg,#ff2d40,#ff5a3c);padding:.9rem 1.8rem;
    font-size:1.9rem;font-weight:800;overflow:hidden;white-space:nowrap}
  #urgentBar.show{display:flex}
  #urgentBar .tag{background:#fff;color:var(--urgent);padding:.15rem 1rem;border-radius:99px;
    font-size:1.4rem;font-weight:900;flex:0 0 auto;letter-spacing:1px}
  #urgentText{display:inline-block;animation:marquee 22s linear infinite}
  @keyframes marquee{0%{transform:translateX(8rem)}100%{transform:translateX(-100%)}}

  /* ── 호출 띠 ── */
  #callBar{flex:0 0 auto;display:flex;align-items:center;gap:1rem;padding:.6rem 1.8rem;
    background:linear-gradient(90deg,#eaf1ff,#f1f6ff);border-bottom:2px solid #d3e2ff}
  #callBar.has{background:linear-gradient(90deg,#fff1d6,#ffe7c2);border-bottom-color:#ffce85}
  #callBar .clabel{display:flex;align-items:center;gap:.4rem;font-size:1.45rem;font-weight:800;color:var(--accent);flex:0 0 auto}
  #callBar.has .clabel{color:#b45309}
  #callFilter{font-size:1.15rem;font-weight:700;padding:.35rem .9rem;border-radius:.5rem;
    border:1.5px solid var(--line);background:#fff;color:var(--txt);flex:0 0 auto}
  #callList{flex:1 1 auto;display:flex;gap:1rem;overflow:hidden;align-items:center}
  .callitem{display:flex;align-items:center;gap:.5rem;font-size:1.35rem;font-weight:700;flex:0 0 auto;
    background:#fff;border:1.5px solid #ffce85;border-radius:99px;padding:.3rem 1.1rem}
  .callitem .cls{background:#b45309;color:#fff;font-size:1.05rem;font-weight:800;padding:.12rem .65rem;border-radius:99px}
  .callitem .stu{color:#9a3412;font-weight:800}
  .callitem .arr{color:var(--sub);font-weight:600}
  .callitem .loc{color:var(--accent);font-weight:800}
  #callEmpty{font-size:1.25rem;color:var(--sub);font-weight:600}

  /* ── 디데이 띠 ── */
  #ddayBar{flex:0 0 auto;display:flex;gap:.9rem;padding:.75rem 1.8rem 0;align-items:stretch;overflow:hidden}
  #ddayBar:empty{display:none}
  .dday{display:flex;align-items:center;gap:.8rem;background:#fff;box-shadow:var(--shadow);
    border:1px solid var(--line);border-radius:.8rem;padding:.55rem 1.2rem;flex:0 0 auto}
  .dday .ic{font-size:1.9rem}
  .dday .lab{font-size:1.05rem;font-weight:700;color:var(--sub);line-height:1.15}
  .dday .lab b{display:block;font-size:1.25rem;color:var(--txt);font-weight:800}
  .dday .cnt{font-size:2.1rem;font-weight:900;font-variant-numeric:tabular-nums;margin-left:.3rem}
  .dday.t-시험 .cnt{color:var(--urgent)} .dday.t-평가 .cnt{color:var(--gold)}
  .dday.t-방학 .cnt{color:var(--green)} .dday.t-기타 .cnt{color:var(--accent)}
  .dday.today{border-color:var(--gold);background:linear-gradient(90deg,#fff6e8,#fffdf8)}
  .dday.today .cnt{color:var(--gold)}

  /* ── 본문 그리드 ── */
  main{flex:1 1 auto;display:grid;grid-template-columns:30% 1fr;
    grid-template-rows:1fr 1fr;gap:1rem;padding:1rem 1.8rem 1.4rem;min-height:0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:1rem;box-shadow:var(--shadow);
    padding:1.1rem 1.3rem;display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .card h2{font-size:1.5rem;font-weight:800;display:flex;align-items:center;gap:.6rem;
    margin-bottom:.7rem;flex:0 0 auto}
  .card h2 .em{font-size:1.7rem}
  .card .body{flex:1 1 auto;min-height:0;overflow:hidden}

  #meal{grid-column:1;grid-row:1}    /* 좌측 위: 급식 */
  #assess{grid-column:1;grid-row:2}  /* 좌측 아래: 평가일정 */

  /* 급식 */
  #mealDay{font-size:1.1rem;color:var(--gold);font-weight:800;margin-bottom:.45rem}
  #mealList{list-style:none;display:flex;flex-direction:column;gap:.4rem}
  #mealList li{font-size:1.35rem;font-weight:600;line-height:1.2;
    padding-left:1.3rem;position:relative}
  #mealList li::before{content:'•';position:absolute;left:0;color:var(--green);font-weight:900}
  #mealKcal{margin-top:.55rem;font-size:1rem;color:var(--sub);font-weight:600}
  .empty{color:var(--sub);font-size:1.25rem;font-weight:600;padding:.8rem 0}

  /* 평가일정 */
  .assessrow{display:flex;align-items:flex-start;gap:.6rem;padding:.5rem 0;border-bottom:1px solid var(--line);font-size:1.2rem;line-height:1.25}
  .assessrow:last-child{border-bottom:none}
  .assessrow .d{flex:0 0 auto;font-weight:800;color:var(--gold);min-width:4.3rem}
  .assessrow .ty{flex:0 0 auto;font-size:.85rem;font-weight:800;padding:.1rem .5rem;border-radius:.4rem;margin-right:.2rem}
  .ty-지필평가{background:rgba(239,59,70,.14);color:var(--urgent)}
  .ty-수행평가{background:rgba(217,119,6,.16);color:var(--gold)}
  .ty-기타{background:rgba(59,110,245,.14);color:var(--accent)}
  .assessrow .sub{font-weight:800}
  .assessrow .sc{color:var(--sub);font-weight:600;font-size:.95rem;display:block}

  /* 공지 카드 영역 (우상단, 큰 비중) */
  #noticeCard{grid-column:2;grid-row:1/2}
  /* ⚠️ .card .body 는 블록이라 자식의 flex:1 이 안 먹어 높이가 0이 됨 → 공지 카드 본문만 flex 컨테이너로 */
  #noticeCard .body{display:flex;flex-direction:column}
  #noticeStage{position:relative;flex:1 1 auto;min-height:0}
  /* 한 페이지에 공지 여러 건 — 2열 배치 */
  .slide{position:absolute;inset:0;opacity:0;transition:opacity .6s;overflow:hidden;
    display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:.55rem;
    align-content:stretch;pointer-events:none}
  .slide.one{grid-template-columns:1fr}          /* 1건뿐이면 가로 전체 */
  .slide.active{opacity:1}
  .nitem{min-height:0;display:flex;align-items:center;gap:.8rem;overflow:hidden;
    background:var(--panel2);border-radius:.7rem;padding:.5rem .9rem}
  .nitem .ntext{flex:1 1 auto;min-width:0}
  .nitem .nhead{display:flex;align-items:center;gap:.6rem;margin-bottom:.15rem}
  .nitem .nmeta{font-size:.95rem;color:var(--sub);font-weight:600;white-space:nowrap}
  .nitem .ntitle{font-size:1.35rem;font-weight:800;line-height:1.2;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nitem .nbody{font-size:1.05rem;color:#41506e;line-height:1.3;font-weight:500;
    display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .nitem .nqr{flex:0 0 auto;width:4.4rem;height:4.4rem;object-fit:contain;background:#fff;
    border:1.5px solid var(--line);border-radius:.5rem;padding:.2rem}
  .nitem .cat{font-size:1rem;padding:.15rem .7rem}
  .slide.one .ntitle{font-size:1.8rem}   /* 1건이면 크게 */
  .slide.one .nbody{font-size:1.3rem;-webkit-line-clamp:3}
  .slide.two .nbody{-webkit-line-clamp:2}  /* 2건이면 본문 2줄 */
  /* 칸이 좁을 땐 본문 숨기고 제목만 (JS 가 자동 판단) */
  .slide.compact .nbody{display:none}
  .slide.compact .ntitle{font-size:1.25rem}
  .slide.compact .nitem{padding:.35rem .8rem}
  .cat-lost{background:rgba(245,158,11,.18);color:#b45309}
  .slide .cat{display:inline-flex;align-self:flex-start;align-items:center;gap:.4rem;
    font-size:1.2rem;font-weight:800;padding:.25rem 1rem;border-radius:99px;margin-bottom:.9rem}
  .cat-교과{background:rgba(169,139,255,.2);color:var(--purple)}
  .cat-학년{background:rgba(91,140,255,.2);color:var(--accent)}
  .cat-일반{background:rgba(55,211,155,.2);color:var(--green)}
  .cat-긴급{background:rgba(255,77,94,.2);color:var(--urgent)}
  .slide .stitle{font-size:2.2rem;font-weight:800;line-height:1.2;margin-bottom:.6rem;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .slide .sbody{font-size:1.5rem;color:#41506e;line-height:1.4;font-weight:500;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .slide .meta{margin-top:.8rem;font-size:1.05rem;color:var(--sub);font-weight:600}
  #dots{display:flex;gap:.5rem;justify-content:center;margin-top:.6rem;flex:0 0 auto}
  #dots i{width:.7rem;height:.7rem;border-radius:99px;background:var(--line);transition:.3s}
  #dots i.on{background:var(--accent);width:2rem}

  /* 하단 우측: 일정 + 시간표변경 나란히 */
  #bottomRow{grid-column:2;grid-row:2/3;display:grid;grid-template-columns:1fr 1fr;gap:1rem;min-height:0}
  #cleanCard{display:none}
  body.cmode #bottomRow{grid-template-columns:1fr 1fr 1fr}
  body.cmode #cleanCard{display:flex}
  .cleanrow{display:flex;align-items:flex-start;gap:.7rem;padding:.5rem 0;border-bottom:1px solid var(--line);font-size:1.2rem;line-height:1.3}
  .cleanrow:last-child{border-bottom:none}
  .cleanrow .ar{flex:0 0 auto;font-weight:800;color:var(--accent);min-width:6rem}
  .cleanrow .mb{font-weight:600}
  .squad{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:.3rem}
  .squad b{font-size:4.2rem;font-weight:900;color:var(--accent);line-height:1}
  .squad span{font-size:1.15rem;color:var(--sub);font-weight:700}
  /* 이름·역할이 함께 있을 땐 조를 작게 */
  .squad.small{height:auto;flex-direction:row;gap:.6rem;justify-content:flex-start;
    align-items:baseline;padding-bottom:.4rem;border-bottom:1.5px solid var(--line);margin-bottom:.4rem}
  .squad.small b{font-size:1.8rem}
  .squad.small span{font-size:1.05rem}
  /* 청소당번 ↔ 1인1역 토글 (전자칠판 터치) */
  .toggleh{display:flex;gap:.5rem;margin-bottom:.7rem;flex:0 0 auto}
  .tgl{font-family:inherit;cursor:pointer;border:1.5px solid var(--line);background:var(--panel2);
    color:var(--sub);font-size:1.15rem;font-weight:800;padding:.3rem 1rem;border-radius:99px;transition:.15s}
  .tgl.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .swapb{display:inline-flex;align-items:center;background:rgba(217,119,6,.15);color:#b45309;
    font-size:1rem;font-weight:800;padding:.25rem .8rem;border-radius:99px;margin-left:auto}
  .rolerow{display:flex;align-items:center;gap:.7rem;padding:.5rem 0;border-bottom:1px solid var(--line);font-size:1.2rem;line-height:1.3}
  .rolerow:last-child{border-bottom:none}
  .rolerow .rn{flex:0 0 auto;font-weight:800;color:var(--purple);min-width:6.5rem}
  .rolerow .rm{font-weight:600}
  /* 🗓️ 주간 시간표 표 */
  #weekBox table{width:100%;border-collapse:collapse;table-layout:fixed}
  #weekBox th,#weekBox td{border:1px solid var(--line);padding:.28rem .15rem;text-align:center;
    font-size:.95rem;line-height:1.25;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  #weekBox th{background:var(--panel2);font-weight:800;color:var(--sub);font-size:.9rem}
  #weekBox th.today{background:var(--accent);color:#fff}
  #weekBox td.pn{background:var(--panel2);font-weight:800;color:var(--sub);width:2.6rem}
  #weekBox td.now{background:rgba(59,110,245,.14);font-weight:800;color:var(--accent)}
  #weekBox td.chg{color:var(--urgent);font-weight:800}
  #weekBox td.tdcol{background:rgba(59,110,245,.05)}
  .listrow{display:flex;align-items:flex-start;gap:.7rem;padding:.55rem 0;border-bottom:1px solid var(--line);
    font-size:1.25rem;line-height:1.3}
  .listrow:last-child{border-bottom:none}
  .listrow .d{flex:0 0 auto;font-weight:800;color:var(--gold);min-width:4.5rem}
  .listrow .t{font-weight:600}
  .listrow .loc{color:var(--sub);font-weight:600;margin-left:.4rem;font-size:1rem}
  .ttc .chg{font-weight:800}
  .ttc .arrow{color:var(--accent);margin:0 .3rem}
  .ttc .who{color:var(--sub);font-weight:700;min-width:5rem;flex:0 0 auto}

  /* 📮 선생님께 말하기 — 버튼 + 입력창 */
  #msgBtn{position:fixed;right:1.6rem;bottom:1.3rem;z-index:45;cursor:pointer;font-family:inherit;
    background:var(--accent);color:#fff;border:none;border-radius:99px;padding:.75rem 1.6rem;
    font-size:1.25rem;font-weight:800;box-shadow:0 .3rem 1rem rgba(59,110,245,.35)}
  #msgBtn:active{transform:scale(.97)}
  #msgModal{position:fixed;inset:0;z-index:60;background:rgba(15,25,50,.45);
    display:none;align-items:center;justify-content:center;padding:2rem}
  #msgModal.show{display:flex}
  .mbox{background:var(--panel);border-radius:1.2rem;padding:1.8rem 2rem;width:60rem;max-width:900px;
    max-height:92vh;overflow:auto;box-shadow:0 2rem 5rem rgba(0,0,0,.25)}
  .mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem}
  .mhead h3{font-size:2rem;font-weight:900}
  .mx{background:none;border:none;font-size:2rem;color:var(--sub);cursor:pointer;font-family:inherit;line-height:1}
  .mdesc{font-size:1.15rem;color:var(--sub);font-weight:600;margin-bottom:1.1rem;line-height:1.5}
  .mcats{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem}
  .mcat{font-family:inherit;cursor:pointer;border:1.5px solid var(--line);background:#fff;color:var(--sub);
    font-size:1.15rem;font-weight:800;padding:.5rem 1.1rem;border-radius:99px}
  .mcat.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .mcat.on[data-c="고민·상담"]{background:var(--gold);border-color:var(--gold)}
  .mcat.on[data-c="도움 요청"]{background:var(--urgent);border-color:var(--urgent)}
  .mwarn{display:none;background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;border-radius:.6rem;
    padding:.7rem 1rem;font-size:1.1rem;font-weight:700;margin-bottom:1rem}
  .mwarn.show{display:block}
  #msgModal input,#msgModal textarea,#msgModal select{-webkit-user-select:text;user-select:text}
  #mBody{width:100%;min-height:9rem;font-family:inherit;font-size:1.4rem;padding:1rem;
    border:1.5px solid var(--line);border-radius:.7rem;resize:none;color:var(--txt);background:#fff}
  #mBody:focus{outline:none;border-color:var(--accent)}
  .mrow{display:flex;gap:.6rem;margin-top:.8rem}
  .mrow input,.mrow select{flex:1;font-family:inherit;font-size:1.2rem;padding:.7rem .9rem;
    border:1.5px solid var(--line);border-radius:.6rem;background:#fff;color:var(--txt);min-width:0}
  .mrow #mTeacher{flex:2}
  .manon{display:flex;align-items:center;gap:.6rem;margin-top:.8rem;padding:.7rem 1rem;cursor:pointer;
    background:var(--panel2);border-radius:.6rem;font-size:1.2rem;font-weight:700}
  .manon input{width:1.5rem;height:1.5rem;accent-color:var(--accent)}
  .manon small{color:var(--sub);font-weight:600;font-size:1rem;margin-left:.4rem}
  .merr{display:none;color:var(--urgent);font-size:1.15rem;font-weight:700;margin-top:.7rem}
  .merr.show{display:block}
  .msend{width:100%;margin-top:1rem;background:var(--accent);color:#fff;border:none;cursor:pointer;
    font-family:inherit;font-size:1.5rem;font-weight:900;padding:1rem;border-radius:.8rem}
  .msend:disabled{opacity:.5}
  #msgOk{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;
    background:rgba(15,25,50,.45)}
  #msgOk.show{display:flex}
  .okbox{background:var(--panel);border-radius:1.2rem;padding:2.5rem 4rem;text-align:center;
    font-size:2.4rem;font-weight:900;color:var(--green)}
  .okbox span{display:block;font-size:1.3rem;color:var(--sub);font-weight:700;margin-top:.6rem}

  /* 연결 끊김 표시 */
  #offline{position:fixed;bottom:1rem;right:1.4rem;background:var(--urgent);color:#fff;
    padding:.4rem 1rem;border-radius:99px;font-size:1rem;font-weight:700;display:none;z-index:50}
  #offline.show{display:block}
  .scroller{animation:vscroll 30s linear infinite}
  @keyframes vscroll{0%,10%{transform:translateY(0)}90%,100%{transform:translateY(calc(-100% + 12rem))}}
</style>
</head>
<body>
  <header>
    <div class="brand"><img class="logo" src="logo.png" alt="해누리중학교 교표" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'logo logo-fb',textContent:'🏫'}))"><h1 id="schoolName">해누리중학교</h1>
      <span class="classbadge" id="classBadge" style="display:none"></span>
    </div>
    <div class="hright">
      <span class="period" id="periodChip" style="display:none"></span>
      <span class="aqi" id="aqi" style="display:none"></span>
      <span class="rain" id="rain" style="display:none"></span>
      <span class="wx" id="wx" style="display:none"><span class="ico" id="wxIco">☀️</span><span id="wxTemp">--°</span></span>
      <div class="clock"><div class="time" id="time">--:--</div><div class="date" id="date">----</div></div>
    </div>
  </header>

  <div id="urgentBar"><span class="tag">긴급</span><span style="overflow:hidden;flex:1"><span id="urgentText"></span></span></div>

/* ── 현재 교시 / 쉬는시간 (헤더 표시) ── */
// 필요시 시간만 학교에 맞게 수정하세요.
// 해누리중: 45분 수업 · 쉬는시간 10분 · 월수금 6교시, 화목 7교시
const BELL = [
  {label:'조회',     s:'08:30', e:'08:40'},
  {label:'1교시',    s:'08:50', e:'09:35'},
  {label:'2교시',    s:'09:45', e:'10:30'},
  {label:'3교시',    s:'10:40', e:'11:25'},
  {label:'4교시',    s:'11:35', e:'12:20'},
  {label:'점심시간', s:'12:20', e:'13:20'},
  {label:'5교시',    s:'13:20', e:'14:05'},
  {label:'6교시',    s:'14:15', e:'15:00'},
  {label:'7교시',    s:'15:10', e:'15:55', days:[2,4]},  // 화·목만
];
const _toMin = t => { const [a,b]=t.split(':').map(Number); return a*60+b; };
function updatePeriod(){
  const el=$('periodChip'); const now=new Date(); const dow=now.getDay();
  if(dow===0 || dow===6){ el.style.display='none'; return; } // 주말 숨김
  const m=now.getHours()*60+now.getMinutes();
  const today = BELL.filter(p => !p.days || p.days.includes(dow));  // 요일별 교시 수 반영
  let cur=null, nxt=null;
  for(const p of today){ if(m>=_toMin(p.s) && m<_toMin(p.e)){ cur=p; break; } }
  if(!cur){ for(const p of today){ if(m<_toMin(p.s)){ nxt=p; break; } } }
  if(cur){ el.style.display='flex';
    el.innerHTML = cur.label==='점심시간' ? `🍴 점심시간 <b>~${cur.e}</b>`
                 : cur.label==='조회'     ? `📣 조회 <b>~${cur.e}</b>`
                 : `🔔 ${cur.label} <b>~${cur.e}</b>`;
  } else if(nxt){ el.style.display='flex'; el.innerHTML = `☕ 쉬는시간 <b>${nxt.label} ${nxt.s}</b>`;
  } else { el.style.display='none'; } // 등교 전 / 하교 후
}

/* ── 공지 로드 + 슬라이드 ── */
let slideTimer=null, slideIdx=0, slides=[], noticeCards=[], lostItems=[];

/* 이 보드에 보여줄 공지인지 판단
   중앙 보드: 전부 표시 / 교실 보드: 전교 + 그 학년 + 그 학년-그 반 만 */
function forThisBoard(n){
  if(!CLASS_MODE) return true;
  if(n.grade == null) return true;              // 전교 공지
  if(Number(n.grade) !== CM_GRADE) return false;
  if(n.class_no == null) return true;           // 그 학년 전체
  return Number(n.class_no) === CM_CLASS;       // 그 반 지정
}
async function loadNotices(){
  const t = todayStr();
  const { data, error } = await sb.from('notices').select('*')
    .lte('start_at', t)
    .or(`end_at.is.null,end_at.gte.${t}`)
    .order('pinned',{ascending:false}).order('created_at',{ascending:false});
  if(error){ markOffline(true); return; }
  markOffline(false);
  const list = data || [];

  // 긴급공지 → 상단 배너
  const urgent = list.filter(n => n.category==='긴급').filter(forThisBoard);
  if(urgent.length){
    $('urgentBar').classList.add('show');
    $('urgentText').textContent = urgent.map(n => n.title + (n.body?` — ${n.body}`:'')).join('     ◆     ');
  } else $('urgentBar').classList.remove('show');

  // 카드 슬라이드 = 긴급 외 공지 (긴급도 카드에 한 번 더 노출)
  const cards = list.filter(n => n.category!=='긴급').filter(forThisBoard);
  noticeCards = cards.length ? cards : list;
  rebuildStage();
}

/* 한 화면에 여러 건을 함께 표시하고, 넘치면 페이지 단위로 순환 */
const PER_PAGE = 6;   // 2열 × 3줄
function noticeItemHtml(n){
  const catLabel = n.category==='교과' ? (n.subject||'교과') : n.category;
  const gradeTxt = n.grade ? `${n.grade}학년${n.class_no?' '+n.class_no+'반':''}` : '전교';
  const icon = n.category==='교과'?'📚':(n.category==='학년'?'🎓':'📣');
  const qr = n.link
    ? `<img class="nqr" src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&margin=1&data=${encodeURIComponent(n.link)}" alt="QR">`
    : '';
  return `<div class="nitem"><div class="ntext">
    <div class="nhead"><span class="cat cat-${n.category}">${icon} ${esc(catLabel)} · ${gradeTxt}</span>
      <span class="nmeta">${n.author_name?esc(n.author_name)+' 선생님':''} ${fmtDate(n.created_at)}</span></div>
    <div class="ntitle">${esc(n.title)}</div>
    ${n.body?`<div class="nbody">${esc(n.body)}</div>`:''}
    </div>${qr}</div>`;
}
function lostItemHtml(it){
  const ph = it.photo_url ? `<img class="nqr" src="${esc(it.photo_url)}" alt="분실물">` : '';
  return `<div class="nitem"><div class="ntext">
    <div class="nhead"><span class="cat cat-lost">🔍 분실물</span></div>
    <div class="ntitle">${esc(it.item_name)}</div>
    <div class="nbody">${it.found_place?`발견 ${esc(it.found_place)} · `:''}📍 <b>${esc(it.keep_place||'교무실')}</b> 에서 찾아가세요</div>
    </div>${ph}</div>`;
}
/* 칸이 좁으면 본문을 숨겨 제목만이라도 깔끔히 보이게 (화면 높이에 따라 자동) */
function fitNoticeItems(){
  // rAF 는 화면이 안 보이는 상태에서 안 돌 수 있어 즉시 측정한다
  // 높이를 추측하지 말고 '실제로 넘치는지' 보고 판단
  slides.forEach(sl=>{
    sl.classList.remove('compact');
    const over = [...sl.querySelectorAll('.nitem')].some(it => it.scrollHeight > it.clientHeight + 2);
    if(over) sl.classList.add('compact');
  });
}

function rebuildStage(){
  const stage = $('noticeStage'); const dots = $('dots');
  const items = [...noticeCards.map(noticeItemHtml), ...lostItems.map(lostItemHtml)];
  stage.innerHTML=''; dots.innerHTML=''; slides=[]; slideIdx=0;
  if(!items.length){
    stage.innerHTML = '<div class="empty">등록된 공지가 없습니다 🌤️</div>';
    if(slideTimer) clearInterval(slideTimer); return;
  }
  // PER_PAGE 개씩 묶어 한 페이지로
  const pages=[];
  for(let i=0;i<items.length;i+=PER_PAGE) pages.push(items.slice(i,i+PER_PAGE));
  pages.forEach((pg,i)=>{
    const el=document.createElement('div');
    el.className='slide'+(i===0?' active':'')+(pg.length===1?' one':pg.length===2?' two':'');
    el.innerHTML=pg.join('');
    stage.appendChild(el); slides.push(el);
    const dot=document.createElement('i'); if(i===0)dot.className='on'; dots.appendChild(dot);
  });
  $('dots').style.display = pages.length>1 ? 'flex' : 'none';
  fitNoticeItems();
  if(slideTimer) clearInterval(slideTimer);
  if(slides.length>1) slideTimer = setInterval(nextSlide, (Number(CFG.slide_seconds)||12)*1000);
}
function nextSlide(){
  if(!slides.length) return;
  slides[slideIdx].classList.remove('active'); $('dots').children[slideIdx].className='';
  slideIdx = (slideIdx+1)%slides.length;
  slides[slideIdx].classList.add('active'); $('dots').children[slideIdx].className='on';
}

function classKey(c){ return `${c.grade??'?'}-${c.class_no??'?'}`; }
async function loadCalls(){
  const since = new Date(Date.now()-4*3600*1000).toISOString(); // 최근 4시간 내 활성 호출
  const { data, error } = await sb.from('calls').select('*').eq('status','active')
    .gte('created_at', since).order('created_at',{ascending:false});
  if(error) return;
  callData = data || [];
  buildCallFilter(); renderCalls();
}
function buildCallFilter(){
  const sel = $('callFilter');
  // 교실 보드는 그 반 호출만 보므로 드롭다운 자체를 감춘다
  if(CLASS_MODE){ sel.style.display='none'; return; }
  const prev = sel.value;
  const classes = [...new Set(callData.map(classKey))].filter(c=>!c.includes('?')).sort();
  sel.innerHTML = '<option value="">전체 반</option>' + classes.map(c=>`<option value="${c}">${c}반</option>`).join('');
  if([...sel.options].some(o=>o.value===prev)) sel.value = prev;
}
function renderCalls(){
  const bar=$('callBar'), list=$('callList');
  // 교실 보드: 그 반 호출만 / 중앙 보드: 드롭다운 선택대로
  const items = CLASS_MODE
    ? callData.filter(c => classKey(c)===CLASS_MODE)
    : callData.filter(c => { const f=$('callFilter').value; return !f || classKey(c)===f; });
  bar.classList.toggle('has', items.length>0);
  if(!items.length){
    list.innerHTML = `<span id="callEmpty">${callData.length? '선택한 반에 호출이 없습니다' : '현재 호출 없음'}</span>`;
    return;
  }
  // ⚠️ 개인정보 보호: 호출 '사유'는 화면에 표시하지 않습니다 (관리자에서만 확인)
  list.innerHTML = items.map(c=>`<div class="callitem">
    <span class="cls">${classKey(c)}</span>
    <span class="stu">${esc(c.student_name)}</span><span class="arr">←</span>
    <span>${esc(c.teacher_name)} 선생님</span><span class="arr">·</span>
    <span class="loc">${esc(c.location||'교무실')} 오세요</span></div>`).join('');
}

/* ── 디데이 ── */
function ddayNum(target){
  const t = new Date(); t.setHours(0,0,0,0);
  const d = new Date(target+'T00:00');
  return Math.round((d - t)/86400000);
}
async function loadDdays(){
  const t = todayStr();
  const { data } = await sb.from('ddays').select('*').gte('target_date', t)
    .order('target_date',{ascending:true}).limit(6);
  const bar = $('ddayBar');
  if(!data || !data.length){ bar.innerHTML=''; return; }
  bar.innerHTML = data.map(x=>{
    const n = ddayNum(x.target_date);
    const cnt = n===0 ? 'D-DAY' : `D-${n}`;
    const dd = new Date(x.target_date+'T00:00');
    const dstr = `${dd.getMonth()+1}/${dd.getDate()}(${DOW[dd.getDay()]})`;
    return `<div class="dday t-${x.type||'기타'} ${n===0?'today':''}">
      <span class="ic">${x.icon||'🎯'}</span>
      <span class="lab">${esc(x.title)}<b>${dstr}</b></span>
      <span class="cnt">${cnt}</span></div>`;
  }).join('');
}

/* ── 주요일정 (교사 입력 + NEIS 학사일정 자동 병합) ── */
let schedData=[], neisSched=[];
async function loadSchedules(){
  const t = todayStr();
  const { data } = await sb.from('schedules').select('*')
    .or(`end_date.gte.${t},and(end_date.is.null,start_date.gte.${t})`)
    .order('start_date',{ascending:true}).limit(8);
  schedData = data || []; renderSchedules();
}
// NEIS 학사일정 — 방학·고사·공휴일 등 자동 (같은 이름 연속일은 기간으로 묶음)
async function loadSchoolSched(){
  try{
    const toD=new Date(); toD.setDate(toD.getDate()+45);
    const url=`https://open.neis.go.kr/hub/SchoolSchedule?Type=json&pIndex=1&pSize=100`
      +`&ATPT_OFCDC_SC_CODE=${CFG.neis_atpt}&SD_SCHUL_CODE=${CFG.neis_school}`
      +`&AA_FROM_YMD=${ymd(new Date())}&AA_TO_YMD=${ymd(toD)}`;
    const r=await fetch(url); const j=await r.json();
    const rows=(j?.SchoolSchedule?.[1]?.row||[])
      .filter(x=>x.EVENT_NM && !/토요휴업일/.test(x.EVENT_NM));
    const grp={};
    rows.forEach(x=>{
      const d=`${x.AA_YMD.slice(0,4)}-${x.AA_YMD.slice(4,6)}-${x.AA_YMD.slice(6,8)}`;
      if(!grp[x.EVENT_NM]) grp[x.EVENT_NM]={title:x.EVENT_NM,start_date:d,end_date:d,
        icon:x.SBTR_DD_SC_NM==='휴업일'?'🏖️':'🏫'};
      else{ if(d<grp[x.EVENT_NM].start_date) grp[x.EVENT_NM].start_date=d;
            if(d>grp[x.EVENT_NM].end_date)   grp[x.EVENT_NM].end_date=d; }
    });
    neisSched=Object.values(grp);
  }catch(e){ neisSched=[]; }
  renderSchedules();
}
function renderSchedules(){
  const box = $('schedBox'); if(!box) return;
  const names=new Set(schedData.map(s=>s.title));
  const all=[...schedData, ...neisSched.filter(n=>!names.has(n.title))]
    .sort((a,b)=>a.start_date.localeCompare(b.start_date)).slice(0,8);
  if(!all.length){ box.innerHTML='<div class="empty">예정된 일정이 없습니다</div>'; return; }
  box.innerHTML = all.map(s=>{
    const d = new Date(s.start_date+'T00:00');
    const dd = `${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`;
    const range = s.end_date && s.end_date!==s.start_date ? `~${(new Date(s.end_date+'T00:00')).getMonth()+1}/${(new Date(s.end_date+'T00:00')).getDate()}` : '';
    return `<div class="listrow"><span class="d">${s.icon||'📌'} ${dd}${range}</span>
      <span class="t">${esc(s.title)}${s.location?`<span class="loc">@${esc(s.location)}</span>`:''}</span></div>`;
  }).join('');
}

/* ── 평가일정 ── */
async function loadAssessments(){
  const t = todayStr();
  const { data } = await sb.from('assessments').select('*').gte('assess_date', t)
    .order('assess_date',{ascending:true}).limit(7);
  const box = $('assessBox');
  if(!data || !data.length){ box.innerHTML='<div class="empty">예정된 평가가 없습니다</div>'; return; }
  box.innerHTML = data.map(a=>{
    const d = new Date(a.assess_date+'T00:00');
    const dd = `${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`;
    const g = a.grade ? `${a.grade}학년 ` : '';
    return `<div class="assessrow"><span class="d">${dd}</span>
      <span class="t"><span class="ty ty-${a.assess_type}">${esc(a.assess_type)}</span>
      <span class="sub">${g}${esc(a.subject)}</span> ${esc(a.title)}
      ${a.scope?`<span class="sc">📖 ${esc(a.scope)}</span>`:''}</span></div>`;
  }).join('');
}

/* 🔁 요일변경 수업 — 학사일정 기준 (예: 10/7 수요일은 금요일 수업)
   값: 1=월 2=화 3=수 4=목 5=금  */
const DAY_SWAP = {
  '2026-10-07': 5,   // 수 → 금요일 수업
  '2026-11-03': 5,   // 화 → 금요일 수업
  '2027-01-05': 4,   // 화 → 목요일 수업
  '2027-01-06': 5,   // 수 → 금요일 수업
};
function swapInfo(dateObj){
  const key=`${dateObj.getFullYear()}-${pad(dateObj.getMonth()+1)}-${pad(dateObj.getDate())}`;
  const w=DAY_SWAP[key];
  return w ? {weekday:w, label:'월화수목금'[w-1]+'요일 수업'} : null;
}
// 시간표를 읽을 때 쓸 '기준 요일' — 요일변경일이면 바뀐 요일로
function schoolDayFor(dateObj){
  const s=swapInfo(dateObj);
  if(!s) return dateObj;
  const d=new Date(dateObj);
  d.setDate(d.getDate() + (s.weekday - (dateObj.getDay()||7)));
  return d;
}

function ttBaseDay(dateObj){
  const w=dateObj.getDay();            // 월=1 … 금=5
  if(w<1||w>5) return null;
  const t=TT_BASE[CLASS_MODE];
  return t ? (t[w-1]||null) : null;
}
function ttSubject(dateObj, period, neisValue){
  const day=ttBaseDay(dateObj);
  const v=day ? day[period-1] : null;
  return (v && v.trim()) ? v : neisValue;   // 원본 우선, 없으면 나이스
}

/* NEIS 시간표 하루치 가져오기
   ⚠️ NEIS 버그: 한 번에 5행만 주고 pIndex 페이징도 안 먹음(같은 5행 반복).
      그래서 전체 건수(list_total_count)가 5보다 크면 6·7교시는 PERIO 를 지정해 따로 조회. */
async function fetchDayTT(dateObj){
  const base=`https://open.neis.go.kr/hub/misTimetable?Type=json&pIndex=1&pSize=20`
    +`&ATPT_OFCDC_SC_CODE=${CFG.neis_atpt}&SD_SCHUL_CODE=${CFG.neis_school}`
    +`&GRADE=${CM_GRADE}&CLASS_NM=${CM_CLASS}&ALL_TI_YMD=${ymd(dateObj)}`;
  try{
    const j = await (await fetch(base)).json();
    const rows = j?.misTimetable?.[1]?.row || [];
    const total = j?.misTimetable?.[0]?.head?.[0]?.list_total_count || rows.length;
    if(total > rows.length){
      const missing=[];
      for(let p=rows.length+1; p<=total; p++) missing.push(p);
      const extra = await Promise.all(missing.map(async p=>{
        try{ const jj=await (await fetch(`${base}&PERIO=${p}`)).json();
             return jj?.misTimetable?.[1]?.row?.[0] || null; }catch(e){ return null; }
      }));
      extra.filter(Boolean).forEach(r=>{ if(!rows.some(x=>Number(x.PERIO)===Number(r.PERIO))) rows.push(r); });
    }
    return rows;
  }catch(e){ return []; }
}

// NEIS 시간표 (교실 모드 전용) — 그 반의 오늘 교시별 과목 자동
async function loadTimetableNEIS(){
  if(!CLASS_MODE) return;
  neisTT = await fetchDayTT(new Date());
  renderTTC();
}
/* 🗓️ 주간 시간표 (교실 모드) — NEIS 는 주간 범위 조회 페이징이 고장나 있어 하루씩 5번 조회 */
let weekTT = null;
function mondayOf(d){ const x=new Date(d); const w=x.getDay(); x.setDate(x.getDate()-((w+6)%7)); x.setHours(0,0,0,0); return x; }
async function loadWeekTT(){
  if(!CLASS_MODE) return;
  const mon = mondayOf(new Date());
  const days = [0,1,2,3,4].map(i=>{ const d=new Date(mon); d.setDate(d.getDate()+i); return d; });
  try{
    const res = await Promise.all(days.map(d => fetchDayTT(d)));
    weekTT = {mon, days, rows:res};
  }catch(e){ weekTT=null; }
  renderWeekTT();
}
function renderWeekTT(){
  const box=$('weekBox'); if(!box||!CLASS_MODE) return;
  if(!weekTT){ box.innerHTML='<div class="empty">주간 시간표를 불러오지 못했습니다</div>'; return; }
  const {days, rows} = weekTT;
  const basePeriods = days.map(d=>(ttBaseDay(schoolDayFor(d))||[]).length);
  const maxP = Math.max(1, ...rows.flat().map(r=>Number(r.PERIO)||0), ...basePeriods);
  const todayY = ymd(new Date());
  const DW=['월','화','수','목','금'];
  // 오늘 변경사항을 주간 표에도 반영
  const myChg = ttcRows.filter(_mine);
  let html='<table><thead><tr><th></th>'
    + days.map((d,i)=>`<th class="${ymd(d)===todayY?'today':''}">${DW[i]}<br>${d.getMonth()+1}/${d.getDate()}</th>`).join('')
    + '</tr></thead><tbody>';
  for(let p=1;p<=maxP;p++){
    html+=`<tr><td class="pn">${p}</td>`;
    days.forEach((d,i)=>{
      const isToday = ymd(d)===todayY;
      const cell = (rows[i]||[]).find(r=>Number(r.PERIO)===p);
      let subj = ttSubject(schoolDayFor(d), p, cell ? cell.ITRT_CNTNT : '');  // 요일변경 반영
      let cls = isToday?'tdcol':'';
      if(isToday){
        const c = myChg.find(x=>x.period===p);
        if(c){ subj = c.after_subj || subj; cls += ' chg'; }
      }
      html+=`<td class="${cls}">${esc(subj)}</td>`;
    });
    html+='</tr>';
  }
  box.innerHTML = html+'</tbody></table>';
}
function switchTT(which){
  const wk = which==='week';
  $('ttcBox').style.display  = wk?'none':'block';
  $('weekBox').style.display = wk?'block':'none';
  $('tgl-today').classList.toggle('on', !wk);
  $('tgl-week').classList.toggle('on', wk);
}

const _mine = x => x.grade==null || (x.grade===CM_GRADE && (x.class_no==null || x.class_no===CM_CLASS));
function renderTTC(){
  const box=$('ttcBox'); if(!box) return;
  if(CLASS_MODE){
    // ── 교실 보드: 오늘 시간표 전체 + 변경·장소 오버레이 ──
    $('ttcTitle').style.display='none';

    let swBadge=$('swapBadge');
    if(sw){
      if(!swBadge){ swBadge=document.createElement('span'); swBadge.id='swapBadge'; swBadge.className='swapb';
        $('ttToggle').appendChild(swBadge); }
      swBadge.textContent='🔁 오늘은 '+sw.label; swBadge.style.display='inline-flex';

    (neisTT||[]).forEach(r=>{ const p=Number(r.PERIO); if(p && !periods[p]) periods[p]=r.ITRT_CNTNT||''; });
    // 학교 원본 시간표(컴시간) 우선 — 분반(과학A/B 등)까지 정확
    const baseDay = ttBaseDay(schoolDayFor(new Date()));
    if(baseDay) baseDay.forEach((s,i)=>{ if(s && s.trim()) periods[i+1]=s; });
    const pNums=Object.keys(periods).map(Number).sort((a,b)=>a-b);
    if(!pNums.length && !myChg.length && !myLoc.length){
      box.innerHTML='<div class="empty">오늘 시간표 정보가 없습니다</div>'; return; }
    const extra=[];
    let html = pNums.map(p=>{
      const chg=myChg.find(c=>c.period===p), loc=myLoc.find(l=>l.period===p);
      let subj = chg
        ? `<s style="opacity:.45">${esc(chg.before_subj||periods[p])}</s><span class="arrow">→</span><span class="chg" style="color:var(--urgent)">${esc(chg.after_subj||'')}</span>`
        : esc(periods[p]);
      return `<div class="listrow ttc"><span class="who">${p}교시</span><span class="t">${subj}`
        +`${loc?` <span class="locpin">📍${esc(loc.location)}</span>`:''}`
        +`${chg&&chg.note?` <span class="loc">(${esc(chg.note)})</span>`:''}</span></div>`;
    }).join('');
    myChg.filter(c=>!c.period || !pNums.includes(c.period)).forEach(c=>extra.push(
      `<div class="listrow ttc"><span class="who">${c.period?c.period+'교시':'변경'}</span><span class="t"><span class="chg">${esc(c.before_subj||'')}</span><span class="arrow">→</span><span class="chg">${esc(c.after_subj||'')}</span>${c.note?` <span class="loc">(${esc(c.note)})</span>`:''}</span></div>`));
    myLoc.filter(l=>!l.period || !pNums.includes(l.period)).forEach(l=>extra.push(
      `<div class="listrow ttc"><span class="who">${l.period?l.period+'교시':esc(l.subject)}</span><span class="t">${l.period?esc(l.subject)+' ':''}<span class="locpin">📍${esc(l.location)}</span>${l.note?` <span class="loc">(${esc(l.note)})</span>`:''}</span></div>`));
    box.innerHTML = html + extra.join('');
    renderWeekTT();   // 변경사항을 주간 표에도 반영
  } else {
    // ── 중앙 보드: 오늘 변경 + 장소 안내 목록 ──
    $('ttcTitle').innerHTML='<span class="em">🔄</span>수업 변경·장소';
    const who = x => `${x.grade?x.grade+'-':''}${x.class_no??''}${x.period?` ${x.period}교시`:''}`.trim();
    const rows=[
      ...ttcRows.map(c=>`<div class="listrow ttc"><span class="who">${who(c)||'전체'}</span>

/* ── 급식 (NEIS 직접 호출) ── */
async function loadMeal(){
  const today = new Date();
  // 오늘부터 7일 범위에서 가장 이른 중식 1건 (주말/휴일이면 다음 급식일)
  const from = ymd(today);
  const toD = new Date(today); toD.setDate(toD.getDate()+7);
  const url = `https://open.neis.go.kr/hub/mealServiceDietInfo?Type=json&pIndex=1&pSize=30`
    + `&ATPT_OFCDC_SC_CODE=${CFG.neis_atpt}&SD_SCHUL_CODE=${CFG.neis_school}`
    + `&MLSV_FROM_YMD=${from}&MLSV_TO_YMD=${ymd(toD)}&MMEAL_SC_CODE=2`;
  try{
    const r = await fetch(url); const j = await r.json();
    const rows = j?.mealServiceDietInfo?.[1]?.row;
    if(!rows || !rows.length){ showNoMeal(); return; }
    rows.sort((a,b)=>a.MLSV_YMD.localeCompare(b.MLSV_YMD));
    const m = rows[0];
    const dayStr = m.MLSV_YMD;
    const dObj = new Date(`${dayStr.slice(0,4)}-${dayStr.slice(4,6)}-${dayStr.slice(6,8)}T00:00`);
    const isToday = dayStr === from;
    $('mealDay').textContent = isToday ? '오늘 중식' :
      `${dObj.getMonth()+1}/${dObj.getDate()}(${DOW[dObj.getDay()]}) 중식`;
    // 알레르기 번호는 지우지 않고 작게 표시 (표시 의무 정보)
    const dishes = m.DDISH_NM.split('<br/>').map(s=>s.trim()).filter(Boolean).map(s=>{
      const mm = s.match(/^(.*?)\s*\(([\d.]+)\)$/);
      return mm ? {name:mm[1].trim(), alg:mm[2].split('.').filter(Boolean).join('·')} : {name:s, alg:''};
    });
    $('mealList').innerHTML = dishes.map(d=>`<li>${esc(d.name)}${d.alg?`<sup class="alg">${d.alg}</sup>`:''}</li>`).join('');
    const hasAlg = dishes.some(d=>d.alg);
    $('mealKcal').textContent = (m.CAL_INFO ? `열량 ${m.CAL_INFO}` : '') + (hasAlg ? ' · 숫자는 알레르기 유발식품 번호' : '');
  }catch(e){ showNoMeal(); }
}
function showNoMeal(){
  $('mealDay').textContent=''; $('mealKcal').textContent='';
  $('mealList').innerHTML = '<div class="empty">예정된 급식 정보가 없습니다</div>';
}

/* ── 날씨 (open-meteo, 무료/무키) ── */
const WX_ICON = c => c===0?'☀️':c<=2?'🌤️':c<=3?'☁️':(c>=51&&c<=67)?'🌧️':(c>=71&&c<=77)?'🌨️':(c>=80&&c<=82)?'🌦️':(c>=95)?'⛈️':'🌥️';
async function loadWeather(){
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${CFG.weather_lat}&longitude=${CFG.weather_lon}&current=temperature_2m,weather_code&daily=precipitation_probability_max&forecast_days=1&timezone=Asia%2FSeoul`;
    const r = await fetch(url); const j = await r.json();
    const c = j?.current;
    if(c){ $('wxTemp').textContent = Math.round(c.temperature_2m)+'°';
      $('wxIco').textContent = WX_ICON(c.weather_code); $('wx').style.display='flex'; }
    // ☔ 오늘 강수확률 40% 이상이면 우산 배지
    const pp = j?.daily?.precipitation_probability_max?.[0];
    if(pp!=null && pp>=40){ $('rain').style.display='flex'; $('rain').textContent=`☔ ${pp}%`; }
    else $('rain').style.display='none';
  }catch(e){ /* 날씨는 선택사항 — 실패시 숨김 */ }
}

/* ── 😷 미세먼지 (open-meteo air quality, 무료·무키) ── */
const AQ_LV=[['좋음','#0ea371','😊'],['보통','#3b6ef5','🙂'],['나쁨','#d97706','😷'],['매우나쁨','#ef3b46','🚨']];
async function loadAir(){
  try{
    const url=`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${CFG.weather_lat}&longitude=${CFG.weather_lon}&current=pm10,pm2_5&timezone=Asia%2FSeoul`;
    const r=await fetch(url); const j=await r.json(); const c=j?.current;
    if(!c || c.pm2_5==null) return;
    // 한국 기준: PM2.5 15/35/75 · PM10 30/80/150 — 둘 중 나쁜 쪽
    const g25=c.pm2_5<=15?0:c.pm2_5<=35?1:c.pm2_5<=75?2:3;
    const g10=c.pm10 ==null?0:c.pm10<=30?0:c.pm10<=80?1:c.pm10<=150?2:3;
    const [lab,col,em]=AQ_LV[Math.max(g25,g10)];
    const el=$('aqi'); el.style.display='flex'; el.style.color=col;
    el.innerHTML=`${em} 미세먼지 <b>${lab}</b>`;
  }catch(e){ /* 실패시 숨김 */ }
}

  setInterval(()=>{ loadWeather(); loadAir(); }, 1800000); // 날씨·미세먼지 30분마다
  // 자정 지나면 날짜 바뀌므로 급식/일정/디데이/평가/시간표 갱신
  setInterval(()=>{ const d=new Date(); if(d.getHours()===0 && d.getMinutes()<3){ loadMeal(); loadSchedules(); loadSchoolSched(); loadTTC(); loadLocations(); loadTimetableNEIS(); loadDdays(); loadAssessments(); } }, 120000);
}
</script>
